<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Schrittli – Wünsche</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="kontrolle.css">
<style>
.kopf{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:14px}
.kopf .karte{margin:0}
.kopf .zahl{font:600 28px/1 var(--display);margin:4px 0}
.balken{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:8px 0 6px}
.balken i{display:block;height:100%;background:var(--lern)}
.wunsch{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start}
@media(max-width:620px){.wunsch{grid-template-columns:1fr}}
.wunsch h2{margin:0;font:600 20px var(--display)}
.bild{aspect-ratio:1;border-radius:14px;background:repeating-conic-gradient(#eef1f4 0 25%,#fff 0 50%) 0 0/20px 20px;display:grid;place-items:center;overflow:hidden}
.bild img{width:92%;height:92%;object-fit:contain}
.bild .warte{font:500 15px var(--display);color:#6b7684;text-align:center;padding:10px}
.wahlen{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.wahl{padding:0;aspect-ratio:1;border:3px solid transparent;border-radius:10px;background:#eef1f4;overflow:hidden;cursor:pointer}
.wahl.on{border-color:var(--lern)}
.wahl img{display:block;width:100%;height:100%;object-fit:contain}
.status{font:600 12px var(--display);border-radius:999px;padding:3px 10px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.status.bereit{background:var(--lern-soft);color:var(--lern)}
.status.fehler,.status.abgelehnt{color:var(--rot)}
.felder{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
@media(max-width:420px){.felder{grid-template-columns:1fr}}
.felder label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.felder input,.felder select{width:100%;box-sizing:border-box}
.wunsch .kind{margin:8px 0 0}
.nochmal{margin-top:10px}
details.alt>summary{cursor:pointer;font:600 16px var(--display);color:var(--muted);margin:22px 0 10px}
.zeile{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.zeile:first-child{border-top:0}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <a class="zurueck" href="./" title="Zurück zur Kontrolle">←</a>
  <div class="logo">✨</div>
  <div><h1>Wünsche</h1></div>
 </header>
 <div class="leiste" id="leiste" hidden><span class="rechts"></span><button id="bild-knopf" class="on">🖼 Bild</button><input type="file" id="bild-datei" accept="image/*" hidden></div>
 <div class="kopf" id="kopf"></div>
 <section class="karte warm" id="ohne-schluessel" hidden>
  <h2>⚠ Claude-Schlüssel fehlt</h2>
 </section>
 <main id="liste"><div class="nichts">Lade Wünsche …</div></main>
 <details class="alt" id="alt" hidden><summary id="alt-titel">Abgelehnt, Fehler und aufgeschaltet</summary><section class="karte" id="alt-liste"></section></details>
 <p class="fehler" id="fehler"></p>
</div>
<script src="werkstatt.js"></script>
<script src="../vorlagen/melden.js" defer></script>
<script>
/* Motiv-Wünsche: Kinder melden im Vorlagen-Generator ein fehlendes Motiv, Claude arbeitet es im Worker ab (alle 10 Minuten oder hier sofort):
   Comic zeichnet es, Echt sucht ein echtes Bild im Netz. «Übernehmen» macht aus der Zeichnung oder dem gewählten Bild ein PNG und schreibt es
   mit figuren.json und quellen.md ins App-Repo, die Action motive.yml macht daraus die Vorlage. «Bild» setzt ein eigenes Bild ein (Logo, Foto), zu einem Wunsch oder als eigenes Motiv. */
(async()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const zeit=z=>{const d=new Date(z);return isNaN(d)?'':d.toLocaleDateString('de-CH',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'})};
const STATUS={neu:'Wartet auf Claude',zeichnet:'Claude zeichnet',bereit:'Zum Prüfen',fehler:'Fehler',abgelehnt:'Abgelehnt',fertig:'Aufgeschaltet'};
const STIL={comic:'Comic',echt:'Echt'};
const statusText=w=>w.status==='zeichnet'&&w.stil==='echt'?'Claude sucht':STATUS[w.status]||esc(w.status);
let daten=null,urls=[],beschaeftigt=0;
let echt={},eigene=[],ziel=null,zaehler=0;   // echt: Wunsch-ID → eingesetztes Bild (data:-PNG), eigene: Bilder ohne Wunsch
const wahl={},geholt={};   // wahl: Wunsch-ID → Nummer des gefundenen Bilds, geholt: Bild-Adresse → Blob-URL (bleibt über zeigen() hinaus)

async function laden(){daten=await W.wuensche.liste();zeigen()}
const mitNs=svg=>/\sxmlns=/.test(svg.slice(0,300))?svg:svg.replace(/^<svg/,'<svg xmlns="http://www.w3.org/2000/svg"');
function svgUrl(svg){const u=URL.createObjectURL(new Blob([mitNs(svg)],{type:'image/svg+xml'}));urls.push(u);return u}

/* Die Zeichnung als PNG mit durchsichtigem Hintergrund, längste Seite px (wie die übrigen Motive in werkzeug/vorlagen/bilder) */
async function alsPng(svg,px){
 const el=new DOMParser().parseFromString(mitNs(svg),'image/svg+xml').documentElement;
 const vb=(el.getAttribute('viewBox')||'0 0 512 512').trim().split(/[\s,]+/).map(Number),f=px/Math.max(vb[2]||1,vb[3]||1);
 const b=Math.round((vb[2]||1)*f),h=Math.round((vb[3]||1)*f);el.setAttribute('width',b);el.setAttribute('height',h);
 const u=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(el)],{type:'image/svg+xml'}));
 try{
  const im=new Image();await new Promise((ok,nein)=>{im.onload=ok;im.onerror=()=>nein(new Error('Die Zeichnung lässt sich nicht als Bild öffnen.'));im.src=u});
  const c=document.createElement('canvas');c.width=b;c.height=h;c.getContext('2d').drawImage(im,0,0,b,h);
  return c.toDataURL('image/png').split(',')[1]}
 finally{URL.revokeObjectURL(u)}}

/* Ein echtes Bild als PNG, längste Seite px; heller oder durchsichtiger Hintergrund wird in bild.py freigestellt */
async function urlPng(u,px=800){
 const im=new Image();await new Promise((ok,nein)=>{im.onload=ok;im.onerror=()=>nein(new Error('⚠ Bild defekt'));im.src=u});
 const g=px/(Math.max(im.naturalWidth,im.naturalHeight)||px),b=Math.round((im.naturalWidth||px)*g),h=Math.round((im.naturalHeight||px)*g);
 const c=document.createElement('canvas');c.width=b;c.height=h;const z=c.getContext('2d');z.imageSmoothingQuality='high';z.drawImage(im,0,0,b,h);
 return c.toDataURL('image/png')}
async function bildPng(f,px=800){
 if(!f.type.startsWith('image/'))throw new Error('⚠ Kein Bild');
 const u=URL.createObjectURL(f);
 try{return await urlPng(u,px)}
 finally{URL.revokeObjectURL(u)}}
/* Gefundene Bilder kommen über den Worker: nur er darf sie lesen, und nur so lassen sie sich ins PNG rechnen */
const holen=async(w,n)=>{const k=w.bilder[n].url;try{return await (geholt[k]??=W.wuensche.bild(w.id,n))}catch(x){delete geholt[k];throw x}};
function bilderLaden(wo=document){
 wo.querySelectorAll('img[data-bild]').forEach(async i=>{
  const n=i.dataset.bild;
  try{const u=await holen(finde(i.closest('[data-id]').dataset.id),+n);if(i.dataset.bild===n)i.src=u}
  catch{i.removeAttribute('src');i.alt='⚠ Bild weg'}})}
async function bildNehmen(f,id){
 $('#fehler').textContent='';
 try{const url=await bildPng(f);
  if(id)echt[id]=url;
  else{const neu='eigen'+(++zaehler);echt[neu]=url;eigene.unshift({id:neu,eigen:true,name:'',titel:f.name.replace(/\.[^.]*$/,'').replace(/^image$/i,'').replace(/[-_]+/g,' ').trim().slice(0,40),status:'bereit'})}
  zeigen()}
 catch(x){$('#fehler').textContent=String(x.message||x)}}

function kopf(){
 const m=daten.monat,offen=daten.wuensche.filter(w=>['neu','zeichnet','bereit'].includes(w.status));
 $('#kopf').innerHTML=`<div class="karte"><div class="klein">Kosten diesen Monat</div><div class="zahl">${m.usd.toFixed(2)} USD</div>
   <div class="balken"><i style="width:${m.budget?Math.min(100,m.usd/m.budget*100):100}%"></i></div>
   <div class="klein">Grenze ${m.budget} USD</div></div>
  <div class="karte"><div class="klein">Offene Wünsche</div><div class="zahl">${offen.length}</div>
   <div class="klein">${offen.filter(w=>w.status==='bereit').length} zum Prüfen</div></div>`;
 $('#ohne-schluessel').hidden=daten.schluessel}

function karte(w){
 const e=echt[w.id],titel=esc(w.titel||w.name),sucht=w.stil==='echt',gefunden=!e&&w.bilder?.length>0,nr=wahl[w.id]||0;
 const bild=e?`<img src="${e}" alt="${titel}">`:gefunden?`<img data-bild="${nr}" alt="${titel}">`:w.svg?`<img src="${svgUrl(w.svg)}" alt="${titel}">`:`<div class="warte">${w.status==='zeichnet'?(sucht?'Claude sucht …':'Claude zeichnet …'):sucht?'Noch kein Bild':'Noch keine Zeichnung'}</div>`;
 const wahlen=gefunden&&w.bilder.length>1?`<div class="wahlen">${w.bilder.map((_,n)=>`<button class="wahl${n===nr?' on':''}" data-tun="wahl" data-n="${n}" aria-label="${n+1}"><img data-bild="${n}" alt=""></button>`).join('')}</div>`:'';
 const welten=daten.welten.map(x=>`<option${x===(w.welt||'Alltag')?' selected':''}>${esc(x)}</option>`).join('');
 const info=[w.anzahl>1&&w.anzahl+'× gewünscht',zeit(w.erstellt),w.versuche&&(sucht?(w.versuche===1?'1 Suche':w.versuche+' Suchen'):w.versuche===1?'1 Zeichnung':w.versuche+' Zeichnungen')].filter(Boolean).join(' · ');
 const knoepfe=e||gefunden||w.svg
  ?`<div class="felder"><label>Name im Generator<input type="text" class="titel" maxlength="40" value="${esc(w.titel||w.name)}"></label>
    <label>Welt<select class="welt">${welten}</select></label></div>
   <div class="reihe"><button class="p" data-tun="auf">Übernehmen</button>${e?'':`<button class="s" data-tun="nochmal">${sucht?'Nochmals suchen':'Nochmals zeichnen'}</button>`}<button class="s" data-tun="bild">🖼 Bild</button><button class="s rot" data-tun="ab">${w.eigen?'Verwerfen':'Ablehnen'}</button></div>
   ${e?'':`<form class="reihe nochmal" hidden><input type="text" class="hinweis grow" maxlength="500" placeholder="Hinweis"><select class="stil" aria-label="Stil">${Object.entries(STIL).map(([k,t])=>`<option value="${k}"${k===w.stil?' selected':''}>${t}</option>`).join('')}</select><button class="p">Los</button></form>`}`
  :`<div class="reihe"><button class="s" data-tun="jetzt"${w.status==='zeichnet'?' disabled':''}>${sucht?'Jetzt suchen':'Jetzt zeichnen'}</button><button class="s" data-tun="bild">🖼 Bild</button><button class="s rot" data-tun="ab">Ablehnen</button></div>`;
 return `<section class="karte wunsch" data-id="${w.id}"><div><div class="bild">${bild}</div>${wahlen}</div><div>
  ${w.eigen?'':`<div class="reihe"><h2 class="grow">«${esc(w.name)}»</h2>${e?'':`<span class="status">${STIL[w.stil]||STIL.comic}</span>`}<span class="status ${e?'bereit':w.status}">${e?'🖼 Bild':statusText(w)}</span></div>
  <p class="klein">${info}</p>`}${w.text?`<p class="kind">«${esc(w.text)}»</p>`:''}
  ${w.grund&&w.status!=='abgelehnt'?`<p class="klein">${esc(w.grund)}</p>`:''}${w.hinweis?`<p class="klein">Letzter Hinweis: ${esc(w.hinweis)}</p>`:''}
  ${knoepfe}<p class="fehler"></p></div></section>`}

function zeile(w){
 const was=w.status==='fertig'?`als <code>${esc(w.figur)}</code> aufgeschaltet`:esc(w.grund||'');
 return `<div class="zeile" data-id="${w.id}"><b>«${esc(w.titel||w.name)}»</b><span class="status ${w.status}">${statusText(w)}</span>
  <span class="klein grow">${was}</span>${w.status==='fertig'?'':`<button class="s" data-tun="jetzt">${w.stil==='echt'?'Doch suchen':'Doch zeichnen'}</button><button class="s" data-tun="bild">🖼 Bild</button>`}<button class="x" data-tun="weg" title="Wunsch löschen">Löschen</button></div>`}

function zeigen(){
 urls.forEach(URL.revokeObjectURL);urls=[];kopf();
 const offen=[...eigene,...daten.wuensche.filter(w=>echt[w.id]||['neu','zeichnet','bereit'].includes(w.status))],alt=daten.wuensche.filter(w=>!offen.includes(w));
 $('#liste').innerHTML=offen.length?offen.map(karte).join(''):'<div class="nichts">Keine Wünsche</div>';
 $('#alt').hidden=!alt.length;$('#alt-titel').textContent=`Abgelehnt, Fehler und aufgeschaltet (${alt.length})`;
 $('#alt-liste').innerHTML=alt.map(zeile).join('');bilderLaden()}

const finde=id=>eigene.find(w=>w.id===id)||daten.wuensche.find(w=>w.id===id);
async function arbeit(knopf,text,fn){
 const box=knopf.closest('[data-id]'),f=box.querySelector('.fehler')||$('#fehler'),alt=knopf.textContent;
 box.querySelectorAll('button,input,select').forEach(e=>e.disabled=true);knopf.textContent=text;f.textContent='';beschaeftigt++;
 try{await fn();zeigen()}
 catch(x){f.textContent=String(x.message||x);box.querySelectorAll('button,input,select').forEach(e=>e.disabled=false);knopf.textContent=alt}
 finally{beschaeftigt--}}
async function zeichnen(knopf,id,hinweis,bild,stil){
 await arbeit(knopf,(stil||finde(id).stil)==='echt'?'Claude sucht … (1–3 Min.)':'Claude zeichnet … (1–3 Min.)',async()=>{
  const r=await W.wuensche.zeichnen(id,hinweis,bild,stil);
  daten.wuensche=daten.wuensche.map(w=>w.id===id?r.wunsch:w);daten.monat=r.monat;delete wahl[id]})}

document.addEventListener('click',async e=>{
 const k=e.target.closest('button[data-tun]');if(!k)return;
 const box=k.closest('[data-id]'),id=box.dataset.id,w=finde(id);if(!w)return;
 const tun=k.dataset.tun;
 if(tun==='jetzt')return zeichnen(k,id,'','');
 if(tun==='wahl'){
  wahl[id]=+k.dataset.n;box.querySelectorAll('.wahl').forEach(x=>x.classList.toggle('on',x===k));
  box.querySelector('.bild img').dataset.bild=k.dataset.n;bilderLaden(box.querySelector('.bild'));return}
 if(tun==='nochmal'){const f=box.querySelector('.nochmal');f.hidden=!f.hidden;if(!f.hidden)f.querySelector('input').focus();return}
 if(tun==='bild'){ziel=id;$('#bild-datei').click();return}
 if(tun==='ab'){
  if(w.eigen){eigene=eigene.filter(x=>x!==w);delete echt[id];return zeigen()}
  const grund=prompt('Grund für «'+w.name+'»','');if(grund===null)return;
  return arbeit(k,'Ablehnen …',async()=>{await W.wuensche.ablehnen(id,grund);delete echt[id];Object.assign(w,{status:'abgelehnt',grund:grund||'Von der Lehrperson abgelehnt.'})})}
 if(tun==='weg'){
  if(!confirm('Wunsch «'+w.name+'» ganz löschen?'))return;
  return arbeit(k,'Löschen …',async()=>{await W.wuensche.loeschen(id);daten.wuensche=daten.wuensche.filter(x=>x.id!==id)})}
 if(tun==='auf'){
  const name=box.querySelector('.titel').value.trim().replace(/ß/g,'ss'),welt=box.querySelector('.welt').value;
  if(!name){box.querySelector('.fehler').textContent='⚠ Name fehlt';return}
  return arbeit(k,'Schalte auf …',async()=>{
   const e=echt[id],nr=wahl[id]||0,g=!e&&w.bilder?.[nr],png=e||(g?await urlPng(await holen(w,nr)):null);
   const figur=await W.wuensche.aufschalten(w.eigen?null:id,name,welt,png?png.split(',')[1]:await alsPng(w.svg,800),!!png,g?g.url:'');
   delete echt[id];if(w.eigen)eigene=eigene.filter(x=>x!==w);else Object.assign(w,{status:'fertig',figur,titel:name});
   $('#fehler').textContent='';setTimeout(()=>alert(`✓ «${name}» · etwa 5 Min.`),50)})}
});
document.addEventListener('submit',async e=>{
 const f=e.target.closest('form.nochmal');if(!f)return;e.preventDefault();
 const box=f.closest('[data-id]'),id=box.dataset.id,w=finde(id),hinweis=f.querySelector('.hinweis').value.trim();
 let bild='';if(w.svg)try{bild=await alsPng(w.svg,512)}catch{}
 zeichnen(f.querySelector('button'),id,hinweis,bild,f.querySelector('.stil').value)});

if(W.LOKAL){$('#liste').innerHTML='<div class="nichts"><a href="https://conradinjoos-lab.github.io/schrittli/kontrolle/wuensche.html">Online öffnen</a></div>';return}
try{await W.bereit();await laden()}catch(x){$('#liste').innerHTML=`<div class="nichts">⚠ ${esc(x.message||x)}</div>`;return}

/* Echtes Bild: Knopf, Einfügen aus der Zwischenablage oder Hineinziehen (auf einen Wunsch oder daneben für ein eigenes Motiv) */
$('#leiste').hidden=false;
$('#bild-knopf').onclick=()=>{ziel=null;$('#bild-datei').click()};
$('#bild-datei').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)bildNehmen(f,ziel)};
document.addEventListener('paste',e=>{if(e.target.closest?.('input,textarea'))return;const f=[...e.clipboardData.files].find(x=>x.type.startsWith('image/'));if(f){e.preventDefault();bildNehmen(f,null)}});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)bildNehmen(f,e.target.closest?.('[data-id]')?.dataset.id||null)});

/* Neue Wünsche bearbeitet der Worker von selbst: ab und zu nachschauen, aber nicht während einer Eingabe */
setInterval(()=>{
 if(beschaeftigt||document.hidden||document.querySelector('.wunsch input:focus,.wunsch select:focus,.nochmal:not([hidden])'))return;
 if(daten&&daten.wuensche.some(w=>w.status==='neu'||w.status==='zeichnet'))laden().catch(()=>{})},60000);
})();
</script>
</body>
</html>
