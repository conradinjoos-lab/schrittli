<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Schrittli – Unterricht</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="kontrolle.css">
<style>
#fehler:empty,#neu-fehler:empty{display:none}
.sym{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sym.voll{fill:currentColor}
/* Klasse wählen */
.klassen-leiste{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.klassen-leiste .pill{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:15px;padding:9px 16px;color:var(--ink)}
.klassen-leiste .pill.on{color:#fff}
.punkt{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.punkt.an{background:var(--lern)}
#neu-form{margin-bottom:14px}
/* Zwei Spalten: links die Freigabe, rechts was im Zimmer läuft */
.lektion{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;align-items:start}
.spalte{min-width:0}
.k-titel{display:flex;align-items:center;gap:8px}
.k-titel .sym{font-size:24px}
.k-zahlen{margin-left:auto;display:flex;align-items:center;gap:12px;font:600 14px var(--display);color:var(--muted)}
.k-zahlen span{display:inline-flex;align-items:center;gap:5px}
.k-zahlen .sym{font-size:16px}
/* Was die Kinder sehen */
.vor-kopf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.vor-kopf b{font:600 18px/1.2 var(--display);min-width:0}
.marke{font:600 13px var(--display);padding:3px 10px;border-radius:999px;background:var(--lern-soft);color:#0F7A61;white-space:nowrap}
.jetzt.entwurf .marke{background:var(--spass-soft);color:#B4481A}
.jetzt.zu .marke{background:var(--surface2);color:var(--muted)}
.vor-chip{font:600 13px var(--display);color:var(--muted);background:var(--surface2);border-radius:999px;padding:3px 9px;white-space:nowrap}
.tablet-rahmen{background:var(--ink);border-radius:18px;padding:10px}
.jetzt.entwurf .tablet-rahmen{outline:3px dashed var(--spass);outline-offset:2px}
.vor-bilder{background:var(--bg);border-radius:9px;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;min-height:120px;align-content:start}
.vk{background:var(--surface);border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm);min-width:0}
.vk.mehr{display:grid;place-items:center;font:600 18px var(--display);color:var(--muted);min-height:70px}
.vk.ganz{grid-column:1/-1}
.vk .th,.fav-k .th{display:grid;place-items:center;width:100%;aspect-ratio:16/10;object-fit:cover;background:var(--surface2);font-size:30px}
.vk.ganz .th{aspect-ratio:auto;height:96px;font-size:44px}
.vk b,.fav-k b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:600 12.5px/1.2 var(--display);padding:5px 7px 6px;overflow-wrap:anywhere}
.aktion{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
#hinweis{font-size:17px}
/* Favoriten */
.fav-reihe{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.fav-k{position:relative;min-width:0;background:var(--surface2);border-radius:12px;overflow:hidden;outline:2px solid transparent}
.fav-k.on{outline-color:var(--lern);background:var(--lern-soft)}
.fav-laden{display:block;width:100%;border:0;background:transparent;padding:0;text-align:left;cursor:pointer;color:inherit}
.fav-weg{position:absolute;right:3px;top:3px;background:rgba(255,255,255,.9);padding:3px 7px}
/* iPads: nur das Gerät */
#geraete{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ipad{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;background:var(--surface2);border-radius:14px;padding:10px 4px 9px;text-align:center;font-size:12px;color:var(--muted)}
.ipad.geist{background:transparent;border:2px dashed var(--line);color:var(--line);justify-content:center}
.ipad-bild{position:relative;display:grid;place-items:center;font-size:54px;line-height:1;color:var(--muted)}
.ipad.online .ipad-bild{color:var(--ink)}
.ipad-bild i{position:absolute;font:700 21px/1 var(--display);padding-bottom:3px}
.ipad.ok .ipad-bild i{color:var(--lern)}
.ipad.fehlt .ipad-bild i{color:var(--spass)}
.ipad-name{border:0;background:transparent;font:600 13px var(--display);color:var(--ink);cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 2px}
.ipad-on{display:inline-flex;align-items:center;gap:4px}
.ipad-frei{font-weight:700}
.ipad.ok .ipad-frei{color:#0F7A61}
.ipad.fehlt .ipad-frei{color:#B4481A}
/* Kinder: nur die Arbeit */
.kv-reihe{display:flex;gap:6px;overflow-x:auto;padding:3px;margin:-3px -3px 8px}
.kv{flex:none;width:64px;height:42px;border:0;border-radius:9px;padding:0;overflow:hidden;background:var(--surface2);cursor:pointer;display:grid;place-items:center;font-size:20px;opacity:.6}
.kv.on{outline:3px solid var(--lern);opacity:1}
.kv .kv-bild{display:grid;place-items:center;width:100%;height:100%;object-fit:cover}
.kind-z{display:grid;grid-template-columns:minmax(0,1fr) 56px 38px 28px 28px;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.kind-z:first-of-type{border-top:0}
.kn{font-weight:700;overflow-wrap:anywhere;line-height:1.2}
.kind-z.leer .kn{font-weight:400;color:var(--muted)}
.kb{display:block;height:8px;border-radius:999px;background:var(--surface2);overflow:hidden}
.kb i{display:block;height:100%;background:var(--lern)}
.kx{text-align:right;font:600 13px var(--display);color:var(--muted)}
.m{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;font-size:15px;color:var(--muted)}
.m.an{background:var(--lern);color:#fff}
.m.aus{background:var(--surface2);color:var(--line)}
.m[data-art=werk].an{background:var(--spass)}
.kind-leer{text-align:center;color:var(--muted);font:600 20px var(--display);padding:8px 0}
.werke-streifen{display:flex;align-items:center;gap:6px;margin-top:10px;background:var(--surface2);border-radius:12px;padding:8px 10px;font:600 15px var(--display);min-height:52px}
.werke-streifen img{width:40px;height:40px;border-radius:8px;object-fit:cover;display:block}
.werke-streifen .pfeil{margin-left:auto;font-size:20px;color:var(--muted)}
/* Bearbeiten */
.modus{display:flex;gap:8px;flex-wrap:wrap}
.modus label{display:flex;align-items:center;gap:6px;background:var(--surface2);border-radius:999px;padding:8px 14px;cursor:pointer;font:600 14px var(--display);border:2px solid transparent}
.modus label:has(input:checked){background:var(--lern-soft);border-color:var(--lern);color:#0F7A61}
.modus input{position:absolute;opacity:0;width:0;height:0}
.modus i{font-style:normal;font-size:17px}
.feld{display:flex;flex-direction:column;gap:4px;margin-top:12px;min-width:0}
.feld>span{font:600 13px var(--display);color:var(--muted)}
.feld input[type=text],.feld select{width:100%}
.zwei{display:grid;grid-template-columns:minmax(0,1fr) 100px;gap:12px}
.schalter{display:flex;align-items:center;gap:8px;margin-top:12px;font:600 14px var(--display);cursor:pointer}
.schalter input{width:18px;height:18px;accent-color:var(--lern)}
/* Video-Auswahl */
.suche{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.suche input{flex:1;min-width:180px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;min-height:28px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--lern-soft);color:#0F7A61;border-radius:999px;padding:3px 6px 3px 12px;font:600 13px var(--display)}
.chip button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:14px;line-height:1;padding:2px 4px;border-radius:50%}
.videos{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:14px;margin-top:10px;background:var(--surface)}
.video{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.video:last-child{border-bottom:0}
.video:has(input:checked){background:var(--lern-soft)}
.video input{width:18px;height:18px;accent-color:var(--lern);flex:none}
.video .th{width:64px;height:40px;border-radius:8px;background:var(--surface2);object-fit:cover;flex:none;display:grid;place-items:center;font-size:20px}
.video b{font:600 14px var(--display);display:block}
.video small{color:var(--muted);font-size:12px}
/* Material und Drucken */
.material{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.mat-liste{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.mat{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border-radius:999px;padding:4px 12px;font-size:13px}
.mat small{color:var(--muted)}
.mat-pro{font-size:13px;margin:3px 0;color:var(--muted)}
.mat-pro b{color:var(--ink);font-weight:600}
.papier{display:inline-flex;gap:6px;margin-right:4px}
.papier label{display:flex;align-items:center;background:var(--surface2);border-radius:999px;padding:7px 14px;cursor:pointer;font:600 13px var(--display);border:2px solid transparent}
.papier label:has(input:checked){background:var(--lern-soft);border-color:var(--lern);color:#0F7A61}
.papier input{position:absolute;opacity:0;width:0;height:0}
/* Schmal: Vorschau, Favoriten, iPads, Kinder, dann Bearbeiten */
@media (max-width:900px){
 .lektion{display:flex;flex-direction:column;align-items:stretch;gap:0}
 .spalte{display:contents}
 #karte-vor{order:1}#favoriten-karte{order:2}#karte-ipads{order:3}#karte-kinder{order:4}#karte-edit{order:5}
}
/* Druckbereich: am Bildschirm unsichtbar, beim Drucken das Einzige */
#druck{display:none}
@media print{
 html,body{background:#fff;margin:0}
 .wrap{display:none}
 #druck{display:block;color:#000;font:12pt/1.35 var(--body)}
 .blatt h1{font:600 22pt/1.1 var(--display);margin:0 0 4pt}
 .blatt .kopf{font-size:11pt;color:#444;margin-bottom:10pt;border-bottom:1.5pt solid #000;padding-bottom:6pt}
 .blatt h2{font:600 14pt/1.2 var(--display);margin:12pt 0 6pt}
 .check{list-style:none;margin:0;padding:0;columns:2;column-gap:12mm}
 .check li{break-inside:avoid;display:flex;gap:7pt;align-items:flex-start;padding:3pt 0;font-size:12.5pt}
 .check li i{flex:none;width:14pt;height:14pt;border:1.5pt solid #000;border-radius:3pt;margin-top:1pt}
 .check li small{display:block;font-size:9pt;color:#555}
 .pro{display:flex;gap:8pt;padding:4pt 0;border-bottom:.5pt solid #bbb;break-inside:avoid;font-size:11.5pt}
 .pro b{flex:0 0 42%;font-weight:700}
 .pro span{color:#222}
 .papier-a3 .check{columns:3}
 .qr-kopf{display:flex;gap:10mm;align-items:center;border-bottom:1.5pt solid #000;padding-bottom:5mm;margin-bottom:5mm}
 .qr-kopf canvas{width:34mm;height:34mm;image-rendering:pixelated}
 .qr-gitter{display:grid;grid-template-columns:repeat(2,1fr);gap:4mm}
 .qr-zelle{height:74mm;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;border:.5pt dashed #999;border-radius:3mm;padding:3mm;break-inside:avoid}
 .qr-zelle canvas{width:54mm;height:54mm;image-rendering:pixelated}
 .qr-zelle b{display:block;font:600 14pt/1.15 var(--display);margin-top:2mm}
 .qr-zelle small{font-size:10.5pt;color:#333}
 .papier-a3 .qr-gitter{grid-template-columns:repeat(3,1fr);gap:5mm}
 .papier-a3 .qr-zelle{height:84mm}
 .papier-a3 .qr-zelle canvas{width:62mm;height:62mm}
 .papier-a3 .qr-zelle b{font-size:16pt}
 .papier-a3 .qr-kopf canvas{width:40mm;height:40mm}
}
</style>
<style id="papier-stil">@page{size:A4 portrait;margin:14mm}</style>
</head>

<script>
(async()=>{
const $=s=>document.querySelector(s);

const THEMEN={naehen:'🪡 Nähen',sticken:'🧵 Sticken',haekeln:'🧶 Häkeln',stricken:'🧶 Stricken',weben:'🧺 Weben',perlen:'📿 Perlen',knuepfen:'🪢 Flechten & Knüpfen',wickeln:'🪁 Wickeln',filzen:'☁️ Filzen',falten:'📄 Falten',schneiden:'✂️ Schneiden & Kleben',holz:'🔨 Sägen & Nageln',schnitzen:'🪵 Schnitzen',formen:'🏺 Formen',drucken:'🖐️ Drucken',experimente:'🧪 Experimentieren'};

 gruppen=g.gruppen;favoriten=f.favoriten||[];klassen=k.klassen||[];sammlungen=w.sammlungen||[];VORSCHAU=new Set(b.bilder||[]);

const vorschlag=()=>{const m=$('input[name=modus]:checked').value;if(m==='projects'&&wahl.size===1)return videoOf([...wahl][0])?.title||'';return modus(m)[2]};

  +vs.map(v=>`<div class="mat-pro"><b>${esc(v.title)}</b>: ${(v.material||[]).length?esc((v.material||[]).map(matName).join(', ')):'–'}</div>`).join('');

/* Link aufs einzelne Video, gleiches Format wie schoolLink() in quelle/p2.js: Bildanleitungen «#a=<id>», sonst «#s=<base64url-Payload>». */
function videoLink(v){
 if(v.source&&v.source.type==='bilder')return W.APP_URL+'#a='+encodeURIComponent(v.id);
 const payload={t:v.title,s:(v.steps||[]).map(s=>[Math.round(s.t*10)/10,s.label]),a:(v.task&&v.task.text)||''};
 if(v.source&&v.source.type==='youtube')payload.y=v.source.id;else payload.u=(v.source&&v.source.url)||'';
 const mat=(v.material||[]).filter(Boolean);if(mat.length)payload.m=mat;
 const b64=btoa(unescape(encodeURIComponent(JSON.stringify(payload)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
 return W.APP_URL+'#s='+b64;
}
const datum=()=>new Date().toLocaleDateString('de-CH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
function drucken(art){
 const vs=gewaehlt();if(!vs.length)return;
 const papier=$('input[name=papier]:checked').value,titel=$('#titel').value.trim()||vorschlag(),klasse=+$('#klasse').value||aktiv.policy.grade;
 $('#papier-stil').textContent=`@page{size:${papier} portrait;margin:14mm}`;document.documentElement.classList.toggle('papier-a3',papier==='A3');
 const kopf=`<h1>${esc(titel)}</h1><div class="kopf">${esc(aktiv.name)}${klasse?` · ${klasse}. Klasse`:''} · ${esc(datum())}</div>`;
 const d=$('#druck');d.replaceChildren();
 if(art==='material'){
  const liste=materialListe(vs);
  d.innerHTML=`<div class="blatt">${kopf}<h2>Material richten</h2>${liste.length?`<ul class="check">${liste.map(m=>`<li><i></i><span>${esc(m.name)}${vs.length>1?`<small>${esc(m.titel.join(', '))}</small>`:''}</span></li>`).join('')}</ul>`:'<p>–</p>'}
   <h2>Pro Aufgabe</h2>${vs.map(v=>`<div class="pro"><b>${esc(v.title)}</b><span>${esc((v.material||[]).map(matName).join(', ')||'–')}${v.zeit?` · ${v.zeit} Min.`:''}</span></div>`).join('')}</div>`;
 }else{
  const blatt=document.createElement('div');blatt.className='blatt';
  const k=document.createElement('div');k.className='qr-kopf';
  if(aktiv.token)k.appendChild(QR.canvas(W.APP_URL+'#unterricht='+aktiv.token,400));
  k.insertAdjacentHTML('beforeend',`<div>${kopf.replace('class="kopf"','class="kopf" style="border:0;margin:0;padding:0"')}</div>`);
  blatt.appendChild(k);
  const g=document.createElement('div');g.className='qr-gitter';
  vs.forEach(v=>{const z=document.createElement('div');z.className='qr-zelle';const link=videoLink(v);
   try{z.appendChild(QR.canvas(link,600,link.length>300?'L':'M'))}catch(x){z.insertAdjacentHTML('beforeend','<p>⚠ Zu gross</p>')}
   z.insertAdjacentHTML('beforeend',`<b>${esc(v.title)}</b><small>${esc([THEMEN[v.areaId]||v.areaId||'',v.zeit?`${v.zeit} Min.`:''].filter(Boolean).join(' · '))}</small>`);g.appendChild(z)});
  blatt.appendChild(g);d.appendChild(blatt);
 }
 window.print();
}
window.addEventListener('afterprint',()=>$('#druck').replaceChildren());
function zeichneVideos(){
 const q=$('#suche').value.trim().toLowerCase(),t=$('#thema').value,k=+$('#stufe').value;
 const treffer=videos.filter(v=>(!q||v.title.toLowerCase().includes(q)||(v.gruppe||'').toLowerCase().includes(q))&&(!t||v.areaId===t)&&(!k||(v.stufen||[]).includes(k)));
 $('#videos').innerHTML=treffer.length?treffer.slice(0,120).map(v=>`<label class="video"><input type="checkbox" data-id="${v.id}"${wahl.has(v.id)?' checked':''}>${bildTag(v,'th')}<span class="grow"><b>${esc(v.title)}</b><small>${[THEMEN[v.areaId]||v.areaId,(v.stufen||[]).length?(v.stufen||[]).join('.–')+'. Klasse':'',(v.steps||[]).length?v.steps.length+' Schritte':''].filter(Boolean).join(' · ')}</small></span></label>`).join('')+(treffer.length>120?`<p class="klein" style="padding:8px 12px">+${treffer.length-120}</p>`:''):
  '<p class="klein" style="padding:12px">🔍 0</p>';
 $('#videos').querySelectorAll('input[data-id]').forEach(c=>c.onchange=()=>{c.checked?wahl.add(c.dataset.id):wahl.delete(c.dataset.id);zeichneChips()});

async function freigeben(p,unten){
 const b=$('#freigeben');b.disabled=true;$('#hinweis').textContent='⏳';fehler($('#fehler'));
 try{const r=await W.unterricht.freigabe(aktiv.id,aktiv.revision,p);aktiv.policy=r.policy;aktiv.revision=r.revision;$('#hinweis').textContent='✓';zeichneGruppen();zeichneJetzt();geraeteLaden();
  const ziel=innerWidth<=900?'#karte-ipads':unten?'#karte-vor':'';if(ziel)$(ziel).scrollIntoView({behavior:'smooth',block:'start'})}
 catch(x){$('#hinweis').textContent='';if(x.status===409){fehler($('#fehler'),x,'⚠ Geändert');setTimeout(()=>location.reload(),1800)}else fehler($('#fehler'),x)}

/* ---------- Was die Kinder mit dieser Freigabe sehen ---------- */
function gleich(a,b){const ids=x=>(x.ids||[]).filter(videoOf).join();
 return a.mode===b.mode&&(a.grade||null)===(b.grade||null)&&!!a.gallery===!!b.gallery&&!!a.plan===!!b.plan&&(a.mode!=='projects'||ids(a)===ids(b))&&(!a.title||!b.title||a.title===b.title)}
const karte=(innen,name,cls='')=>`<div class="vk${cls}">${innen}${name?`<b>${esc(name)}</b>`:''}</div>`;
function zeichneJetzt(){
 const el=$('#jetzt');if(!el)return;const f=ausFormular(),neu=!gleich(f,aktiv.policy),zu=f.mode==='closed',m=modus(f.mode);
 el.classList.toggle('entwurf',neu);el.classList.toggle('zu',!neu&&zu);$('#freigeben2').hidden=!neu;if(neu)$('#hinweis').textContent='';
 const chips=[f.grade?f.grade+'.':'',f.plan?'🧺▶📷':'',f.gallery?'🖼️':''].filter(Boolean).map(c=>`<span class="vor-chip">${c}</span>`).join('');
 einmal($('#vor-kopf'),`<span class="marke">${neu?'✎ Entwurf':zu?'🔒 Zu':'● Offen'}</span><b class="grow">${esc(f.title)}</b>${chips}`);
 const vs=f.ids.map(videoOf).filter(Boolean),galerie=f.gallery&&!zu?karte('<span class="th">🖼️</span>','Werke'):'';
 const kacheln=f.mode==='projects'?(vs.length?vs.slice(0,8).map(v=>karte(bildTag(v,'th'),v.title)).join('')+(vs.length>8?karte('',`+${vs.length-8}`).replace('class="vk"','class="vk mehr"').replace(/<\/?b>/g,''):''):karte('<span class="th">▶</span>','–',' ganz')):karte(`<span class="th">${m[1]}</span>`,m[2],' ganz');
 einmal($('#vor-bilder'),kacheln+galerie);
 markiereFavoriten(f);
}
const favBild=f=>{const v=videoOf((f.policy.ids||[])[0]);return v?bildTag(v,'th'):`<span class="th">${modus(f.policy.mode)[1]}</span>`};
function markiereFavoriten(f){document.querySelectorAll('[data-fav]').forEach(b=>{const x=favoriten.find(y=>y.id===b.dataset.fav);b.closest('.fav-k').classList.toggle('on',!!x&&gleich(f,x.policy))})}
/* ---------- iPads ---------- */
function zeichneGeraete(){
 const el=$('#geraete');if(!el)return;const n=geraete?geraete.now:0;
 const liste=(geraete?geraete.geraete:[]).map(d=>({...d,online:n-d.gesehen<ONLINE_MS,ok:d.revision>=geraete.revision})).sort((a,b)=>b.online-a.online||a.name.localeCompare(b.name,'de'));
 const soll=Math.max(IPADS,liste.length);
 einmal($('#g-anzahl'),geraete?`<span><i class="punkt an"></i>${liste.filter(d=>d.online).length}/${soll}</span><span>✓ ${liste.filter(d=>d.ok).length}/${soll}</span>`:'<span>–</span>');
 einmal(el,liste.map(d=>`<div class="ipad ${d.online?'online':'offline'} ${d.ok?'ok':'fehlt'}" data-id="${esc(d.id)}"><span class="ipad-bild">${SYM.tablet}<i>${d.ok?'✓':'↻'}</i></span><button class="ipad-name" data-name="${esc(d.id)}" title="Umbenennen">${esc(d.name)} ✎</button><span class="ipad-on"><i class="punkt${d.online?' an':''}"></i>${d.online?'Online':'Offline'}</span>${d.online?'':`<span>${vor(n-d.gesehen)}</span>`}<span class="ipad-frei">${d.ok?'Übernommen':'Fehlt'}</span></div>`).join('')
  +`<div class="ipad geist"><span class="ipad-bild">${SYM.tablet}</span></div>`.repeat(Math.max(0,soll-liste.length)));
}
/* ---------- Kinder: Arbeitsstand, nie Gerätestatus ---------- */
const kindName=key=>key==='_ohne'?'Ohne Name':key.slice(key.lastIndexOf('/')+1);
function kindVideos(){
 const p=aktiv.policy,offen=p.mode==='projects'?p.ids:[],st=kindDaten?.staende||[],g=geraete?.geraete||[];
 return [...new Set([...offen,...st.map(s=>s.videoId),...g.flatMap(d=>(d.fortschritt||[]).map(f=>f.videoId))])].filter(videoOf).slice(0,8);
}
function kindZeilen(id){
 const st=(kindDaten?.staende||[]).filter(s=>s.videoId===id),mengen=new Map();
 /* Was mit demselben Stand ankommt, hat zusammen gearbeitet */
 st.forEach(s=>{const ohne=s.kindKey==='_ohne',k=ohne?'_ohne':[s.stand,s.schritt,s.max,s.videoFertig,s.werkFertig].join('|');
  if(!mengen.has(k))mengen.set(k,{key:s.kindKey,namen:[],ohne,schritt:s.max??s.schritt,video:s.videoFertig,werk:s.werkFertig});
  const z=mengen.get(k);kindName(s.kindKey).split(/,\s*/).filter(Boolean).forEach(n=>{if(!z.namen.includes(n))z.namen.push(n)});
  if(z.namen.length>1)z.gruppe=true});
 const zeilen=[...mengen.values()],da=new Set(zeilen.flatMap(z=>z.namen));
 (KLASSE.finde(klassen,aktiv.name)?.namen||[]).forEach(n=>{if(!da.has(n))zeilen.push({key:n,namen:[n],leer:true,schritt:null,video:null,werk:null})});
 zeilen.sort((a,b)=>(a.ohne?1:0)-(b.ohne?1:0)||a.namen[0].localeCompare(b.namen[0],'de'));
 /* Ohne Meldung je Kind bleibt der Lektionsplan: die Gruppe am iPad */
 const plan=st.length?[]:(geraete?.geraete||[]).flatMap(d=>{const f=(d.fortschritt||[]).find(x=>x.videoId===id);return f?[{key:'ipad:'+d.id,namen:[d.name],gruppe:true,plan:true,material:!!f.schritte[0],video:!!f.schritte[1],werk:!!f.schritte[2],schritt:null}]:[]});
 return [...plan,...zeilen];
}
const marke=(art,w)=>w==null?`<span class="m" data-art="${art}">–</span>`:`<span class="m ${w?'an':'aus'}" data-art="${art}" title="${art==='spiel'?'Video beendet':'Werk fertig'}">${SYM[art]}</span>`;
function kindZeile(z,y){
 const x=z.schritt==null?null:y?Math.min(z.schritt+1,y):z.schritt+1;
 const mitte=z.plan?`<span class="m ${z.material?'an':'aus'}" title="Material">🧺</span>`:x==null?'<span class="kb"></span>':`<span class="kb"><i style="width:${y?Math.round(x/y*100):0}%"></i></span>`;
 return `<div class="kind-z${z.leer?' leer':''}" data-kind="${esc(z.key)}"><span class="kn">${z.gruppe?'👥 ':''}${esc(z.namen.join(', '))}</span>${mitte}<span class="kx">${x==null?'–':y?`${x}/${y}`:x}</span>${marke('spiel',z.video)}${marke('werk',z.werk)}</div>`;
}
function zeichneKinder(){
 const el=$('#kinder');if(!el)return;const ids=kindVideos();if(!ids.includes(kvideo))kvideo=ids[0]||null;
 if(!kvideo){einmal($('#k-zahlen'),'');einmal(el,'<div class="kind-leer">–</div>');return}
 const v=videoOf(kvideo),zs=kindZeilen(kvideo),kinder=zs.filter(z=>!z.plan&&!z.ohne),anzahl=f=>new Set(kinder.filter(f).flatMap(z=>z.namen)).size,N=anzahl(()=>true);

/* ---------- Werke der Klasse ---------- */
let werkeLauf=0,werkeUrls=[];
async function zeichneWerke(){
 const el=$('#werke-streifen'),lauf=++werkeLauf;if(!el)return;
 werkeUrls.forEach(u=>URL.revokeObjectURL(u));werkeUrls=[];
 el.setAttribute('href',KLASSE.adresse('sammlung.html',aktiv.name));el.innerHTML='🖼️ <b>–</b><span class="pfeil">›</span>';
 const s=KLASSE.finde(sammlungen,aktiv.name);if(!s)return;
 try{const {werke}=await W.sammlung.werke(s.id);if(lauf!==werkeLauf)return;
  const fotos=(await Promise.all(werke.slice(0,3).map(w=>W.sammlung.foto(w.id).catch(()=>null)))).filter(Boolean);
  if(lauf!==werkeLauf){fotos.forEach(u=>URL.revokeObjectURL(u));return}
  werkeUrls=fotos;el.innerHTML=`🖼️ ${fotos.map(u=>`<img src="${esc(u)}" alt="">`).join('')}<b>${werke.length}</b><span class="pfeil">›</span>`}catch{}
}
async function geraeteLaden(){
 const g=aktiv;if(!g||document.hidden)return;
 try{const [r,k]=await Promise.all([W.unterricht.geraete(g.id),W.unterricht.kindstand(g.id).catch(()=>null)]);if(g!==aktiv)return;
  if(r.revision!==g.revision){const unberuehrt=gleich(ausFormular(),g.policy);g.revision=r.revision;g.policy=r.policy;zeichneGruppen();if(unberuehrt)fuellen(g.policy)}
  geraete=r;kindDaten=k;zeichneGeraete();zeichneKinder();zeichneJetzt()}catch(x){if(g===aktiv)fehler($('#fehler'),x)}
}
/* ---------- Favoriten ---------- */
function zeichneFavoriten(){
 const el=$('#favoriten');if(!el)return;$('#favoriten-karte').hidden=!favoriten.length;
 el.innerHTML=favoriten.map(f=>`<div class="fav-k"><button class="fav-laden" data-fav="${f.id}">${favBild(f)}<b>${esc(f.name)}</b></button><button class="x fav-weg" data-weg="${f.id}" title="Entfernen">✕</button></div>`).join('');
 el.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{fuellen(favoriten.find(f=>f.id===b.dataset.fav).policy);$('#karte-vor').scrollIntoView({behavior:'smooth',block:'start'})});
 el.querySelectorAll('[data-weg]').forEach(b=>b.onclick=async()=>{if(!confirm('Favorit entfernen?'))return;try{await W.unterricht.favoritEntfernen(b.dataset.weg);favoriten=favoriten.filter(f=>f.id!==b.dataset.weg);zeichneFavoriten()}catch(x){fehler($('#fehler'),x)}});
 markiereFavoriten(ausFormular());
}
