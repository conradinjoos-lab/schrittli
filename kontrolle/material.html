<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Schrittli – Material</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="kontrolle.css">
<style>
/* Unterrichtsmaterial aus schrittli-werkstatt/material (Katalog: material/katalog.json, eine Kachel pro Dokument oder Thema) */
#suche{flex:1;min-width:180px;max-width:320px;border-radius:999px;padding:7px 14px;border:0;box-shadow:var(--shadow-sm)}
.mappe{background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-sm);border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;transition:transform .12s}
.mappe:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.mappe:focus-visible{outline:3px solid var(--lern);outline-offset:2px}
.mappe .bild{aspect-ratio:4/3;position:relative;overflow:hidden;background:var(--surface2);display:grid;place-items:center;font-size:42px}
.mappe .bild img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.mappe .text{padding:9px 12px 11px;display:flex;flex-direction:column;gap:4px}
.mappe .titel{font:600 15px/1.2 var(--display)}
.mappe .arten{font-size:13px;letter-spacing:1px}
.bereich{margin-top:18px}
.bereich h2 span{font:700 12px var(--body);color:var(--muted);background:var(--surface);border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:middle}
#mappe{width:min(92vw,640px)}
#mappe .kopf{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
#mappe .kopf b{font:600 20px/1.15 var(--display);flex:1}
#dateien{display:flex;flex-direction:column;max-height:70vh;overflow:auto;padding:6px}
.datei{display:flex;gap:12px;align-items:center;border:0;background:none;font:inherit;color:inherit;text-align:left;padding:10px 12px;border-radius:12px;cursor:pointer}
.datei:hover{background:var(--surface2)}
.datei .sym{font-size:24px;width:30px;text-align:center}
.datei .n{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700}
.datei .kb{font-size:12px;color:var(--muted);white-space:nowrap}
.datei.laedt{opacity:.5;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <a class="zurueck" href="./" title="Kontrolle">←</a>
  <div class="logo">📚</div>
  <div><h1>Material</h1></div>
 </header>
 <div class="leiste" id="filter"></div>
 <main id="liste"><div class="nichts">…</div></main>
 <p class="fehler" id="fehler"></p>
</div>
<dialog id="mappe"><div class="kopf"><b></b><button class="s" value="zu" title="Schliessen">✕</button></div><div id="dateien"></div></dialog>
<script src="werkstatt.js"></script>
<script src="../vorlagen/melden.js" defer></script>
<script>
(async()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const ART={pdf:['📄','application/pdf'],jpg:['🖼️','image/jpeg'],jpeg:['🖼️','image/jpeg'],png:['🖼️','image/png'],webp:['🖼️','image/webp'],svg:['🖼️','image/svg+xml'],
 mp4:['🎬','video/mp4'],docx:['📝',''],doc:['📝',''],pptx:['📊',''],ppsx:['📊',''],ppt:['📊',''],xlsx:['📈',''],xls:['📈',''],
 md:['📃','text/plain;charset=utf-8'],txt:['📃','text/plain;charset=utf-8'],json:['🧩','application/json'],jsonl:['🧩','text/plain;charset=utf-8'],html:['🌐','text/html;charset=utf-8'],js:['🧩','']};
const endung=n=>(n.match(/\.([a-z0-9]+)$/i)||[,''])[1].toLowerCase();
const groesse=b=>b>=1e6?(b/1e6).toFixed(1).replace('.0','')+' MB':Math.max(1,Math.round(b/1e3))+' kB';
const name=p=>p.split('/').pop().replace(/\.[a-z0-9]+$/i,'').replace(/[_]+/g,' ');
const voll=(m,p)=>[m.pfad,p].filter(Boolean).join('/');
let mappen=[],bereich='',suche='';
try{await W.bereit();mappen=(await W.material.katalog()).kacheln}catch(x){$('#liste').innerHTML=`<div class="nichts">⚠ ${esc(x.message||x)}</div>`;return}
const bereiche=[...new Set(mappen.map(m=>m.bereich))];
const passt=m=>(!bereich||m.bereich===bereich)&&(!suche||(m.titel+' '+m.bereich+' '+m.dateien.map(d=>d[0]).join(' ')).toLowerCase().includes(suche));

function leiste(){
 $('#filter').innerHTML=`<button data-b="" class="${bereich?'':'on'}">Alle<em>${mappen.length}</em></button>`+
  bereiche.map(b=>`<button data-b="${esc(b)}" class="${bereich===b?'on':''}">${esc(b.replace(/-/g,' '))}<em>${mappen.filter(m=>m.bereich===b).length}</em></button>`).join('')+
  `<input type="search" id="suche" placeholder="🔍" value="${esc(suche)}">`;
 $('#filter').querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{bereich=b.dataset.b;leiste();zeigen()});
 $('#suche').oninput=e=>{suche=e.target.value.trim().toLowerCase();zeigen()};
}
const beob=new IntersectionObserver(es=>es.forEach(async e=>{
 if(!e.isIntersecting)return;beob.unobserve(e.target);
 const m=mappen[+e.target.dataset.i];if(!m.bild)return;
 try{const b=await W.material.datei(m.bild);if(b)e.target.querySelector('.bild').innerHTML=`<img alt="" src="${URL.createObjectURL(b)}">`}catch{}
}),{rootMargin:'300px'});
function zeigen(){
 const gruppen=bereiche.map(b=>[b,mappen.map((m,i)=>[m,i]).filter(([m])=>m.bereich===b&&passt(m))]).filter(([,l])=>l.length);
 $('#liste').innerHTML=gruppen.length?gruppen.map(([b,l])=>`<section class="bereich"><h2>${esc(b.replace(/-/g,' '))}<span>${l.length}</span></h2><div class="gitter">${l.map(([m,i])=>{
   const arten=[...new Set(m.dateien.map(d=>(ART[endung(d[0])]||['📎'])[0]))];
   return `<button class="mappe" data-i="${i}"><div class="bild">${arten[0]||'📁'}</div><div class="text">${m.titel?`<div class="titel">${esc(m.titel)}</div>`:''}<div class="arten">${arten.join('')}${m.dateien.length>1?` <span class="klein">${m.dateien.length}</span>`:''}</div></div></button>`}).join('')}</div></section>`).join('')
  :'<div class="nichts">∅</div>';
 $('#liste').querySelectorAll('.mappe').forEach(k=>{beob.observe(k);k.onclick=()=>{const m=mappen[+k.dataset.i];m.dateien.length===1?holen(m,m.dateien[0][0],k):oeffnen(+k.dataset.i)}});
}
function oeffnen(i){
 const m=mappen[i],d=$('#mappe');
 d.querySelector('.kopf b').textContent=m.titel||m.bereich;
 $('#dateien').innerHTML=m.dateien.map(([p,s],j)=>`<button class="datei" data-j="${j}"><span class="sym">${(ART[endung(p)]||['📎'])[0]}</span><span class="n">${esc(name(p))}</span><span class="kb">${groesse(s)}</span></button>`).join('');
 $('#dateien').querySelectorAll('.datei').forEach(b=>b.onclick=()=>holen(m,m.dateien[+b.dataset.j][0],b));
 history.replaceState(null,'','#m='+encodeURIComponent(m.id));
 if(!d.open)d.showModal();
}
async function holen(m,p,knopf){
 const e=endung(p),[,typ]=ART[e]||['',''],zeigbar=!!typ&&e!=='js';
 const fenster=zeigbar?window.open('','_blank'):null;   // sofort öffnen, sonst blockiert Safari das Fenster nach dem Laden
 knopf.classList.add('laedt');$('#fehler').textContent='';
 try{
  let b=await W.material.datei(voll(m,p));if(!b)throw new Error('⚠ Fehlt');
  if(e==='html'){   // kleine Werkzeuge (z. B. Weben-Figuren): Skripte aus demselben Ordner einbetten
   let t=await b.text();const ordner=p.includes('/')?p.slice(0,p.lastIndexOf('/')+1):'';
   for(const s of [...t.matchAll(/<script src="([^":]+)"><\/script>/g)]){const js=await W.material.datei(voll(m,ordner+s[1]));if(js){const code=await js.text();t=t.replace(s[0],()=>'<script>'+code.replace(/<\/script/gi,'<\\/script')+'<\/script>')}}
   b=new Blob([t],{type:typ})}
  else b=new Blob([b],{type:typ||'application/octet-stream'});
  const url=URL.createObjectURL(b);
  if(fenster)fenster.location=url;
  else{const a=document.createElement('a');a.href=url;a.download=p.split('/').pop();document.body.append(a);a.click();a.remove()}
  setTimeout(()=>URL.revokeObjectURL(url),120000);
 }catch(x){if(fenster)fenster.close();$('#fehler').textContent=x.message.startsWith('⚠')?x.message:'⚠ '+x.message}
 finally{knopf.classList.remove('laedt')}
}
$('#mappe').addEventListener('click',e=>{if(e.target.value==='zu'||e.target===e.currentTarget)e.currentTarget.close()});
$('#mappe').addEventListener('close',()=>history.replaceState(null,'',location.pathname));
leiste();zeigen();
const h=decodeURIComponent((location.hash.match(/^#m=(.+)$/)||[,''])[1]),i=mappen.findIndex(m=>m.id===h);
if(i>=0)oeffnen(i);
})();
</script>
</body>
</html>
