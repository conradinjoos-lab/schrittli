const arbeitsSicht=()=>['player','anleitung'].includes(view.name);
const WW_ART=[['allein','bibo-hallo','Allein'],['gruppe','beide-highfive','Gruppe']];
/* Kacheln. wechsel: Klasse, Allein oder Gruppe, dann Namen; leer, damit ein neues Kind nicht zur Gruppe wird. foto: Mehrfachwahl mit Kamera-Knopf, die aktuelle Wahl ist schon da. nachtrag: nur bestätigen. */
function werKacheln(el,{modus,fertig,zu,ohne}){ const ks=KL.klassen, wechsel=modus==='wechsel'; let gew=wechsel?[]:kinder().slice(), k=ks.length===1?ks[0]:wechsel?null:ks.find(x=>x.id===((kind()||{}).liste||S.settings.liste))||null, art=wechsel?null:'gruppe';
  const fuss=()=>{ const n=gew.length, zahl=n?` <b>${n}</b>`:'', kam=`<button class="ww-kamera" data-act="kamera" aria-label="Foto">📷${zahl}</button>`, f=t=>`<div class="ww-fuss">${t}</div>`;
    if(modus==='nachtrag') return f(`<button class="ww-gehe" data-act="ok" aria-label="OK"${n?'':' disabled'}>${ico('check')}${zahl}</button>`);
    if(modus==='foto') return f(kam);
    if(k&&art==='gruppe') return f(`<button class="ww-kamera klein" data-act="kamera" aria-label="Foto">📷</button><button class="ww-gehe haupt" data-act="ok" aria-label="Weiter"${n?'':' disabled'}>→${zahl}</button>`);
    return !art&&(!k||ks.length===1)&&kinder().length?f(`<button class="ww-gehe ohne" data-act="ohne">Abmelden</button>${kam}`):''; };
  const fussNeu=()=>{ const f=$('.ww-fuss',el); if(f) f.outerHTML=fuss(); };
  const zeichne=()=>{ const s=k&&klasseVon({liste:k.id}), ist=n=>gew.some(x=>x.liste===k.id&&x.name===n);
    el.innerHTML=wwHtml(k?k.name:'Klasse',`${k&&!art?`<div class="ww-art">${WW_ART.map(([a,b,t])=>`<button class="ww-wahl" data-act="art" data-art="${a}"><img src="${GRAFIK}figuren/${b}.webp" alt=""><b>${t}</b></button>`).join('')}</div>`
      :`<div class="ww-raster">${k?k.namen.map(n=>`<button class="ww-k${ist(n)?' ich':''}" data-act="ich" data-n="${esc(n)}" aria-pressed="${ist(n)}">${esc(n)}</button>`).join('')
      :ks.map(x=>`<button class="ww-k" data-act="liste" data-id="${esc(x.id)}" data-s="${x.stufe||''}">${esc(x.name)}</button>`).join('')}</div>`}${fuss()}`,{zurueck:!!k&&(ks.length>1||wechsel&&!!art),caps:s&&s<3});
    const r=$('.ww-raster',el); if(r) wwFuellen(r); };
  wire(el,{ liste:b=>{ k=ks.find(x=>x.id===b.dataset.id); zeichne(); }, zurueck:()=>{ if(wechsel&&art) art=null; else k=null; zeichne(); }, zu,
    art:b=>{ art=b.dataset.art; if(art==='allein') gew=[]; zeichne(); },
    ich:b=>{ const n=b.dataset.n; if(art==='allein'){ fertig([{liste:k.id,name:n,key:kindKeyIn(k,n)}]); return; } const i=gew.findIndex(x=>x.liste===k.id&&x.name===n); if(i>=0) gew.splice(i,1); else if(gew.length>=6){ toast('⚠ Max. 6'); return; } else gew.push({liste:k.id,name:n,key:kindKeyIn(k,n)}); b.classList.toggle('ich',i<0); b.setAttribute('aria-pressed',String(i<0)); fussNeu(); },
    kamera:()=>fertig(wechsel&&!gew.length?kinder():gew,true), ok:()=>{ if(gew.length) fertig(gew); }, ohne:()=>ohne() });
  zeichne(); }
function werWahl(weiter){ const el=wwAuf(); werKacheln(el,{modus:'foto',fertig:gew=>{ const anders=!gleicheWahl(gew,kinder()); el.remove(); kinderSetzen(gew); if(anders&&arbeitsSicht()) go(view.name,view.params); else if(view.name==='home') render(); weiter(anders); },zu:()=>el.remove()}); }
/* Offene Arbeit der gewählten Kinder, das Neuste zuerst. */
function offeneArbeit(){ const m=new Map(); kindKeys().forEach(k=>{ const b=S.arbeit[k]||{}; for(const id in b){ const a=b[id], v=videoOf(id); if(!v||a.done||!(a.pos>5||a.step>0||(a.erledigt||[]).length||Object.keys(a.entwuerfe||{}).length)) continue; const x=m.get(id); if(!x||arbeitRang(a)>arbeitRang(x.pr)) m.set(id,{id,v,pr:a}); } }); return [...m.values()].sort((a,b)=>(b.pr.zeit||0)-(a.pr.zeit||0)); }
const arbeitZahl=({v,pr})=>{ const n=schrittListe(v).length, i=(pr.step||0)+1; return n?`${Math.min(i,n)}/${n}`:''; };
/* Entwürfe aus den Werkzeugen: Schlüssel von Planer.speicher. Ohne Name liegt der Stand unter dem bestehenden Schlüssel des Werkzeugs. */
const ENTWURF_BASEN=['schrittli-vorlagen','schrittli-vorlagen-liste','schrittli.bohren.v1','schrittli.falten.v1','schrittli.kiste.v1','schrittli.mechanik.v1','schrittli.maschenprobe.v1','schrittli.zaehlmuster.v1'];
const entwurfPfad=b=>/^schrittli-vorlagen/.test(b)?'':((/^schrittli\.(\w+)\.v\d+$/.exec(b)||[])[1]||'?')+'/';
function entwurfBasen(k){ const o=[]; try{ if(k===OHNE) return ENTWURF_BASEN.filter(b=>localStorage.getItem(b)!==null); const h='.kind.'+k; for(const s of Object.keys(localStorage)) if(s.endsWith(h)) o.push(s.slice(0,-h.length)); }catch(e){} return o; }
const hashText=t=>{ let h=5381; for(let i=0;i<t.length;i++) h=(h*33^t.charCodeAt(i))|0; return h; };
function entwurfMerken(){ const k=kinder().length>1?kindKeys()[0]:null, m={}; if(k) try{ for(const b of entwurfBasen(k)) m[b]=hashText(localStorage.getItem(b+'.kind.'+k)||''); }catch(e){} S.settings.entwurfBasis=m; }
/* Werkzeuge schreiben nur beim ersten Kind. Was die Gruppe dort geändert hat, geht an die anderen. */
function entwuerfeSpiegeln(){ const ks=kindKeys(); if(!SCHULE||ks.length<2) return; const m=S.settings.entwurfBasis||{}; try{ for(const b of entwurfBasen(ks[0])){ const t=localStorage.getItem(b+'.kind.'+ks[0]); if(t===null||m[b]===hashText(t)) continue; ks.slice(1).forEach(k=>localStorage.setItem(b+'.kind.'+k,t)); m[b]=hashText(t); } }catch(e){} S.settings.entwurfBasis=m; save(); }
/* Vorlagen-Entwürfe an offene Projekte hängen, die den Generator verlinken; der Rest sind eigene Werkzeugkarten. */
function entwurfKarten(){ const m=new Map(); for(const k of kindKeys()) for(const b of entwurfBasen(k)){ const pf=entwurfPfad(b), w=WERKZEUGE.find(x=>x[0]===pf); if(!w) continue; const a=pf?[]:Object.entries(S.arbeit[k]||{}).filter(([id,r])=>!r.done&&((videoOf(id)||{}).vorlagen||[]).some(x=>String(x.datei)[0]==='?')); if(a.length){ a.forEach(([,r])=>{ (r.entwuerfe=r.entwuerfe||{})[b]=1; }); continue; } m.set(pf,w); } return [...m.values()]; }
/* Bildkarten mit dem Stand: «Weiter» springt ins Projekt, die Werkzeugkarte öffnet den Entwurf. */
function standZeigen(el,fertig){ const wz=entwurfKarten(), o=offeneArbeit(); if(!o.length&&!wz.length){ fertig(); return; } const namen=kinder().length?namenText(kinder()):'Ohne Name';
  const karte=x=>`<button class="ww-karte" data-act="weiter" data-id="${esc(x.id)}"><img src="${esc(thumbOf(x.v))}" alt=""><span class="ww-titel">${esc(x.v.title)}</span><span class="ww-z">${arbeitZahl(x)}</span><span class="ww-los">Weiter ▶</span></button>`;
  const werkz=([pf,bild,t,farbe])=>`<a class="ww-karte" href="${VORL_BASE}${pf}"><span class="ww-sym" style="background:${farbe}" aria-hidden="true">${bild}</span><span class="ww-titel">${t}</span><span class="ww-los">Weiter ▶</span></a>`;
  el.innerHTML=wwHtml(namen,`<div class="ww-stand${o.length+wz.length===1?' eins':''}">${o.map(karte).join('')}${wz.map(werkz).join('')}</div>`);
  wire(el,{ weiter:b=>fertig(b.dataset.id), zu:()=>fertig() }); $$('a.ww-karte',el).forEach(a=>a.addEventListener('click',()=>setTimeout(()=>fertig(),0))); }
/* Kurzlogin: Wahl, dann der Stand. Offene Player und Anleitungen zeichnen sich für das neue Kind neu. */
function kinderWechsel(){ const el=wwAuf(), neu=()=>{ if(arbeitsSicht()){ const {stelle,los,...rest}=view.params; go(view.name,rest,{ersetzen:true}); } else if(['home','raum','area','gallery','unterricht','werkzeuge','projekt','suche','restzeit','sammlung'].includes(view.name)) render(); };
  const stand=gew=>{ kinderSetzen(gew); standZeigen(el,id=>{ el.remove(); if(id) go('player',{videoId:id}); else neu(); }); };
  werKacheln(el,{modus:'wechsel',fertig:(gew,foto)=>{ if(!foto){ stand(gew); return; } const anders=!gleicheWahl(gew,kinder()), id=videoJetzt(); el.remove(); kinderSetzen(gew); if(anders) neu(); kamera(id,null,true); },ohne:()=>stand([]),zu:()=>el.remove()}); }
/* Ohne Klassenliste gibt es keine Kacheln: der Weg zur Verbindung. Kommt die Liste doch noch, gehen die Kacheln auf. */
async function werLeer(){ const el=wwAuf(); el.innerHTML=wwHtml(klToken()?'⚠ Keine Klassen':'⚠ Nicht verbunden','<div class="ww-raster"><button class="ww-k" data-act="lehrer">🔗 Verbinden</button></div>'); wwFuellen($('.ww-raster',el));
  wire(el,{ zu:()=>el.remove(), lehrer:()=>{ el.remove(); go('lehrer'); } }); await klHolen(); if(el.isConnected&&KL.klassen.length){ el.remove(); kinderWechsel(); } }
SCREENS.wer=app=>{ const weiter=id=>id?go('player',{videoId:id}):go(S.settings.klasse?'home':'klasse'); if(!KL.klassen.length){ weiter(); return; } KL.gefragt=true; const stand=gew=>{ kinderSetzen(gew); standZeigen(app,weiter); };
  werKacheln(app,{modus:'wechsel',fertig:(gew,foto)=>{ if(!foto){ stand(gew); return; } kinderSetzen(gew); weiter(); kamera(null,null,true); },ohne:()=>stand([]),zu:()=>weiter()}); };
function verbindungenHtml(){ if(!SCHULE) return '';
  const z=(titel,name,act)=>`<div class="verb-zeile"><b>${titel}</b><span class="${name?'an':''}">${name?'✓ '+esc(name):'–'}</span>${name?`<button class="btn sm" data-act="${act}">Trennen</button>`:''}</div>`;
  return `<div class="panel verb"><h2>Verbindungen</h2>
    ${z('Unterricht',U.verb&&(U.verb.name||'Gruppe'),'u-trennen')}
    ${z('Rückmeldungen',RM.verb&&RM.verb.name,'rm-trennen')}
    ${z('Unsere Werke',SW.verb&&SW.verb.name,'sw-trennen')}
    <div class="verb-zeile"><b>Klassen</b><span class="${KL.klassen.length?'an':''}">${KL.klassen.length?`✓ ${KL.klassen.length} ${KL.klassen.length===1?'Klasse':'Klassen'} · ${KL.klassen.reduce((n,k)=>n+k.namen.length,0)} Vornamen${kind()?' · '+esc(kind().name):''}`:'–'}</span>${klToken()?`<button class="btn sm" data-act="kl-holen">Neu laden</button>`:''}</div>
    <div class="row"><input class="inp" id="verb-link" placeholder="Link" autocomplete="off" spellcheck="false" style="flex:1;min-width:200px"><button class="btn primary" data-act="verbinden">Verbinden</button></div>
    <div class="row verb-links"><a class="btn" href="../kontrolle/unterricht.html">Unterricht</a><a class="btn" href="../kontrolle/rueckmeldungen.html">Rückmeldungen</a><a class="btn" href="../kontrolle/sammlung.html">Werke</a><a class="btn" href="../kontrolle/klassen.html">Klassen</a></div></div>`; }
function verbindungenAktionen(app){ return {
  'u-trennen':()=>confirmBox('Unterricht trennen?','','Trennen',()=>{ U.verb=null; U.policy=null; uSpeichern(); uWechsel(); render(); },true),
  'rm-trennen':()=>{ RM.verb=null; rmSpeichern(); toast('Rückmeldungen getrennt'); render(); },
  'kl-holen':async b=>{ b.disabled=true; await klHolen(); toast(KL.klassen.length?'✓ Vornamen':'⚠ Vornamen'); render(); },
  'sw-trennen':()=>confirmBox('Werke trennen?','Eigene Fotos bleiben','Trennen',()=>{ swTrennen(); render(); },true),
  verbinden:async b=>{ const inp=$('#verb-link',app); const t=(inp&&inp.value||'').trim(); const m=t.match(/(unterricht|klasse|sammlung)=([0-9a-fA-F]{64})(?![0-9a-fA-F])/); if(!m){ toast('⚠ Link'); return; }
    b.disabled=true; try{ await verbindungSetzen(m[1],m[2].toLowerCase()); if(inp) inp.value=''; if(view.name==='lehrer') render(); }catch(e){ toast(fehlerKurz(e),5000); } b.disabled=false; } }; }
async function verbindungSetzen(art,token){
  if(art==='unterricht'){ U.verb={token,deviceId:(U.verb&&U.verb.deviceId)||uuid(),id:null,name:''}; U.policy=null; U.revision=0; uSpeichern(); uLaufen(); await uSync(); if(!U.verb) throw new Error(U.error||'⚠ Verbindung'); if(U.error) throw new Error(U.error); toast('✓ '+(U.verb.name||'Gruppe'),3500); uWechsel(); }
  else if(art==='klasse') await rmVerbinden(token);
  else await swVerbinden(token);
  klHolen(); }

/* ============================== Papierflieger-Sammlung (Werkstatt-Look v3) ==============================
   Die Klassenwahl gilt wie überall in der Schule; mit «Alle» lässt sie sich hier aufheben. */
const fuerKlasse=(v,alle)=>alle||!SCHULE||!S.settings.klasse||(v.stufen||[]).includes(S.settings.klasse);
/* Eine Zeile wie auf der Themenseite, für die Papierflieger-Liste. */
function katZeile(v,{thema=true}={}){ const pr=prSchule(v); const th=thumbOf(v); const a=areaOf(v.areaId);
  const meta=[thema&&a?a.name:'',v.source.type==='bilder'?'Foto-Anleitung':'',(v.steps||[]).length?v.steps.length+' Schritte':'',zeitText(v),v.task&&v.task.text&&v.task.deliverable!=='keine'?'Aufgabe':''].filter(Boolean).join(' · ');
  return `<button class="v3-lektion" data-act="video" data-id="${v.id}"><span class="th">${th?`<img src="${th}" alt="" loading="lazy">`:''}<i aria-hidden="true">${v.source.type==='bilder'?'📷':'▶'}</i></span><span class="grow"><b>${esc(v.title)}</b><span class="v3-meta">${meta}</span></span>${niveauHtml(v)}<span class="v3-badge ${pr.done?'fertig':'offen'}" aria-label="${pr.done?'fertig':'noch offen'}">${pr.done?'✓':'▶'}</span></button>`; }
const chips=(act,wahl,akt,alle='Alle')=>`<div class="v3-chips" role="group">${alle?`<button class="${akt?'':'an'}" data-act="${act}" data-v="" aria-pressed="${!akt}">${alle}</button>`:''}${wahl.map(([w,t])=>`<button class="${akt===w?'an':''}" data-act="${act}" data-v="${w}" aria-pressed="${akt===w}">${t}</button>`).join('')}</div>`;
/* ---------- Papierflieger: alle Modelle aus dem Thema Falten, von leicht bis knifflig ---------- */
const istFlieger=v=>v.areaId==='falten'&&(/^flieger-/.test(v.id)||/papierflieger/i.test(v.title));
const fliegerVideos=(alle=false)=>S.videos.filter(v=>istFlieger(v)&&fuerKlasse(v,alle));
const FLIEGER_NIVEAU=[[1,'Leicht'],[2,'Mittel'],[3,'Knifflig']];
function sammlungKachel(r){ if(r.id!=='hand') return ''; const vs=fliegerVideos(); if(vs.length<3) return ''; const cover=vs.find(v=>v.id==='flieger-windhover')||vs.find(v=>thumbOf(v)); const th=cover&&thumbOf(cover);
  return `<button class="v3-kachel sammlung" data-act="sammlung"><span class="bild" style="background:#DCEBF7">${th?`<img src="${th}" alt="" loading="lazy">`:'<span aria-hidden="true">✈️</span>'}</span><b>Papierflieger</b><span class="v3-zeile"><span class="v3-meta">${vs.length} Modelle</span><span class="v3-meta">✈️</span></span></button>`; }
SCREENS.sammlung=(app,params={})=>{ let niv=+params.niveau||0; const alle=!!params.alle; const k=S.settings.klasse;

      ${SCHULE&&k?`<div class="v3-schalter" role="group" aria-label="Klasse"><button class="${alle?'':'an'}" data-act="alle" data-v="">${k}. Klasse</button><button class="${alle?'an':''}" data-act="alle" data-v="1">Alle</button></div>`:''}</div>
    <div class="v3-liste" id="fl-liste"></div>
    ${v3Fuss()}</div></div>`;
  const zeichnen=()=>{ const vs=fliegerVideos(alle); const gr=FLIEGER_NIVEAU.filter(([n])=>!niv||n===niv).map(([n,t])=>[t,vs.filter(v=>(+v.niveau||2)===n).sort((a,b)=>a.title.localeCompare(b.title,'de'))]).filter(([,g])=>g.length);
    $('#fl-liste',app).innerHTML=gr.map(([t,g])=>`${niv?'':`<h2 class="v3-niv" style="--h:#DCEBF7;--d:#1C4A63"><span>${g.length}</span>${t}</h2>`}${g.map(v=>katZeile(v,{thema:false})).join('')}`).join('')||`<div class="v3-leer vf-leer">${figur('nachdenken')}<div class="vf-chips">${niv?`<span class="vf an">${FLIEGER_NIVEAU.find(([x])=>x===niv)[1]}</span>`:''}${S.settings.klasse&&!alle?`<span class="vf an">${S.settings.klasse}. Klasse</span>`:''}</div><button class="v3-pill vf-alle" data-act="niv" data-v="">↺ Alle</button></div>`;
    view.params.niveau=niv; view.params.alle=alle; };
  zeichnen();
  wire(app,{ back:()=>navZurueck('home'), niv:b=>{ niv=+b.dataset.v||0; $$('[data-act=niv]',app).forEach(x=>x.classList.toggle('an',x.dataset.v===b.dataset.v)); zeichnen(); }, alle:b=>go('sammlung',{niveau:niv,alle:!!b.dataset.v},{ersetzen:true}),
    video:b=>go('projekt',{videoId:b.dataset.id}), gallery:()=>go('gallery'), lehrer:()=>go('lehrer'), werkzeuge:()=>go('werkzeuge') });
};

/* ============================== Schule: Restzeit, Führerschein, Beamer, Lektionsplan ============================== */
/* Schnellzugriff auf der Raum-Seite (nur Schule). Im Unterrichtsmodus «closed» kommt die Seite gar nicht dran; sicherheitshalber trotzdem prüfen. */
function schnellBand(){ if(!SCHULE) return ''; const p=uPolicy(); if(p&&p.mode==='closed') return '';
  const fs=fsStand(); const n=FUEHRERSCHEINE.filter(f=>fs[f.id]&&fs[f.id].gesehen).length;
  return `<div class="v3-schnell"><button class="v3-schnell-btn zeit" data-act="restzeit" aria-label="Restzeit 10 min"><span class="sym" aria-hidden="true">⏱️</span><span class="txt"><b>10 min</b></span></button>
    ${FS_AN?`<button class="v3-schnell-btn fs" data-act="fuehrerschein"><span class="sym" aria-hidden="true">🪪</span><span class="txt"><b>Werkzeug-Führerschein</b>${n?`<small>${n}/${FUEHRERSCHEINE.length}</small>`:''}</span></button>`:''}</div>`; }

/* ---- Restzeit: zuerst was sicher passt, dann was knapp werden kann, je nach Schwierigkeit. Ohne Zeitangabe kein Eintrag, kein Countdown ---- */
const RESTZEIT_WAHL=[5,10,15,20];
const zeitSicher=(v,min)=>{ const z=zeitVon(v); return !!z&&z[1]<=min&&!v.trocknen; };
function restzeitListe(min,p=uPolicy()){ let vs=S.videos.filter(v=>{ const z=zeitVon(v); return z&&z[0]<=min&&fuerKlasse(v); }); if(p&&p.mode==='projects') vs=vs.filter(v=>p.ids.includes(v.id));
  return vs.sort((a,b)=>(zeitSicher(b,min)-zeitSicher(a,min))||((+a.niveau||2)-(+b.niveau||2))||a.title.localeCompare(b.title,'de')); }
SCREENS.restzeit=(app,params={})=>{ let min=RESTZEIT_WAHL.includes(+params.min)?+params.min:10; const k=S.settings.klasse; const p=uPolicy();
  app.innerHTML=`<div class="v3${schriftNormal()?'':' caps'} restzeit"><div class="v3-in">
    ${v3Kopf('<button class="v3-rund gross" data-act="back" aria-label="Zurück">←</button>',`<div class="v3-thema-titel"><h1 id="rz-titel">⏱ ${min} min</h1></div>`)}
    <div class="rz-wahl" role="group" aria-label="Minuten">${RESTZEIT_WAHL.map(m=>`<button class="rz-min${m===min?' an':''}" data-act="min" data-m="${m}" aria-pressed="${m===min}"><b>${m}</b><small>min</small></button>`).join('')}</div>
    <div class="v3-liste" id="rz-liste"></div>
    ${v3Fuss(false)}</div></div>`;
  const zeichnen=()=>{ const vs=restzeitListe(min,p), mehr=RESTZEIT_WAHL.find(m=>m>min&&restzeitListe(m,p).length);
    $('#rz-liste',app).innerHTML=vs.map(v=>{ const th=thumbOf(v), a=areaOf(v.areaId), z=zeitVon(v), sicher=zeitSicher(v,min), t=z[0]===z[1]?z[0]:z[0]+'–'+z[1];
      return `<button class="v3-lektion rz-zeile" data-act="video" data-id="${v.id}" data-passt="${sicher?'sicher':'knapp'}"><span class="th">${th?`<img src="${th}" alt="" loading="lazy">`:''}<i aria-hidden="true">${v.source.type==='bilder'?'📷':'▶'}</i></span><span class="grow"><b>${esc(v.title)}</b><span class="v3-meta">${niveauHtml(v)}${a?`<span>${esc(a.name)}</span>`:''}${zeitHtml({trocknen:v.trocknen})}</span></span><span class="rz-zeit ${sicher?'sicher':'knapp'}" aria-label="${t} min"><i aria-hidden="true">${sicher?'✓':'⏱'}</i> ${t}<small>min</small></span>${fortschrittHtml(v)}</button>`; }).join('')
      ||`<div class="v3-leer vf-leer">${figur('nachdenken')}<div class="vf-chips"><span class="vf an">⏱ ${min} min</span>${SCHULE&&k?`<span class="vf an">${k}. Klasse</span>`:''}</div>${mehr?`<button class="v3-pill vf-alle" data-act="min" data-m="${mehr}">⏱ ${mehr} min</button>`:'<button class="v3-pill vf-alle" data-act="back" aria-label="Zurück">←</button>'}</div>`;
    $('#rz-titel',app).textContent='⏱ '+min+' min'; view.params.min=min; };
  zeichnen();
  wire(app,{ back:()=>navZurueck(p&&p.mode==='projects'?'unterricht':'home'), min:b=>{ min=+b.dataset.m; $$('.rz-min',app).forEach(x=>{ const an=+x.dataset.m===min; x.classList.toggle('an',an); x.setAttribute('aria-pressed',String(an)); }); zeichnen(); },
    video:b=>go('projekt',{videoId:b.dataset.id}), gallery:()=>go('gallery'), lehrer:()=>go('lehrer') });
};

/* ---- Werkzeug-Führerschein: kleines Quiz vor gefährlichen Werkzeugen ----
   Frage: {f, a:[3 Antworten], r: Index der richtigen, e: einfacher Text für 1.–2. Klasse (optional)}.
   Stand in S.settings.fuehrerschein[id] = {datum, gesehen} – bleibt auf dem Gerät wie die Klasse. */
const FS_AN=false;                                                       // vorerst ausgeblendet: keine Kachel, kein Hinweis im Video
const FUEHRERSCHEINE=[
 {id:'schnitzen',titel:'Schnitzmesser',emoji:'🔪',farbe:'#EEF3E2',regex:/schnitz|messer/i,fragen:[
   {f:'In welche Richtung schnitzt du?',e:'Wohin schnitzt du?',a:['Immer vom Körper weg','Zu mir hin, so sehe ich besser','Egal, Hauptsache schnell'],r:0},
   {f:'Wie weit sitzt du von anderen Kindern weg?',e:'Wie weit weg sitzt du von den anderen?',a:['Ganz nah, dann können wir reden','Mindestens einen Arm weit – Sicherheitsabstand','Das ist egal'],r:1},
   {f:'Wie hältst du das Messer?',a:['Mit zwei Fingern an der Klinge','Locker, dann tut es nicht weh','Mit der ganzen Hand fest am Griff'],r:2},
   {f:'Wann darfst du schnitzen?',a:['Nur im Sitzen und ganz ruhig','Auch im Gehen','Wenn ich schnell bin, immer'],r:0},
   {f:'Was trägst du an der Hand, die das Holz hält?',e:'Was kommt an die Hand mit dem Holz?',a:['Nichts','Den Schnitzhandschuh','Einen Ring'],r:1},
   {f:'Was machst du mit dem Messer, wenn du fertig bist?',e:'Du bist fertig. Wohin mit dem Messer?',a:['Offen auf den Tisch legen','Einem Kind zuwerfen','Zuklappen oder in die Hülle stecken'],r:2}]},
 {id:'saegen',titel:'Laubsäge & Feinsäge',emoji:'🪚',farbe:'#FFF1E6',regex:/säg|saeg/i,fragen:[
   {f:'Wie muss das Holz liegen, bevor du sägst?',e:'Wie liegt das Holz beim Sägen?',a:['Lose auf dem Tisch','Fest eingespannt mit Zwinge oder Laubsägetisch','Ich halte es in der Luft'],r:1},
   {f:'Wohin zeigen die Zähne des Laubsägeblatts?',e:'Wohin zeigen die Zähne vom Sägeblatt?',a:['Nach unten zum Griff','Nach oben, weg vom Griff','Das ist egal'],r:0},
   {f:'Wie sägst du richtig?',a:['Ganz schnell hin und her','Mit viel Kraft drücken','Ruhig auf und ab – die Säge arbeitet, nicht du'],r:2},
   {f:'Wo ist die Hand, die das Holz hält?',a:['Weit weg vom Sägeblatt, nie davor','Direkt vor dem Sägeblatt','Unter dem Holz'],r:0},
   {f:'Das Sägeblatt ist gerissen. Was machst du?',e:'Das Sägeblatt ist kaputt. Was machst du?',a:['Einfach weitersägen','Der Lehrperson sagen, dann Blatt wechseln','Heimlich wegwerfen'],r:1}]},
 {id:'heissleim',titel:'Heissleimpistole',emoji:'♨️',farbe:'#FDEFF4',regex:/heissleim|heisskleb/i,fragen:[
   {f:'Wo steht die Heissleimpistole, wenn du sie nicht brauchst?',e:'Wohin kommt die Pistole, wenn du sie nicht brauchst?',a:['Liegend auf dem Tisch','In meiner Hand','Auf ihrem Ständer, auf einer Unterlage'],r:2},
   {f:'Was darfst du nie anfassen?',a:['Die Düse und den frischen Leim','Den Griff','Den Stecker'],r:0},
   {f:'Du hast heissen Leim am Finger. Was machst du zuerst?',e:'Heisser Leim am Finger! Was tust du zuerst?',a:['Pusten und weiterarbeiten','Sofort unter kaltes Wasser und der Lehrperson sagen','Den Leim abkratzen'],r:1},
   {f:'Wie viel Leim drückst du heraus?',a:['Ganz viel, dann hält es besser','Mit dem Finger verteilen','Nur kleine Punkte – so viel, wie du brauchst'],r:2},
   {f:'Wer schaltet die Pistole ein?',a:['Ich, wann ich will','Die Lehrperson – oder du nur mit Erlaubnis','Irgendein Kind'],r:1}]}];
const fsStand=()=>S.settings.fuehrerschein||(S.settings.fuehrerschein={});
const fsVon=id=>FUEHRERSCHEINE.find(f=>f.id===id);
const fsGesehen=id=>!!(fsStand()[id]&&fsStand()[id].gesehen);
/* Welche Führerscheine braucht dieses Video? Sucht in Techniken, Material und Titel. */
function fsNoetig(v){ if(!FS_AN||!SCHULE||!v) return []; const txt=[v.title,...(v.techniken||[]),...(v.material||[]),...(v.material||[]).map(matName)].filter(Boolean).join(' '); return FUEHRERSCHEINE.filter(f=>f.regex.test(txt)); }
function fsHinweisHtml(v){ const offen=fsNoetig(v).filter(f=>!fsGesehen(f.id)); if(!offen.length) return '';
  return `<div class="inner fs-hinweis" role="note"><span class="sym" aria-hidden="true">🪪</span>${offen.map(f=>`<button class="fs-los" data-act="fuehrerschein" data-id="${f.id}">${f.emoji} ${esc(f.titel)} →</button>`).join('')}</div>`; }
SCREENS.fuehrerschein=(app,params={})=>{ const f=fsVon(params.id); const zur=params.zurueck||null; const einfach=SCHULE&&S.settings.klasse&&S.settings.klasse<=2;
  const zurueck=()=>zur&&zur.name?go(zur.name,zur.params||{}):go(uPolicy()&&uPolicy().mode==='projects'?'unterricht':'home');
  const kopf=titel=>v3Kopf('<button class="v3-rund gross" data-act="back" aria-label="Zurück">←</button>',`<div class="v3-thema-titel"><h1>${titel}</h1></div>`);
  if(!f){ const st=fsStand();
    app.innerHTML=`<div class="v3${schriftNormal()?'':' caps'} fs"><div class="v3-in">${kopf('Werkzeug-Führerschein')}
      <div class="fs-karten">${FUEHRERSCHEINE.map(x=>{ const s=st[x.id]||{}; const stand=s.gesehen?'gesehen':s.datum?'bestanden':'offen';
        return `<button class="fs-karte ${stand}" data-act="quiz" data-id="${x.id}" style="--f:${x.farbe}"><span class="bild" aria-hidden="true">${x.emoji}</span><b>${esc(x.titel)}</b><span class="fs-stand">${stand==='gesehen'?'✓ Gesehen'+(s.datum?' · '+dateDE(s.datum):''):stand==='bestanden'?'👀 Zeigen':x.fragen.length+' Fragen'}</span></button>`; }).join('')}</div>
      ${v3Fuss(false)}</div></div>`;
    wire(app,{ back:zurueck, quiz:b=>go('fuehrerschein',{id:b.dataset.id,zurueck:zur}), gallery:()=>go('gallery'), lehrer:()=>go('lehrer') });
    return; }
  let i=0, gewaehlt=null, richtig=false; const n=f.fragen.length; const s=fsStand()[f.id]||{};
  const zeichne=()=>{ const q=f.fragen[i]; const fertig=i>=n;
    const balken=`<div class="an-balken fs-balken" aria-label="Fragen">${f.fragen.map((x,k)=>`<span class="${k<i||fertig?'an':k===i?'jetzt':''}"></span>`).join('')}</div>`;
    let inhalt='';
    if(fertig){ const st=fsStand()[f.id]||{}; const ok=!!st.gesehen;
      inhalt=`<div class="fs-ende v3-karte">${figur(ok?'geschafft':'material')}<h2>${ok?'Führerschein ✓':'Alle richtig ✓'}</h2>
        <div class="an-box zeigen${ok?' ok':''} fs-zeigen"><span class="sym" aria-hidden="true">👀</span><div>${ok?`<p>${dateDE(st.datum||Date.now())}</p>`:''}<button class="an-gesehen fs-gesehen" data-act="gesehen" aria-pressed="${ok}">${ok?'☑':'☐'} Lehrperson ✓</button></div></div>
        <div class="an-nav mitte">${ok?`<button class="an-weiter" data-act="back">${zur&&zur.name?'Weiter →':'Fertig'}</button>`:''}<button class="v3-pill" data-act="nochmal">Nochmal üben</button></div></div>`; }
    else { inhalt=`<div class="fs-frage"><div class="fs-nr">${i+1}/${n}</div><h2>${esc(einfach&&q.e?q.e:q.f)}</h2>
        <div class="fs-antworten">${q.a.map((t,k)=>`<button class="fs-antwort${gewaehlt===k?(k===q.r?' richtig':' falsch'):''}${richtig&&k!==q.r?' aus':''}" data-act="antwort" data-k="${k}" ${richtig?'disabled':''}><span class="buchstabe" aria-hidden="true">${gewaehlt===k?(k===q.r?'✓':'✗'):'ABC'[k]}</span><span>${esc(t)}</span></button>`).join('')}</div>
        <div class="fs-feedback${gewaehlt==null?'':richtig?' gut':' nein'}" role="status" aria-live="polite">${gewaehlt==null?'':richtig?'✓ Richtig':'✗ Nochmal'}</div>
        <div class="an-nav mitte">${richtig?`<button class="an-weiter" data-act="weiter">${i===n-1?'Fertig ✓':'Nächste Frage →'}</button>`:''}</div></div>`; }
    app.innerHTML=`<div class="v3${schriftNormal()?'':' caps'} fs"><div class="v3-in">${kopf(f.titel,'Werkzeug-Führerschein')}${balken}${inhalt}</div></div>`; };
  wire(app,{ back:()=>{ if(i>=n&&zur&&zur.name&&fsGesehen(f.id)) zurueck(); else go('fuehrerschein',{zurueck:zur}); },
    antwort:b=>{ if(richtig) return; gewaehlt=+b.dataset.k; richtig=gewaehlt===f.fragen[i].r; zeichne(); if(richtig&&S.settings.autoRead) speak('Richtig!'); },
    weiter:()=>{ if(!richtig) return; i++; gewaehlt=null; richtig=false; if(i>=n){ const st=fsStand(); const alt=st[f.id]||{}; st[f.id]={datum:alt.gesehen?alt.datum:Date.now(),gesehen:!!alt.gesehen}; save(); confetti(); } zeichne(); window.scrollTo(0,0); },
    gesehen:()=>{ const st=fsStand(); const alt=st[f.id]||{}; st[f.id]={datum:Date.now(),gesehen:!alt.gesehen}; save(); if(st[f.id].gesehen){ confetti(); toast('✓ Führerschein'); } zeichne(); },
    nochmal:()=>{ i=0; gewaehlt=null; richtig=false; zeichne(); } });
  if(s.gesehen&&!params.neu) i=n;   // schon bestanden: direkt die Karte zeigen
  zeichne();
};

/* ---- Beamer-Ansicht: Video gross, Schritte in grosser Schrift für die ganze Klasse (nur Schule) ---- */
const BEAMER={an:false};
function toggleBeamer(on){ const el=$('.kid.pl'); if(!el) return; const want=on==null?!el.classList.contains('beamer'):!!on; el.classList.toggle('beamer',want); el.classList.remove('kino','liste'); document.body.classList.toggle('beamer',want);
  const b=$('.beamer-btn',el); if(b){ b.setAttribute('aria-pressed',String(want)); b.classList.toggle('an',want); const t=$('span',b); if(t) t.textContent=want?'Beamer aus':'Beamer'; }
  if(want) fsEnter(); else fsExit(); if(P) updatePlayerUI(); if(!want) setTimeout(fitPlayer,50); }
document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return; if($('.kid.pl.beamer')) toggleBeamer(false); else if(BEAMER.an){ BEAMER.an=false; render(); } });

/* ---- Lektionsplan (Unterrichtsmodus «projects» mit plan:true): Material richten → Video schauen → Foto/Fertig ----
   Haken bleiben auf diesem Gerät in S.settings.lektionsplan[videoId] = {s:[bool,bool,bool]}; das Material steht im Arbeitsstand des Kindes.
   s[] ändert sich nur durch eine Handlung (matSetzen, Plan-Haken, Videoende), nie beim Zeichnen. Ring und Kontrolle zeigen s[], Stationen und Sperre das Material des Kindes.
   Jede Änderung geht gebündelt (1 s) an den Worker: POST /unterricht/fortschritt {token, geraet, videoId, schritte}. Fehler sind egal. */
const planAktiv=()=>{ const p=uPolicy(); return !!(p&&p.plan&&p.mode==='projects'); };
function planVon(id){ const alle=S.settings.lektionsplan||(S.settings.lektionsplan={}); const e=alle[id]||(alle[id]={s:[false,false,false]}); if(!Array.isArray(e.s)||e.s.length!==3) e.s=[false,false,false]; return e; }
function planSetzen(id,schritt,wert){ if(!SCHULE||!id||!planAktiv()) return; const e=planVon(id); if(e.s[schritt]===!!wert) return; e.s[schritt]=!!wert; save(); planMelden(id); if(view.name==='unterricht') render(); }
const PLAN_MELD={timer:{}};
function planMelden(id){ if(!uAktiv()) return; clearTimeout(PLAN_MELD.timer[id]); PLAN_MELD.timer[id]=setTimeout(()=>{ const verb=U.verb; if(!verb) return; const e=planVon(id);
  try{ fetch(SCHRITTLI_API+'/unterricht/fortschritt',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+verb.token},body:JSON.stringify({token:verb.token,geraet:verb.deviceId,videoId:id,schritte:e.s.slice()}),keepalive:true,cache:'no-store',credentials:'omit'}).catch(()=>{}); }catch(err){} },1000); }
// Kinderstand für die Kontrolle: der Merker a.meld hält nur den neuesten Stand je Kind und Video, offline entsteht keine Warteschlange
const KIND_MELD={timer:null,laeuft:false,zuletzt:0};
function kindMelden(id){ if(!uAktiv()) return; const z=Date.now(); kindKeys().forEach(k=>{ const a=(S.arbeit[k]||{})[id]; if(a) a.meld=z; }); save(); clearTimeout(KIND_MELD.timer); KIND_MELD.timer=setTimeout(()=>{ KIND_MELD.timer=null; kindSenden(); },1000); }
function kindNachsenden(){ if(!KIND_MELD.timer) kindSenden(); }
function kindOffene(){ const l=[]; Object.keys(S.arbeit||{}).forEach(k=>{ const b=S.arbeit[k]||{}; Object.keys(b).forEach(id=>{ const a=b[id]; if(!a||!a.meld) return; if(!/^[^\u0000-\u001f\u007f]{1,120}$/.test(k)||!/^[-a-zA-Z0-9_]{1,100}$/.test(id)){ delete a.meld; return; } l.push({k,id,a}); }); }); return l.sort((x,y)=>y.a.meld-x.a.meld); }
async function kindSenden(){ const verb=U.verb; if(!uAktiv()||KIND_MELD.laeuft) return; const teil=kindOffene().slice(0,40); if(!teil.length) return; KIND_MELD.laeuft=true; KIND_MELD.zuletzt=Date.now();
  const staende=teil.map(({k,id,a})=>{ const max=Math.min(999,Math.max(a.max||0,a.step||0)); return {kindKey:k,videoId:id,schritt:Math.min(a.step||0,max),max,videoFertig:!!a.done,werkFertig:!!a.werkFertig,zeit:a.meld}; });
  try{ const r=await fetch(SCHRITTLI_API+'/unterricht/kindstand',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+verb.token},body:JSON.stringify({token:verb.token,deviceId:verb.deviceId,staende}),keepalive:true,cache:'no-store',credentials:'omit'});
    if(r.ok||r.status===400){ teil.forEach(({a},i)=>{ if(a.meld===staende[i].zeit) delete a.meld; }); save(); if(kindOffene().length) setTimeout(kindNachsenden,1000); } }catch(e){}finally{ KIND_MELD.laeuft=false; } }
const PLAN_KORB={};
function planKarte(v){ const e=planVon(v.id), th=thumbOf(v), a=areaOf(v.areaId), mat=matListe(v), fehlt=matFehlt(v), st=[e.s[0]&&!fehlt.length,e.s[1],e.s[2]];
  const n=e.s.filter(Boolean).length, jetzt=st.indexOf(false), offen=mat.length>0&&(PLAN_KORB[v.id]??fehlt.length>0);
  const ring=`<span class="plan-ring${n===3?' voll':''}" aria-label="${n} von 3"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20"/><circle cx="24" cy="24" r="20" class="f" style="stroke-dasharray:${Math.round(125.66*n/3)} 126"/></svg><b>${n}/3</b></span>`;
  const station=(k,haupt,haken)=>`<li class="plan-station${st[k]?' erledigt':jetzt===k?' jetzt':''}">${haupt}${haken?`<button class="plan-haken${e.s[k]?' an':''}" data-act="plan" data-id="${v.id}" data-k="${k}" aria-pressed="${e.s[k]}" aria-label="${haken}">✓</button>`:st[k]?'<span class="plan-haken an" aria-hidden="true">✓</span>':''}</li>`;
  return `<div class="plan-karte v3-karte" data-video="${v.id}" data-projekt="${esc(v.id)}"><div class="plan-kopf"><button class="v3-lektion plan-video" data-act="video" data-id="${v.id}"><span class="th">${th?`<img src="${th}" alt="" loading="lazy">`:''}<i aria-hidden="true">${v.source.type==='bilder'?'📷':'▶'}</i></span><span class="grow"><b>${esc(v.title)}</b><span class="v3-meta">${a?esc(a.name):''}${zeitHtml(v)}</span></span></button>${ring}</div>
    <ol class="plan-stationen">
      ${station(0,`<button class="plan-gross" data-act="korb" data-id="${v.id}" aria-expanded="${offen}"><span class="plan-sym" aria-hidden="true">🧺</span><b>Materialkorb</b><small>${mat.length?mat.length-fehlt.length+'/'+mat.length:'–'}</small></button>`,!fehlt.length&&!e.s[0]?'Alles da':'')}
      ${station(1,matStartHtml(v,`class="plan-gross" data-act="spielen" data-id="${v.id}"`,'<span class="plan-sym" aria-hidden="true">▶</span><b>Abspielen</b>'),'Geschaut')}
      ${station(2,`<button class="plan-gross" data-act="planfoto" data-id="${v.id}"><span class="plan-sym" aria-hidden="true">📷</span><b>Kamera</b></button>`,'Fertig')}
    </ol>${offen?`<div class="plan-korb">${matKnoepfe(v)}</div>`:''}</div>`; }
function planAktionen(app){
  return { plan:b=>{ const e=planVon(b.dataset.id); planSetzen(b.dataset.id,+b.dataset.k,!e.s[+b.dataset.k]); if(e.s.every(Boolean)) confetti(); },
    korb:b=>{ const id=b.dataset.id; if(!matListe(videoOf(id)).length) return; PLAN_KORB[id]=b.getAttribute('aria-expanded')!=='true'; render(); },
    mat:b=>{ const c=b.closest('.plan-karte'), v=videoOf(c.dataset.video); PLAN_KORB[v.id]=true; matSetzen(v,b.dataset.id,!matStand(v)[b.dataset.id]); render(); },
    spielen:b=>go('player',{videoId:b.dataset.id,los:true}),
    planfoto:b=>takePhoto(b.dataset.id,()=>{ if(view.name==='unterricht') render(); }) }; }

fmKnopf();
boot();
</script>
