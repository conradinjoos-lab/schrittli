<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Schritt für Schritt">
<meta name="theme-color" content="#F1E3CB" id="themecolor">
<title>Schritt für Schritt</title>
<link rel="icon" type="image/png" sizes="32x32" href="grafik/marke/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="grafik/marke/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="grafik/marke/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@700;800;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: Kinderseite = Werkstattwand (Lochwand, Regale, Werkbank), Player mit zwei Fenstern (Video, Kamera) auf der Werkbank. Elternbereich = neutrale Formularspalte. */
:root{
  --bg:#EEF3F8; --surface:#FFFFFF; --surface2:#F5F8FB; --ink:#17212F; --muted:#5B6B80; --line:#D5DEE9;
  --lern:#17997A; --lern-soft:#D5F1E8; --spass:#EF6C2E; --spass-soft:#FFE4D4;
  --star:#F3B51B; --star-off:#D5DEE9; --ok:#2E9E5B; --bad:#D64545;
  --display:'Fredoka','Arial Rounded MT Bold',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:18px; --shadow:0 6px 18px rgba(23,33,47,.10); --shadow-sm:0 2px 6px rgba(23,33,47,.08);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#0F1621; --surface:#1A2433; --surface2:#141C28; --ink:#EDF2F8; --muted:#9DACBF; --line:#2B384A; --lern-soft:#15382F; --spass-soft:#3F2718; --star-off:#2B384A; --shadow:0 6px 18px rgba(0,0,0,.35); --shadow-sm:0 2px 6px rgba(0,0,0,.3); color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#0F1621; --surface:#1A2433; --surface2:#141C28; --ink:#EDF2F8; --muted:#9DACBF; --line:#2B384A; --lern-soft:#15382F; --spass-soft:#3F2718; --star-off:#2B384A; --shadow:0 6px 18px rgba(0,0,0,.35); --shadow-sm:0 2px 6px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%;overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:28px} h2{font-size:22px} h3{font-size:18px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px}
.grow{flex:1;min-width:0}
.ico{width:1.2em;height:1.2em;fill:currentColor;vertical-align:-.25em;flex:none}
:focus-visible{outline:3px solid var(--lern);outline-offset:2px}
[hidden]{display:none!important}

#app{min-height:100%}
.screen{min-height:100%;display:flex;flex-direction:column;gap:18px;max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(68px + env(safe-area-inset-bottom,0px))}
.screen.parent{max-width:820px;gap:14px}
.topbar{display:flex;align-items:center;gap:10px;min-height:56px;flex-wrap:wrap}
.topbar h1{font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Knöpfe (neutral, Elternbereich) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow-sm);font-family:var(--display);font-weight:600;font-size:17px;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--lern);color:#fff}
.btn.spass{background:var(--spass);color:#fff}
.btn.danger{background:var(--bad);color:#fff}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted)}
.btn.outline{background:transparent;box-shadow:none;border:2px solid var(--line)}
.btn.icon{width:48px;min-height:48px;padding:0;border-radius:50%;font-size:22px}
.btn.sm{min-height:36px;font-size:15px;padding:0 12px;border-radius:10px}
.kid .btn.sm{min-height:48px}
.kbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:0 24px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);font-family:var(--display);font-weight:600;font-size:22px}
.kbtn:active{transform:scale(.96)}
.kbtn.round{width:72px;min-height:72px;padding:0;border-radius:50%;font-size:30px}
.kbtn.round.big{width:96px;min-height:96px;font-size:44px}
.kbtn.round .ico{width:1em;height:1em;vertical-align:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}

/* ===== Werkstatt (Kinderseite) ===== */
.kid{--wall:#F1E3CB;--hole:#D6C09A;--wood:#C98A4E;--wood2:#8F5A2E;--wood3:#D9A066;--kink:#2B2320;--paper:#FFF1C9;--sign:#FFE58A;--wtext:#2B2320;--wmuted:#7A4E2D;--drawer:#A86E3E;--drawer2:#B8794A;--mat:#3BB273;--sh:rgba(43,35,32,.25);--screen:#2B2320;--bezel:#3B3330;--cam:#E9E1D4;--camframe:#FFFFFF;
  max-width:none;padding:0 0 calc(28px + env(safe-area-inset-bottom,0px));gap:0;position:relative;overflow:hidden;
  font-family:var(--display);color:var(--wtext);text-transform:uppercase;letter-spacing:.04em;
  background-color:var(--wall);background-image:radial-gradient(circle,var(--hole) 3px,transparent 3.6px);background-size:28px 28px;background-position:14px 14px}
.kid.abend{--wall:#2E3A4A;--hole:#24303E;--wood:#9C6436;--wood2:#6B4121;--wood3:#B8794A;--wtext:#F4EEE2;--wmuted:#FFD27A;--drawer:#7A4E2D;--drawer2:#8A5A35;--mat:#2E8F5E;--sh:rgba(0,0,0,.4);--screen:#000;--bezel:#14191F;--cam:#D9CDB8;--camframe:#FFF1C9}
.kid .inner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.kid h1,.kid h2,.kid h3{text-transform:uppercase}
.kid .btn{background:#fff;color:var(--kink);border:3px solid var(--kink);box-shadow:2px 3px 0 var(--sh);border-radius:12px;font-size:17px}
.kid .btn.icon{border-radius:50%}
.kid .btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--wmuted)}
.kid .btn.primary{background:var(--sign);color:var(--kink)}
.kid .kbtn{background:#fff;color:var(--kink);border:3px solid var(--kink);box-shadow:3px 4px 0 var(--sh);border-radius:18px}
.kid .kbtn.primary,.kid .kbtn.c{background:var(--sign);color:var(--kink)}
.kid .kbtn.spass{background:#FFC4A3;color:var(--kink)}
.kid .kbtn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--wmuted)}
.kid .kbtn.round{border-radius:50%}
.kid .kbtn[disabled]{opacity:.4}
.kid .empty{border-color:var(--wood2);color:var(--wmuted);background:rgba(255,255,255,.35)}
.girlande{width:100%;height:auto;display:block}
.fenster{position:absolute;left:36px;top:18px;width:240px;height:118px;border-radius:8px;border:8px solid var(--wood2);box-shadow:inset 0 0 0 3px var(--wood),4px 6px 0 var(--sh);overflow:hidden;background:#BFE6FF}
.fenster svg{display:block;width:100%;height:100%}
.fenster.nacht{background:#141C2C}
.fensterbank{position:absolute;left:36px;top:136px;width:240px;height:12px;background:var(--wood2);border-radius:0 0 4px 4px}
.fenster-pflanze{position:absolute;left:212px;top:80px;width:60px;height:70px}
@media (max-width:699px){.fenster,.fensterbank,.fenster-pflanze{display:none}}
.kopf{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-top:-6px;min-height:72px}
@media (min-width:700px){.kopf{padding-left:300px;min-height:92px}}
.schild{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;background:var(--wood);border:4px solid var(--wood2);color:var(--paper);border-radius:10px;box-shadow:4px 5px 0 var(--sh);padding:6px 22px;text-align:center;min-height:58px}
.schild h1{font-size:28px;letter-spacing:.08em;color:var(--paper)}
.schild .sub{font-size:12px;letter-spacing:.1em;opacity:.9}
.schild.hallo{margin:0 auto}
.schild-btn{display:inline-flex;flex:none;align-items:center;justify-content:center;width:54px;height:54px;border-radius:14px;background:#fff;border:3px solid var(--kink);color:var(--kink);box-shadow:2px 3px 0 var(--sh)}
.zettel{display:inline-flex;align-items:center;gap:8px;background:var(--sign);border:2px solid var(--kink);color:var(--kink);border-radius:8px;padding:6px 14px;box-shadow:2px 3px 0 var(--sh);font-size:16px;font-weight:600;transform:rotate(2deg);white-space:nowrap}
.zettel.links{transform:rotate(-3deg)}
.kopf-rechts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto}
.glas-sterne{display:inline-flex;align-items:center;gap:8px;height:56px;padding:0 14px;border-radius:14px;background:#fff;border:3px solid var(--kink);color:var(--kink);font-size:17px;font-weight:600}
.glas-sterne svg{width:30px;height:36px}
.glas-sterne.sm{height:44px;font-size:15px}
.werke-btn{display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 14px;border-radius:10px;background:var(--wood3);border:3px solid var(--wood2);color:var(--kink);font-size:17px;font-weight:600;background-image:radial-gradient(circle,rgba(143,90,46,.25) 1px,transparent 1.5px);background-size:8px 8px;position:relative}
.werke-btn .fotos{display:flex;gap:4px}.werke-btn .fotos i{display:block;width:20px;height:24px;border:2px solid var(--kink);background:#BDD8FF;transform:rotate(-8deg)}.werke-btn .fotos i+i{background:#FFC6DD;transform:rotate(6deg)}
.werke-btn .neu{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;border-radius:999px;background:#E8554E;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid var(--kink)}
.lock-btn{width:52px;height:52px;border-radius:50%;color:var(--wmuted);display:inline-flex;align-items:center;justify-content:center;opacity:.8}
.regal-wrap{margin-top:34px}
.regal-wrap .zettel{margin-bottom:-8px;position:relative;z-index:2}
.regal{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));column-gap:0;row-gap:50px;align-items:end;margin-top:10px}
.ding{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0;padding:10px 6px 0;color:var(--kink);text-transform:inherit;letter-spacing:inherit;font:inherit;position:relative}
.ding svg.obj{width:118px;height:108px;display:block;max-width:100%;transition:transform .12s}
.ding:active svg.obj{transform:translateY(-6px)}
.ding .tag{margin-top:6px;margin-bottom:-12px;position:relative;z-index:1}
.ding::after{content:"";display:block;width:calc(100% + 12px);margin:0 -6px;height:22px;background:var(--wood);background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.14) 0 2px,transparent 2px 8px);box-shadow:0 8px 0 var(--wood2),0 16px 20px var(--sh)}
.ding.deko{pointer-events:none}
.ding.deko svg.obj{width:96px;height:88px;margin-bottom:12px}
.ding.leer{color:var(--wmuted)}
.tag{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;background:var(--paper);border:2px solid var(--kink);color:var(--kink);font-size:17px;font-weight:600;letter-spacing:.05em;white-space:nowrap;position:relative;box-shadow:2px 3px 0 var(--sh);max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tag::before{content:"";position:absolute;left:50%;top:-8px;width:2px;height:8px;background:var(--kink)}
.tag .cnt{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--kink);color:#fff;font-size:13px}
.bank{position:relative;margin-top:44px}
.deko-reihe{display:flex;align-items:flex-end;gap:22px;height:110px;position:relative}
.deko-reihe svg{display:block}
.deko-reihe .kegel{position:absolute;right:0;bottom:-4px;width:520px;height:220px;max-width:70%;pointer-events:none}
@media (max-width:599px){.deko-reihe .nur-breit{display:none}}
.platte{height:30px;background:var(--wood);background-image:repeating-linear-gradient(90deg,transparent 0 196px,rgba(43,35,32,.14) 196px 200px),repeating-linear-gradient(0deg,rgba(255,255,255,.12) 0 2px,transparent 2px 9px);box-shadow:0 6px 0 var(--wood2)}
.schubladen{background:var(--drawer);display:flex;gap:18px;padding:22px 40px 18px;margin-top:6px}
.lade{flex:1;min-width:0;border-radius:8px;background:var(--drawer2);border:3px solid var(--wood2);display:flex;align-items:center;justify-content:center;min-height:86px}
.lade i{display:block;width:24px;height:24px;border-radius:50%;background:var(--paper);border:3px solid var(--kink)}
@media (max-width:599px){.schubladen{padding:16px 20px 14px;gap:12px}.lade:nth-child(n+3){display:none}}
.du{display:flex;flex-direction:column;align-items:center;gap:2px}
.du .av{width:62px;height:62px;border-radius:50%;border:4px solid var(--kink);display:flex;align-items:center;justify-content:center;font-size:34px;background:var(--c,#FFB86B)}
.du .lbl{font-size:13px;font-weight:600;background:var(--kink);color:#fff;padding:1px 10px;border-radius:999px}
.kid.abend .du .lbl{background:var(--paper);color:var(--kink)}
.papier{background:var(--paper);border:3px solid var(--kink);border-radius:14px;box-shadow:4px 5px 0 var(--sh);padding:22px;color:var(--kink);display:flex;flex-direction:column;gap:16px}
.papier .inp{background:#fff;border-color:var(--kink)}
.kid .emoji-pick button{background:#fff;border-color:var(--kink)}.kid .emoji-pick button.on{background:var(--sign)}
.kid .color-pick button.on{border-color:var(--kink)}
.avatars{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.avatar-btn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px;border-radius:14px;background:#fff;border:3px solid var(--kink);box-shadow:3px 4px 0 var(--sh);font-size:21px;font-weight:600;color:var(--kink)}
.avatar-btn .em{font-size:60px;line-height:1;width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--c);border:4px solid var(--kink)}

/* Bereichsseite: angepinnte Karteikarten */
.pinwand{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:26px 22px;padding-top:14px}
.vcard{position:relative;display:flex;flex-direction:column;gap:8px;background:#fff;border:3px solid var(--kink);border-radius:10px;box-shadow:3px 4px 0 var(--sh);padding:10px;color:var(--kink);text-align:left;transform:rotate(-1.2deg);text-transform:inherit;letter-spacing:inherit;font:inherit}
.vcard:nth-child(2n){transform:rotate(1.1deg)} .vcard:nth-child(3n){transform:rotate(-.6deg)}
.vcard::before{content:"";position:absolute;left:50%;top:-11px;width:18px;height:18px;border-radius:50%;background:#E8554E;border:3px solid var(--kink);transform:translateX(-50%);z-index:1;box-shadow:1px 2px 0 var(--sh)}
.vcard:active{transform:scale(.98)}
.vcard .th{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:6px;overflow:hidden;background:#E9E1D4;display:flex;align-items:center;justify-content:center;font-size:40px}
.vcard .th img{width:100%;height:100%;object-fit:cover;display:block}
.vcard .th .badge{position:absolute;right:6px;bottom:6px;background:#3BB273;color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;display:flex;align-items:center;gap:4px;border:2px solid var(--kink)}
.vcard .th .gt{position:absolute;right:6px;top:6px;background:var(--sign);color:var(--kink);border:2px solid var(--kink);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700}
.niv{display:inline-flex;gap:3px;align-items:center;background:#fff;border:2px solid var(--kink);border-radius:999px;padding:3px 5px;flex:none}
.niv i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--kink);background:#fff}
.niv.n1 i.an{background:#3BB273}.niv.n2 i.an{background:#F2B705}.niv.n3 i.an{background:#E8554E}
.vcard .th .niv{position:absolute;left:6px;top:6px}
.pw-grp{grid-column:1/-1;margin:4px 0 -14px;font-size:20px}
.lrow .gt{background:var(--sign);border:1.5px solid var(--kink);border-radius:999px;padding:0 6px;font-size:11px;font-weight:700;white-space:nowrap}
.vcard .th .zeit{position:absolute;left:6px;bottom:6px;background:rgba(43,35,32,.78);color:#fff;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600}
.vcard .th .badge.prog{background:var(--sign);color:var(--kink)}
.vcard .th .lock{position:absolute;inset:0;background:rgba(43,35,32,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:40px}
.vcard .tt{font-size:17px;font-weight:600;line-height:1.2;display:flex;gap:8px;align-items:flex-start}
.vcard.disabled{opacity:.75}
.vcard .stern{margin-left:auto;color:#F2B705;flex:none}

/* Player auf der Werkbank */
.pl-top{margin-top:4px}
.pl-top .schild{padding:4px 18px;min-height:54px}.pl-top .schild h1{font-size:24px}
.panes{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;margin-top:14px}
@media (min-width:900px){.panes{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}}
.pane{display:flex;flex-direction:column;gap:8px;min-width:0}
.plabel{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;letter-spacing:.1em;color:var(--wmuted);min-height:36px}
.plabel .punkt{width:14px;height:14px;border-radius:50%;flex:none}
.video-box{position:relative;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:14px;overflow:hidden;border:6px solid var(--bezel);box-shadow:4px 6px 0 var(--sh)}
.video-box .host,.video-box .host video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.video-box .host iframe{position:absolute;left:0;width:100%;top:-100px;height:calc(100% + 200px);border:0;background:#000}
.video-box.yt-frei .host iframe{top:0;height:100%}
.video-box .host video{object-fit:contain}
.shield{position:absolute;inset:0;display:block;width:100%;height:100%;min-height:0;padding:0;border:0;border-radius:0;box-shadow:none;background:transparent}
.shield:focus-visible{outline-offset:-6px}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;color:#FFF4DF;background:var(--screen)}
.overlay.transparent{background:rgba(0,0,0,.25);pointer-events:none}
.overlay h2{font-size:clamp(22px,4.5vw,36px);color:var(--sign)}
.overlay .lbl{font-size:clamp(18px,3.6vw,28px);font-weight:500;max-width:28ch;line-height:1.2}
.overlay .kbtn{background:#fff;color:var(--kink);border-color:#FFF4DF;min-height:56px;font-size:19px;padding:0 18px}
.overlay .kbtn.round.big{width:96px;min-height:96px}
.overlay .kbtn.ghost{background:transparent;color:#FFF4DF;border-color:transparent}
.overlay .em{font-size:52px;line-height:1}
.fuss{width:120px;height:14px;background:var(--bezel);border-radius:0 0 8px 8px;margin:0 auto}
.fuss.hell{background:var(--camframe)}
.cam-box{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:14px;background:var(--cam);border:6px solid var(--camframe);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:4px 6px 0 var(--sh);color:var(--wmuted);text-align:center;padding:12px}
.cam-box video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cam-box.off{aspect-ratio:auto;min-height:120px}
@media (min-width:900px){.cam-box.off{aspect-ratio:16/9}}
.cam-box .live{position:absolute;right:12px;top:10px;display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--kink);color:#FFF4DF;font-size:13px}
.cam-box .live i{width:10px;height:10px;border-radius:50%;background:#E8554E}
.cam-box .hinweis{position:absolute;left:12px;bottom:10px;font-size:13px;background:rgba(255,241,201,.9);color:var(--wmuted);padding:3px 10px;border-radius:999px}
.pl-bank{margin-top:22px;padding:18px 0 22px;background:var(--wood);background-image:repeating-linear-gradient(90deg,transparent 0 236px,rgba(43,35,32,.14) 236px 240px),repeating-linear-gradient(0deg,rgba(255,255,255,.10) 0 2px,transparent 2px 9px);box-shadow:inset 0 8px 0 var(--wood3),inset 0 -6px 0 var(--wood2)}
.matte{display:flex;align-items:flex-end;gap:10px;overflow-x:auto;padding:14px;background:var(--mat);border-radius:14px;box-shadow:inset 0 0 0 4px rgba(0,0,0,.18);min-height:146px;scrollbar-width:none}
.matte::-webkit-scrollbar{display:none}
.karte{display:flex;align-items:center;justify-content:center;flex:none;width:84px;height:110px;border-radius:10px;background:#fff;border:2px solid var(--kink);box-shadow:2px 3px 0 rgba(0,0,0,.3);font-size:28px;font-weight:600;color:#B9ADA6;background-image:repeating-linear-gradient(#fff 0 22px,#E9E1D4 22px 24px);text-transform:inherit;letter-spacing:inherit;font-family:inherit}
.karte.done{color:var(--kink);background:#BFE8C8;background-image:none}
.karte.cur{flex-direction:column;gap:5px;width:160px;background:var(--sign);background-image:none;color:var(--kink);border-width:3px;box-shadow:4px 5px 0 var(--kink);padding:8px;text-align:center}
.karte.cur .k{font-size:12px;color:var(--wmuted);letter-spacing:.08em}
.karte.cur .t{font-size:15px;line-height:1.15;font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.karte:nth-child(odd){transform:rotate(-1.5deg)}.karte:nth-child(even){transform:rotate(1.5deg)}.karte.cur{transform:rotate(0)}
.matte .zeit{font-size:30px;font-weight:600;color:#fff;padding:0 10px;font-variant-numeric:tabular-nums}
.steuer{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:0}
.controls{display:grid;grid-template-columns:84px 108px 84px;gap:10px;align-items:center;flex:none}
.kid .kbtn.pos{flex-direction:column;gap:2px;min-height:72px;min-width:0;width:100%;padding:4px 2px;font-size:14px;letter-spacing:0;line-height:1.1;border-radius:16px}
.kbtn.pos .ico{width:28px;height:28px;vertical-align:0}
.kid .kbtn.pos.haupt{min-height:88px;font-size:17px}
.kbtn.pos.haupt .ico{width:36px;height:36px}
.kbtn.pos:disabled{cursor:default}
.werkzeug{display:flex;gap:8px;flex:none}
.kid .kbtn.werk{width:56px;min-height:56px;padding:0;font-size:24px;border-radius:14px}
.kid .kbtn.speed.slow{background:#BFE8C8}
.auftrag{margin-left:auto;display:flex;flex-direction:column;gap:10px;background:var(--paper);border:2px solid var(--kink);color:var(--kink);border-radius:8px;padding:12px 16px;box-shadow:2px 3px 0 var(--sh);transform:rotate(-1deg);max-width:420px;min-width:min(100%,260px)}
.auftrag .k{font-size:13px;letter-spacing:.08em;color:var(--wmuted);font-weight:600}
.auftrag .txt{font-size:19px;line-height:1.3;font-weight:600}
.auftrag .done{display:flex;align-items:center;gap:8px;color:#1F7A4A;font-size:18px;font-weight:600}
.auftrag .btn-grid{display:flex;gap:8px;flex-wrap:wrap}
.auftrag .kbtn{min-height:54px;font-size:19px;padding:0 18px}

/* Galerie: Korkwand */
.kork{background:#B8794A;background-image:radial-gradient(circle,rgba(0,0,0,.14) 1.5px,transparent 2px);background-size:10px 10px;border:12px solid var(--wood2);border-radius:12px;padding:28px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:26px 22px;margin-top:14px}
.foto{position:relative;background:#fff;padding:8px 8px 26px;border:2px solid var(--kink);box-shadow:3px 4px 0 rgba(0,0,0,.3);transform:rotate(-2deg);color:var(--kink);font:inherit;text-transform:inherit;letter-spacing:inherit}
.foto-auf{display:block;width:100%;padding:0;border:0;background:none;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer}.foto-auf::after{content:"";position:absolute;inset:0}.foto-auf:focus-visible{outline:none}.foto-auf:focus-visible::after{outline:3px solid #4C6EF5;outline-offset:3px}
.foto:nth-child(2n){transform:rotate(1.5deg)}.foto:nth-child(3n){transform:rotate(-.8deg)}
.foto::before{content:"";position:absolute;left:50%;top:-10px;width:18px;height:18px;border-radius:50%;background:#4C6EF5;border:3px solid var(--kink);transform:translateX(-50%);z-index:1}
.foto:nth-child(2n)::before{background:#E8554E}.foto:nth-child(3n)::before{background:#3BB273}
.foto .bild{width:100%;aspect-ratio:1;background:#E9E1D4;display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden}
.foto .bild img{width:100%;height:100%;object-fit:cover;display:block}
.kork.andere{margin-top:24px}
.andere-titel{margin:30px 0 0}
.kork.andere .foto{padding-bottom:8px}
.foto .nm{display:block;margin-top:6px;font-size:14px;line-height:1.2;text-align:center}
.andere-gross{display:block;max-width:100%;max-height:68vh;margin:0 auto;border-radius:8px;border:3px solid var(--kink)}
.foto .dt{position:absolute;left:8px;right:8px;bottom:5px;font-size:12px;color:var(--wmuted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.foto .fb{position:absolute;right:6px;bottom:-8px;font-size:22px;background:#fff;border:2px solid var(--kink);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.foto .fb.new::after{content:"";position:absolute;right:-3px;top:-3px;width:12px;height:12px;border-radius:50%;background:#E8554E}
.viewer img{max-width:100%;max-height:60vh;border-radius:12px;display:block;margin:0 auto}
.bubble{background:var(--lern-soft);border-radius:16px;padding:12px 14px;font-size:18px;display:flex;gap:10px;align-items:flex-start}
.bubble .em{font-size:28px;line-height:1}

/* Malen & Aufnehmen */
.tool-top{margin-top:4px}
.canvas-wrap{flex:1;min-height:52vh;border-radius:14px;overflow:hidden;background:#fff;border:3px solid var(--kink);box-shadow:4px 5px 0 var(--sh);touch-action:none;position:relative}
.canvas-wrap canvas{position:absolute;inset:0;display:block;touch-action:none}   /* darf den Rahmen nicht mitbestimmen, sonst wächst er endlos */
.palette{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;padding:10px 0}
.sw{width:48px;height:48px;border-radius:50%;border:3px solid var(--kink);box-shadow:2px 3px 0 var(--sh)}
.sw.on{outline:4px solid var(--sign);transform:scale(1.12)}
.sz{width:48px;height:48px;border-radius:50%;background:#fff;border:3px solid var(--kink);display:flex;align-items:center;justify-content:center;box-shadow:2px 3px 0 var(--sh)}
.sz.on{background:var(--sign)}
.sz i{display:block;border-radius:50%;background:var(--kink)}
.sep{width:2px;height:36px;background:var(--wood2);border-radius:2px}
.recbtn{width:150px;height:150px;border-radius:50%;background:#E8554E;color:#fff;font-size:64px;display:flex;align-items:center;justify-content:center;border:4px solid var(--kink);box-shadow:4px 6px 0 var(--sh);margin:0 auto}
.recbtn.on{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,85,78,.45)}100%{box-shadow:0 0 0 28px rgba(232,85,78,0)}}
.timer{font-size:34px;text-align:center;font-variant-numeric:tabular-nums}
.modal.kid{background:#FFF1C9;color:#2B2320;border:3px solid #2B2320;box-shadow:4px 5px 0 rgba(43,35,32,.25);font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;text-align:center;align-items:center}
.modal.kid .kbtn{background:#fff;color:#2B2320;border:3px solid #2B2320;box-shadow:3px 4px 0 rgba(43,35,32,.25);border-radius:18px}
.modal.kid .namen{display:grid;gap:12px;width:min(100%,360px);margin:6px 0 14px}
.modal.kid .namen .inp{font:inherit;font-size:26px;letter-spacing:.06em;text-transform:uppercase;text-align:center;min-height:58px;border:3px solid #2B2320;background:#fff;color:#2B2320}
.modal.kid .namen select.inp{font-size:22px;text-align-last:center}
.modal.kid .kbtn.spass{background:#FFC4A3}.modal.kid .kbtn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:#7A4E2D}

/* ===== Elternbereich ===== */
.av{width:44px;height:44px;border-radius:50%;background:var(--c,var(--lern));display:inline-flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.emoji-pick{display:flex;flex-wrap:wrap;gap:8px}
.emoji-pick button{width:48px;height:48px;border-radius:12px;font-size:28px;background:var(--surface2);border:2px solid transparent}
.emoji-pick button.on{border-color:var(--lern);background:var(--lern-soft)}
.color-pick{display:flex;flex-wrap:wrap;gap:8px}
.color-pick button{width:48px;height:48px;border-radius:50%;border:3px solid transparent}
.color-pick button.on{border-color:var(--ink)}
.ding-pick{display:flex;flex-wrap:wrap;gap:8px}
.ding-pick button{width:64px;height:64px;border-radius:12px;background:var(--surface2);border:2px solid transparent;display:flex;align-items:center;justify-content:center}
.ding-pick button svg{width:52px;height:48px}
.ding-pick button.on{border-color:var(--lern);background:var(--lern-soft)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:8px}
.tabs button{padding:8px 14px;border-radius:10px;font-family:var(--display);font-weight:600;font-size:16px;color:var(--muted)}
.tabs button.on{background:var(--lern-soft);color:var(--lern)}
.panel{background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:12px;min-width:0}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:14px;font-weight:700;color:var(--muted)}
.inp{width:100%;min-height:48px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface2);font-size:16px}
textarea.inp{min-height:80px;resize:vertical}
.inp:focus{border-color:var(--lern);outline:0}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface2);min-width:0}
.li .th{width:84px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:24px}
.li .th img{width:100%;height:100%;object-fit:cover;display:block}
.li .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .acts{display:flex;gap:6px;margin-left:auto;flex:none}
.badge-ok{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--lern-soft);color:var(--lern);font-size:14px;font-weight:700;white-space:nowrap}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.toggle .desc{font-size:14px;color:var(--muted)}
.sw-tog{width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw-tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.sw-tog.on{background:var(--lern)} .sw-tog.on::after{left:25px}
.steps-list{display:flex;flex-direction:column;gap:6px;counter-reset:s}
.step-li{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;background:var(--surface2)}
.step-li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--lern);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:14px;flex:none}
.step-li .inp{min-height:36px;padding:4px 8px}
.step-li .tm{width:80px;flex:none;font-variant-numeric:tabular-nums}
.note{background:var(--lern-soft);border-radius:12px;padding:10px 12px;font-size:15px}
.note.warn{background:var(--spass-soft)}
.pinpad{display:grid;grid-template-columns:repeat(3,76px);gap:10px;justify-content:center}
.pinpad button{height:64px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow-sm);font-family:var(--display);font-size:26px}
.pin-dots{display:flex;gap:12px;justify-content:center;font-size:28px;min-height:40px;letter-spacing:.2em}
.pin-dots.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
code{font-size:13px;word-break:break-all;background:var(--surface2);padding:2px 5px;border-radius:5px}
.qr{display:flex;justify-content:center;padding:8px;background:#fff;border-radius:12px;width:fit-content;margin:0 auto;max-width:100%}
.stars{display:inline-flex;gap:2px;align-items:center;font-size:22px;line-height:1}
.stars .st{color:var(--star-off)} .stars .st.on{color:var(--star)}
.stars .ico{width:1em;height:1em;vertical-align:0}

/* Modal, Toast, Konfetti */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,24,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:24px;padding:24px;max-width:460px;width:100%;max-height:min(92vh,100%);overflow:auto;outline:0;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.modal .big-emoji{font-size:72px;line-height:1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2B2320;color:#FFF1C9;padding:12px 20px;border-radius:999px;font-family:var(--display);font-size:18px;z-index:60;box-shadow:var(--shadow);max-width:90vw;text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70;display:none}
.empty{padding:28px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:20px;font-family:var(--display);font-size:19px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Nachbesserungen */
@media (min-width:700px){.kid .inner.kopf.mitfenster{padding-left:300px}}
.cam-box{color:#7A4E2D}
.regal-wrap .zettel{white-space:normal;max-width:calc(100% - 12px)}
.tag{white-space:normal;height:auto;min-height:36px;text-align:center;line-height:1.1;padding:5px 10px;justify-content:center}
@media (max-width:599px){.ding.deko{display:none}.kopf .schild h1{font-size:24px}}
.kid input,.kid textarea{text-transform:none;letter-spacing:0}
/* Schritte als Knöpfe neben dem Video */
.schritte{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:14px;background:var(--paper);border:3px solid var(--kink);box-shadow:4px 6px 0 var(--sh);overflow-y:auto;max-height:360px}
@media (min-width:900px){.schritte{aspect-ratio:16/9;max-height:none}}
.szeile{display:flex;align-items:stretch;gap:8px;flex:none}
.sbtn{display:flex;flex:1;min-width:0;align-items:center;gap:12px;padding:10px 12px;border:2px solid var(--kink);border-radius:10px;background:#fff;color:var(--kink);text-align:left;font:inherit;font-size:17px;line-height:1.15;text-transform:inherit;letter-spacing:inherit;min-height:54px}
.sbtn .num{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid var(--kink);color:var(--kink);font-size:16px;flex:none;position:relative;box-sizing:border-box}
.sbtn .num .ico{width:20px;height:20px;vertical-align:0}
.sbtn .lbl{flex:1;min-width:0}
.say{flex:none;display:flex;align-items:center;justify-content:center;width:56px;min-height:48px;background:#fff;border:2px solid var(--kink);border-radius:10px;color:var(--kink)}
.sbtn:focus-visible,.say:focus-visible{outline-offset:-5px}
.sbtn:disabled{cursor:default}.sbtn:disabled:not(.cur){opacity:.4}
.sbtn.cur,.sbtn.cur.done{background:var(--sign);border-width:3px;box-shadow:3px 4px 0 var(--kink);font-size:19px;min-height:64px;color:var(--kink)}
.sbtn.cur .num{background:var(--kink);color:#fff}
.sbtn.done{background:#BFE8C8;color:#4A4038}.sbtn.done .num{background:#1F7A4A;border-color:#1F7A4A;color:#fff}
.sbtn.cur.done .num{background:var(--kink);border-color:var(--kink)}
.sbtn.cur.done .num::after{content:'✓';position:absolute;right:-8px;top:-8px;width:20px;height:20px;border-radius:50%;background:#1F7A4A;color:#fff;font-size:13px;line-height:20px;text-align:center}
.schritte .frei{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;flex:1;min-height:120px;text-align:center}
.schritte .zeit{font-size:34px;font-variant-numeric:tabular-nums}
/* Gutachten-Fixes */
.kid button,.kid a,.kid .btn,.kid .kbtn,.kid .tag,.kid .zettel{text-transform:inherit;letter-spacing:inherit}
.kid{--paper-muted:#7A4E2D}
.auftrag .k,.kid .btn.ghost,.kid .kbtn.ghost,.cam-box,.karte.cur .k{color:var(--paper-muted)}
.schritte .zeit{color:var(--kink)}
.overlay{overflow:auto}
@media (max-width:520px){.overlay{gap:8px;padding:10px}.overlay h2{font-size:20px}.overlay .lbl{font-size:16px}.overlay .kbtn.round.big{width:72px;min-height:72px}.overlay .kbtn{min-height:48px;font-size:16px;padding:0 12px}}
.modal.kid .bubble{background:#fff;border:2px solid #2B2320;font-size:22px;text-align:left}
.modebadge{position:absolute;left:12px;top:10px;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:var(--sign);color:#2B2320;border:2px solid #2B2320;font-size:15px;font-weight:600;letter-spacing:.06em;pointer-events:none;box-shadow:2px 3px 0 rgba(0,0,0,.3)}
.tag .zaehl{display:inline-flex;align-items:center;gap:3px;margin-left:4px;padding:0 7px;height:24px;border-radius:999px;background:var(--kink);color:var(--paper);font-size:13px;font-weight:700;letter-spacing:.02em;flex:none}
.ding .tag{flex-wrap:wrap;row-gap:4px;overflow-wrap:anywhere}   /* langer Name + Zähler: Zähler rutscht in die nächste Zeile statt abgeschnitten */
.tag .zaehl.alle{background:var(--ok,#2f9e44);color:#fff}
.tag .zaehl .ico{width:14px;height:14px}
.kid .schild.hallo.tipp{position:relative}.kid .schild.hallo.tipp button{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}.kid .schild.hallo.tipp button::after{content:"";position:absolute;inset:-10px -4px}
.kid .schild.hallo.tipp:active{transform:translateY(2px)}
.bank .front{height:70px;background:var(--wood2);background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 2px,transparent 2px 160px);box-shadow:inset 0 10px 14px rgba(0,0,0,.25)}
.kid .empty.zettel{display:inline-block;margin:0 auto}
.kid.screen{min-height:100vh;min-height:100dvh;padding-bottom:0}
.kid.screen:not(.pl):not(:has(>.bank)):not(:has(.palette)){padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}   /* Platz für die Flagge am Seitenende */
.kid .bank{margin-top:auto;padding-top:44px}
.kid .bank .front{min-height:90px;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.kid.pl.kino{position:fixed;inset:0;z-index:60;background:#000;overflow:hidden;padding:0;min-height:0}
.kid.pl.kino .girlande,.kid.pl.kino .pl-top,.kid.pl.kino .plabel,.kid.pl.kino .fuss,.kid.pl.kino .auftrag{display:none}
.kid.pl.kino .panes{display:block;margin:0}
.kid.pl.kino .video-box{position:fixed;left:50%;top:0;transform:translateX(-50%);width:min(100vw,calc((100vh - var(--bank))*16/9));width:min(100dvw,calc((100dvh - var(--bank))*16/9));aspect-ratio:16/9;border:0;border-radius:0;box-shadow:none;max-width:none}
.kid.pl.kino .schritte{position:fixed;right:16px;top:16px;bottom:calc(var(--bank) + 12px);width:min(440px,70vw);max-height:none;height:auto;aspect-ratio:auto;display:none;z-index:2}
.kid.pl.kino.liste .schritte{display:flex}
.kid.pl.kino .pl-bank{position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));background:#111;background-image:none;box-shadow:none;min-height:var(--bank);display:flex;align-items:center}

const blobs={db:null,mem:new Map(),urls:new Map(),

  tx(mode){ return this.db.transaction('blobs',mode).objectStore('blobs'); },
  put(k,b){ if(!this.db){this.mem.set(k,b);return Promise.resolve();} return new Promise((res,rej)=>{ const r=this.tx('readwrite').put(b,k); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); },
  get(k){ if(!this.db) return Promise.resolve(this.mem.get(k)||null); return new Promise(res=>{ const r=this.tx('readonly').get(k); r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(null); }); },
  del(k){ this.urls.delete(k); if(!this.db){this.mem.delete(k);return Promise.resolve();} return new Promise(res=>{ const r=this.tx('readwrite').delete(k); r.onsuccess=()=>res(); r.onerror=()=>res(); }); },
  async url(k){ if(this.urls.has(k)) return this.urls.get(k); const b=await this.get(k); if(!b) return null; const u=URL.createObjectURL(b); this.urls.set(k,u); return u; }

function validVideo(v){ return v&&typeof v.id==='string'&&typeof v.title==='string'&&v.source&&(v.source.type==='youtube'&&/^[A-Za-z0-9_-]{11}$/.test(v.source.id)||v.source.type==='file'&&typeof v.source.url==='string')&&Array.isArray(v.steps||[]); }
async function ladeJson(url){ try{ const r=await fetch(url,{cache:'no-store'}); if(!r.ok) return null; const j=await r.json(); return j&&Array.isArray(j.videos)?j:null; }catch(e){ return null; } }
async function loadContentFile(){
  if(!/^https?:/.test(location.protocol)) return;
  // Familie: zuerst alle Schulvideos (gleiche Schritte und Stopps wie in der Schule), dazu die Videos aus inhalte.json, die es nur dort gibt
  const [sch,fam]=await Promise.all([ladeJson(SCHULE?'schule.json':'schule/schule.json'),SCHULE?null:ladeJson('inhalte.json')]);
  if(!sch&&!fam) return;
  try{ const vs=(sch?sch.videos:[]).filter(validVideo), ids=new Set(vs.map(v=>v.id));
    if(fam) fam.videos.filter(validVideo).forEach(v=>{ if(!ids.has(v.id)){ vs.push(v); ids.add(v.id); return; } const sv=vs.find(x=>x.id===v.id); if(!sv.task&&v.task) sv.task=v.task; });
    ((sch&&sch.bereiche)||[]).forEach(a=>{ const ex=areaOf(a.id); if(ex) Object.assign(ex,a); else S.areas.push(a); });
    if(!SCHULE) THEMEN.forEach(t=>{ if(!areaOf(t.id)) S.areas.push(Object.assign({},t)); });
    vs.forEach(v=>{ v.quelle='datei'; const ex=videoOf(v.id); if(ex) Object.assign(ex,v); else S.videos.push(v); });
    [...((sch&&sch.geloescht)||[]),...((fam&&fam.geloescht)||[])].forEach(id=>{ S.videos=S.videos.filter(v=>v.id!==id); });
    const pos=new Map(vs.map((v,i)=>[v.id,i]));
    S.videos.sort((a,b)=>(pos.has(a.id)?pos.get(a.id):1e9)-(pos.has(b.id)?pos.get(b.id):1e9));
    S.areas.forEach(a=>{ if(!a.ding) a.ding=DING_BY_ID[a.id]||'kiste'; });
    contentInfo={n:vs.length,stand:(sch||fam).stand||''}; save();
  }catch(e){}
}

function gruppenOf(vids){ const m=new Map(); videoOrdnung(vids).forEach(v=>{ const g=v.gruppe||'Weitere Projekte'; if(!m.has(g)) m.set(g,[]); m.get(g).push(v); });   // Projektart im Thema (schule.json «gruppe»)
  const st=v=>v.grundtechnik?0:(+v.niveau||2), mitte=g=>g.reduce((s,v)=>s+st(v),0)/g.length;
  return [...m].sort((x,y)=>(Math.min(...x[1].map(st))-Math.min(...y[1].map(st)))||(mitte(x[1])-mitte(y[1]))); }   // leichteste Gruppe zuerst, darin leicht → anspruchsvoll

function fortschrittHtml(v,jetzt){ const pr=prSchule(v), m=schrittListe(v).length, s=Math.min((pr.step||0)+1,m); if(pr.done) return '<span class="v3-badge fertig" aria-label="fertig">✓</span>'; if(pr.step>0||pr.pos>5) return m?`<span class="v3-badge lauf" aria-label="Schritt ${s} von ${m}">${s}/${m}</span>`:'<span class="v3-badge lauf" aria-label="angefangen">◔</span>'; return jetzt?'<span class="v3-badge jetzt" aria-label="jetzt dran">▶</span>':'<span class="v3-badge offen" aria-hidden="true"></span>'; }
function projektZeile(v,jetzt){ const th=thumbOf(v); return `<button class="v3-lektion${v===jetzt?' jetzt':''}" data-act="video" data-id="${v.id}"><span class="th">${th?`<img src="${th}" alt="" loading="lazy">`:''}<i aria-hidden="true">${v.source.type==='bilder'?'📷':'▶'}</i></span><span class="grow"><b>${esc(v.title)}</b><span class="v3-meta">${niveauHtml(v)}${zeitHtml(v)}${v.grundtechnik?'<span>Grundtechnik</span>':''}</span></span>${fortschrittHtml(v,v===jetzt)}</button>`; }
const aufgabeZeile=v=>v.task&&v.task.text&&v.task.deliverable!=='keine'?`<button class="v3-lektion aufgabe" data-act="video" data-id="${v.id}"><span class="th stern" aria-hidden="true">★</span><span class="grow"><b>${esc(v.task.text)}</b><span class="v3-meta">Aufgabe${v.task.deliverable==='foto'?' · 📷':''}</span></span><span class="v3-badge aufgabe">★</span></button>`:'';
// Filter: Schwierigkeit, Zeit, Material, Lupe. Die Wahl steht in view.params und kommt mit dem Verlauf zurück
const MAT_FILTER=['papier','karton','stoff','wolle','ton','holzbrett','draht','perle'];
const filterLeer=f=>!f.niv&&!f.zeit&&!f.mat&&!f.q;

function filterWahl(vs,f){ const q=(f.q||'').trim().toLowerCase(), t=+f.zeit||0, r=vs.filter(v=>(!f.niv||(+v.niveau||2)===+f.niv)&&(!t||(zeitVon(v)&&zeitVon(v)[0]<=t))&&(!f.mat||matListe(v).includes(f.mat))&&(!q||suchText(v).includes(q))); return t?r.sort((a,b)=>zeitSicher(b,t)-zeitSicher(a,t)):r; }
function filterKnoepfe(f,pool,lupe){ const k=(sch,w,inhalt,name,cls='')=>{ const an=String(f[sch])===String(w); return `<button class="vf${cls}${an?' an':''}" data-act="f" data-k="${sch}" data-v="${esc(w)}" aria-pressed="${an}" aria-label="${esc(name)}">${inhalt}</button>`; };
  const mats=MAT_FILTER.filter(m=>pool.some(v=>matListe(v).includes(m))).slice(0,6);
  return `<div class="vf-gruppe">${[1,2,3].map(n=>k('niv',n,niveauHtml({niveau:n}),NIVEAU[n])).join('')}</div>
    ${pool.some(zeitVon)?`<div class="vf-gruppe"><span class="vf-sym" aria-hidden="true">⏱</span>${[5,10,15].map(m=>k('zeit',m,m+'<small>min</small>',m+' min')).join('')}</div>`:''}
    <div class="vf-gruppe">${mats.map(m=>k('mat',m,`<span class="vf-bild">${matIcon(m)}</span><small>${esc(matName(m))}</small>`,matName(m),' vf-mat')).join('')}</div>

function filterLeerHtml(f){ const c=[f.niv&&['niv',f.niv,niveauHtml({niveau:f.niv})],f.zeit&&['zeit',f.zeit,'⏱ '+f.zeit+' min'],f.mat&&['mat',f.mat,`<span class="vf-bild">${matIcon(f.mat)}</span>${esc(matName(f.mat))}`],f.q&&['q',f.q,'🔍 '+esc(f.q)]].filter(Boolean);
  return `<div class="v3-leer vf-leer">${figur('nachdenken')}<div class="vf-chips">${c.map(([k,w,x])=>`<button class="vf an" data-act="f" data-k="${k}" data-v="${esc(w)}">${x} ✕</button>`).join('')}</div><button class="v3-pill vf-alle" data-act="falle">↺ Alle</button></div>`; }
const filterLeiste=()=>'<div class="v3-filter"><div class="vf-knoepfe" id="vf"></div><input class="vf-q" id="vf-q" type="search" aria-label="Suche" autocomplete="off" hidden></div>';
function filterBinden(app,f,pool,inhalt,immerOffen){ const q=$('#vf-q',app); q.hidden=!immerOffen&&!f.q; q.value=f.q||'';
  const zeichne=()=>{ $('#vf',app).innerHTML=filterKnoepfe(f,pool,!immerOffen); $('#liste',app).innerHTML=inhalt(); if(document.activeElement!==q) q.value=f.q||''; };
  q.oninput=()=>{ if(q.value) f.q=q.value; else delete f.q; zeichne(); }; zeichne();
  return { f:b=>{ const k=b.dataset.k, w=b.dataset.v; if(String(f[k])===w) delete f[k]; else f[k]=k==='niv'||k==='zeit'?+w:w; zeichne(); }, falle:()=>{ ['niv','zeit','mat','q'].forEach(k=>delete f[k]); zeichne(); }, lupe:()=>{ q.hidden=!q.hidden; if(q.hidden) delete f.q; else q.focus(); zeichne(); } }; }
function areaSchule(app,a){ const f=view.params, gr=gruppenOf(videosIn(a.id)), vs=gr.flatMap(g=>g[1]), letzt=SCHULE?(offeneArbeit()[0]||{}).id:S.settings.zuletzt, jetzt=vs.find(v=>v.id===letzt&&!prSchule(v).done)||vs.find(v=>!prSchule(v).done);

function mapYT(s){ return ({'-1':'idle',0:'ended',1:'playing',2:'paused',3:'buffering',5:'cued'})[s]||'idle'; }

  if(source.type==='youtube'){

    ytFehler=()=>{ if(!api.dead) opts.onError&&opts.onError('laden'); };

        events:{onReady:()=>{api.ready=true;ccOff(p);opts.onReady&&opts.onReady();},onStateChange:e=>{ if(e.data===1) ccOff(p); opts.onState&&opts.onState(mapYT(e.data)); },onError:e=>opts.onError&&opts.onError(e.data)}});

    api.play=()=>{ if(ok()) p.playVideo(); }; api.pause=()=>{ if(ok()) p.pauseVideo(); }; api.seek=t=>{ if(ok()) p.seekTo(t,true); };
    api.time=()=>ok()?(p.getCurrentTime()||0):0; api.duration=()=>ok()?(p.getDuration()||0):0; api.rate=r=>{ if(ok()) p.setPlaybackRate(r); };
    api.state=()=>ok()?mapYT(p.getPlayerState()):'idle'; api.destroy=()=>{ api.dead=true; try{ p&&p.destroy(); }catch(e){} };
  } else {
    const v=document.createElement('video'); v.src=source.url; v.playsInline=true; v.setAttribute('playsinline',''); v.setAttribute('webkit-playsinline',''); v.preload='metadata'; v.controls=!!opts.controls; host.appendChild(v);
    v.addEventListener('loadedmetadata',()=>{ api.ready=true; opts.onReady&&opts.onReady(); });
    v.addEventListener('play',()=>opts.onState&&opts.onState('playing')); v.addEventListener('pause',()=>{ if(!v.ended) opts.onState&&opts.onState('paused'); });

    api.destroy=()=>{ api.dead=true; try{ v.pause(); v.removeAttribute('src'); v.load(); }catch(e){} v.remove(); };

SCREENS.paint=(app,pr)=>{
  const PAL=['#2B2320','#E8554E','#F28C28','#F2C12E','#3BB273','#2A9DB8','#4C6EF5','#9B5DE5','#8B5A2B','#F5A3C7'];

    <div class="inner" style="display:flex;flex-direction:column;gap:10px;flex:1;margin-top:12px"><div class="canvas-wrap" id="wrap"><canvas id="pc"></canvas></div>
    <div class="palette">${PAL.map(c=>`<button class="sw${c===color?' on':''}" data-act="color" data-v="${c}" style="background:${c}" aria-label="Farbe"></button>`).join('')}<span class="sep"></span>${SIZES.map(s=>`<button class="sz${s===size?' on':''}" data-act="size" data-v="${s}" aria-label="Pinsel ${s}"><i style="width:${s+6}px;height:${s+6}px"></i></button>`).join('')}<span class="sep"></span><button class="sz" id="eraser" data-act="eraser" aria-label="Radiergummi" style="font-size:22px">🧽</button></div></div></div>`;
  const cv=$('#pc'), wrap=$('#wrap'), ctx=cv.getContext('2d'); let dpr=Math.min(2,devicePixelRatio||1);
  function fit(){ const r={width:wrap.clientWidth,height:wrap.clientHeight}; const snap=cv.width?ctx.getImageData(0,0,cv.width,cv.height):null; cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); cv.style.width=r.width+'px'; cv.style.height=r.height+'px'; ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height); if(snap) ctx.putImageData(snap,0,0); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineCap='round'; ctx.lineJoin='round'; }
  fit(); const ro=new ResizeObserver(()=>{ if(!drawing) fit(); }); ro.observe(wrap);
  const pos=e=>{ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; };
  cv.addEventListener('pointerdown',e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId); if(undo.length>25) undo.shift(); undo.push(ctx.getImageData(0,0,cv.width,cv.height)); drawing=true; ctx.strokeStyle=eraser?'#fff':color; ctx.lineWidth=eraser?size*3:size; const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+.01,y); ctx.stroke(); });
  cv.addEventListener('pointermove',e=>{ if(!drawing) return; e.preventDefault(); const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e]; for(const ev of evs){ const [x,y]=pos(ev); ctx.lineTo(x,y); } ctx.stroke(); });
  const end=()=>{ drawing=false; }; cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  wire(app,{
    cancel:()=>{ ro.disconnect(); go(pr.back==='player'?'player':'gallery',{videoId:pr.videoId}); },
    undo:()=>{ const s=undo.pop(); if(s){ ctx.setTransform(1,0,0,1,0,0); ctx.putImageData(s,0,0); ctx.setTransform(dpr,0,0,dpr,0,0); } },
    color:b=>{ color=b.dataset.v; eraser=false; $$('.sw').forEach(x=>x.classList.toggle('on',x===b)); $('#eraser').classList.remove('on'); },
    size:b=>{ size=+b.dataset.v; $$('.sz').forEach(x=>x.classList.toggle('on',x===b)); },
    eraser:b=>{ eraser=!eraser; b.classList.toggle('on',eraser); if(eraser) $$('.sw').forEach(x=>x.classList.remove('on')); },
    keep:()=>{ ro.disconnect(); cv.toBlob(async b=>{ try{ const star=await saveWork({type:'bild',blob:b,videoId:pr.videoId}); afterWork(pr,star); }catch(e){} },'image/png'); }
  });
};

SCREENS.record=(app,pr)=>{
  let state='idle', mr=null, chunks=[], blob=null, url=null, stream=null, t0=0, timer=null; const n=abend();
  app.innerHTML=`<div class="${kidClass()}">${girlande(n)}<div class="inner kopf tool-top" style="padding-left:max(16px,env(safe-area-inset-left,0px))"><button type="button" class="schild-btn" data-act="cancel" aria-label="Abbrechen">${ico('x')}</button><div class="schild"><h1>Aufnehmen</h1></div><div class="kopf-rechts"></div></div><div class="inner" style="margin-top:20px"><div class="papier" id="rec" style="align-items:center;gap:22px"></div></div>${bank()}</div>`;
  const ui=()=>{ const r=$('#rec'); if(!r) return;
    if(state==='idle') r.innerHTML=`<button class="recbtn" data-act="start" aria-label="Aufnahme starten">${ico('mic')}</button>`;
    else if(state==='rec') r.innerHTML=`<div class="timer" id="tm">0:00</div><button class="recbtn on" data-act="stop" aria-label="Aufnahme stoppen"><span style="display:block;width:48px;height:48px;background:#fff;border-radius:8px"></span></button>`;
    else if(state==='done') r.innerHTML=`<div style="font-size:64px;line-height:1">🎧</div><audio controls src="${url}" style="width:min(100%,420px)"></audio><div class="row center"><button class="kbtn" data-act="again">${ico('replay')} Nochmal</button><button class="kbtn primary" data-act="keep">${ico('check')} Behalten</button></div>`;
    else if(state==='err') r.innerHTML=`<div style="font-size:64px;line-height:1">🙈</div><p style="font-size:20px;text-align:center">⚠ Mikrofon</p>`; };
  const cleanup=()=>{ clearInterval(timer); if(stream) stream.getTracks().forEach(t=>t.stop()); stream=null; if(url) URL.revokeObjectURL(url); };
  wire(app,{
    cancel:()=>{ cleanup(); go(pr.back==='player'?'player':'gallery',{videoId:pr.videoId}); }, who:()=>{},
    start:async()=>{ try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); const mime=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||''; mr=new MediaRecorder(stream,mime?{mimeType:mime}:undefined); chunks=[]; mr.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); }; mr.onstop=()=>{ blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'}); url=URL.createObjectURL(blob); stream.getTracks().forEach(t=>t.stop()); state='done'; ui(); }; mr.start(); t0=Date.now(); state='rec'; ui(); timer=setInterval(()=>{ const el=$('#tm'); if(el) el.textContent=fmt((Date.now()-t0)/1000); if(Date.now()-t0>180000) mr.stop(); },250); }catch(e){ state='err'; ui(); } },
    stop:()=>{ clearInterval(timer); if(mr&&mr.state!=='inactive') mr.stop(); },
    again:()=>{ if(url) URL.revokeObjectURL(url); url=null; blob=null; state='idle'; ui(); },
    keep:async()=>{ if(!blob) return; try{ const star=await saveWork({type:'ton',blob,videoId:pr.videoId}); cleanup(); afterWork(pr,star); }catch(e){} }
  });
  ui();
};

    rmstep:b=>{ ED.steps.splice(+b.dataset.i,1); renderSteps(); },

    schoollink:async()=>{ if(!ED.source){ toast('⚠ Zuerst Prüfen'); return; } const v={title:ED.title||'Video',source:ED.source,steps:ED.steps.map((s,i)=>({t:s.t,label:s.label.trim()||'Schritt '+(i+1)})),task:ED.task,material:ED.materialText!=null?matIdsOf(ED.materialText):ED.material}; const link=schoolLink(v); const box=$('#ed-link');

      try{ if(!window.QRCode) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'); new QRCode($('#qr'),{text:link,width:220,height:220,correctLevel:QRCode.CorrectLevel.L}); }catch(e){ $('#qr').innerHTML='<span class="small muted">⚠ QR offline</span>'; } },
    copylink:b=>{ navigator.clipboard&&navigator.clipboard.writeText(b.dataset.link).then(()=>toast('Kopiert')).catch(()=>toast('⚠ Kopieren')); },
    save:()=>{ if(!ED.source){ toast('⚠ Zuerst Prüfen'); return; } if(!ED.title.trim()){ toast('⚠ Titel fehlt'); return; }
      const matIds=ED.materialText!=null?matIdsOf(ED.materialText):(ED.material||[]).slice();
      const rec={id:existing?existing.id:uid(),areaId:ED.areaId,title:ED.title.trim(),source:ED.source,material:matIds,steps:ED.steps.map((s,i)=>({t:s.t,label:s.label.trim()||'Schritt '+(i+1)})),task:{text:ED.task.text.trim(),deliverable:ED.task.text.trim()?ED.task.deliverable:'keine'}};
      if(existing) Object.assign(existing,rec); else S.videos.push(rec); save(); ED=null; toast('Gespeichert'); go('parent',{tab:'videos'}); },
    delete:()=>confirmBox('Video löschen?',ED.title,'Löschen',()=>{ S.videos=S.videos.filter(v=>v.id!==existing.id); save(); ED=null; go('parent',{tab:'videos'}); },true)
  });
}
function parseSource(s){ s=(s||'').trim(); if(!s) return null; let m=s.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/); if(m) return {type:'youtube',id:m[1]}; if(/^[A-Za-z0-9_-]{11}$/.test(s)) return {type:'youtube',id:s}; if(/^https?:\/\//.test(s)&&!/youtube|youtu\.be/.test(s)) return {type:'file',url:s}; return null; }
async function fetchTitle(id){ const url=encodeURIComponent('https://www.youtube.com/watch?v='+id); for(const ep of ['https://www.youtube.com/oembed?format=json&url='+url,'https://noembed.com/embed?url='+url]){ try{ const r=await fetch(ep); if(r.ok){ const j=await r.json(); if(j.title) return j.title; } }catch(e){} } return ''; }
function schoolLink(v){ if(v.source.type==='bilder') return location.origin.replace('null','')+location.pathname+'#a='+encodeURIComponent(v.id); const payload={t:v.title,s:(v.steps||[]).map(s=>[Math.round(s.t*10)/10,s.label]),a:(v.task&&v.task.text)||''}; if(v.source.type==='youtube') payload.y=v.source.id; else payload.u=v.source.url; const mat=(v.material||[]).filter(Boolean); if(mat.length) payload.m=mat; const b64=btoa(unescape(encodeURIComponent(JSON.stringify(payload)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); return location.origin.replace('null','')+location.pathname+'#s='+b64; }
function decodeShare(str){ const m=String(str||'').match(/[#&]s=([A-Za-z0-9_-]+)/); if(!m) return null; try{ let b=m[1].replace(/-/g,'+').replace(/_/g,'/'); while(b.length%4) b+='='; const j=JSON.parse(decodeURIComponent(escape(atob(b)))); return {id:'school',title:j.t||'Video',source:j.y?{type:'youtube',id:j.y}:{type:'file',url:j.u},steps:(j.s||[]).map(([t,label])=>({t:+t,label:String(label)})),task:{text:j.a||'',deliverable:j.a?'fertig':'keine'},material:Array.isArray(j.m)?j.m.map(String).filter(Boolean):[],areaId:null}; }catch(e){ return null; } }
function parseSchool(){ const an=location.hash.match(/[#&]a=([A-Za-z0-9_-]+)/); if(an) return videoOf(an[1])||null; return decodeShare(location.hash); }
SCREENS.school=(app,{video})=>{ SCREENS.player(app,{school:video}); };

  <div class="panel"><h3>Zurücksetzen</h3><button class="btn danger" data-act="reset" style="align-self:flex-start">Alles löschen</button></div>`;
  if(navigator.storage&&navigator.storage.estimate) navigator.storage.estimate().then(e=>{ const el=$('#storage'); if(el&&e.usage) el.textContent='Belegt: '+(e.usage/1048576).toFixed(1)+' MB'; });
  $('#imp').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const j=JSON.parse(r.result); if(!Array.isArray(j.areas)||!Array.isArray(j.videos)) throw 0; confirmBox('Importieren?','Werke bleiben','Importieren',()=>{ S.areas=j.areas.filter(a=>a&&a.id&&a.name); S.videos=j.videos.filter(validVideo); if(Array.isArray(j.profiles)&&j.profiles.length) S.profiles=j.profiles; if(j.settings) Object.assign(S.settings,j.settings,{pin:S.settings.pin}); if(!S.profiles.find(p=>p.id===S.activeProfile)) S.activeProfile=S.profiles[0]&&S.profiles[0].id; S.areas.forEach(a=>{ if(!a.ding) a.ding=DING_BY_ID[a.id]||'kiste'; }); save(); toast('Importiert'); render(); }); }catch(err){ toast('⚠ Datei'); } }; r.readAsText(f); };
  Object.assign(acts,{ export:()=>{ const data={app:'schrittli',version:1,exported:new Date().toISOString(),profiles:S.profiles,areas:S.areas,videos:S.videos,settings:{...S.settings,pin:undefined}}; const b=new Blob([JSON.stringify(data,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='schrittli-'+todayStr()+'.json'; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); },
    reset:()=>confirmBox('Alles löschen?','','Alles löschen',async()=>{ for(const w of S.works) await blobs.del(w.id); localStorage.removeItem(KEY); location.reload(); },true) });
}

/* ============================== Unterricht: Freigabe der iPads durch die Lehrperson ==============================
   Verbunden wird ein iPad über den Link «…/schule/#unterricht=<Token>» aus kontrolle/unterricht.html. Danach fragt die App
   alle paar Sekunden beim Worker nach, was gerade freigegeben ist (Policy); ohne Antwort gilt nach 90 s «geschlossen». */
const UNTERRICHT_API='https://schrittli-anmelden.conradinjoos.workers.dev/unterricht/status';
const UNTERRICHT_KEY='schrittli.unterricht.verbindung';
const UNTERRICHT_MODI=['closed','projects','templates','beads','free'];
const U={verb:null,policy:null,revision:0,deadline:0,error:null,timer:null,laeuft:false,offen:false,lage:null,zurueck:null};
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{ const r=Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); });
function uLaden(){ try{ const v=JSON.parse(localStorage.getItem(UNTERRICHT_KEY)||'null'); if(v&&/^[0-9a-f]{64}$/.test(v.token||'')) U.verb={token:v.token,deviceId:/^[0-9a-f-]{36}$/.test(v.deviceId||'')?v.deviceId:uuid(),id:v.id||null,name:v.name||''}; }catch(e){} }
function uSpeichern(){ try{ if(U.verb) localStorage.setItem(UNTERRICHT_KEY,JSON.stringify(U.verb)); else localStorage.removeItem(UNTERRICHT_KEY); }catch(e){} }
function uTokenAusLink(){ const m=location.hash.match(/[#&]unterricht=([0-9a-fA-F]{64})(?![0-9a-fA-F])/); if(!m) return false; U.verb={token:m[1].toLowerCase(),deviceId:(U.verb&&U.verb.deviceId)||uuid(),id:null,name:''}; U.policy=null; U.revision=0; uSpeichern(); history.replaceState(null,'',location.pathname+location.search); return true; }
const uAktiv=()=>SCHULE&&!!U.verb;
const U_ZU={mode:'closed',title:'',ids:[],simple:true};
function uPolicy(){ if(!uAktiv()) return null; return U.policy&&Date.now()<U.deadline?U.policy:U_ZU; }
// Lage für die Kinder: weg = Verbindung unterbrochen, zu = von der Lehrperson geschlossen
function uLage(){ const p=uPolicy(); if(!p) return null; if(p===U_ZU) return U.error||U.policy?'weg':'warten'; if(p.mode==='closed') return 'zu'; return 'offen'; }
function uLageNeu(){ const l=uLage(); if(l!==U.lage){ U.lage=l; if(view&&view.name==='unterricht') render(); } }
async function uSync(){ if(!uAktiv()||U.laeuft) return; U.laeuft=true; const verb=U.verb; const ac=new AbortController(); const t=setTimeout(()=>ac.abort(),8000);
  try{ const r=await fetch(UNTERRICHT_API,{method:'POST',headers:{Authorization:'Bearer '+verb.token,'Content-Type':'application/json'},body:JSON.stringify({deviceId:verb.deviceId,revision:U.revision}),cache:'no-store',credentials:'omit',signal:ac.signal});
    if(r.status===401){ U.verb=null; U.policy=null; uSpeichern(); U.error='⚠ Verbindung'; toast(U.error,5000); uWechsel(); return; }
    if(!r.ok) throw new Error('status '+r.status);
    const d=await r.json(); if(!d||!d.policy||!UNTERRICHT_MODI.includes(d.policy.mode)||!Array.isArray(d.policy.ids||[])) throw new Error('policy');
    const vorher=JSON.stringify(uPolicy()); const p=Object.assign({ids:[]},d.policy);
    U.policy=p; U.revision=Number.isSafeInteger(d.revision)?d.revision:0; U.deadline=Date.now()+Math.min(90000,+d.leaseMs||90000); U.error=null;
    if(U.verb===verb){ U.verb={...verb,id:d.id||verb.id,name:d.name||verb.name}; uSpeichern(); }
    if(vorher!==JSON.stringify(p)||(view&&view.name==='unterricht')) uWechsel();
    if(Date.now()-KIND_MELD.zuletzt>15000) kindNachsenden();
  }catch(e){ U.error='⚠ Verbindung'; const f=$('#u-fehler'); if(f){ f.textContent=U.error; f.hidden=uLage()==='weg'; } uLageNeu(); }
  finally{ clearTimeout(t); U.laeuft=false; } }
function uStart(){ if(!SCHULE) return; uLaden(); uTokenAusLink(); if(uAktiv()) uLaufen(); }
function uLaufen(){ if(U.timer) return;
  uSync(); kindNachsenden(); let letzte=Date.now();
  U.timer=setInterval(()=>{ if(!uAktiv()){ clearInterval(U.timer); U.timer=null; return; } const p=uPolicy(); if(U.policy&&p===U_ZU&&U.offen){ U.offen=false; if(view&&['player','anleitung','projekt'].includes(view.name)){ const q={...view.params}; delete q.los; U.zurueck={name:view.name,params:q}; } uWechsel(); } if(p!==U_ZU) U.offen=true; uLageNeu(); const takt=document.hidden?15000:5000; if(Date.now()-letzte>=takt){ letzte=Date.now(); uSync(); } },1000);
  ['online','pageshow','focus'].forEach(ev=>window.addEventListener(ev,()=>{ uSync(); kindNachsenden(); }));
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) uSync(); });
}
/* Wohin darf diese Ansicht? null = erlaubt, sonst das Ziel. */
function uRoute(name,params){ const p=uPolicy(); if(!p||p.mode==='free'||name==='unterricht'||name==='school'||name==='wer') return null;
  if(name==='fuehrerschein'&&p.mode!=='closed') return null; if(name==='restzeit'&&p.mode==='projects') return null;
  if(name==='gallery') return p.gallery?null:{name:'unterricht',params:{}};
  if(p.mode==='projects'){ const id=params&&(params.videoId||(params.v&&params.v.id)); if((name==='player'||name==='anleitung'||name==='projekt')&&id&&p.ids.includes(id)) return null; }
  return {name:'unterricht',params:{}};
}
function uWechsel(){ const p=uPolicy(); const b=document.body.classList; b.toggle('unterricht',uAktiv()); b.toggle('u-klasse',!!(p&&p.grade)); b.toggle('u-ohne-galerie',!!p&&p.mode!=='free'&&!p.gallery);
  if(p&&STUFEN.includes(+p.grade)&&S.settings.klasse!==+p.grade){ S.settings.klasse=+p.grade; save(); }
  $$('.modal-bg').forEach(m=>m.remove()); try{ window.dispatchEvent(new Event('unterricht:leave')); }catch(e){}
  if(!view) return;
  if(!uAktiv()){ if(view.name==='unterricht') go('home'); else render(); return; }
  if(U.zurueck&&p!==U_ZU){ if(p.mode==='closed') U.zurueck=null; else { const z=U.zurueck; U.zurueck=null; if(view.name==='unterricht'&&!uRoute(z.name,z.params)){ go(z.name,z.params); return; } } }
  if(p.mode==='projects'&&!p.plan&&p.ids.length===1&&videoOf(p.ids[0])&&!['player','anleitung','projekt'].includes(view.name)){ go('player',{videoId:p.ids[0]}); return; }
  const z=uRoute(view.name,view.params); if(z) go(z.name,z.params); else if(!['player','anleitung','projekt'].includes(view.name)) render();
}
/* Wartebildschirm im Schul-Look: zeigt, was die Lehrperson gerade freigibt. */
SCREENS.unterricht=app=>{ const p=uPolicy(); if(!p){ go('home'); return; } const name=U.verb.name||'Unterricht'; const k=S.settings.klasse; const lage=U.lage=uLage(), weg=lage==='weg';
  const zeile=v=>{ const pr=prSchule(v); const th=thumbOf(v); const a=areaOf(v.areaId);
    return `<button class="v3-lektion u-projekt${pr.done?'':' jetzt'}" data-act="video" data-id="${v.id}"><span class="th">${th?`<img src="${th}" alt="" loading="lazy">`:''}<i aria-hidden="true">${v.source.type==='bilder'?'📷':'▶'}</i></span><span class="grow"><b>${esc(v.title)}</b><span class="v3-meta">${[a?a.name:'',(v.steps||[]).length?v.steps.length+' Schritte':'',zeitText(v)].filter(Boolean).join(' · ')}</span></span><span class="v3-badge ${pr.done?'fertig':'jetzt'}" aria-label="${pr.done?'fertig':'jetzt dran'}">${pr.done?'✓':'▶'}</span></button>`; };
  let inhalt='';
  if(p.mode==='projects'){ const vs=p.ids.map(videoOf).filter(Boolean);
    inhalt=vs.length?(p.plan?`<div class="v3-liste u-liste plan-liste">${vs.map(planKarte).join('')}</div>`:`<div class="v3-liste u-liste">${vs.map(zeile).join('')}</div>`):`<div class="v3-leer">${figur('nachdenken')}⏳</div>`; }
  else if(p.mode==='templates'||p.mode==='beads'){ const perlen=p.mode==='beads'; const href=VORL_BASE+(perlen?'perlen/':'')+(k?'?klasse='+k:'');
    inhalt=`<div class="u-karte"><div class="bild" style="background:${perlen?'#EEF7EC':'#FBEDE4'}" aria-hidden="true">${perlen?WZ_BILD.perlen:WZ_BILD.vorlagen}</div><div class="grow"><b>${perlen?'Perlentiere':'Vorlagen'}</b><a class="v3-werkzeuge" href="${href}">Öffnen ▶</a></div></div>`; }
  else if(p.mode==='free'){ go('home'); return; }
  else inhalt=weg?`<div class="v3-leer u-warten" data-lage="weg">${figur('nachdenken')}<span class="u-sym u-weg" role="img" aria-label="Verbindung unterbrochen">${ico('wlanaus')}</span><div class="z-reihe">${zustandHtml('verbindung')}${zustandHtml('gespeichert')}</div><button class="v3-pill u-neu" data-act="neu">${ico('replay')} Nochmal</button></div>`:`<div class="v3-leer u-warten" data-lage="${lage}">${figur('hallo')}<span class="u-sym" role="img" aria-label="${lage==='zu'?'Geschlossen':'Warten'}">${lage==='zu'?'🔒':'⏳'}</span></div>`;
  app.innerHTML=`<div class="v3${schriftNormal()?'':' caps'} u-screen"><div class="v3-in">
    ${v3Kopf('',`<b class="v3-name">${esc(name)}</b>`)}
    ${!weg&&p.title?`<h1 class="v3-h1 gross">${esc(p.title)}</h1>`:''}
    <p class="z-chip warn u-fehler" id="u-fehler"${U.error&&!weg?'':' hidden'}>${esc(U.error||'')}</p>
    ${inhalt}
    <div class="v3-fuss"><span class="v3-meta u-status"><i class="u-punkt${U.error?' weg':U.policy?' an':''}"></i>${esc(name)}</span><button class="v3-link u-trennen" data-act="trennen">Verbindung trennen</button></div>
  </div></div>`;
  let halten=null; const tb=$('[data-act=trennen]',app);
  const los=()=>{ clearTimeout(halten); halten=setTimeout(()=>{ tb.classList.remove('haelt'); confirmBox('Verbindung trennen?','Nur Lehrperson','Trennen',()=>{ U.verb=null; U.policy=null; uSpeichern(); toast('Verbindung getrennt'); uWechsel(); },true); },3000); tb.classList.add('haelt'); };
  const stop=()=>{ clearTimeout(halten); tb.classList.remove('haelt'); };
  tb.addEventListener('pointerdown',los); ['pointerup','pointerleave','pointercancel','keyup','blur'].forEach(ev=>tb.addEventListener(ev,stop));
  tb.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&!e.repeat){ e.preventDefault(); los(); } });
  wire(app,{ video:b=>go('projekt',{videoId:b.dataset.id}), gallery:()=>go('gallery'), trennen:()=>{}, neu:()=>{ toast('⏳',800); uSync(); }, ...planAktionen(app) });
};

/* ============================== Verbindungen der Schul-iPads (Rückmeldungen, Unsere Werke) ==============================
   Beide Verbindungen kommen über Links aus der Online-Kontrolle: «#klasse=<Token>» (Rückmeldungen) und «#sammlung=<Token>» (Werke).
   Tokens bleiben nur in localStorage dieses iPads; die Kontrolle kann sie jederzeit sperren. */
const SCHRITTLI_API='https://schrittli-anmelden.conradinjoos.workers.dev';
function mitZeit(ms){ const ac=new AbortController(); const t=setTimeout(()=>ac.abort(),ms); return {signal:ac.signal,ende:()=>clearTimeout(t)}; }
const TOKEN64=/^[0-9a-f]{64}$/;

/* ---------- Rückmeldungen: zwei Bildfragen und eine freiwillige Sprachnachricht ---------- */
const RM_KEY='schrittli.feedback.klasse', RM_MAX_AUDIO=1048576;
const RM={verb:null,gefragt:new Set()};
const rmAktiv=()=>SCHULE&&!!RM.verb;
function rmLaden(){ try{ const v=JSON.parse(localStorage.getItem(RM_KEY)||'null'); if(v&&TOKEN64.test(v.token||'')) RM.verb={token:v.token,name:String(v.name||'Deine Klasse').slice(0,80)}; }catch(e){} }
function rmSpeichern(){ try{ if(RM.verb) localStorage.setItem(RM_KEY,JSON.stringify(RM.verb)); else localStorage.removeItem(RM_KEY); }catch(e){} }
async function rmVerbinden(token){ const z=mitZeit(15000);
  try{ const r=await fetch(SCHRITTLI_API+'/feedback/klasse',{headers:{Authorization:'Bearer '+token},cache:'no-store',credentials:'omit',signal:z.signal});
    if(!r.ok){ throw Object.assign(new Error(r.status===401||r.status===403?'⚠ Link':'⚠ Verbindung'),{status:r.status}); }
    const d=await r.json(); RM.verb={token,name:String(d.name||'Deine Klasse').slice(0,80)}; rmSpeichern(); toast('✓ '+RM.verb.name,3500);
  }catch(e){ if(e.name==='AbortError') throw new Error('⚠ Verbindung'); throw e; } finally{ z.ende(); } }
function rmStart(){ if(!SCHULE) return; rmLaden(); const m=location.hash.match(/[#&]klasse=([0-9a-fA-F]{64})(?![0-9a-fA-F])/); if(!m) return;
  history.replaceState(null,'',location.pathname+location.search); rmVerbinden(m[1].toLowerCase()).then(()=>{ klHolen(); if(view.name==='lehrer') render(); }).catch(e=>toast(fehlerKurz(e),6000)); }
/* Nach einem abgegebenen Werk einmal pro Video fragen – kurz verzögert, damit Konfetti und Hinweis zuerst dran sind. */
function rmNachAbgabe(videoId,name){ if(!rmAktiv()||!videoId||RM.gefragt.has(videoId)) return; const v=videoOf(videoId); if(!v) return; RM.gefragt.add(videoId); setTimeout(()=>{ if(rmAktiv()) rmFragen(v,name); },900); }
const RM_FRAGEN=[{f:'schwierigkeit',titel:'Wie war es für dich?',wahl:[[1,'🪶','Leicht'],[2,'👌','Genau richtig'],[3,'💪','Schwierig']]},{f:'spass',titel:'Hat es Spass gemacht?',wahl:[[1,'😕','Wenig'],[2,'🙂','Okay'],[3,'🤩','Viel']]}];
function rmFragen(v,name){
  const st={id:uuid(),name:name||null,schwierigkeit:0,spass:0,klasse:STUFEN.includes(+S.settings.klasse)?+S.settings.klasse:0,stufe:'idle',audio:null,url:null,rec:null,stream:null,tick:null,sek:0,start:0};
  const gueltig=()=>st.schwierigkeit&&st.spass&&STUFEN.includes(st.klasse)&&(st.stufe==='idle'||st.stufe==='fertig');
  const pruefen=m=>{ const b=$('[data-act=senden]',m); if(b) b.disabled=!gueltig(); };
  const frage=q=>`<div class="rm-frage"><span>${q.titel}</span><div class="rm-wahl">${q.wahl.map(([w,sym,txt])=>`<button type="button" data-act="wahl" data-f="${q.f}" data-v="${w}" aria-pressed="false"><i aria-hidden="true">${sym}</i>${txt}</button>`).join('')}</div></div>`;
  kidModal(`<h2>Wie war’s${st.name?', '+esc(st.name):''}?</h2><p class="rm-titel">${esc(v.title)}</p>${RM_FRAGEN.map(frage).join('')}
    ${st.klasse?'':`<div class="rm-frage"><span>Deine Klasse</span><div class="rm-wahl klassen">${STUFEN.map(k=>`<button type="button" data-act="wahl" data-f="klasse" data-v="${k}" aria-pressed="false">${k}.</button>`).join('')}</div></div>`}
    <div class="rm-ton" id="rm-ton"></div><p class="rm-fehler" id="rm-fehler" hidden></p>
    <div class="row center"><button class="kbtn ghost" data-act="nein">Lieber nicht</button><button class="kbtn primary" data-act="senden" disabled>${ico('check')} Senden</button></div>`,{
    wahl:(b,close,m)=>{ st[b.dataset.f]=+b.dataset.v; $$(`[data-f=${b.dataset.f}]`,m).forEach(x=>{ x.classList.toggle('an',x===b); x.setAttribute('aria-pressed',String(x===b)); }); pruefen(m); },
    aufnahme:(b,close,m)=>rmAufnahme(st,m,pruefen), stopp:()=>rmStopp(st),
    loeschen:(b,close,m)=>{ rmAufraeumen(st); rmTonZeigen(st,m); pruefen(m); },
    nein:(b,close)=>{ rmAufraeumen(st); close(); },
    senden:async(b,close,m)=>{ if(!gueltig()) return; b.disabled=true; const alt=b.innerHTML; b.textContent='⏳'; const fe=$('#rm-fehler',m); fe.hidden=true;
      const fd=new FormData(); fd.append('daten',JSON.stringify({id:st.id,videoId:v.id,titel:String(v.title||'Video').slice(0,160),klasse:st.klasse,schwierigkeit:st.schwierigkeit,spass:st.spass,name:st.name}));
      if(st.audio) fd.append('audio',st.audio,'nachricht.'+({'audio/webm':'webm','audio/mp4':'m4a','audio/ogg':'ogg'}[st.audio.type]||'webm'));
      const z=mitZeit(30000);
      try{ const r=await fetch(SCHRITTLI_API+'/feedback/abgeben',{method:'POST',body:fd,headers:{Authorization:'Bearer '+RM.verb.token},cache:'no-store',credentials:'omit',signal:z.signal}); const j=await r.json().catch(()=>({}));
        if(r.status===401||r.status===403){ RM.verb=null; rmSpeichern(); rmAufraeumen(st); close(); toast('⚠ Link',6000); return; }
        if((r.status===413||r.status===415)&&st.audio){ rmAufraeumen(st); rmTonZeigen(st,m,'⚠ Aufnahme'); b.disabled=false; b.innerHTML=alt; pruefen(m); return; }
        if(!r.ok) throw new Error('⚠ Senden');
        rmAufraeumen(st); close(); confetti(); toast('✓ Danke',3000);
      }catch(e){ fe.textContent=e.name==='AbortError'?'⚠ Verbindung':e.message; fe.hidden=false; b.disabled=false; b.innerHTML=alt; }
      finally{ z.ende(); } }
  });
  const m=document.body.lastElementChild; rmTonZeigen(st,m); pruefen(m);
  // Wird das Fenster daneben weggetippt, Mikrofon und Aufnahme trotzdem freigeben.
  const wache=setInterval(()=>{ if(!m.isConnected){ clearInterval(wache); rmAufraeumen(st); } },1000);
}
function rmTonZeigen(st,m,fehler){ const box=$('#rm-ton',m); if(!box) return; const f=fehler?`<p class="rm-fehler">${esc(fehler)}</p>`:'';
  if(st.stufe==='warten') box.innerHTML=`<div class="rm-rec">🎙️ ⏳</div>`;
  else if(st.stufe==='laeuft') box.innerHTML=`<div class="rm-rec"><span class="punkt" aria-hidden="true"></span><span id="rm-zeit" role="timer">${st.sek} / 60 s</span></div><button class="kbtn" data-act="stopp">⏹ Stopp</button>`;
  else if(st.stufe==='stoppt') box.innerHTML=`<div class="rm-rec">⏳</div>`;
  else if(st.stufe==='fertig') box.innerHTML=`<div class="rm-rec">🎧 ${st.sek} s</div><audio controls src="${st.url}"></audio><button class="kbtn ghost" data-act="loeschen">Nochmals aufnehmen</button>`;
  else box.innerHTML=`<button class="kbtn" data-act="aufnahme" aria-label="Aufnehmen, bis 1 Minute">🎙️ 1 min</button>${f}`; }
async function rmAufnahme(st,m,pruefen){ if(st.stufe!=='idle') return; const md=navigator.mediaDevices;
  if(!md||!md.getUserMedia||!window.MediaRecorder){ rmTonZeigen(st,m,'⚠ Mikrofon'); return; }
  st.stufe='warten'; rmTonZeigen(st,m); pruefen(m);
  try{ st.stream=await md.getUserMedia({audio:true}); }catch(e){ st.stufe='idle'; rmTonZeigen(st,m,'⚠ Mikrofon'); pruefen(m); return; }
  if(!m.isConnected){ rmAufraeumen(st); return; }
  const typ=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'].find(t=>MediaRecorder.isTypeSupported(t));
  let rec; try{ rec=typ?new MediaRecorder(st.stream,{mimeType:typ}):new MediaRecorder(st.stream); }catch(e){ rmAufraeumen(st); rmTonZeigen(st,m,'⚠ Mikrofon'); pruefen(m); return; }
  const teile=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) teile.push(e.data); };
  rec.onstop=()=>{ const basis=String(rec.mimeType||typ||'audio/webm').split(';')[0]; const blob=new Blob(teile,{type:basis}); clearInterval(st.tick); if(st.stream) st.stream.getTracks().forEach(t=>t.stop()); st.stream=null; st.rec=null;
    let fehler=''; if(blob.size>RM_MAX_AUDIO) fehler='⚠ Zu lang'; else if(!['audio/webm','audio/mp4','audio/ogg'].includes(basis)||blob.size<100) fehler='⚠ Format';
