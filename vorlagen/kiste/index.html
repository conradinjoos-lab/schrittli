<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schritt für Schritt · Kisten-Planer</title>
<meta name="description" content="Holzkiste planen: Länge, Breite, Höhe und Material (Sperrholz, MDF, Massivholz) eingeben – die Seite rechnet alle Teile aus, wählt Schraube, Bohrer und Vorbohrtiefe, zeichnet die Bohrpläne und den Zuschnitt und schreibt die Bauanleitung.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap">
<link rel="stylesheet" href="../planer.css">
<style>
:root{--bg:#F3EFE6;--surface:#FFFFFF;--surface2:#F7F3EC;--ink:#2B2320;--muted:#6B5F58;--line:#DDD3C6;--acc:#9A6B2F;--acc-ink:#FFFFFF;--acc-soft:#F4E6D2;--warn:#B3412A;--warn-soft:#FBE9E4;--papier:#FFFFFF;--holz:#E9C99A;--holz2:#C99A5B;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130F;--surface:#241E18;--surface2:#1C1712;--ink:#F2EBE2;--muted:#B3A596;--line:#3C322A;--acc:#E0A860;--acc-ink:#17130F;--acc-soft:#3A2C1A;--warn:#F08A6E;--warn-soft:#3A2420;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130F;--surface:#241E18;--surface2:#1C1712;--ink:#F2EBE2;--muted:#B3A596;--line:#3C322A;--acc:#E0A860;--acc-ink:#17130F;--acc-soft:#3A2C1A;--warn:#F08A6E;--warn-soft:#3A2420;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.4 Nunito,system-ui,sans-serif}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0}
h1{font-size:28px}
h2{font-size:17px;margin-bottom:10px}
h3{font-size:15px;margin:12px 0 6px}
a{color:var(--acc)}
main{max-width:1200px;margin:0 auto;padding:8px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:14px;align-items:start}
.links{display:flex;flex-direction:column;gap:14px}
.karte{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.rechts{position:sticky;top:calc(var(--kopf-h) + 12px);display:flex;flex-direction:column;gap:14px}
.feld{margin-bottom:14px}.feld:last-child{margin-bottom:0}
.lbl{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.chip:hover{border-color:var(--acc)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.zwei{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.zahl{display:flex;align-items:center;gap:6px}
.zahl input{width:92px;height:48px;font:600 24px Fredoka,Nunito,sans-serif;text-align:center;border:2px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--ink);padding:0 4px}
.zahl span{font-size:15px;color:var(--muted)}
.tz{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 4px;margin-right:6px;border-radius:11px;background:var(--acc);color:var(--acc-ink);font:700 13px/1 Nunito,sans-serif;vertical-align:1px}
.antwort{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.antwort li{font-size:16px;line-height:1.35}
.antwort b{font:600 24px/1.1 Fredoka,Nunito,sans-serif;color:var(--acc);white-space:nowrap}
.antwort .leise{color:var(--muted);font-size:14px;display:block;margin-top:2px}
.warn{color:var(--warn)}
.rechnung{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;align-items:start}
.rg{padding:8px 12px 10px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.rg h4{display:flex;align-items:center;gap:8px;margin:0 0 4px;font:600 16px Fredoka,Nunito,sans-serif}
.rg h4 svg{width:36px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;color:var(--muted)}
.rg h4 svg .f{fill:currentColor;fill-opacity:.3}
.rz{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding:4px 0;border-top:1px dashed var(--line);font-size:14px}
.rz .rf{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.rz b{font:600 17px/1.2 Fredoka,Nunito,sans-serif;color:var(--acc);white-space:nowrap;min-width:64px;text-align:right}
.rz.total{border-top:2px solid var(--line)}.rz.total b{font-size:20px}
.schritte{margin:0;padding-left:22px;font-size:15px;line-height:1.45}
.schritte li{margin-bottom:6px}
.material{margin:0;padding:0;list-style:none}
.material li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
.material li:last-child{border-bottom:0}
.material .n{color:var(--acc);font:600 16px Fredoka,Nunito,sans-serif;white-space:nowrap}
.material .leise{color:var(--muted);font-size:13px;display:block}
.bild svg{display:block;width:100%;height:auto;max-height:52vh;background:var(--papier);border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.plaene{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.plaene figure{margin:0}
.plaene figcaption{font-size:14px;margin-bottom:4px}
.plaene figcaption .leise{color:var(--muted);font-size:12px;display:block}
.plaene svg{display:block;width:100%;height:auto;background:var(--papier);border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.12)}
[hidden]{display:none!important}
svg .t,svg .tk{font-family:Nunito,sans-serif;font-weight:600}
svg .mass{fill:none;stroke:#9A6B2F;stroke-width:.5}
svg .masst{font-family:Fredoka,Nunito,sans-serif;font-weight:600;fill:#9A6B2F}
/* Bühne: die Kiste zum Anfassen */
.werkzeug{display:flex;flex-wrap:wrap;gap:8px 14px;margin-bottom:10px;align-items:center}
.chip.ico{width:44px;padding:0;display:inline-grid;place-items:center}
.chip svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;display:block}
.chip svg .f{fill:currentColor;fill-opacity:.3}
.chip svg .a{stroke:var(--acc);stroke-width:2}.chip svg .a.f{fill:var(--acc);fill-opacity:1;stroke-width:1.2}
.seg{align-items:center;gap:4px}.seg .gt{font-size:13px;font-weight:700;color:var(--muted);margin-right:2px}
.chip i{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.35);vertical-align:-2px;margin-right:6px}
.einheit{font-size:13px;color:var(--muted);align-self:center;margin-left:2px}
.flaeche{position:relative;background:var(--papier);border:2px solid var(--line);border-radius:14px;overflow:hidden}
.flaeche svg{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.flaeche .zieh{cursor:grab;touch-action:none}.flaeche.zieht,.flaeche.zieht .zieh{cursor:grabbing}
.flaeche .zieh:focus{outline:none}.flaeche .zieh:focus-visible .ring{stroke:#2B2320;stroke-width:3}
.flaeche [data-t],.flaeche .griff,.flaeche .massz{cursor:pointer}
.massz:focus{outline:none}.massz:focus-visible .pille{stroke:#1F1A17;stroke-width:3}
.massz text{font-family:Fredoka,Nunito,sans-serif;font-weight:600;pointer-events:none}
@keyframes glut{50%{opacity:.5}}
.glut{animation:glut 1.1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.glut{animation:none}}
/* Feld am Mass: gleiche Farbe wie Kante und Pfeil */
.massfeld{--m:var(--acc);position:absolute;left:0;top:0;z-index:5;display:flex;align-items:center;gap:4px;padding:3px;border-radius:14px;background:#fff;color:#2B2320;border:2px solid var(--m);box-shadow:0 0 12px 2px var(--m)}
.massfeld button{flex:none;width:44px;height:44px;border:0;border-radius:10px;background:#F4EFE7;color:var(--m);font:600 26px/1 Fredoka,Nunito,sans-serif;cursor:pointer;touch-action:manipulation}
.massfeld input{width:76px;height:44px;border:0;border-radius:10px;background:#F4EFE7;color:#2B2320;font:600 24px Fredoka,Nunito,sans-serif;text-align:center;padding:0 2px}
.massfeld input:focus-visible,.massfeld button:focus-visible{outline:3px solid var(--m);outline-offset:1px}
.massfeld span{font-size:15px;color:#6B5F58;white-space:nowrap}
.massfeld.falsch{--m:#B3412A}.massfeld.falsch span{color:#B3412A;font-weight:800}
.druck-karte{padding:12px 16px}
.warnband{position:absolute;left:8px;top:8px;margin:0;padding:6px 10px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:800;max-width:calc(100% - 16px);pointer-events:none}
.mehr summary,.mehr-karte summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:36px;padding:0 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface2);color:var(--muted);font-size:15px;margin-top:8px}
.mehr summary::-webkit-details-marker,.mehr-karte summary::-webkit-details-marker{display:none}
.mehr[open] summary,.mehr-karte[open] summary{border-color:var(--acc);color:var(--ink)}
.mehr .zwei{margin-top:10px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.mehr .lbl{margin-bottom:4px}
.mehr-karte{padding:12px 16px}
.mehr-karte>*:not(summary){margin-top:12px}
.mehr-karte summary{margin-top:0}
.fakten{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.fakt{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:8px 6px;text-align:center;line-height:1.15}
.fakt svg{width:44px;height:30px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;display:block;margin:0 auto 4px;color:var(--muted)}
.fakt svg .f{fill:currentColor;fill-opacity:.3}
.fakt b{display:block;font:600 21px/1.1 Fredoka,Nunito,sans-serif;color:var(--acc);white-space:nowrap}
.fakt small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.fakt.warn{color:var(--warn);background:var(--warn-soft);grid-column:1/-1}.fakt.warn b{color:var(--warn)}
.material li .mini{flex:none;width:36px;height:22px;align-self:center}
.material li .mini rect{fill:var(--holz);stroke:var(--holz2);stroke-width:1}
.material li .tn{flex:1}
h2 .leise{color:var(--muted);font-size:14px;font-family:Nunito,sans-serif}
@media (max-width:860px){
  main{display:flex;flex-direction:column;align-items:stretch}
  .links,.buehne{display:contents}
  .flaeche{order:1;position:sticky;top:var(--kopf-h)}.werkzeug{order:2;margin:0;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px}#zahlen{order:3}.rechts{order:4}.links>.karte:not(.buehne){order:5}
  .mehr summary{margin-top:0}
  .rechts{position:static}
}
@media (max-width:520px){
  main{padding:6px 16px 32px;gap:12px}
  .werkzeug{gap:6px 10px}
}
#druck{display:none}
@media print{
  body{background:#fff;color:#000;font-size:12px}
  main{display:none!important}
  #druck{display:block}
  #druck .seite{break-after:page}
  #druck .seite:last-child{break-after:auto}
  #druck h1{font-size:20px;margin-bottom:4px}
  #druck h2{font-size:14px;margin:10px 0 4px}
  #druck .bild svg{max-height:75mm;box-shadow:none;border:1px solid #ccc}
  #druck table{border-collapse:collapse;width:100%;font-size:12px}
  #druck td,#druck th{border-bottom:1px solid #ccc;padding:3px 6px;text-align:left}
  #druck .rechnung{grid-template-columns:1fr 1fr 1fr;gap:5px}
  #druck .rg{background:#fff;border-color:#ccc;color:#000;padding:3px 7px 4px;border-radius:6px}
  #druck .rg h4{font-size:12px;margin:0 0 1px}#druck .rg h4 svg{width:26px;height:17px;color:#555}
  #druck .rz{font-size:10px;padding:1px 0;gap:5px}#druck .rz .rf{color:#555}#druck .rz b{color:#000;font-size:11px;min-width:0}#druck .rz.total b{font-size:12px}
  #druck .schritte{font-size:11px;line-height:1.35}
  #druck .plaene{grid-template-columns:1fr 1fr 1fr;gap:6px}
  #druck .plaene svg{box-shadow:none;border:1px solid #ccc}
  #druck .plaene figcaption{font-size:12px}
  #druck .fuss{font-size:10px;color:#666;margin-top:8px}
  #druck .fusszeile{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:4px}#druck .fusszeile .fuss{margin:0}
  #druck .tz{min-width:15px;height:15px;padding:0 3px;margin-right:4px;border-radius:8px;background:#fff;color:#000;border:1px solid #000;font-size:10px}
  #druck .antwort{gap:3px}#druck .antwort li{font-size:12px}#druck .antwort b{font-size:15px;color:#000}#druck .antwort .leise{font-size:11px}
  #druck .bild svg{max-height:62mm}#druck .plaene svg{max-height:44mm}#druck .seite .bild+h2{margin-top:6px}#druck .zu svg{max-height:42mm}#druck .schritte li{margin-bottom:2px}
}
</style>
</head>
<body>
<header class="pk">
  <a class="zur-app" href="../../" data-zur-app aria-label="Zurück zur App"><span>App</span></a>
  <h1>Kisten-Planer</h1>
  <a class="pk-vorlagen" href="../" aria-label="Vorlagen" title="Vorlagen"><span>Vorlagen</span></a>
  <button class="pk-rueck" id="p-rueck" type="button" disabled aria-label="Rückgängig" title="Rückgängig"></button>
  <button class="pk-druck" id="drucken" type="button" aria-label="Drucken, 100 %"><span>Drucken</span></button>
</header>
<script src="../zurueck.js"></script>
<script src="../planer.js"></script>
<main>
<div class="links">
  <section class="karte buehne">
    <div class="werkzeug">
      <div class="chips seg" role="group" aria-label="Mass" data-g="mass"><span class="gt">Mass</span>
        <button type="button" class="chip ico" data-v="aussen" title="Aussen" aria-label="Aussenmass"><svg viewBox="0 0 26 26" aria-hidden="true"><path class="f" d="M3 11v12h20V11h-3v9H6v-9z"/><path class="a" d="M3 6h20M3 3.5v5M23 3.5v5"/></svg></button>
        <button type="button" class="chip ico" data-v="innen" title="Innen" aria-label="Innenmass"><svg viewBox="0 0 26 26" aria-hidden="true"><path class="f" d="M3 6v17h20V6h-3v14H6V6z"/><path class="a" d="M6 13h14M6 10.5v5M20 10.5v5"/></svg></button>
      </div>
      <div class="chips seg" role="group" aria-label="Boden" data-g="boden"><span class="gt">Boden</span>
        <button type="button" class="chip ico" data-v="unter" title="Unter den Wänden" aria-label="Boden unter den Wänden"><svg viewBox="0 0 26 26" aria-hidden="true"><path class="f" d="M3 4h3.5v14H3zM19.5 4H23v14h-3.5z"/><path class="a f" d="M3 18h20v4H3z"/></svg></button>
        <button type="button" class="chip ico" data-v="zwischen" title="Zwischen den Wänden" aria-label="Boden zwischen den Wänden"><svg viewBox="0 0 26 26" aria-hidden="true"><path class="f" d="M3 4h3.5v18H3zM19.5 4H23v18h-3.5z"/><path class="a f" d="M6.5 18h13v4h-13z"/></svg></button>
      </div>
      <div class="chips seg" role="group" aria-label="Ecken" data-g="aussen"><span class="gt">Ecken</span>
        <button type="button" class="chip ico" data-v="lang" title="Längsseiten aussen" aria-label="Längsseiten aussen"><svg viewBox="0 0 26 26" aria-hidden="true"><path class="f" d="M2 9.5h3.5v7H2zM20.5 9.5H24v7h-3.5z"/><path class="a f" d="M2 6h22v3.5H2zM2 16.5h22V20H2z"/></svg></button>
        <button type="button" class="chip ico" data-v="kurz" title="Stirnseiten aussen" aria-label="Stirnseiten aussen"><svg viewBox="0 0 26 26" aria-hidden="true"><path class="f" d="M5.5 6h15v3.5h-15zM5.5 16.5h15V20h-15z"/><path class="a f" d="M2 6h3.5v14H2zM20.5 6H24v14h-3.5z"/></svg></button>
      </div>
      <div class="chips seg" role="group" aria-label="Deckel" data-g="deckel"><span class="gt">Deckel</span>
        <button type="button" class="chip ico" data-v="nein" title="Ohne" aria-label="Ohne Deckel"><svg viewBox="0 0 26 26" aria-hidden="true"><path class="f" d="M4 11v11h18V11h-3v8H7v-8z"/><path d="M4 6.5h18" stroke-dasharray="2 2.5"/></svg></button>
        <button type="button" class="chip ico" data-v="ja" title="Lose" aria-label="Deckel lose"><svg viewBox="0 0 26 26" aria-hidden="true"><path class="f" d="M4 11v11h18V11h-3v8H7v-8z"/><path class="a f" d="M3 4h20v3H3z"/><path class="a f" d="M8 7h2.5v4H8zM15.5 7H18v4h-2.5z"/></svg></button>
        <button type="button" class="chip ico" data-v="scharnier" title="Scharnier" aria-label="Deckel mit Scharnier"><svg viewBox="0 0 26 26" aria-hidden="true"><path class="f" d="M4 11v11h18V11h-3v8H7v-8z"/><path class="a f" d="M22.5 10.5L14.8 1.3l-2.3 1.9 7.7 9.2z"/><circle class="a f" cx="21.6" cy="11" r="1.6"/></svg></button>
        <button type="button" class="chip ico" data-v="nut" title="Nut" aria-label="Schiebedeckel in Nut"><svg viewBox="0 0 26 26" aria-hidden="true"><path class="f" d="M2 9v13h16V9h-3v10H5V9z"/><path class="a f" d="M6 11h19v2.2H6z"/><path class="a" d="M24 6.5h-7M19.5 4l-2.5 2.5 2.5 2.5"/></svg></button>
      </div>
      <div class="chips" role="group" aria-label="Holz" data-g="mat">
        <button type="button" class="chip" data-v="sperrholz"><i style="background:#E6C48F"></i>Sperrholz</button>
        <button type="button" class="chip" data-v="mdf"><i style="background:#B48A5E"></i>MDF</button>
        <button type="button" class="chip" data-v="massiv"><i style="background:#D59E5C"></i>Massiv</button>
      </div>
      <div class="chips" role="group" aria-label="Dicke in mm" id="dicken"></div>
    </div>
    <div class="flaeche pl-haft" id="flaeche">
      <svg id="kiste" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Kiste"></svg>
      <p class="warnband" id="flaeche-warn" hidden></p>
      <div class="massfeld" id="massfeld" role="group" hidden>
        <button type="button" id="mf-minus" aria-label="Weniger">−</button>
        <input id="mf-zahl" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done">
        <span id="mf-e">cm</span>
        <button type="button" id="mf-plus" aria-label="Mehr">+</button>
      </div>
    </div>
    <details class="mehr" id="zahlen"><summary aria-label="Zahlen">⋯</summary>
      <div class="zwei">
        <div class="feld"><label class="lbl" for="l">↔ Länge</label><div class="zahl"><input type="number" id="l" min="4" max="120" step="0.5" inputmode="decimal"><span>cm</span></div></div>
        <div class="feld"><label class="lbl" for="b">⤢ Breite</label><div class="zahl"><input type="number" id="b" min="4" max="120" step="0.5" inputmode="decimal"><span>cm</span></div></div>
        <div class="feld"><label class="lbl" for="h">↕ Höhe</label><div class="zahl"><input type="number" id="h" min="2" max="80" step="0.5" inputmode="decimal"><span>cm</span></div></div>
        <div class="feld"><label class="lbl" for="d">▮ Dicke</label><div class="zahl"><input type="number" id="d" min="3" max="30" step="0.5" inputmode="decimal"><span>mm</span></div></div>
      </div>
    </details>
  </section>
  <section class="karte">
    <h2>Bohrpläne</h2>
    <div class="plaene" id="plaene"></div>
  </section>
  <section class="karte">
    <h2>Zuschnitt</h2>
    <div class="bild" id="zuschnitt"></div>
  </section>
</div>

<div class="rechts">
  <section class="karte" aria-live="polite">
    <h2>Teile <span class="leise" id="teile-dicke"></span></h2>
    <ul class="material" id="teile"></ul>
  </section>
  <section class="karte">
    <h2>Schrauben</h2>
    <div class="fakten" id="fakten"></div>
  </section>

<div id="druck"></div>
<script>
// Kisten-Planer von Schritt für Schritt. Eingaben in cm (Kiste) und mm (Dicke); gerechnet und gezeichnet wird in mm.
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='schrittli.kiste.v1';
const n=x=>String(Math.round(x*10)/10).replace('.',',');
const mm=x=>`${n(x)} mm`;
const cmT=x=>`${n(x/10)} cm`;
const KERF=3;      // Sägeschnitt im Zuschnittplan (mm)
const MATERIAL={
  sperrholz:{name:'Sperrholz / Schichtholz',dicken:[4,6,8,10,12,15]},
  mdf:{name:'MDF',dicken:[6,8,10,12,16,19]},
  massiv:{name:'Massivholz-Brett',dicken:[12,15,18,20]}};
const SCHARNIERE=[[20,16],[25,19],[30,24],[40,30]];   // Kleinscharniere Messing: Länge × offen (mm)
const LAENGEN={2.5:[12,16,20,25],3:[12,16,20,25,30,35,40],3.5:[16,20,25,30,35,40,45,50],4:[20,25,30,35,40,45,50,60,70],4.5:[25,30,35,40,45,50,60,70,80]};
const S={l:30,b:20,h:8,mass:'aussen',mat:'sperrholz',d:8,boden:'unter',aussen:'lang',deckel:'nein',zu:'haken'};
const GRENZEN={l:[4,120],b:[4,120],h:[2,80],d:[3,30]};
const SP=Planer.speicher(KEY);
{ const g=SP.lies(); if(g&&typeof g==='object') for(const k in S) if(g[k]!==undefined) S[k]=g[k]; }
try{ const u=new URL(location.href).searchParams;
  ['l','b','h','d'].forEach(k=>{ if(u.has(k)&&!isNaN(parseFloat(u.get(k)))) S[k]=parseFloat(u.get(k)); });
  [['mass',['aussen','innen']],['mat',Object.keys(MATERIAL)],['boden',['unter','zwischen']],['aussen',['lang','kurz']],['deckel',['nein','ja','scharnier','nut']],['zu',['haken','magnet']]].forEach(([k,w])=>{ if(w.includes(u.get(k))) S[k]=u.get(k); });
}catch(e){}
for(const k in GRENZEN){ const [lo,hi]=GRENZEN[k]; S[k]=Math.min(hi,Math.max(lo,+S[k]||lo)); }
if(!MATERIAL[S.mat]) S.mat='sperrholz';
function speichern(){ SP.schreibe(S); }

// ---------- Schraube, Bohrer, Vorbohren ----------
// Durchmesser nach Kantendicke (die Kante soll gut doppelt so dick sein wie die Schraube), Länge ≈ 3 × Dicke:
// einmal durch das Brett, zweimal die Dicke in die Kante hinein. Vorbohren 1 mm dünner als die Schraube.
function schraube(d,maxEin){
  if(d<6) return {ok:false};
  const dm=d<8?2.5:d<12?3:d<15?3.5:d<18?4:4.5;
  const ls=LAENGEN[dm], ziel=3*d;
  let len=ls.find(x=>x>=ziel)||ls[ls.length-1], kurz=false;
  if(maxEin!=null&&len-d>maxEin){            // in die Kante passen nur maxEin mm: kürzere Schraube nehmen
    const k=ls.filter(x=>x-d<=maxEin); if(!k.length) return {ok:false,zuLang:true};
    len=k[k.length-1]; kurz=true;
  }
  return {ok:true,dm,len,loch:dm,vor:Math.round((dm-1)*10)/10,senk:2*dm,ein:len-d,tiefe:len-d+2,ziel,kurz,laengste:len<ziel&&!kurz};
}
// Schraubenstellen auf einer Kante der Länge len: vom Rand e weg, dazwischen gleichmässig etwa ab mm (10–15 × Schraubendicke).
function stellen(len,e,ab){
  if(len<2*e+10) return [Math.round(len/2)];
  const k=Math.max(1,Math.round((len-2*e)/ab)), a=(len-2*e)/k, p=[];
  for(let i=0;i<=k;i++) p.push(Math.round(e+i*a));
  return p;
}

// ---------- Rechnen ----------
function rechnen(){
  const d=S.d, innen=S.mass==='innen', unter=S.boden==='unter', langAussen=S.aussen==='lang';
  const L0=S.l*10,B0=S.b*10,H0=S.h*10;
  const La=innen?L0+2*d:L0, Ba=innen?B0+2*d:B0, Ha=innen?H0+d:H0;
  const Li=La-2*d, Bi=Ba-2*d, Hi=Ha-d;
  const hw=unter?Ha-d:Ha;                       // Wandhöhe
  const R={d,La,Ba,Ha,Li,Bi,Hi,hw,unter,langAussen,innen,fehler:false,deckel:(S.deckel==='scharnier'||S.deckel==='nut')&&d<8?'ja':S.deckel};   // Scharnier und Nut erst ab 8 mm Holz
  const geht=kurz=>{ R.fehler=true; R.kurz=kurz; if(R.deckel!=='nein') R.deckel='ja'; return R; };   // ohne Masse kein Scharnier und keine Nut zeichnen
  if(Li<20||Bi<20||Hi<5)return geht('⚠ Holz zu dick');
  const sc=schraube(d,unter?hw-3:undefined); R.sc=sc;   // von unten: die Schraube muss in der Wandkante bleiben
  if(sc.zuLang) return geht('⚠ Zu flach');
  const e=sc.ok?Math.max(Math.round(sc.len-d+8),Math.ceil(5*sc.dm)):20;    // Randabstand: Boden- und Eckschrauben kreuzen sich nie, und mindestens 5 × Schraube, sonst spaltet das Brettende
  const ab=sc.ok?12.5*sc.dm:50;                 // Abstand dazwischen: 10–15 × Schraube, zu eng spaltet, zu weit klafft
  R.e=e; R.ab=ab; R.diag=Math.round(Math.hypot(Li,Bi));   // Diagonale innen: gleich lang = rechtwinklig
  // Teile: Länge × Breite (mm), alle aus dem gleichen Holz
  const teile=[];
  teile.push({id:'boden',name:'Boden',n:1,l:unter?La:Li,b:unter?Ba:Bi});
  teile.push({id:'lang',name:'Längsseite',n:2,l:langAussen?La:Li,b:hw});
  teile.push({id:'kurz',name:'Stirnseite',n:2,l:langAussen?Bi:Ba,b:hw});
  const nutT=La>=400||Ba>=300?4:3, nutA=Math.max(4,Math.round(d/2));     // Deckeldicke = Nutbreite, Abstand der Nut von der Oberkante
  if(R.deckel==='nut'&&hw-nutA-nutT<d+10) R.deckel='ja';                    // zu flach für eine Nut
  let leisteB=0;
  if(R.deckel==='scharnier') teile.push({id:'deckel',name:'Deckel',n:1,l:La,b:Ba});
  if(R.deckel==='ja'){
    leisteB=sc.ok?Math.max(20,Math.ceil((sc.len-d+4)/5)*5):20;   // Leiste hochkant: so breit, dass die Schraube nicht durchkommt
    teile.push({id:'deckel',name:'Deckel',n:1,l:La,b:Ba});
    teile.push({id:'leiste',name:'Deckelleiste (hochkant)',n:2,l:Li-2,b:leisteB});
  }
  R.teile=teile; R.leisteB=leisteB;
  // Löcher pro Teil: {x,y} in mm vom linken bzw. unteren Rand des Teils, dazu Beschriftung
  const loecher={}; let anzahl=0;
  // Ecken: die Eckschraube kreuzt keine Bodenschraube, darum reichen oben und unten 5 × Schraube Rand – zwei Schrauben mindestens 10 × Schraube auseinander
  let ecken=stellen(hw,e,ab);
  if(sc.ok&&!(ecken.length>1&&ecken[1]-ecken[0]>=0.8*ab)){ const z=Math.min(0.8*ab,hw-10*sc.dm); if(z>=0.5*ab) ecken=[hw/2-z/2,hw/2+z/2].map(Math.round); }
  R.ecken=ecken;
  const aussenId=langAussen?'lang':'kurz', aussenTeil=teile.find(t=>t.id===aussenId), innenTeil=teile.find(t=>t.id===(langAussen?'kurz':'lang'));
  // Eckschrauben: durch die Aussenwand in die Kante der Innenwand, Reihe d/2 vom Wandende
  loecher[aussenId]=[]; ecken.forEach(y=>{ loecher[aussenId].push({x:d/2,y,art:'ecke'}); loecher[aussenId].push({x:aussenTeil.l-d/2,y,art:'ecke'}); });
  anzahl+=4*ecken.length;
  loecher[innenTeil.id]=[];
  const bodenStellen={};
  if(unter){
    // Bodenschrauben: durch den Boden hinauf in die Kanten der vier Wände
    const bo=teile.find(t=>t.id==='boden'); loecher.boden=[];
    const sl=langAussen?stellen(La,e,ab):stellen(Li,e,ab).map(x=>x+d);        // der Längsseite entlang (x)
    const sk=langAussen?stellen(Bi,e,ab).map(y=>y+d):stellen(Ba,e,ab);        // der Stirnseite entlang (y)
    sl.forEach(x=>{ loecher.boden.push({x,y:d/2,art:'boden'}); loecher.boden.push({x,y:Ba-d/2,art:'boden'}); });
    sk.forEach(y=>{ loecher.boden.push({x:d/2,y,art:'boden'}); loecher.boden.push({x:La-d/2,y,art:'boden'}); });
    bodenStellen.lang=sl; bodenStellen.kurz=sk; anzahl+=2*sl.length+2*sk.length;
  } else {
    // Boden zwischen den Wänden: durch jede Wand waagrecht in die Bodenkante, Reihe d/2 über der Unterkante
    const sl=langAussen?stellen(Li,e,ab).map(x=>x+d):stellen(Li,e,ab);
    const sk=langAussen?stellen(Bi,e,ab):stellen(Bi,e,ab).map(x=>x+d);
    sl.forEach(x=>loecher.lang.push({x,y:d/2,art:'boden'}));
    sk.forEach(x=>loecher.kurz.push({x,y:d/2,art:'boden'}));
    bodenStellen.lang=sl; bodenStellen.kurz=sk; anzahl+=2*sl.length+2*sk.length;
  }
  if(R.deckel==='ja'){
    // Deckelleisten: hochkant unter dem Deckel, 1 mm von der Innenwand weg; von oben durch den Deckel in die Leistenkante
    loecher.deckel=[]; const sd=stellen(Li-2,e,ab).map(x=>x+d+1), yl=d+1+d/2;
    sd.forEach(x=>{ loecher.deckel.push({x,y:yl,art:'deckel'}); loecher.deckel.push({x,y:Ba-yl,art:'deckel'}); });
    bodenStellen.deckel=sd; anzahl+=2*sd.length;
  }
  if(R.deckel==='scharnier'){
    // Längsseite hinten bekommt die Scharniere, vorn den Verschluss: darum zwei Bohrpläne
    const lt=teile.find(t=>t.id==='lang'), xl0=langAussen?0:d;
    lt.n=1; lt.name='Längsseite vorn';
    teile.splice(teile.indexOf(lt)+1,0,{id:'hinten',name:'Längsseite hinten',n:1,l:lt.l,b:lt.b});
    loecher.hinten=loecher.lang.map(h=>({...h}));
    // Scharniere hinten aufgeschraubt, Gelenk auf der Fuge: ein Lappen auf der Wand, einer auf der Deckelkante (Lappen nicht breiter als das Holz)
    const [Lh,Wh]=[...SCHARNIERE].reverse().find(([,w])=>w/2<=d)||SCHARNIERE[0], lap=Wh/2;
    const a=Math.max(Math.round(La/5),Lh/2+d+10), mitten=La>=2*a+Lh?[a,La-a]:[La/2];
    const ss=d>=12?10:d>=10?8:6;
    R.scharnier={Lh,Wh,lap,mitten,ss};
    loecher.deckel=[];
    mitten.forEach(c=>[c-Lh/4,c+Lh/4].forEach(x=>{ loecher.hinten.push({x:x-xl0,y:hw-lap/2,art:'scharnier'}); loecher.deckel.push({x,y:Ba,art:'scharnier'}); }));
    // Verschluss vorn in der Mitte: Magnet in Wandkante und Deckel (ab 10 mm), sonst Sturmhaken mit Öse
    R.zu=S.zu==='magnet'&&d>=10?'magnet':'haken';
    if(R.zu==='magnet'){ loecher.lang.push({x:La/2-xl0,y:hw,art:'magnet'}); loecher.deckel.push({x:La/2,y:d/2,art:'magnet'}); }
    else { const Lk=hw>=60?40:30, yo=Math.round(Math.max(hw/2,hw-Lk+d/2+4)); R.haken={Lk,yo};
      loecher.lang.push({x:La/2-xl0,y:yo,art:'haken'}); loecher.deckel.push({x:La/2,y:0,art:'haken'}); }
  }
  if(R.deckel==='nut'){
    // Schiebedeckel aus dünnem Sperrholz: Nut mit der Kreissäge innen durch beide Längsseiten und die linke Stirnseite.
    // Die rechte Stirnseite reicht nur bis unter die Nut, dort schiebt man den Deckel hinein.
    const tn=Math.min(5,Math.floor(d/2)), hT=hw-nutA-nutT;
    const kt=teile.find(t=>t.id==='kurz'); kt.n=1; kt.name='Stirnseite links';
    teile.splice(teile.indexOf(kt)+1,0,{id:'tief',name:'Stirnseite rechts',n:1,l:kt.l,b:hT});
    loecher.tief=loecher.kurz.filter(h=>h.y<=hT-d/2).map(h=>({...h}));
    anzahl-=loecher.kurz.length-loecher.tief.length;
    const Ld=La-d+tn-1, Bd=Ba-2*d+2*tn-1;                                 // 1 mm Luft in der Länge, je 0,5 mm in der Breite
    teile.push({id:'deckel',name:'Schiebedeckel',n:1,l:Ld,b:Bd,dick:nutT});
    R.nut={t:nutT,tn,a:nutA,hT,Ld,Bd,out:Math.round(Math.min(La*0.3,Ld*0.4))};
  }
  R.loecher=loecher; R.anzahl=anzahl; R.bodenStellen=bodenStellen;
  teile.forEach((t,i)=>{ t.z=Planer.teil(i); });
  R.zuschnitt=zuschnitt(teile.filter(t=>!t.dick));   // der dünne Schiebedeckel kommt aus einer anderen Platte
  return R;
}

// ---------- Zuschnittplan: Teile in Reihen auf eine Platte legen, schmalste Platte mit der kleinsten Fläche ----------
function zuschnitt(teile){
  const st=[]; teile.forEach(t=>{ for(let i=0;i<t.n;i++) st.push({name:t.name,z:t.z,w:t.l,h:t.b}); });
  const cands=new Set();
  const lang=st.map(p=>Math.max(p.w,p.h)).sort((a,b)=>b-a); let acc=0; lang.forEach(w=>{ acc+=w+KERF; cands.add(acc-KERF); });
  const kurz=st.map(p=>Math.min(p.w,p.h)).sort((a,b)=>b-a); acc=0; kurz.forEach(w=>{ acc+=w+KERF; cands.add(acc-KERF); });
  st.forEach(p=>{ cands.add(p.w); cands.add(p.h); });
  const masse=[...new Set(st.flatMap(p=>[p.w,p.h]))];
  masse.forEach(a=>masse.forEach(b=>{ cands.add(a+KERF+b); masse.forEach(c=>cands.add(a+KERF+b+KERF+c)); }));
  const alle=[];
  for(const W of cands){ const r=packen(st,W); if(r) alle.push({W,H:r.H,area:W*r.H,teile:r.plaet}); }
  const minA=Math.min(...alle.map(a=>a.area));
  const gut=alle.filter(a=>a.area<=minA*1.08);
  gut.sort((a,b)=>Math.max(a.W,a.H)-Math.max(b.W,b.H)||a.area-b.area);
  return gut[0];
}
function packen(st,W){
  const items=[];
  for(const p of st){ let w=Math.max(p.w,p.h),h=Math.min(p.w,p.h); if(w>W+0.01){ [w,h]=[h,w]; if(w>W+0.01) return null; } items.push({name:p.name,z:p.z,w,h}); }
  items.sort((a,b)=>b.h-a.h||b.w-a.w);
  const reihen=[], plaet=[]; let y=0;
  for(const it of items){
    let r=reihen.find(s=>s.x+it.w<=W+0.01&&it.h<=s.h+0.01);
    if(!r){ const q=reihen.find(s=>s.x+it.h<=W+0.01&&it.w<=s.h+0.01); if(q){ r=q; [it.w,it.h]=[it.h,it.w]; } }
    if(!r){ r={x:0,y,h:it.h}; reihen.push(r); y+=it.h+KERF; }
    plaet.push({name:it.name,z:it.z,w:it.w,h:it.h,x:r.x,y:r.y}); r.x+=it.w+KERF;
  }
  return {H:y-KERF,plaet};
}

// ---------- Zeichnen ----------
const K=0.42;                                              // Schrägbild: Tiefe halb so lang, schräg nach hinten
const P=(x,y,z)=>[x+K*y, -(z+K*y)];
const pt=(x,y,z)=>{ const [a,b]=P(x,y,z); return `${a.toFixed(1)},${b.toFixed(1)}`; };
const pts=a=>a.map(p=>pt(...p)).join(' ');
const poly=(p,fill,lw)=>`<polygon points="${pts(p)}" fill="${fill}" stroke="#4a3a2a" stroke-width="${lw}" stroke-linejoin="round"/>`;
// Jedes Brett ist ein Quader q=[x0,x1,y0,y1,z0,z1] (mm). dick = Achse der Brettdicke (0 x, 1 y, 2 z), innen = man sieht die Innenseite.
// Löcher {p:[x,y,z]} gehen durch die Dicke; gezeichnet werden sie auf der sichtbaren Fläche.
const FARBE={flaeche:['#C99A5B','#E9C99A','#EFD3A8'],kante:['#DDB57E','#F3DDB7','#F7E6C8'],innen:['#B98A50','#D9B98A','#E3C59A']};
const MESSING=['#B8902F','#D9B24A','#EBCB6A'];
// Kreis in einer Ebene: a = Achse senkrecht dazu, fl = Lage der Ebene, (u,v) Mitte in den zwei anderen Achsen
function kreis(a,fl,u,v,r){ const ring=[];
  for(let k=0;k<16;k++){ const w=k/16*2*Math.PI, cu=u+r*Math.cos(w), cv=v+r*Math.sin(w); ring.push(a===0?[fl,cu,cv]:a===1?[cu,fl,cv]:[cu,cv,fl]); }
  return ring; }
function bretter(R,d){
  const {La,Ba,Ha,unter,langAussen}=R, z0=unter?d:0, L=R.loecher||{}, B=[];
  const xl0=langAussen?0:d, xl1=langAussen?La:La-d, yk0=langAussen?d:0, yk1=langAussen?Ba-d:Ba;
  const sicht=h=>h.art!=='magnet'&&h.art!=='scharnier';      // Magnet in der Kante und Scharnierlöcher hinten sieht man nicht
  const lang=(L.lang||[]).filter(sicht), hinten=(L.hinten||L.lang||[]).filter(sicht), kurz=L.kurz||[];
  // Nut: dunkler Streifen auf der Innenfläche, im Schnitt an den Brettenden
  const N=R.nut, zn=N?[Ha-N.a-N.t,Ha-N.a]:null;
  const nutX=(x,ya,yb)=>[[x,ya,zn[0]],[x,yb,zn[0]],[x,yb,zn[1]],[x,ya,zn[1]]], nutY=(y,xa,xb)=>[[xa,y,zn[0]],[xb,y,zn[0]],[xb,y,zn[1]],[xa,y,zn[1]]];
  B.push(unter?{q:[0,La,0,Ba,0,d],dick:2,loch:(L.boden||[]).map(h=>[h.x,h.y])}:{q:[d,La-d,d,Ba-d,0,d],dick:2,loch:[]});
  [[0,true],[Ba-d,false]].forEach(([y,vorn])=>B.push({q:[xl0,xl1,y,y+d,z0,Ha],dick:1,innen:!vorn,loch:(vorn?lang:hinten).map(h=>[xl0+h.x,z0+h.y]),
    nut:N?(vorn?[nutX(xl1,y+d-N.tn,y+d)]:[nutY(y,xl0,xl1),nutX(xl1,y,y+N.tn)]):null}));
  [[0,true],[La-d,false]].forEach(([x,links])=>{ const tief=N&&!links;
    B.push({q:[x,x+d,yk0,yk1,z0,tief?z0+N.hT:Ha],dick:0,innen:links,loch:(tief?L.tief||[]:kurz).map(h=>[yk0+h.x,z0+h.y]),
      nut:N&&links?[nutX(x+d,yk0,yk1),nutY(yk0,x+d-N.tn,x+d)]:null}); });
  if(N){ const x1=La+N.out; B.push({q:[Math.max(d,x1-N.Ld),x1,d,Ba-d,zn[0],zn[1]],dick:2,loch:[]}); }   // Schiebedeckel, ein Stück herausgezogen
  return B;
}
// Malreihenfolge: was weiter hinten liegt, zuerst. Getrennte Quader sind auf einer Achse getrennt, und die sagt, welcher vorne ist.
function hinter(a,b){ const A=a.q,B=b.q;
  if(A[1]<=B[0]) return true; if(B[1]<=A[0]) return false;
  if(A[2]>=B[3]) return true; if(B[2]>=A[3]) return false;
  return A[5]<=B[4]; }
function bretterBild(B,o){
  const rest=[...B], reihe=[];
  while(rest.length){ const i=rest.findIndex(b=>!rest.some(c=>c!==b&&hinter(c,b))); reihe.push(rest.splice(i<0?0:i,1)[0]); }
  let s='';
  reihe.forEach(b=>{
    const [x0,x1,y0,y1,z0,z1]=b.q, pal=a=>(b.farbe||(a!==b.dick?FARBE.kante:b.innen?FARBE.innen:FARBE.flaeche))[a];
    s+=poly([[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]],pal(0),o.lw);
    s+=poly([[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]],pal(1),o.lw);
    s+=poly([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],pal(2),o.lw);
    (b.nut||[]).forEach(q=>{ s+=`<polygon points="${pts(q)}" fill="#5a4330"/>`; });
    // Löcher: Kreis in der Fläche, schräg gesehen
    const a=b.dick, fl=[x1,y0,z1][a], r=o.sr;
    b.loch.forEach(([u,v])=>{ s+=`<polygon points="${pts(kreis(a,fl,u,v,r))}" fill="#fff" stroke="#4a3a2a" stroke-width="${o.thin}"/>`; });
  });
  return s;
}
// Der Kistenkörper, gleich für Bildschirm und Druck: o.lw Kanten, o.thin Lochrand, o.sr Lochradius
function kistenKoerper(R,o){
  const d=Math.max(0.5,Math.min(R.d,R.La/2-1,R.Ba/2-1,R.Ha-1));      // bei zu dickem Holz trotzdem eine Kiste zeichnen
  return bretterBild(bretter(R,d),o);
}
// Druckbild mit Massen
function kistenBild(R){
  const {La,Ba,Ha}=R;
  let s=kistenKoerper(R,{lw:.6,thin:.5,sr:Math.max(1.2,La/120)});
  const Sch=R.scharnier;
  if(Sch) s+=bretterBild([{q:[0,La,Ba,Ba+R.d,Ha,Ha+Ba],dick:1,loch:[]},...Sch.mitten.map(c=>({q:[c-Sch.Lh/2,c+Sch.Lh/2,Ba-1.6,Ba+1.6,Ha-1.6,Ha+1.6],dick:2,farbe:MESSING,loch:[]}))],{lw:.6,thin:.5,sr:0});
  const fs=Math.max(5,(La+Ba)/22);
  const m=(p1,p2,text,dx,dy,rot)=>{ const [a1,b1]=P(...p1),[a2,b2]=P(...p2); const cx=(a1+a2)/2+dx, cy=(b1+b2)/2+dy;
    return `<path class="mass" d="M${a1.toFixed(1)},${b1.toFixed(1)} L${a2.toFixed(1)},${b2.toFixed(1)}"/><text class="masst" font-size="${fs}" x="${cx.toFixed(1)}" y="${cy.toFixed(1)}" text-anchor="middle"${rot?` transform="rotate(${rot} ${cx.toFixed(1)} ${cy.toFixed(1)})"`:''}>${esc(text)}</text>`; };
  const ab=fs*1.6;
  s+=m([0,0,-ab],[La,0,-ab],`${cmT(La)} lang`,0,fs*1.1,0);
  s+=m([La+ab,0,0],[La+ab,Ba,0],`${cmT(Ba)} breit`,fs*2.2,fs*0.4,-40);
  s+=m([-ab,0,0],[-ab,0,Ha],`${cmT(Ha)} hoch`,-fs*0.6,0,-90);
  const xs=[-ab-fs*2.5, La+K*Ba+fs*4+(R.nut?R.nut.out:0)], ys=[-(Ha+K*Ba+(Sch?Ba+K*R.d:0))-fs, ab+fs*2.5];
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${xs[0].toFixed(1)} ${ys[0].toFixed(1)} ${(xs[1]-xs[0]).toFixed(1)} ${(ys[1]-ys[0]).toFixed(1)}" role="img" aria-label="Kiste ${cmT(La)} × ${cmT(Ba)} × ${cmT(Ha)}">${s}</svg>`;
}

// ---------- Die Kiste zum Anfassen ----------
// Einheiten im SVG sind mm; u = mm pro Bildschirmpixel, damit Griffe und Schrift immer gleich gross bleiben.
const RAND={l:54,r:86,t:50,b:60};               // Platz in px rund um die Kiste für Masspfeile und Griffe
const NAMEN={l:'Länge',b:'Breite',h:'Höhe'};
const OR='#E8772E';
const MFARBE={l:'#1F6FB8',b:'#1E8A5A',h:'#B8449A'};   // Pfeil, Zahl, Griff, Kante und Feld eines Masses
const deckelLuft=R=>(R.leisteB||20)+Math.max(15,R.Ha*0.15);
function einpassen(R){
  const sw=$('flaeche').clientWidth||600;
  const sch=R.deckel==='scharnier';
  const top=R.Ha+(R.deckel==='ja'?deckelLuft(R)+R.d:sch?R.Ba+K*R.d+8:0);
  const gw=R.La+K*(R.Ba+(sch?R.d:0))+(R.nut?R.nut.out:0), gh=top+K*R.Ba, gy0=-gh;
  const schmal=innerWidth<=860, shMax=schmal?Math.max(200,innerHeight*0.46):Math.min(560,Math.max(260,innerHeight*0.6));   // schmal haftet die Vorschau: fester Rahmen, der nie mehr als knapp die halbe Höhe braucht
  const u=Math.max(gw/Math.max(80,sw-RAND.l-RAND.r), gh/(shMax-RAND.t-RAND.b));
  const hpx=schmal?Math.min(shMax,gh/u+RAND.t+RAND.b):Math.max(240,gh/u+RAND.t+RAND.b);
  const ex=(sw-RAND.l-RAND.r-gw/u)/2, ey=(hpx-RAND.t-RAND.b-gh/u)/2;
  return {u, x:-(RAND.l+ex)*u, y:gy0-(RAND.t+ey)*u, w:sw*u, h:hpx*u};
}
function liveBild(R,A){
  const {La,Ba,Ha}=R, d=R.d, u=A.u, f=v=>v.toFixed(1), us=u.toFixed(4);
  const klemm=(x,y,r)=>[Math.min(A.x+A.w-r*u,Math.max(A.x+r*u,x)), Math.min(A.y+A.h-r*u,Math.max(A.y+r*u,y))];
  let s=kistenKoerper(R,{lw:1.3*u,thin:u,sr:Math.max(3*u,La/120)});
  // Antippen: Wände (Umriss) und Boden (nur der Teil, den man durch die Öffnung sieht)
  const dd=Math.max(0.5,Math.min(d,La/2-1,Ba/2-1));
  const sil=[[0,0,0],[La,0,0],[La,Ba,0],[La,Ba,Ha],[0,Ba,Ha],[0,0,Ha]];
  const oeff=[[dd,dd,Ha],[La-dd,dd,Ha],[La-dd,Ba-dd,Ha],[dd,Ba-dd,Ha]], bod=[[dd,dd,dd],[La-dd,dd,dd],[La-dd,Ba-dd,dd],[dd,Ba-dd,dd]];
  // Bei hohen Kisten ist der Boden ganz verdeckt: dann bleibt die untere Kante zum Antippen
  const bz=Math.min(Ha,Math.max(d,14*u)), kante=[[0,0,0],[La,0,0],[La,Ba,0],[La,Ba,bz],[La,0,bz],[0,0,bz]];
  s+=`<clipPath id="oeff"><polygon points="${pts(oeff)}"/></clipPath>`;
  if(wahl==='wand') s+=`<polygon points="${pts(sil)}" fill="none" stroke="${OR}" stroke-width="${3*u}" stroke-linejoin="round"/><polygon points="${pts(oeff)}" fill="none" stroke="${OR}" stroke-width="${2*u}"/>`;
  if(wahl==='boden') s+=`<polygon points="${pts(bod)}" clip-path="url(#oeff)" fill="${OR}" fill-opacity=".22" stroke="${OR}" stroke-width="${4*u}" stroke-linejoin="round"/><polygon points="${pts(kante)}" fill="${OR}" fill-opacity=".22" stroke="${OR}" stroke-width="${3*u}" stroke-linejoin="round"/>`;
  s+=`<polygon points="${pts(sil)}" fill="transparent" data-t="wand"><title>Wände</title></polygon><g data-t="boden"><polygon points="${pts(bod)}" clip-path="url(#oeff)" fill="transparent"/><polygon points="${pts(kante)}" fill="transparent"/><title>Boden</title></g>`;
  // Deckel schwebt über der Kiste, die Leisten hängen darunter
  let zl=0;
  const metall=(ring,lw)=>`<polygon points="${pts(ring)}" fill="#8E979F" stroke="#3a3f45" stroke-width="${lw}"/>`;
  const draht=d2=>`<path d="${d2}" fill="none" stroke="#4d535a" stroke-width="${1.8*u}" stroke-linecap="round" stroke-linejoin="round"/>`;
  if(R.deckel==='scharnier'){
    const zt=Ha+Ba, yb=Ba+d, Sch=R.scharnier, lw=1.3*u, ys=Ba-0.6;
    // Bogen mit Pfeil: so klappt der Deckel zu
    const bog=[]; for(let k=16;k>=1;k--){ const w=k/16*Math.PI/2; bog.push(pt(La,Ba-Ba*Math.cos(w),Ha+d+(Ba-d)*Math.sin(w))); }
    const [ta,tb]=P(La,0,Ha+d);
    let g=`<path d="M${bog.join(' L')}" fill="none" stroke="#8a7a6a" stroke-width="${1.2*u}" stroke-dasharray="${4*u} ${3*u}"/><path d="M${f(ta-4*u)},${f(tb-8*u)} L${f(ta)},${f(tb)} L${f(ta+4*u)},${f(tb-8*u)}" fill="none" stroke="#8a7a6a" stroke-width="${1.4*u}" stroke-linejoin="round"/>`;
    g+=bretterBild([{q:[0,La,Ba,yb,Ha,zt],dick:1,loch:[]}],{lw,thin:u,sr:Math.max(3*u,La/120)});
    if(R.zu==='magnet') g+=metall(kreis(1,ys,La/2,zt-d/2,3),u);
    else { const Lk=R.haken.Lk, x=La/2, z1=zt-Lk+6;
      const bo=[]; for(let k=0;k<=8;k++){ const w=Math.PI+k/8*Math.PI; bo.push(pt(x+2.5+2.5*Math.cos(w),ys,z1+2.5*Math.sin(w))); }
      g+=`<polygon points="${pts(kreis(1,ys,x,zt+2.6,2.2))}" fill="none" stroke="#4d535a" stroke-width="${1.6*u}"/>`+draht(`M${pt(x,ys,zt+0.4)} L${pt(x,ys,z1)} L${bo.join(' L')} L${pt(x+5,ys,z1+2.5)}`); }
    // Scharniere: Gelenk auf der Fuge hinten
    const k=Math.max(1.6,2.2*u);
    g+=bretterBild(Sch.mitten.map(c=>({q:[c-Sch.Lh/2,c+Sch.Lh/2,Ba-k,Ba+k,Ha-k,Ha+k],dick:2,farbe:MESSING,loch:[]})),{lw:u,thin:u,sr:0});
    if(wahl==='deckel') g+=`<polygon points="${pts([[0,Ba,Ha],[La,Ba,Ha],[La,yb,Ha],[La,yb,zt],[0,yb,zt],[0,Ba,zt]])}" fill="none" stroke="${OR}" stroke-width="${3*u}" stroke-linejoin="round"/>`;
    s+=`<g data-t="deckel">${g}<title>Deckel</title></g>`;
    // Gegenstück an der Kiste: Magnet in der Wandkante oder Öse vorn
    s+=R.zu==='magnet'?metall(kreis(2,Ha,La/2,d/2,3),u):`<polygon points="${pts(kreis(1,0,La/2,(R.unter?d:0)+R.haken.yo,2.4))}" fill="none" stroke="#4d535a" stroke-width="${1.6*u}"/>`;
  }
  if(R.deckel==='nut'){
    const N=R.nut, x1=La+N.out, x0=Math.max(La-d,x1-N.Ld), za=Ha-N.a-N.t, zb=Ha-N.a;
    const um=[[x0,d,za],[x1,d,za],[x1,Ba-d,za],[x1,Ba-d,zb],[x0,Ba-d,zb],[x0,d,zb]];
    const pl=Math.min(N.out*0.8,La*0.25), [p1,q1]=P(x1+6+pl,Ba/2,zb), [p2,q2]=P(x1+6,Ba/2,zb);
    s+=`<path d="M${f(p1)},${f(q1)} L${f(p2)},${f(q2)} M${f(p2+6*u)},${f(q2-5*u)} L${f(p2)},${f(q2)} L${f(p2+6*u)},${f(q2+5*u)}" fill="none" stroke="#8a7a6a" stroke-width="${1.6*u}" stroke-linecap="round" stroke-linejoin="round"/>`;
    if(wahl==='deckel') s+=`<polygon points="${pts(um)}" fill="none" stroke="${OR}" stroke-width="${3*u}" stroke-linejoin="round"/>`;
    s+=`<polygon points="${pts(um)}" fill="transparent" data-t="deckel"><title>Deckel</title></polygon>`;
  }
  if(R.deckel==='ja'){
    zl=Ha+deckelLuft(R); const lb=R.leisteB||20, x0=d+1, x1=La-d-1, lw=1.3*u;
    let g=`<path d="M${pt(0,0,Ha)} L${pt(0,0,zl)} M${pt(La,0,Ha)} L${pt(La,0,zl)} M${pt(La,Ba,Ha)} L${pt(La,Ba,zl)}" fill="none" stroke="#8a7a6a" stroke-width="${u}" stroke-dasharray="${4*u} ${3*u}"/>`;
    const DB=[{q:[0,La,0,Ba,zl,zl+d],dick:2,loch:((R.loecher||{}).deckel||[]).map(h=>[h.x,h.y])}];
    if(x1>x0) [d+1,Ba-2*d-1].forEach(y=>DB.push({q:[x0,x1,y,y+d,zl-lb,zl],dick:1,loch:[]}));
    g+=bretterBild(DB,{lw,thin:u,sr:Math.max(3*u,La/120)});
    if(wahl==='deckel') g+=`<polygon points="${pts([[0,0,zl],[La,0,zl],[La,Ba,zl],[La,Ba,zl+d],[0,Ba,zl+d],[0,0,zl+d]])}" fill="none" stroke="${OR}" stroke-width="${3*u}" stroke-linejoin="round"/>`;
    s+=`<g data-t="deckel">${g}<title>Deckel</title></g>`;
  }
  // Masspfeile: aussen an den Aussenkanten, innen zwischen den Innenwänden. Zahl und Griff bleiben am selben Ort.
  const innen=S.mass==='innen';
  const ab=24*u, tk=6*u;
  const linie=(a,b)=>`M${f(a[0])},${f(a[1])} L${f(b[0])},${f(b[1])}`;
  const zieh=(k,x,y,rot)=>{ const [a,b]=klemm(x,y,16), [lo,hi]=GRENZEN[k];
    return `<g class="zieh" data-achse="${k}" tabindex="0" role="slider" aria-label="${NAMEN[k]}" aria-valuemin="${lo}" aria-valuemax="${hi}" aria-valuenow="${S[k]}" aria-valuetext="${n(S[k])} cm" transform="translate(${f(a)} ${f(b)}) scale(${us})"><circle r="24" fill="transparent"/><circle class="ring" r="14" fill="${MFARBE[k]}" stroke="#fff" stroke-width="2.5"/><path d="M-7 0h14M-3.5-3.5L-7 0l3.5 3.5M3.5-3.5L7 0l-3.5 3.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(${rot})"/><title>${NAMEN[k]}</title></g>`; };
  const spitze=(k,p,q)=>{ const w=Math.atan2(q[1]-p[1],q[0]-p[0]), l=9*u, e=t=>`${f(p[0]+l*Math.cos(w+t))},${f(p[1]+l*Math.sin(w+t))}`;
    return `<path d="M${e(.42)} L${f(p[0])},${f(p[1])} L${e(-.42)} Z" fill="${MFARBE[k]}" stroke="${MFARBE[k]}" stroke-width="${f(.6*u)}" stroke-linejoin="round"/>`; };
  const pfeil=(k,a,b,hilf)=>`<g data-pfeil="${k}" data-lage="${innen?'innen':'aussen'}">${innen?`<path d="${linie(a,b)}" stroke="#fff" stroke-width="${f(4.5*u)}" opacity=".85"/>`:''}<path d="${hilf||''}" stroke="${MFARBE[k]}" stroke-width="${f(u)}" opacity=".55"/><path d="${linie(a,b)}" stroke="${MFARBE[k]}" stroke-width="${f(innen?2*u:1.6*u)}"/>${spitze(k,a,b)}${spitze(k,b,a)}</g>`;
  const B0=P(La,0,0), B1=P(La,Ba,0), Bp=p=>[p[0]+40*u,p[1]+30*u];
  const gl=[La+20*u,ab], gh=[-ab,-Ha-22*u], gb=[Bp(B1)[0]+15*u,Bp(B1)[1]-15*u];
  // Kante, die zum Mass gehört: leuchtet, solange das Feld offen ist oder gezogen wird
  const KANTE=innen?{l:[[dd,dd,Ha],[La-dd,dd,Ha]],b:[[La-dd,dd,Ha],[La-dd,Ba-dd,Ha]],h:[[dd,Ba-dd,dd],[dd,Ba-dd,Ha]]}:{l:[[0,0,0],[La,0,0]],b:[[La,0,0],[La,Ba,0]],h:[[0,0,0],[0,0,Ha]]};
  const kante2=k=>`M${pt(...KANTE[k][0])} L${pt(...KANTE[k][1])}`;
  const glut=feld||(drag&&drag.k);
  let m='';
  if(glut) m+=`<g data-glut="${glut}" stroke="${MFARBE[glut]}" stroke-linecap="round"><path class="glut" d="${kante2(glut)}" stroke-width="${f(10*u)}" opacity=".3"/><path d="${kante2(glut)}" stroke-width="${f(3.5*u)}"/></g>`;
  puls.filter(k=>k!==glut).forEach(k=>{ m+=`<path class="pl-kante" d="${kante2(k)}" style="stroke:${MFARBE[k]};stroke-width:${f(3*u)}"/>`; });
  if(innen){
    m+=pfeil('l',P(dd,Ba/2,Ha),P(La-dd,Ba/2,Ha));
    m+=pfeil('b',P(La/2,dd,Ha),P(La/2,Ba-dd,Ha));
    m+=pfeil('h',P(dd,Ba-dd,dd),P(dd,Ba-dd,Ha));
  }else{
    m+=pfeil('l',[0,ab],[La,ab],`${linie([0,4*u],[0,ab+tk])} ${linie([La,4*u],[La,ab+tk])}`);
    m+=pfeil('h',[-ab,0],[-ab,-Ha],`${linie([-4*u,0],[-ab-tk,0])} ${linie([-4*u,-Ha],[-ab-tk,-Ha])}`);
    const lang=p=>[p[0]+48*u,p[1]+36*u];
    m+=pfeil('b',Bp(B0),Bp(B1),`${linie(B0,lang(B0))} ${linie(B1,lang(B1))}`);
  }
  s+=`<g fill="none" pointer-events="none">${m}</g>`;
  // Masszahl als Knopf: öffnet das Feld direkt am Mass
  const pille=(k,x,y,rot)=>{ const txt=`${n(S[k])} cm`, w=Math.max(50,txt.length*8.6+18), an=feld===k, c=MFARBE[k], hit=Math.max(76,w+8);
    const a=Math.min(A.x+A.w-(rot?20:hit/2)*u,Math.max(A.x+(rot?20:hit/2)*u,x)), b=Math.min(A.y+A.h-(rot?hit/2:20)*u,Math.max(A.y+(rot?hit/2:20)*u,y));
    return `<g class="massz" data-feld="${k}" tabindex="0" role="button" aria-label="${NAMEN[k]} ${txt}" aria-expanded="${an}" transform="translate(${f(a)} ${f(b)}) scale(${us})${rot?` rotate(${rot})`:''}"><rect x="${-hit/2}" y="-24" width="${hit}" height="48" fill="transparent"/><rect class="pille" x="${(-w/2).toFixed(1)}" y="-14" width="${w.toFixed(1)}" height="28" rx="14" fill="${an?c:'#fff'}" stroke="${c}" stroke-width="2"/><text y="5.5" text-anchor="middle" font-size="16" fill="${an?'#fff':c}">${txt}</text><title>${NAMEN[k]}</title></g>`; };
  // Auf kurzen Pfeilen rückt die Zahl vom Griff weg
  const bm=[(Bp(B0)[0]+Bp(B1)[0])/2,(Bp(B0)[1]+Bp(B1)[1])/2], bNah=Math.hypot(bm[0]-gb[0],bm[1]-gb[1])<64*u;
  s+=pille('l',Math.min(La/2,gl[0]-64*u),ab)+pille('h',-ab,Math.max(-Ha/2,gh[1]+64*u),-90)+pille('b',bNah?gb[0]-8*u:bm[0],bNah?gb[1]-62*u:bm[1]);
  // Griffe an den Teilen (wie im Stromkreis: runde Knöpfe direkt daneben)

    return `<g class="griff" data-griff="${act}" tabindex="0" role="button" aria-label="${titel}"${an===undefined?'':` aria-pressed="${!!an}"`} transform="translate(${f(a)} ${f(b)}) scale(${us})"><circle r="20" fill="transparent"/><circle r="13" fill="${rot?'#B3412A':an?OR:'#fff'}" stroke="${hell?'#fff':'#1F1A17'}" stroke-width="2.5"/><path d="${icon}" fill="none" stroke="${hell?'#fff':'#1F1A17'}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><title>${titel}</title></g>`; };
  let g='';
  if(wahl==='wand'){
    // Die Holzdicke gilt für alle Bretter und steht oben bei den mm; hier nur die Ecke tauschen, direkt an der Ecke
    const [ka,kb]=P(La,0,Ha/2);
    g+=griff('ecken',ka,kb,'M-6-3h11l-3-3M6 3h-11l3 3',S.aussen==='lang'?'Stirnseiten aussen':'Längsseiten aussen');
  }
  if(wahl==='boden'){
    const [bx,by]=P(La/2,Ba/2,d), mitte=-(Ha+Ha+K*Ba)/2, sichtbar=by<-Ha;
    g+=griff('boden',bx,sichtbar?Math.min(by,mitte):-bz-22*u,'M-3.5-7v14M-6.5 4l3 3 3-3M3.5 7v-14M.5-4l3-3 3 3',S.boden==='unter'?'Boden zwischen die Wände':'Boden unter die Wände');
  }
  if(R.deckel==='ja'&&wahl==='deckel'){ const [a,b]=P(La,0,zl+d); g+=griff('deckelweg',a+10*u,b-10*u,'M-5-5l10 10M5-5l-10 10','Deckel weg',true); }
  if(R.deckel==='nut'&&wahl==='deckel'){ const [a,b]=P(La+R.nut.out,0,Ha); g+=griff('deckelweg',a+14*u,b-14*u,'M-5-5l10 10M5-5l-10 10','Deckel weg',true); }
  if(R.deckel==='scharnier'&&wahl==='deckel'){
    const [a,b]=P(La,Ba+d,Ha+Ba); g+=griff('deckelweg',a+10*u,b-10*u,'M-5-5l10 10M5-5l-10 10','Deckel weg',true);
    if(d>=10){ const [c,e]=P(La/2,Ba+d/2,Ha+Ba);
      g+=griff('haken',c-17*u,e-28*u,'M-2-7.5a2 2 0 1 0 .01 0M-2-3.5v7a3 3 0 0 0 6 0v-1.5','Haken',false,R.zu==='haken');
      g+=griff('magnet',c+17*u,e-28*u,'M-5-6v5a5 5 0 0 0 10 0v-5M-7-4h4M3-4h4','Magnet',false,R.zu==='magnet'); }
  }
  if(R.deckel==='nein'){ const [a,b]=P(La/2,Ba,Ha); g+=griff('deckel',a,b-26*u,'M-7-3h14M-7-3v-3h14v3M0 0v7M-3.5 3.5h7','Deckel dazu'); }
  s+=g;
  s+=zieh('l',...gl,0)+zieh('h',...gh,90)+zieh('b',...gb,-45);
  return s;
}
// Bohrplan eines Teils: Rechteck mit allen Löchern, Masse vom linken und vom unteren Rand
function bohrplan(R,t){
  const L=R.loecher[t.id]||[]; const w=t.l,h=t.b;
  const fs=Math.max(3.5,Math.max(w,h)/30), rand=fs*4.2;
  let s=`<rect x="0" y="0" width="${w}" height="${h}" fill="#F3E2C6" stroke="#4a3a2a" stroke-width="${fs/10}"/>`;
  if(R.nut&&(t.id==='lang'||t.id==='kurz')){ const N=R.nut;
    s+=`<rect x="0" y="${N.a}" width="${w}" height="${N.t}" fill="#9A6B2F" fill-opacity=".5"/>`;
    s+=`<text class="t" font-size="${fs*0.8}" x="${w/2}" y="${N.a+N.t+fs*0.95}" text-anchor="middle" fill="#7a4f1f">Nut ${n(N.t)} × ${n(N.tn)}</text>`;
    s+=`<text class="t" font-size="${fs}" x="${-fs*0.5}" y="${N.a+N.t+fs*0.35}" text-anchor="end" fill="#7a4f1f">${n(N.hT)}</text>`; }
  // Reihenlinien (d/2 vom Rand) gestrichelt
  const reihen=new Set(); L.forEach(p=>{ reihen.add('x'+p.x); reihen.add('y'+p.y); });
  const istReiheX=x=>L.filter(p=>p.x===x).length>1, istReiheY=y=>L.filter(p=>p.y===y).length>1;
  const gez=new Set();
  L.forEach(p=>{

function rechnung(R){

  const g=(bild,titel,zeilen)=>`<section class="rg"><h4><svg viewBox="0 0 44 30" aria-hidden="true">${RECH_BILD[bild]||FAKT_BILD[bild]}</svg>${titel}</h4>${zeilen.join('')}</section>`;
  const G=[];

    ?g('masse','Aussen',[z('Länge',`${n(R.Li)} + 2 × ${D}`,mm(R.La)),z('Breite',`${n(R.Bi)} + 2 × ${D}`,mm(R.Ba)),z('Höhe',`${n(R.Hi)} + ${D}`,mm(R.Ha))])

    z(kurzN,kurzF,mm(kurzL)),
    ...(R.unter?[z('Boden','= aussen',mm(R.La)),z('','',mm(R.Ba))]:[z('Boden',`${n(R.La)} − 2 × ${D}`,mm(R.Li)),z('',`${n(R.Ba)} − 2 × ${D}`,mm(R.Bi))])]));
  if(sc.ok){
    const pfeil=sc.kurz?`↓ ⚠ ${mm(R.hw)}`:sc.laengste?'↓ max.':'↑';

      z('Dicke',`${D} ≥ 2 × ${n(sc.dm)}`,mm(sc.dm)),
      z('Länge',`3 × ${D} = ${n(sc.ziel)} ${pfeil}`,mm(sc.len)),

      z('Durchgang','= Schraube',`⌀ ${n(sc.loch)} mm`),

      z('Senken',`2 × ${n(sc.dm)}`,`⌀ ${n(sc.senk)} mm`),
      z('Tiefe',`${sc.len} − ${D} + 2`,mm(sc.tiefe))]));

  G.push(g('winkel','Winkel',[z('Diagonale',`√(${n(R.Li)}² + ${n(R.Bi)}²)`,mm(R.diag))]));
  if(sc.ok){
    const Sch=R.scharnier;
    if(Sch){ const zs=[z('Scharnier',`Lappen ${n(Sch.lap)} ≤ ${D}`,`${Sch.Lh} × ${Sch.Wh} mm`),z('Schräubchen',`< ${D}`,`2 × ${Sch.ss} mm`)];
      if(R.zu==='magnet') zs.push(z('Holz hinter Magnet',`${D} − 6`,mm(d-6)));
      G.push(g('scharnier','Scharnier',zs)); }
    if(R.nut){ const N=R.nut;
      G.push(g('nut','Nut',[
        z('Tiefe',d/2>5?`${D} : 2, max. 5`:`${D} : 2`,mm(N.tn)),z('Breite','',mm(N.t)),z('Unter Kante','',mm(N.a)),
        z('Deckel',`${n(R.La)} − ${D} + ${n(N.tn)} − 1`,mm(N.Ld)),
        z('',`${n(R.Ba)} − 2 × ${D} + 2 × ${n(N.tn)} − 1`,mm(N.Bd)),
        z('Stirnseite rechts',`${n(R.hw)} − ${n(N.a)} − ${n(N.t)}`,mm(N.hT))])); }

    const zs=[z('Ecken',`4 × ${R.ecken.length}`,String(4*R.ecken.length)),
      z(R.unter?'Boden':'Wände',`2 × ${bs.lang.length} + 2 × ${bs.kurz.length}`,String(2*bs.lang.length+2*bs.kurz.length))];

}

function einbetten(html,x,y,w,h){ const m=/viewBox="([-\d.]+) ([-\d.]+) ([-\d.]+) ([-\d.]+)"/.exec(html); if(!m) return ''; const [vx,vy,vw,vh]=m.slice(1).map(Number), k=Math.min(w/vw,h/vh), inn=html.replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'');
  return `<g transform="translate(${(x+(w-vw*k)/2-vx*k).toFixed(2)} ${(y-vy*k).toFixed(2)}) scale(${k.toFixed(4)})">${inn}</g>`; }
const zeilen=(x,y,w,n2,ab=7)=>{ let t=''; for(let i=0;i<n2;i++) t+=`<rect x="${x}" y="${y+i*ab}" width="${w}" height="2.5" rx="1" fill="#D8D2C8"/>`; return t; };
function blattBilder(R){
  const eins=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297">${einbetten(kistenBild(R),20,14,170,105)}${zeilen(20,128,170,R.teile.length+1)}${zeilen(20,200,120,5)}</svg>`;
  const pl=R.teile.filter(t=>t.id!=='leiste'&&!t.dick);
  const zwei=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297">${pl.map((t,i)=>einbetten(bohrplan(R,t),12+(i%3)*63,12+Math.floor(i/3)*58,60,54)).join('')}${einbetten(zuschnittBild(R.zuschnitt),30,134,150,80)}${zeilen(20,226,170,7)}</svg>`;
  return [eins,zwei];
}
function kartenZeigen(ja){ KARTEN.forEach(k=>{ if(k) k.style.display=ja?'':'none'; }); }
function bald(){ if(!raf) raf=requestAnimationFrame(()=>{ raf=0; zeichnen(); }); }
function zeichnen(){
  const R=rechnen();
  document.querySelectorAll('[data-g="deckel"] .chip').forEach(c=>{ c.setAttribute('aria-pressed',String(c.dataset.v===R.deckel)); if(c.dataset.v==='scharnier'||c.dataset.v==='nut') c.disabled=S.d<8; });
  // Während des Ziehens bleibt der Ausschnitt stehen, sonst läuft die Kiste dem Finger davon
  const A=drag&&ansicht?ansicht:(ansicht=einpassen(R));
  const a=document.activeElement, fokus=svg.contains(a)?(a.dataset.achse?`[data-achse="${a.dataset.achse}"]`:a.dataset.griff?`[data-griff="${a.dataset.griff}"]`:a.dataset.feld?`.massz[data-feld="${a.dataset.feld}"]`:null):null;
  // Was sich geändert hat, leuchtet kurz auf
  const nun={l:S.l,b:S.b,h:S.h,mass:S.mass};
  puls=letzte?['l','b','h'].filter(k=>nun[k]!==letzte[k]||nun.mass!==letzte.mass):[]; letzte=nun;
  svg.setAttribute('viewBox',`${A.x.toFixed(1)} ${A.y.toFixed(1)} ${A.w.toFixed(1)} ${A.h.toFixed(1)}`);
  svg.innerHTML=liveBild(R,A);
  if(fokus){ const el=svg.querySelector(fokus); if(el) el.focus({preventScroll:true}); }
  feldLage();
  $('flaeche-warn').textContent=R.kurz||''; $('flaeche-warn').hidden=!R.fehler;
  $('teile-dicke').textContent=`${n(R.d)} mm`;
  if(R.fehler){
    ['teile','fakten','rechnung','material','schritte','plaene','zuschnitt','druck','blaetter'].forEach(id=>{ $(id).innerHTML=''; });
    kartenZeigen(false); $('drucken').disabled=true; letzteTeile=null;
    return;
  }
  kartenZeigen(true); $('drucken').disabled=false;
  $('teile').innerHTML=teileListe(R);
  if(!drag){ const neu={}; $('teile').querySelectorAll('li').forEach(li=>{ neu[li.dataset.z]=li.dataset.w; if(letzteTeile&&letzteTeile[li.dataset.z]!==li.dataset.w) Planer.leuchte(li); }); letzteTeile=neu; }
  $('fakten').innerHTML=fakten(R);
  $('rechnung').innerHTML=rechnung(R);
  $('material').innerHTML=material(R);
  $('schritte').innerHTML=schritte(R);
  const plaene=R.teile.filter(t=>t.id!=='leiste'&&!t.dick).map(t=>`<figure><figcaption><b class="tz">${t.z}</b>${esc(t.name)} <span class="leise">${t.n}× · ${mm(t.l)} × ${mm(t.b)}</span></figcaption>${bohrplan(R,t)}</figure>`).join('');
  $('plaene').innerHTML=plaene;
  $('zuschnitt').innerHTML=zuschnittBild(R.zuschnitt);
  if(drag) return;                                   // die Druckseite erst nach dem Ziehen bauen
  // Druck: Seite 1 Plan, Seite 2 Bohrpläne und Zuschnitt
  const titel=`Kiste ${cmT(R.La)} × ${cmT(R.Ba)} × ${cmT(R.Ha)} · ${MATERIAL[S.mat].name} ${n(R.d)} mm`;
  $('druck').innerHTML=`<div class="seite"><h1>${esc(titel)}</h1><div class="bild">${kistenBild(R)}</div>
    <h2>Teile zuschneiden</h2><table><tr><th>Teil</th><th>Anzahl</th><th>Länge</th><th>Breite</th><th>Dicke</th></tr>${R.teile.map(t=>`<tr><td><b class="tz">${t.z}</b>${esc(t.name)}</td><td>${t.n}×</td><td>${mm(t.l)}</td><td>${mm(t.b)}</td><td>${mm(t.dick||R.d)}</td></tr>`).join('')}</table>
    <h2>Schrauben und Bohren</h2><ul class="antwort">${antwort(R)}</ul>
    <h2>So wird gerechnet</h2><div class="rechnung">${rechnung(R)}</div>
    <div class="fusszeile"><p class="fuss">Schritt für Schritt · Kisten-Planer</p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 8.5" style="flex:none;width:54mm;height:8.5mm" role="img" aria-label="5 cm, 100 %">${Planer.kontrolle(2,6)}</svg></div></div>
    <div class="seite"><h2>Bohrpläne · mm</h2><div class="plaene">${plaene}</div>
    <h2>Zuschnitt</h2><div class="bild zu">${zuschnittBild(R.zuschnitt)}</div>
    <h2>So baust du die Kiste</h2><ol class="schritte">${schritte(R)}</ol>
    <p class="fuss">Schritt für Schritt · Kisten-Planer</p></div>`;
  druckKopf.zeige({blaetter:2});
  Planer.blaetter('#blaetter',blattBilder(R),{spalten:2});
}

// ---------- Bedienung ----------
function dickenChips(){
  $('dicken').innerHTML=MATERIAL[S.mat].dicken.map(x=>`<button type="button" class="chip" data-d="${x}" aria-pressed="${x===S.d}" aria-label="${n(x)} mm">${n(x)}</button>`).join('')+'<span class="einheit">mm</span>';
  $('dicken').querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{ if(S.d!==+c.dataset.d) Planer.merke(); S.d=+c.dataset.d; felder(); speichern(); zeichnen(); }));
}
function felder(){
  ['l','b','h','d'].forEach(k=>{ $(k).value=S[k]; });
  document.querySelectorAll('[data-g]').forEach(g=>{ const k=g.dataset.g; g.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.v===S[k]))); });
  dickenChips();
}
function setzeMass(k,v){
  const [lo,hi]=GRENZEN[k]; v=Math.min(hi,Math.max(lo,Math.round(v*2)/2));
  if(v===S[k]) return false;
  S[k]=v; $(k).value=v; speichern(); return true;
}
// Rückgängig: hole den ganzen Plan, setze zeichnet alles neu
Planer.verlauf({hole:()=>({...S}),setze:z=>{ Object.assign(S,z); felder(); speichern(); zeichnen(); }});
// Feld am Mass: Masszahl antippen oder Enter, tippen oder ± wirkt sofort
function feldLage(){
  if(!feld) return;
  const e=svg.querySelector(`.massz[data-feld="${feld}"]`); if(!e) return;
  const r=e.getBoundingClientRect(), q=flaeche.getBoundingClientRect(), A=ansicht, unten=(0-A.y)/A.u+6;
  const x=Math.min(flaeche.clientWidth-mf.offsetWidth-4,Math.max(4,r.left+r.width/2-q.left-mf.offsetWidth/2)), y=Math.min(flaeche.clientHeight-mf.offsetHeight-4,unten);
  mf.style.transform=`translate(${Math.round(x)}px,${Math.round(y)}px)`;
}
function feldAuf(k){
  feld=k; mf.hidden=false; mf.classList.remove('falsch'); mf.style.setProperty('--m',MFARBE[k]); mf.setAttribute('aria-label',NAMEN[k]); mfz.setAttribute('aria-label',`${NAMEN[k]} in cm`); mfz.value=n(S[k]); $('mf-e').textContent='cm';
  zeichnen(); mfz.focus({preventScroll:true}); mfz.select();
}
function feldZu(zurueck){
  const k=feld; if(!k) return; feld=null; mf.hidden=true; zeichnen();
  if(zurueck){ const e=svg.querySelector(`.massz[data-feld="${k}"]`); if(e) e.focus({preventScroll:true}); }
}
function feldStufe(r){ const k=feld, v=S[k]; const neu=Math.min(GRENZEN[k][1],Math.max(GRENZEN[k][0],Math.round((v+r*.5)*2)/2)); if(neu===v) return; Planer.merke(null,'feld-'+k); setzeMass(k,neu); mfz.value=n(S[k]); mf.classList.remove('falsch'); $('mf-e').textContent='cm'; zeichnen(); }
mfz.addEventListener('input',()=>{
  const k=feld; if(!k) return; const [lo,hi]=GRENZEN[k], t=mfz.value.trim(), v=parseFloat(t.replace(',','.')), ok=!isNaN(v)&&v>=lo&&v<=hi;
  mf.classList.toggle('falsch',!!t&&!ok); $('mf-e').textContent=t&&!ok?`⚠ ${lo}–${hi}`:'cm';
  if(ok){ const w=Math.round(v*10)/10; if(w!==S[k]){ Planer.merke(null,'feld-'+k); S[k]=w; $(k).value=w; speichern(); zeichnen(); } }
});
mfz.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); feldZu(true); }
  else if(e.key==='ArrowUp'||e.key==='ArrowDown'){ e.preventDefault(); feldStufe(e.key==='ArrowUp'?1:-1); }
});
$('mf-minus').addEventListener('click',()=>feldStufe(-1));
$('mf-plus').addEventListener('click',()=>feldStufe(1));
[$('mf-minus'),$('mf-plus')].forEach(b=>b.addEventListener('mousedown',e=>e.preventDefault()));
document.addEventListener('pointerdown',e=>{ if(feld&&!mf.contains(e.target)&&!(e.target.closest&&e.target.closest('.massz'))) feldZu(false); },true);
document.addEventListener('focusin',e=>{ if(feld&&!mf.contains(e.target)&&!svg.contains(e.target)) feldZu(false); });
// Knöpfe an den Teilen
function aktion(act){
  Planer.merke();
  if(act==='ecken') S.aussen=S.aussen==='lang'?'kurz':'lang';
  if(act==='boden') S.boden=S.boden==='unter'?'zwischen':'unter';
  if(act==='deckel'){ S.deckel='ja'; wahl='deckel'; }
  if(act==='deckelweg'){ S.deckel='nein'; wahl=null; }
  if(act==='haken'||act==='magnet') S.zu=act;
  felder(); speichern(); zeichnen();
}
function punkt(e){ const m=svg.getScreenCTM(); if(!m) return {x:0,y:0}; const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse()); return {x:p.x,y:p.y}; }
// Griffe ziehen ohne die Seite zu rollen: auf dem Rest der Kiste rollt der Finger weiter
svg.addEventListener('touchstart',e=>{ if(e.target.closest&&e.target.closest('.zieh')) e.preventDefault(); },{passive:false});
svg.addEventListener('click',e=>{ const m=e.target.closest('.massz'); if(!m) return; const k=m.dataset.feld; if(feld===k) feldZu(true); else feldAuf(k); });
svg.addEventListener('pointerdown',e=>{
  if(e.button>0) return;
  if(e.target.closest('.massz')) return;
  const g=e.target.closest('.griff');
  if(g){ e.preventDefault(); aktion(g.dataset.griff); return; }
  const z=e.target.closest('.zieh');
  if(z){ e.preventDefault(); svg.setPointerCapture(e.pointerId); drag={k:z.dataset.achse,p0:punkt(e),v0:S[z.dataset.achse],id:e.pointerId,vor:{...S},neu:false}; flaeche.classList.add('zieht'); bald(); return; }
  const t=e.target.closest('[data-t]');
  tap={x:e.clientX,y:e.clientY,id:e.pointerId,t:t?t.dataset.t:null};
});
svg.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id) return;
  const p=punkt(e), dx=p.x-drag.p0.x, dy=p.y-drag.p0.y;
  const dmm=drag.k==='l'?dx:drag.k==='h'?-dy:(dx-dy)/(2*K);   // Breite: der Schräge entlang, 1 mm Tiefe = K mm schräg
  if(setzeMass(drag.k,drag.v0+dmm/10)){ if(!drag.neu){ drag.neu=true; Planer.merke(drag.vor); } bald(); }
});
function los(e,abbruch){
  if(drag&&e.pointerId===drag.id){ drag=null; flaeche.classList.remove('zieht'); zeichnen(); return; }
  if(!tap||e.pointerId!==tap.id) return;
  const t=tap; tap=null;
  if(abbruch||Math.hypot(e.clientX-t.x,e.clientY-t.y)>8) return;
  wahl=t.t&&wahl!==t.t?t.t:null; zeichnen();
}
svg.addEventListener('pointerup',e=>los(e,false));
svg.addEventListener('pointercancel',e=>los(e,true));
svg.addEventListener('keydown',e=>{
  const g=e.target.closest('.griff'), z=e.target.closest('.zieh'), m=e.target.closest('.massz');
  if(g&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); aktion(g.dataset.griff); return; }
  if(m&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); if(feld===m.dataset.feld) feldZu(true); else feldAuf(m.dataset.feld); return; }
  if(!z) return;
  const st={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1,PageUp:10,PageDown:-10}[e.key]; if(!st) return;
  e.preventDefault(); const k=z.dataset.achse;
  const vor={...S};
  if(setzeMass(k,S[k]+st*0.5*(e.shiftKey?10:1))){ Planer.merke(vor,'tast-'+k); zeichnen(); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&wahl){ wahl=null; zeichnen(); } });
addEventListener('resize',()=>{ if(!drag) bald(); });
document.querySelectorAll('[data-g]').forEach(g=>{ const k=g.dataset.g; g.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{ if(S[k]!==c.dataset.v) Planer.merke(); S[k]=c.dataset.v; if(k==='deckel') wahl=S.deckel==='nein'?null:'deckel'; if(k==='mat'&&!MATERIAL[S.mat].dicken.includes(S.d)) S.d=MATERIAL[S.mat].dicken.includes(8)?8:MATERIAL[S.mat].dicken[1]; felder(); speichern(); zeichnen(); })); });
['l','b','h','d'].forEach(k=>{ const inp=$(k), [lo,hi]=GRENZEN[k];
  const setzen=v=>{ if(isNaN(v)) v=S[k]; const w=Math.min(hi,Math.max(lo,Math.round(v*10)/10)); if(w!==S[k]) Planer.merke(null,'tipp-'+k); S[k]=w; inp.value=S[k]; if(k==='d') dickenChips(); speichern(); zeichnen(); };
  inp.addEventListener('change',()=>setzen(parseFloat(String(inp.value).replace(',','.'))));
  inp.addEventListener('input',()=>{ const v=parseFloat(String(inp.value).replace(',','.')); if(!isNaN(v)&&v>=lo&&v<=hi){ if(v!==S[k]) Planer.merke(null,'tipp-'+k); S[k]=v; if(k==='d') dickenChips(); speichern(); zeichnen(); } });
});
$('drucken').addEventListener('click',()=>window.print());
felder(); zeichnen();
})();
</script>
</body>
</html>
