<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schritt für Schritt · Bohrvorlage</title>
<meta name="description" content="Bohrvorlage zum Ausdrucken: Platte, Bohrer, Lochabstand und Rand direkt im Bild ziehen – die Seite zeichnet alle Bohrlöcher mit Kreuz zum Ankörnen, auf A4 oder A3. Grosse Platten kommen auf mehrere Blätter zum Zusammenkleben.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{--bg:#EEF3F8;--surface:#FFFFFF;--surface2:#F5F8FB;--ink:#17212F;--muted:#5B6B80;--line:#D5DEE9;--acc:#17997A;--acc-ink:#FFFFFF;--acc-soft:#E3F4EF;--warn:#B3412A;--knapp:#A86A00;--papier:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1621;--surface:#1A2433;--surface2:#141C28;--ink:#EDF2F8;--muted:#9DACBF;--line:#2B384A;--acc:#2FBF98;--acc-ink:#0F1621;--acc-soft:#16302B;--warn:#F08A6E;--knapp:#F2C14E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1621;--surface:#1A2433;--surface2:#141C28;--ink:#EDF2F8;--muted:#9DACBF;--line:#2B384A;--acc:#2FBF98;--acc-ink:#0F1621;--acc-soft:#16302B;--warn:#F08A6E;--knapp:#F2C14E;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.4 Nunito,system-ui,sans-serif}
h1{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0;font-size:28px}
a{color:var(--acc)}
.kopf{max-width:1200px;margin:0 auto;padding:20px 16px 8px}
.kopf p{margin:2px 0 0;color:var(--muted)}
main{max-width:1200px;margin:0 auto;padding:8px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:16px;align-items:start}
.karte{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.seite-rechts{position:sticky;top:12px;display:flex;flex-direction:column;gap:14px;min-width:0}
.leiste{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.leiste .chips{gap:2px;padding:3px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.chip{font:inherit;font-size:15px;padding:6px 14px;border-radius:999px;border:2px solid transparent;background:var(--surface2);color:var(--ink);cursor:pointer;min-height:44px}
#papier .chip{border-color:var(--line)}
.chip.ic{width:46px;height:44px;padding:0;display:inline-grid;place-items:center;background:transparent}
.chip svg{width:26px;height:26px;display:block}
.chip[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.chip:hover{border-color:var(--acc)}
#mehr{margin-left:auto;font-size:22px;line-height:1;width:46px;padding:0;border-color:var(--line)}
#mehr[aria-expanded="true"]{border-color:var(--acc);background:var(--acc-soft)}
#zurueckholen{border-color:var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.zahlen{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px;margin:0 0 12px;padding:12px;border-radius:14px;background:var(--surface2)}
.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.stepper{display:flex;align-items:center;gap:5px}
.stepper button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:600 24px/1 Fredoka,Nunito,sans-serif;cursor:pointer;padding:0;flex:none}
.stepper button:hover{border-color:var(--acc)}
.stepper input{width:72px;height:44px;font:600 22px Fredoka,Nunito,sans-serif;text-align:center;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0 4px;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper span{font-size:14px;color:var(--muted)}
.flaeche{overflow:hidden;border-radius:12px;background:var(--surface2)}
#pv,#lv{display:block;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
#pv{overflow:visible}
.lupe-karte{padding:8px;position:relative;border:2px dashed var(--acc)}
.lupe-ic{position:absolute;left:14px;top:12px;width:30px;height:30px;border-radius:50%;background:var(--surface);display:grid;place-items:center;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.lupe-ic svg{width:18px;height:18px;fill:none;stroke:var(--acc);stroke-width:2.6;stroke-linecap:round}
/* Zeichnung am Bildschirm */
svg .holz{fill:#F3E2C2}
svg .loch{fill:none;stroke:#3B2A18;stroke-linecap:round}
svg .geist{fill:none;stroke:#8C7A62}
svg .gewaehlt{fill:none;stroke:#E8554E}
svg .bereich{fill:none;stroke:var(--acc)}
svg .blattr{fill:none;stroke:var(--acc)}
svg .blattn{fill:var(--acc);fill-opacity:.28;font-family:Fredoka,Nunito,sans-serif;pointer-events:none}
svg .mass{fill:none;stroke:var(--acc);stroke-linecap:round;stroke-linejoin:round}
svg .hilfs{fill:none;stroke:var(--acc);opacity:.6}
svg .et{font-family:Nunito,system-ui,sans-serif;font-weight:800;fill:var(--ink);stroke:var(--surface2);paint-order:stroke;stroke-linejoin:round;pointer-events:none}
svg .grund{fill:var(--surface2)}
#lv .mass,#lv .hilfs{stroke:#0E7A5F}
#lv .et{fill:#0B4F3E;stroke:#FFF6E6}
svg .mass.warn,#lv .mass.warn{stroke:#D0392B}
svg .et.warn,#lv .et.warn{fill:#B3261E}
svg .randlinie{fill:none;stroke:#0E7A5F;opacity:.55}
svg .griff{cursor:grab}
svg .griff[data-griff="weg"]{cursor:pointer}
svg .griff:hover circle+circle+circle{stroke-width:3.5}
.werte{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.wert{background:var(--surface2);border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:8px;min-width:0}
.wert svg{width:28px;height:28px;flex:none;fill:none;stroke:var(--acc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wert b{font:600 21px/1.15 Fredoka,Nunito,sans-serif;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wert small{display:block;color:var(--muted);font-size:13px;line-height:1.2}
.wert.knapp b{color:var(--knapp)}.wert.knapp svg{stroke:var(--knapp)}
.wert.warn b{color:var(--warn)}.wert.warn svg{stroke:var(--warn)}
.warnz{color:var(--warn);font-weight:800;margin:10px 0 0}
.druck-karte{display:flex;flex-direction:column;gap:10px}
.drucken{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--acc);color:var(--acc-ink);font:600 20px Fredoka,Nunito,sans-serif;cursor:pointer}
.drucken svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round}
.hinweis{font-size:13px;color:var(--muted);margin:0}
.blaetter{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:12px}
.blaetter svg{display:block;width:100%;height:auto;background:var(--papier);border-radius:3px;box-shadow:0 1px 6px rgba(0,0,0,.15)}
@media (max-width:860px){
  main{grid-template-columns:minmax(0,1fr);gap:14px}
  .seite-rechts{position:static}
  h1{font-size:24px}
}
@media (max-width:420px){
  main{padding:8px 12px 32px}
  .karte{padding:10px}
  .chip.ic{width:40px}
}
#druck{display:none}
@page{size:A4 portrait;margin:0}
@media print{
  body{background:#fff}
  .kopf,main{display:none!important}
  #druck{display:block}
  #druck svg{display:block;width:var(--bw,210mm);height:var(--bh,297mm);break-after:page}
  #druck svg:last-child{break-after:auto}
}

  <section class="karte" id="k-platte" aria-label="Platte">

        <button type="button" class="chip ic" data-muster="versetzt" aria-pressed="false" aria-label="Versetzt (Waben)" title="Versetzt (Waben)"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="6.5" r="2.2"/><circle cx="12" cy="6.5" r="2.2"/><circle cx="19" cy="6.5" r="2.2"/><circle cx="8.5" cy="12.5" r="2.2"/><circle cx="15.5" cy="12.5" r="2.2"/><circle cx="5" cy="18.5" r="2.2"/><circle cx="12" cy="18.5" r="2.2"/><circle cx="19" cy="18.5" r="2.2"/></svg></button>

      </div>
      <div class="chips" role="group" aria-label="Anordnung" id="lage">

      <div><label class="lbl" for="b">Breite</label><div class="stepper" data-feld="b"><button type="button" data-minus aria-label="Breite kleiner">−</button><input type="number" id="b" min="1" max="120" step="0.5" inputmode="decimal"><button type="button" data-plus aria-label="Breite grösser">+</button><span>cm</span></div></div>
      <div><label class="lbl" for="h">Höhe</label><div class="stepper" data-feld="h"><button type="button" data-minus aria-label="Höhe kleiner">−</button><input type="number" id="h" min="1" max="120" step="0.5" inputmode="decimal"><button type="button" data-plus aria-label="Höhe grösser">+</button><span>cm</span></div></div>
      <div><label class="lbl" for="d">Bohrer ⌀</label><div class="stepper" data-feld="d" data-schritt="0.5"><button type="button" data-minus aria-label="Bohrer dünner">−</button><input type="number" id="d" min="0.5" max="30" step="0.5" inputmode="decimal"><button type="button" data-plus aria-label="Bohrer dicker">+</button><span>mm</span></div></div>

      <div><label class="lbl" for="r">Rand</label><div class="stepper" data-feld="r"><button type="button" data-minus aria-label="Rand kleiner">−</button><input type="number" id="r" min="0" max="200" step="0.5" inputmode="decimal"><button type="button" data-plus aria-label="Rand grösser">+</button><span>mm</span></div></div>

    <div class="flaeche" id="pv-box"><svg id="pv" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Platte"></svg></div>

  </section>
  <div class="seite-rechts">
    <section class="karte lupe-karte" aria-label="Lupe: Bohrer, Abstand und Rand ziehen">
      <span class="lupe-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/></svg></span>
      <div class="flaeche" id="lv-box"><svg id="lv" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lupe"></svg></div>
    </section>

      <div class="chips" id="papier" role="group" aria-label="Papier"><button type="button" class="chip" data-papier="a4" aria-pressed="true">A4</button><button type="button" class="chip" data-papier="a3" aria-pressed="false">A3</button></div>
      <button type="button" class="drucken" id="drucken"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2M6 14h12v7H6z"/></svg><span>Drucken</span></button>
      <p class="hinweis" id="tipp"></p>
    </section>

</main>
<div id="druck"></div>
<script>
// Bohrvorlage von Schritt für Schritt. Platte in cm, alles andere in mm; die Zeichnung ist 1:1 in mm.
// Bedienung direkt im Bild: Platte an den Griffen grösser ziehen, in der Lupe Bohrer (Lochrand), Abstand (zweites Loch)
// und Rand (Lochfeld verschieben) ziehen. Ein angetipptes Loch lässt sich mit × weglassen.
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='schrittli.bohren.v1';
const PAPIERE={a4:{name:'A4',w:210,h:297},a3:{name:'A3',w:297,h:420}};
const M=8;        // Druckrand des Blatts (mm)
const FUSS=14;    // Platz für Kontrolllinie und Text unten
const UEB=10;     // Überlappung beim Zusammenkleben
const RAHMEN=7;   // Platz um die Platte für die Nummern
const MAX_LOECHER=40000;
const n=x=>String(Math.round(x*100)/100).replace('.',',');   // 12.5 → «12,5»
const mm=x=>Math.round(x*1000)/1000;
const begrenz=(v,lo,hi)=>Math.min(hi,Math.max(lo,v));
const rund=(v,s)=>Math.round(v/s)*s;
const schl=p=>p[0]+','+p[1];
const S={b:50,h:30,d:5,a:10,r:10,muster:'raster',lage:'rand',papier:'a4',weg:[]};
const GRENZEN={b:[1,120],h:[1,120],d:[0.5,30],a:[2,200],r:[0,200]};

// ---------- Einstellungen laden ----------
try{ const g=JSON.parse(localStorage.getItem(KEY)||'{}'); for(const k in S) if(g[k]!==undefined) S[k]=g[k]; }catch(e){}
try{ const u=new URL(location.href).searchParams;
  ['b','h','d','a','r'].forEach(k=>{ if(u.has(k)&&!isNaN(parseFloat(u.get(k)))) S[k]=parseFloat(u.get(k)); });
  if(['raster','versetzt','rahmen'].includes(u.get('muster'))) S.muster=u.get('muster');
  if(u.get('lage')==='mitte'||u.get('lage')==='rand') S.lage=u.get('lage');
  if(PAPIERE[u.get('papier')]) S.papier=u.get('papier');
  if(['b','h','d','a','r','muster','lage'].some(k=>u.has(k))) S.weg=[];   // geteilter Link: ganzes Muster
}catch(e){}
for(const k in GRENZEN){ const [lo,hi]=GRENZEN[k]; S[k]=Math.min(hi,Math.max(lo,+S[k]||lo)); }
if(!PAPIERE[S.papier]) S.papier='a4';
if(!['raster','versetzt','rahmen'].includes(S.muster)) S.muster='raster';
if(!['rand','mitte'].includes(S.lage)) S.lage='rand';
S.weg=Array.isArray(S.weg)?S.weg.filter(x=>typeof x==='string').slice(-5000):[];
function speichern(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

// ---------- Löcher berechnen ----------
// Gibt die Lochmitten in Plattenkoordinaten (mm, Ursprung links oben) zurück, dazu Spalten und Reihen.
function loecher(){
  const W=S.b*10,H=S.h*10,A=S.a,R=S.r;
  const innenW=W-2*R, innenH=H-2*R;
  const eps=1e-6;
  if(innenW<-eps||innenH<-eps) return {pts:[],nx:0,ny:0,xs:[],ys:[],zuViele:false};
  if(S.muster==='rahmen'){
    // Löcher nur dem Rand entlang: in jeder Ecke eines, dazwischen gleichmässig, höchstens A auseinander
    const segX=Math.max(1,Math.ceil(innenW/A-eps)), segY=Math.max(1,Math.ceil(innenH/A-eps));
    const nx=innenW>eps?segX+1:1, ny=innenH>eps?segY+1:1;
    const ax=nx>1?innenW/segX:A, ay=ny>1?innenH/segY:A;
    if(2*(nx+ny)>MAX_LOECHER) return {pts:[],nx,ny,xs:[],ys:[],zuViele:true};
    const pts=[],xs=[],ys=[];
    for(let i=0;i<nx;i++) xs.push(mm(R+i*ax));
    for(let j=0;j<ny;j++) ys.push(mm(R+j*ay));
    for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){ if(j===0||j===ny-1||i===0||i===nx-1) pts.push([xs[i],ys[j]]); }
    return {pts,nx,ny,xs,ys,zuViele:false,ax,ay};
  }
  const dy=S.muster==='versetzt'?A*Math.sqrt(3)/2:A;
  const nx=Math.floor(innenW/A+eps)+1, ny=Math.floor(innenH/dy+eps)+1;
  if(nx*ny>MAX_LOECHER) return {pts:[],nx,ny,xs:[],ys:[],zuViele:true};
  // versetzte Reihen: haben so viele Löcher wie die geraden, wenn der halbe Abstand noch Platz hat
  const versetzt=S.muster==='versetzt';
  const nxs=versetzt?(((nx-1)*A+A/2<=innenW+eps)?nx:nx-1):nx;
  const breite=Math.max((nx-1)*A,(ny>1&&versetzt)?(nxs-1)*A+A/2:0);
  const hoehe=(ny-1)*dy;
  const x0=S.lage==='mitte'?(W-breite)/2:R;
  const y0=S.lage==='mitte'?(H-hoehe)/2:R;
  const pts=[],xs=[],ys=[];
  for(let i=0;i<nx;i++) xs.push(mm(x0+i*A));
  for(let j=0;j<ny;j++){
    const y=mm(y0+j*dy); ys.push(y);
    const schieb=(versetzt&&j%2===1)?A/2:0;
    const anzahl=schieb?nxs:nx;
    for(let i=0;i<anzahl;i++) pts.push([mm(x0+i*A+schieb),y]);
  }
  return {pts,nx,ny,xs,ys,zuViele:false};
}

// ---------- Blattaufteilung ----------
function aufteilung(Pw,Ph,dw,dh){
  const nw=Pw-2*M, nh=Ph-2*M-FUSS;
  const nx=dw<=nw?1:Math.ceil((dw-UEB)/(nw-UEB));
  const ny=dh<=nh?1:Math.ceil((dh-UEB)/(nh-UEB));
  return {Pw,Ph,nw,nh,nx,ny,stepx:nw-UEB,stepy:nh-UEB,ox:nx===1?M+(nw-dw)/2:M,oy:ny===1?M+(nh-dh)/2:M};
}
function beste(dw,dh){
  const P=PAPIERE[S.papier];
  const hoch=aufteilung(P.w,P.h,dw,dh), quer=aufteilung(P.h,P.w,dw,dh);
  hoch.quer=false; quer.quer=true;
  const h=hoch.nx*hoch.ny, q=quer.nx*quer.ny;
  if(q<h) return quer; if(h<q) return hoch;

}

// ---------- Alles ausrechnen ----------
// L.alle = ganzes Muster, L.pts = davon gebohrt (ohne die weggelassenen), L.weg = weggelassene
function rechnen(){
  const L=loecher(); L.alle=L.pts;
  const w=new Set(S.weg);
  L.pts=w.size?L.alle.filter(p=>!w.has(schl(p))):L.alle;
  L.weg=w.size?L.alle.filter(p=>w.has(schl(p))):[];
  const W=S.b*10,H=S.h*10, dw=W+2*RAHMEN, dh=H+2*RAHMEN;
  const T=beste(dw,dh);
  const rahmen=S.muster==='rahmen', alle=L.alle.length;
  const abst=rahmen&&alle?Math.min(L.ax,L.ay):S.a;
  let rand=S.r;
  if(alle){ let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
    L.alle.forEach(([x,y])=>{ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; });
    rand=mm(Math.min(x0,W-x1,y0,H-y1)); }

  const p0=L.alle[0]||[S.r,S.r];
  const A1=rahmen&&L.ax?L.ax:S.a;
  const p1=[mm(p0[0]+A1),p0[1]];
  const da=q=>L.alle.some(p=>Math.abs(p[0]-q[0])<.01&&Math.abs(p[1]-q[1])<.01);
  return {L,W,H,dw,dh,T,P:PAPIERE[S.papier],rand,abst,steg:abst-S.d,kante:rand-S.d/2,p0,p1,A1,p0da:da(p0),p1da:da(p1)};
}

// ---------- Druckzeichnung ----------
// Alles in «Weltkoordinaten»: die Zeichnung ist die Platte plus RAHMEN rundum.
function weltTeile(L,sicht){

  let kreise='',kreuze='',punkte='';

    kreuze+=`M${mm(x-arm)},${y}h${mm(2*arm)}M${x},${mm(y-arm)}v${mm(2*arm)}`;
    punkte+=`M${mm(x-0.3)},${y}a.3,.3 0 1 0 .6,0a.3,.3 0 1 0 -.6,0`;
  }
  let s=`<rect x="${RAHMEN}" y="${RAHMEN}" width="${W}" height="${H}" fill="none" stroke="#000" stroke-width="0.4"/>`;
  // Eckmarken aussen, damit man die Platte auch nach dem Beschneiden noch anlegen kann
  const e=4;
  s+=`<path d="M${RAHMEN-e},${RAHMEN}h${e}v${-e}M${RAHMEN+W},${RAHMEN-e}v${e}h${e}M${RAHMEN+W+e},${RAHMEN+H}h${-e}v${e}M${RAHMEN},${RAHMEN+H+e}v${-e}h${-e}" fill="none" stroke="#000" stroke-width="0.25"/>`;
  if(kreuze) s+=`<path d="${kreuze}" fill="none" stroke="#000" stroke-width="0.2"/>`;
  if(kreise) s+=`<path d="${kreise}" fill="none" stroke="#000" stroke-width="0.3"/>`;
  if(punkte) s+=`<path d="${punkte}" fill="#000"/>`;
  // Nummern der Spalten (oben) und Reihen (links), bei engen Abständen nur jede n-te
  const schritt=Math.max(1,Math.ceil(6/S.a));
  const fs=Math.min(2.8,Math.max(1.8,S.a*0.35));
  let t='';
  L.xs.forEach((x,i)=>{ if(i%schritt===0||i===L.xs.length-1){ const X=mm(x+RAHMEN); if(!sicht||(X>=sicht.x0-2&&X<=sicht.x1+2)) t+=`<text x="${X}" y="${RAHMEN-1.6}" text-anchor="middle">${i+1}</text>`; } });
  L.ys.forEach((y,j)=>{ if(j%schritt===0||j===L.ys.length-1){ const Y=mm(y+RAHMEN); if(!sicht||(Y>=sicht.y0-2&&Y<=sicht.y1+2)) t+=`<text x="${RAHMEN-1.6}" y="${Y+fs*0.35}" text-anchor="end">${j+1}</text>`; } });
  if(t) s+=`<g font-family="Nunito,Arial,sans-serif" font-size="${fs}" fill="#555">${t}</g>`;
  return s;
}
let clipN=0;
function fussText(L,T,i,j){

  if(T.nx*T.ny>1) t+=` · Blatt ${j*T.nx+i+1} von ${T.nx*T.ny} (Reihe ${j+1}, Spalte ${i+1})`;
  return t;
}
function blatt(L,T,i,j){

  s+=`</g></g>`;
  if(mehr){

    if(i>0) s+=`<line x1="${M+UEB}" y1="${M}" x2="${M+UEB}" y2="${M+T.nh}" stroke="#17997A" stroke-width="0.3" stroke-dasharray="2 1.5"/><text ${f} fill="#17997A" transform="translate(${M+UEB-1.2},${M+T.nh/2}) rotate(-90)" text-anchor="middle">✂ links abschneiden</text>`;
    if(j>0) s+=`<line x1="${M}" y1="${M+UEB}" x2="${M+T.nw}" y2="${M+UEB}" stroke="#17997A" stroke-width="0.3" stroke-dasharray="2 1.5"/><text ${f} fill="#17997A" x="${M+T.nw/2}" y="${M+UEB-1.2}" text-anchor="middle">✂ oben abschneiden</text>`;

  s+=`<text x="${T.Pw-M}" y="${yf+1}" text-anchor="end" font-family="Nunito,Arial,sans-serif" font-size="3" fill="#000">${esc(fussText(L,T,i,j))}</text>`;
  s+=`<text x="${T.Pw-M}" y="${yf+5}" text-anchor="end" font-family="Nunito,Arial,sans-serif" font-size="2.4" fill="#666">Schritt für Schritt · Bohrvorlage</text>`;
  return s+'</svg>';
}

// ---------- Bausteine für die Bildschirm-Zeichnung ----------
// k = Weltmass pro Bildschirmpixel, damit Pfeile, Schrift und Griffe am Bildschirm immer gleich gross sind
const r3=v=>Math.round(v*1000)/1000;

  let d=`M${r3(x1)},${r3(y1)}L${r3(x2)},${r3(y2)}`+kopf(x2,y2,-1); if(!offen) d+=kopf(x1,y1,1);

}
const etikett=(x,y,t,k,cls='',anker='middle',dreh=0)=>`<text class="et ${cls}" x="${r3(x)}" y="${r3(y)}" font-size="${r3(14*k)}" stroke-width="${r3(4*k)}" text-anchor="${anker}"${dreh?` transform="rotate(${dreh} ${r3(x)} ${r3(y)})"`:''}>${esc(t)}</text>`;
const PF='M-7 0H7M-7 0l3.5-3.5M-7 0l3.5 3.5M7 0l-3.5-3.5M7 0l-3.5 3.5';
const IC={
  quer:`<path d="${PF}"/>`,
  hoch:`<path d="${PF}" transform="rotate(90)"/>`,
  diag:`<path d="${PF}" transform="rotate(45)"/>`,
  dick:`<path d="${PF}" transform="rotate(-45)"/>`,
  feld:'<path d="M-7 0H7M0-7V7M-7 0l3-3M-7 0l3 3M7 0l-3-3M7 0l-3 3M0-7l-3 3M0-7l3 3M0 7l-3-3M0 7l3-3"/>',
  weg:'<path d="M-5-5L5 5M5-5L-5 5" stroke-width="3"/>'

function knopf(art,x,y,ic,titel,k,farbe='#17997A'){

function setzeSicht(svg,V){

}
function gewaehltSvg(L,k,sicht){

  if(sicht&&(x<sicht.x0||x>sicht.x1||y<sicht.y0||y>sicht.y1)) return '';

// ---------- Platte (ganze Fläche) ----------

  s+=pfeil(xh,R+H,xh,R,k)+etikett(xh-6*k,R+H/2,`${n(S.h)} cm`,k,'','middle',-90);

// ---------- Lupe (Ecke mit den ersten Löchern) ----------

  s+=knopf('feld',X0,Y0,'feld','Löcher verschieben (Rand)',k);
  s+=knopf('d',dx,dy,'dick','Bohrer dicker oder dünner',k);
  s+=gewaehltSvg(L,k,sicht);
  return s;
}

// ---------- Ergebnis ----------
const WI={
  loch:'<circle cx="12" cy="12" r="7"/><path d="M12 2v20M2 12h20" stroke-width="1.3"/>',
  steg:'<circle cx="6" cy="12" r="4.2"/><circle cx="18" cy="12" r="4.2"/><path d="M10.2 12h3.6" stroke-width="3"/>',
  kante:'<path d="M3 3v18" stroke-width="3"/><circle cx="15" cy="12" r="5"/><path d="M5 12h5"/>',
  blatt:'<path d="M6 2h9l4 4v16H6z"/><path d="M15 2v4h4"/>'
};
function werteZeigen(Z){
  const {L,T,P}=Z, bl=T.nx*T.ny, total=L.pts.length, ok=L.alle.length>0;
  const kachel=(ic,gross,klein,cls='',titel='')=>`<div class="wert ${cls}"${titel?` title="${esc(titel)}"`:''}><svg viewBox="0 0 24 24" aria-hidden="true">${WI[ic]}</svg><div><b>${gross}</b><small>${klein}</small></div></div>`;
  const t=[];
  const raster=S.muster==='raster'&&!L.weg.length&&ok;
  t.push(kachel('loch',raster?`${L.nx} × ${L.ny}`:String(total),(raster?`${total} Löcher`:'Löcher')+(L.weg.length?` · ${L.weg.length} weg`:''),ok?'':'warn'));
  if(ok){
    t.push(kachel('steg',`${n(Z.steg)} mm`,'Steg',Z.steg<=0?'warn':Z.steg<S.d?'knapp':'','Holz zwischen zwei Löchern'));
    t.push(kachel('kante',`${n(Z.kante)} mm`,'Kante',Z.kante<0?'warn':'','Lochrand bis Plattenkante'));
  }
  t.push(kachel('blatt',`${bl} × ${P.name}`,T.quer?'quer':'hoch'));
  $('werte').innerHTML=t.join('');
  let w='';
  if(L.zuViele) w=`⚠ Über ${MAX_LOECHER.toLocaleString('de-CH')} Löcher`;
  else if(!ok) w='⚠ Kein Loch passt – Rand kleiner';
  else if(Z.steg<=0) w='⚠ Löcher überschneiden sich';
  else if(Z.kante<0) w='⚠ Loch schneidet die Kante';
  else if(Z.steg<S.d) w='⚠ Dünne Stege – können brechen';
  $('warn').textContent=w; $('warn').hidden=!w;
  $('tipp').textContent=(bl>1?'Nach Nummern auslegen · grüne Kreuze aufeinander · ':'')+'Drucken mit 100 % · 5-cm-Linie nachmessen'+(S.papier==='a3'?' · Papier A3':'');
}

// ---------- Zeichnen ----------
let Z=null, wahl=null, drag=null;
function zeichnen(voll=true){
  Z=rechnen();
  werteZeigen(Z);
  const lv=$('lv'), pv=$('pv');
  LV=drag&&drag.LV?drag.LV:lvLayout(Z);
  PV=drag&&drag.PV?drag.PV:pvLayout(Z);
  setzeSicht(lv,LV); lv.innerHTML=lvSvg(Z,LV);
  setzeSicht(pv,PV); pv.innerHTML=pvSvg(Z,PV);
  pv.setAttribute('aria-label',`Platte ${n(S.b)} × ${n(S.h)} cm, ${Z.L.pts.length} Löcher`);
  $('lage').hidden=S.muster==='rahmen';
  const zh=$('zurueckholen'); zh.hidden=!Z.L.weg.length; zh.querySelector('span').textContent=Z.L.weg.length;
  if(voll) drucksachen(Z);
}
function drucksachen(Z){
  const {L,T,P}=Z, bl=T.nx*T.ny;
  if(L.zuViele){ $('blaetter').innerHTML=''; $('druck').innerHTML=''; return; }
  let seiten='';
  for(let j=0;j<T.ny;j++) for(let i=0;i<T.nx;i++) seiten+=blatt(L,T,i,j);
  $('druck').innerHTML=seiten;
  $('blaetter').innerHTML=bl>1?seiten:'';
  $('seite').textContent=`@page{size:${P.name} ${T.quer?'landscape':'portrait'};margin:0}#druck{--bw:${T.Pw}mm;--bh:${T.Ph}mm}`;
}
let geplant=false;
function planen(){ if(geplant) return; geplant=true; requestAnimationFrame(()=>{ geplant=false; zeichnen(false); }); }

// ---------- Ziehen im Bild ----------
function svgPunkt(svg,e){ const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; const q=p.matrixTransform(svg.getScreenCTM().inverse()); return [q.x,q.y]; }
function treffer(x,y,k){
  const px=x-RAHMEN,py=y-RAHMEN,g=Math.max(S.d/2,14*k); let best=null,bd=g*g;
  for(const p of Z.L.alle){ const dx=p[0]-px,dy=p[1]-py,q=dx*dx+dy*dy; if(q<bd){ bd=q; best=p; } }
  if(!best) return null; const key=schl(best); return {key,geist:S.weg.includes(key)};
}
function lochWeg(){ if(!wahl) return; if(!S.weg.includes(wahl)) S.weg.push(wahl); wahl=null; speichern(); zeichnen(); }
function runter(e){
  if(e.button&&e.button!==0) return;
  const svg=e.currentTarget, V=svg.id==='pv'?PV:LV, [x,y]=svgPunkt(svg,e), gr=e.target.closest('.griff');
  e.preventDefault();
  if(gr&&gr.dataset.griff==='weg'){ lochWeg(); return; }
  svg.setPointerCapture(e.pointerId);
  const art=gr?gr.dataset.griff:'leer';
  const hit=['b','h','bh','d'].includes(art)?null:treffer(x,y,1/V.s);
  drag={art:art==='leer'&&hit&&!hit.geist?'loch':art,hit,svg,V,x,y,bewegt:false,S0:{...S},p0:Z.p0,A1:Z.A1,PV,LV};
}
function zieh(e){
  if(!drag||drag.svg!==e.currentTarget) return;
  const [x,y]=svgPunkt(drag.svg,e), dx=x-drag.x, dy=y-drag.y;
  if(!drag.bewegt){
    if(Math.hypot(dx,dy)*drag.V.s<5) return;
    if(drag.art==='leer'){ drag.art='nichts'; }
    drag.bewegt=true;
    if(drag.art==='loch') drag.art='feld';
    if(drag.art==='feld'){ drag.r0=S.muster!=='rahmen'&&S.lage==='mitte'?Math.min(drag.p0[0],drag.p0[1]):S.r; if(S.muster!=='rahmen') S.lage='rand'; felder(); }
    if(drag.art==='d') drag.dist0=Math.hypot(drag.x-drag.p0[0]-RAHMEN,drag.y-drag.p0[1]-RAHMEN);
    wahl=null;
  }
  const S0=drag.S0;
  switch(drag.art){
    case 'b': S.b=begrenz(rund(S0.b+dx/10,.5),1,120); break;
    case 'h': S.h=begrenz(rund(S0.h+dy/10,.5),1,120); break;
    case 'bh': S.b=begrenz(rund(S0.b+dx/10,.5),1,120); S.h=begrenz(rund(S0.h+dy/10,.5),1,120); break;
    case 'a': S.a=begrenz(rund(drag.A1+dx,.5),2,200); break;
    case 'd': { const dist=Math.hypot(x-drag.p0[0]-RAHMEN,y-drag.p0[1]-RAHMEN); S.d=begrenz(rund(S0.d+2*(dist-drag.dist0),.5),.5,30); break; }
    case 'feld': { const v=Math.abs(dx)>=Math.abs(dy)?dx:dy; S.r=begrenz(rund(drag.r0+v,.5),0,Math.min(200,S.b*5,S.h*5)); break; }
    default: return;
  }
  ['b','h','d','a','r'].forEach(k=>{ $(k).value=S[k]; });
  planen();
}
function hoch(e){
  if(!drag||drag.svg!==e.currentTarget) return;
  const d=drag; drag=null;
  if(!d.bewegt){
    if(d.hit){ if(d.hit.geist) S.weg=S.weg.filter(k=>k!==d.hit.key); else wahl=wahl===d.hit.key?null:d.hit.key; }
    else if(d.art==='leer') wahl=null;
  }
  speichern(); felder(); zeichnen();
}
['pv','lv'].forEach(id=>{ const svg=$(id);
  svg.addEventListener('pointerdown',runter); svg.addEventListener('pointermove',zieh);
  svg.addEventListener('pointerup',hoch); svg.addEventListener('pointercancel',hoch); });
document.addEventListener('keydown',e=>{ if(e.target.matches('input')) return;
  if((e.key==='Delete'||e.key==='Backspace')&&wahl){ e.preventDefault(); lochWeg(); }
  if(e.key==='Escape'&&wahl){ wahl=null; zeichnen(false); } });
let rz=0; window.addEventListener('resize',()=>{ if(drag) return; cancelAnimationFrame(rz); rz=requestAnimationFrame(()=>zeichnen(false)); });

// ---------- Knöpfe und Zahlenfelder ----------
function felder(){
  ['b','h','d','a','r'].forEach(k=>{ $(k).value=S[k]; });
  document.querySelectorAll('#muster .chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.muster===S.muster)));
  document.querySelectorAll('#lage .chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.lage===S.lage)));
  document.querySelectorAll('#papier .chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.papier===S.papier)));
}
document.querySelectorAll('.stepper').forEach(st=>{
  const k=st.dataset.feld, inp=st.querySelector('input'), [lo,hi]=GRENZEN[k], schritt=+st.dataset.schritt||1;
  const setzen=v=>{ if(isNaN(v)) v=S[k]; S[k]=Math.min(hi,Math.max(lo,Math.round(v*100)/100)); inp.value=S[k]; speichern(); zeichnen(); };
  st.querySelector('[data-minus]').addEventListener('click',()=>setzen(S[k]-schritt));
  st.querySelector('[data-plus]').addEventListener('click',()=>setzen(S[k]+schritt));
  inp.addEventListener('change',()=>setzen(parseFloat(String(inp.value).replace(',','.'))));
  inp.addEventListener('input',()=>{ const v=parseFloat(String(inp.value).replace(',','.')); if(!isNaN(v)&&v>=lo&&v<=hi){ S[k]=v; speichern(); zeichnen(); } });
});
document.querySelectorAll('#muster .chip').forEach(c=>c.addEventListener('click',()=>{ S.muster=c.dataset.muster; felder(); speichern(); zeichnen(); }));
document.querySelectorAll('#lage .chip').forEach(c=>c.addEventListener('click',()=>{ S.lage=c.dataset.lage; felder(); speichern(); zeichnen(); }));
document.querySelectorAll('#papier .chip').forEach(c=>c.addEventListener('click',()=>{ S.papier=c.dataset.papier; felder(); speichern(); zeichnen(); }));
$('mehr').addEventListener('click',()=>{ const z=$('zahlen'), auf=z.hidden; z.hidden=!auf; $('mehr').setAttribute('aria-expanded',String(auf)); zeichnen(false); });
$('zurueckholen').addEventListener('click',()=>{ S.weg=[]; wahl=null; speichern(); zeichnen(); });
$('drucken').addEventListener('click',()=>window.print());
felder(); zeichnen();
})();
</script>
</body>
</html>
