<!doctype html>
<html lang="de-CH">
<head>

<title>Schritt für Schritt · Perlentier aus Bild</title>
<meta name="description" content="Bild hineinziehen, Perlentier-Plan für Rocailles mit Drahtweg bekommen: Hintergrund weg, Farben zählen, abstehende Ohren und Beine als Paare, drucken. Das Bild bleibt auf dem Gerät.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#EEF3F8;--surface:#FFFFFF;--surface2:#F5F8FB;--ink:#17212F;--muted:#5B6B80;--line:#D5DEE9;--acc:#17997A;--acc-ink:#FFFFFF;--acc-soft:#E3F4EF;--papier:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1621;--surface:#1A2433;--surface2:#141C28;--ink:#EDF2F8;--muted:#9DACBF;--line:#2B384A;--acc:#2FBF98;--acc-ink:#0F1621;--acc-soft:#16302B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1621;--surface:#1A2433;--surface2:#141C28;--ink:#EDF2F8;--muted:#9DACBF;--line:#2B384A;--acc:#2FBF98;--acc-ink:#0F1621;--acc-soft:#16302B;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.4 Nunito,system-ui,sans-serif}
h1,h2{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0}
h1{font-size:28px}
h2{font-size:17px;margin-bottom:10px}
a{color:var(--acc)}
.kopf{max-width:1200px;margin:0 auto;padding:20px 16px 8px}
.kopf p{margin:4px 0 0;color:var(--muted)}
main{max-width:1200px;margin:0 auto;padding:8px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:20px;align-items:start}
.karte{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.zone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:240px;border:3px dashed var(--line);border-radius:16px;padding:24px 16px;text-align:center;background:var(--surface2);cursor:pointer;color:var(--muted)}
.zone b{color:var(--ink);font:600 20px Fredoka,Nunito,sans-serif}
.zone svg{width:48px;height:48px;fill:none;stroke:var(--acc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.zone.ueber,body.ueber .zone{border-color:var(--acc);background:var(--acc-soft)}
.zone.klein{min-height:0;flex-direction:row;flex-wrap:wrap;padding:10px 14px;gap:4px 10px;font-size:14px}
.zone.klein svg{width:24px;height:24px;flex:none}
.zone.klein b{font-size:16px;white-space:nowrap}
.finger{display:none}
@media (pointer:coarse){.maus{display:none}.finger{display:inline}}
.knopf-text{font:inherit;font-size:14px;background:none;border:0;color:var(--acc);text-decoration:underline;cursor:pointer;padding:4px}
.plan{margin-top:14px;overflow:auto;border-radius:8px}
.plan svg{display:block;width:100%;max-height:80vh;height:auto;background:var(--papier);border-radius:8px;touch-action:auto}
.plan.malen svg{cursor:crosshair;touch-action:none}
.pruefung{margin-top:12px;padding:12px 14px;border-radius:14px;font-size:15px;background:var(--acc-soft)}
.legende{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin:10px 0 0}
.legende span{display:inline-flex;align-items:center;gap:6px}
.legende i{display:inline-block;width:18px;height:3px;border-radius:2px}
.seite-rechts{position:sticky;top:12px;display:flex;flex-direction:column;gap:14px}
.feld{margin-bottom:14px}
.lbl{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:6px}

.spanne svg{width:24px;height:16px;fill:currentColor}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--acc)}
.chip[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=text]{width:100%;font:inherit;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--surface2);color:var(--ink)}
.drucken{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--acc);color:var(--acc-ink);font:600 20px Fredoka,Nunito,sans-serif;cursor:pointer}
.drucken:disabled{opacity:.45;cursor:default}
.drucken svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round}
.info{font-size:15px;margin:10px 0 0}
.hinweis{font-size:13px;color:var(--muted);margin:8px 0 0}
.farben{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.farbe{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;text-align:left}
.farbe[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.farbe i{flex:none;width:16px;height:22px;border-radius:6px/5px;border:1.5px solid rgba(0,0,0,.35)}
.farbe span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.farbe small{color:var(--muted);font-weight:800}
details{margin-top:8px}
summary{cursor:pointer;font-size:14px;color:var(--muted)}
.alle{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.alle button{width:30px;height:30px;border-radius:50%;border:2px solid rgba(0,0,0,.3);cursor:pointer}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .farbe i,:root:not([data-theme="light"]) .alle button:not([aria-pressed="true"]){border-color:rgba(255,255,255,.4)}}
:root[data-theme="dark"] .farbe i,:root[data-theme="dark"] .alle button:not([aria-pressed="true"]){border-color:rgba(255,255,255,.4)}
.alle button[aria-pressed="true"]{outline:3px solid var(--acc);outline-offset:2px}
button:focus-visible,.zone:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
@media (max-width:860px){main{grid-template-columns:minmax(0,1fr)}.seite-rechts{position:static}h1{font-size:24px}}
#druck{display:none}
@page{size:A4 portrait;margin:0}
@media print{
  body{background:#fff}
  .kopf,main{display:none!important}
  #druck{display:block}
  #druck svg{display:block;width:210mm;height:297mm}
}

<body>

<script src="../zurueck.js"></script>
<main>
  <section class="karte" aria-label="Bild und Plan">

      </div>

</main>
<div id="druck"></div>
<script>
// Perlenfarben wie bei den fertigen Perlentieren (vorlagen/perlen), dazu hautfarben
const FARBE={g:['#3FA34D','grün'],d:['#1F6B35','dunkelgrün'],h:['#B5DE7A','hellgrün'],s:['#1C2430','schwarz'],w:['#FFFFFF','weiss'],r:['#D7352E','rot'],y:['#F4C430','gelb'],o:['#F08A24','orange'],b:['#2A6FDB','blau'],l:['#9CD0F5','hellblau'],p:['#F6AFC6','rosa'],q:['#D9487A','pink'],k:['#8A5A35','braun'],c:['#E2BC72','ocker'],n:['#A7B1BE','grau'],v:['#7B4FC9','violett'],u:['#F3C9A0','hautfarben']};
const KEY=Object.keys(FARBE),N=KEY.length;
// Rocailles 3 mm sind kurze Röhrchen: auf dem Draht 2 mm lang, quer dazu 3 mm hoch. Ein Feld im Raster ist darum Q so breit wie hoch.
const ML=2,MD=3,Q=ML/MD,PE={name:'Rocailles 3 mm',l:.2,d:.3,draht:'0,3 mm'};
const FARBZAHL=[3,4,6,8,0];
const A='#2A6FDB',B=A;   // ein Draht, eine Farbe: A und B sind nur die zwei Enden
const $=id=>document.getElementById(id);
const S={bild:null,vor:null,reihen:14,farben:8,hg:true,t:null,notiz:null,pinsel:null,ans:null};

// Farbabstand im Lab-Raum
const lin=v=>(v/=255)<=.04045?v/12.92:((v+.055)/1.055)**2.4;
function lab(r,g,b){const R=lin(r),G=lin(g),B=lin(b),f=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;
  const x=f((R*.4124+G*.3576+B*.1805)/.95047),y=f(R*.2126+G*.7152+B*.0722),z=f((R*.0193+G*.1192+B*.9505)/1.08883);
  return [116*y-16,500*(x-y),200*(y-z)]}
const hexRgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const PLAB=KEY.map(k=>lab(...hexRgb(FARBE[k][0])));
const d2=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2;
function naechste(l0,l1,l2){let b=0,bd=1e18;for(let k=0;k<N;k++){const p=PLAB[k],d=(l0-p[0])**2+(l1-p[1])**2+(l2-p[2])**2;if(d<bd){bd=d;b=k}}return b}

// Ausschnitt (sx,sy,sw,sh) des Bilds auf W×H Pixel; vorher schrittweise halbieren, sonst werden Fotos körnig
function verkleinern(img,sx,sy,sw,sh,W,H){
  let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height,src=img,s=1;
  while(sw*s/2>=W*2&&sh*s/2>=H*2){w=Math.round(w/2);h=Math.round(h/2);const t=document.createElement('canvas');t.width=w;t.height=h;
    const x=t.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(src,0,0,w,h);src=t;s/=2}
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.imageSmoothingQuality='high';
  x.drawImage(src,sx*s,sy*s,sw*s,sh*s,0,0,W,H);
  return x.getImageData(0,0,W,H).data;
}

// 1. Bild auf höchstens 600 Pixel, Lab-Farben, Hintergrund weg, jedes Pixel bekommt die nächste Perlenfarbe (-1 = Hintergrund)
function vorbereiten(){
  const iw=S.bild.naturalWidth||S.bild.width,ih=S.bild.naturalHeight||S.bild.height,s=Math.min(1,600/Math.max(iw,ih));
  const w=Math.max(8,Math.round(iw*s)),h=Math.max(8,Math.round(ih*s)),n=w*h,d=verkleinern(S.bild,0,0,iw,ih,w,h);
  const Lb=new Float32Array(3*n),hg=new Uint8Array(n);
  for(let i=0;i<n;i++){const a=d[4*i+3]/255;if(a<.5)hg[i]=1;
    const l=lab(d[4*i]*a+255*(1-a),d[4*i+1]*a+255*(1-a),d[4*i+2]*a+255*(1-a));Lb[3*i]=l[0];Lb[3*i+1]=l[1];Lb[3*i+2]=l[2]}
  if(S.hg)hintergrund(w,h,Lb,hg);
  const pal=new Int8Array(n);let x0=w,x1=-1,y0=h,y1=-1;
  for(let i=0;i<n;i++){if(hg[i]){pal[i]=-1;continue}pal[i]=naechste(Lb[3*i],Lb[3*i+1],Lb[3*i+2]);
    const x=i%w,y=(i-x)/w;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  return {w,h,Lb,pal,x0,x1,y0,y1,offen:{},koerper:koerper(w,h,pal)};
}

// Hintergrund: durchsichtige Pixel, dazu die häufigste Randfarbe von den Rändern her wegfüllen.
// Toleranz für JPG-Rauschen; der Schritt von Pixel zu Pixel muss klein bleiben, so frisst die Füllung keine hellen Flächen der Figur.
// Grosse, ganz eingeschlossene Flächen in Hintergrundfarbe (z. B. zwischen Arm und Bauch) fallen auch weg.
function hintergrund(w,h,Lb,hg){
  const n=w*h,rand=[],durch=hg.slice(),D=(i,j)=>(Lb[3*i]-Lb[3*j])**2+(Lb[3*i+1]-Lb[3*j+1])**2+(Lb[3*i+2]-Lb[3*j+2])**2;
  for(let x=0;x<w;x++)rand.push(x,(h-1)*w+x);for(let y=1;y<h-1;y++)rand.push(y*w,y*w+w-1);
  const op=rand.filter(i=>!hg[i]),sp=Math.ceil(op.length/300),probe=op.filter((_,k)=>k%sp===0);
  let ref=null,best=-1,bn=0;
  for(const i of probe){let k=0;for(const j of probe)if(D(i,j)<100)k++;if(k>bn){bn=k;best=i}}
  if(best>=0&&bn>=probe.length*.25){const m=probe.filter(j=>D(best,j)<100);ref=[0,1,2].map(k=>m.reduce((s,j)=>s+Lb[3*j+k],0)/m.length)}
  if(!ref)return;
  // Toleranz nach dem Rauschen am Rand: sauberer Hintergrund streng, körniges JPG grosszügiger
  const ab=i=>(Lb[3*i]-ref[0])**2+(Lb[3*i+1]-ref[1])**2+(Lb[3*i+2]-ref[2])**2,rr=op.map(ab).filter(v=>v<100).sort((a,b)=>a-b);
  const tol=Math.max(4,Math.min(14,3*Math.sqrt(rr[Math.floor(rr.length*.8)]||0))),t2=tol*tol,schritt=Math.min(49,t2/2);
  const nah=i=>ab(i)<t2;
  const q=new Int32Array(n);let qa=0,qe=0;
  for(let i=0;i<n;i++)if(hg[i])q[qe++]=i;
  for(const i of rand)if(!hg[i]&&nah(i)){hg[i]=1;q[qe++]=i}
  while(qa<qe){const i=q[qa++],x=i%w;
    for(const j of[x>0?i-1:-1,x<w-1?i+1:-1,i-w,i+w])if(j>=0&&j<n&&!hg[j]&&nah(j)&&(durch[i]||D(i,j)<schritt)){hg[j]=1;q[qe++]=j}}
  const gesehen=new Uint8Array(n),minL=n*.002;
  for(let s=0;s<n;s++){if(hg[s]||gesehen[s]||!nah(s))continue;
    const teil=[s];gesehen[s]=1;let rand_=false;
    for(let k=0;k<teil.length;k++){const i=teil[k],x=i%w;
      for(const j of[x>0?i-1:-1,x<w-1?i+1:-1,i-w,i+w]){if(j<0||j>=n)continue;if(hg[j])rand_=true;else if(!gesehen[j]&&nah(j)){gesehen[j]=1;teil.push(j)}}}
    // nur was im Mittel genau wie der Hintergrund aussieht: weisse Handschuhe oder Augen (leicht grau) bleiben
    const mi=[0,1,2].map(k=>teil.reduce((s,i)=>s+Lb[3*i+k],0)/teil.length);
    if(!rand_&&teil.length>=minL&&(mi[0]-ref[0])**2+(mi[1]-ref[1])**2+(mi[2]-ref[2])**2<5)for(const i of teil)hg[i]=1}
}

// Öffnen einer Maske: bleibt nur, wo ein ganzes Quadrat (2r+1)² hineinpasst. Dünnes fällt weg, Flächen bleiben fast unverändert.
function oeffneMaske(w,h,m,r){
  const W1=w+1,I=new Int32Array(W1*(h+1)),kern=new Uint8Array(w*h),aus=new Uint8Array(w*h);
  const integral=f=>{for(let y=0;y<h;y++){let s=0;for(let x=0;x<w;x++){s+=f[y*w+x];I[(y+1)*W1+x+1]=I[y*W1+x+1]+s}}};
  const summe=(x,y)=>{const x0=Math.max(0,x-r),y0=Math.max(0,y-r),x1=Math.min(w,x+r+1),y1=Math.min(h,y+r+1);return [I[y1*W1+x1]-I[y0*W1+x1]-I[y1*W1+x0]+I[y0*W1+x0],(x1-x0)*(y1-y0)]};
  integral(m);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(m[i]){const [s,f]=summe(x,y);kern[i]=s===f?1:0}}
  integral(kern);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(m[i]&&summe(x,y)[0]>0)aus[i]=1}
  return aus;
}
// Dünne Linien (Umrisse, Schraffur) weg: eine Farbe bleibt nur dort, wo sie eine Fläche bildet.
// Was wegfällt, bekommt die Farbe der nächsten Fläche. So bleiben Augen und Flecken, schwarze Umrisslinien verschwinden.
function oeffnen(w,h,pal,r){
  const n=w*h,aus=new Int8Array(n).fill(-2),da=new Set(pal);da.delete(-1);
  for(const c of da){const o=oeffneMaske(w,h,pal.map(v=>v===c?1:0),r);for(let i=0;i<n;i++)if(o[i])aus[i]=c}
  const q=new Int32Array(n);let qa=0,qe=0;
  for(let i=0;i<n;i++){if(pal[i]<0)aus[i]=-1;else if(aus[i]>=0)q[qe++]=i}
  while(qa<qe){const i=q[qa++],x=i%w;for(const j of[x>0?i-1:-1,x<w-1?i+1:-1,i-w,i+w])if(j>=0&&j<n&&aus[j]===-2){aus[j]=aus[i];q[qe++]=j}}
  for(let i=0;i<n;i++)if(aus[i]===-2)aus[i]=pal[i];
  return aus;
}
// Körper = Figur ohne abstehende Teile: öffnen mit einem Quadrat von etwa 40 % der Figurgrösse, dann das grösste Stück.
// Ohren, Arme, Hände, Beine und Schwanz fallen so weg und werden später zu Paaren.
function koerper(w,h,pal){

      T.enden.map(({p:q,pfeil})=>pfeil?`<path d="M${P_(q[4])}l${(pfeil*.34*sk).toFixed(2)} ${(-.21*sk).toFixed(2)}v${(.42*sk).toFixed(2)}z" fill="${A}" ${rand}/>`:
        `<circle cx="${(ox+q[3][0]*sk).toFixed(2)}" cy="${(oy+q[3][1]*sk).toFixed(2)}" r="${(sk*.13).toFixed(2)}" fill="${A}" ${rand}/>`).join('')}).join('');
}
// Platz rechts für die Anzahl: längster Text mal Zeichenbreite
const rechtsText=t=>Math.max(...t.rows.map((r,i)=>`${r.length}${beinText(t,i)}`.length));
function luftGeo(t){const g=geometrie(t,Q,1);g.x0-=.35;g.x1+=.35;g.y1+=1.3;return g}

function planSvg(){
  const t=S.t,g=luftGeo(t),sk=10,fs=5.2,links=fs*.74+fs*1.6+Math.min(fs*.9,sk*.55)+3,rechts=fs*.74+Math.max(rechtsText(t),6)*fs*.56+4;   // mindestens so breit wie die Überschrift «Perlen»
  const ox=links-g.x0*sk,oben=Math.min(g.y0*sk,-.64*sk)-fs*1.3-fs*.6-4,oy=-oben,w=links+(g.x1-g.x0)*sk+rechts,h=oy+g.y1*sk+4;
  S.ans={ox,oy,sk,g};
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w.toFixed(1)} ${h.toFixed(1)}" font-family="Nunito,Arial,sans-serif" role="img" aria-label="Perlentier-Plan, ${t.rows.length} Reihen, mit Drahtweg" id="plansvg">`+
    `<rect width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="#fff"/>`+muster(t,g,sk,ox,oy,fs)+`</svg>`;
}

// Technik-Bilder (eigene Zeichnungen, wie bei den fertigen Perlentieren)
function perle(x,y,r=2.1,f='#E8EDF3',dr=0){return `<rect x="${-r*.68}" y="${-r}" width="${r*1.36}" height="${2*r}" rx="1" ry="1.1" transform="translate(${x} ${y})${dr?` rotate(${dr})`:''}" fill="${f}" stroke="#1c2430" stroke-width=".3"/>`}
function technik(x,y,naehen=false){
  const L=(d,c)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width=".6" stroke-linecap="round"/>`;
  const T=(tx,ty,s,nr)=>`<circle cx="${tx}" cy="${ty-1.1}" r="2.4" fill="#17997A"/><text x="${tx}" y="${ty}" font-size="3" font-weight="800" fill="#fff" text-anchor="middle">${nr}</text><text x="${tx+4}" y="${ty}" font-size="3.4" font-weight="800" fill="#1c2430">${s}</text>`;
  let o=`<g transform="translate(${x} ${y})">`;
  o+=T(1.5,3,'Reihe 1',1);
  o+=L('M6 10H32',A)+L('M32 10H58',B)+perle(29.8,10)+perle(34.2,10)+
    `<text x="5" y="8" font-size="2.6" font-weight="800" fill="${A}">Ende A</text><text x="59" y="8" font-size="2.6" font-weight="800" fill="${B}" text-anchor="end">Ende B</text>`;
  o+=T(1.5,18,'Reihe 2',2);
  o+=`<g transform="translate(0 20)">`+
    L('M29.8 4C20 4 18 13.4 26 13.4H56',A)+L('M34.2 4C44 4 46 14.6 38 14.6H9',B)+
    perle(29.8,4)+perle(34.2,4)+perle(27.6,14)+perle(32,14)+perle(36.4,14)+`</g>`;
  o+=T(1.5,40,'Ziehen',3);
  o+=`<g transform="translate(0 41)">`+
    L('M29.8 4C25 4 24 8.6 27 8.6H38.5C42 8.6 46 12 52 15',A)+L('M34.2 4C39 4 40 9.4 37 9.4H25.5C22 9.4 18 12 12 15',B)+
    perle(29.8,4)+perle(34.2,4)+perle(27.6,9)+perle(32,9)+perle(36.4,9)+`</g>`;
  o+=T(1.5,61,'Bein',4);
  o+=`<g transform="translate(0 62)">`+
    L('M12 5.4H38.6C40.2 5.4 39.6 2.4 41.3 2.4V9.6C39.6 9.6 40.2 6.6 38.6 6.6H26',A)+
    perle(14,6)+perle(18.4,6)+perle(22.8,6)+perle(28.6,6,2.1,'#cfe7dc')+perle(33,6,2.1,'#cfe7dc')+perle(37.4,6,2.1,'#cfe7dc')+
    perle(41.3,6,2.1,'#fde0c8',90)+`</g>`;
  o+=T(1.5,76,'Verdrehen',5);
  o+=`<g transform="translate(0 77)">`+
    L('M29 1C29 3 35 4 35 6C35 8 29 8 29 10C29 12 35 12 35 14',A)+L('M35 1C35 3 29 4 29 6C29 8 35 8 35 10C35 12 29 12 29 14',B)+
    perle(29.8,1)+perle(34.2,1)+`</g>`;
  // Teil quer ans Körperstück: die Enden der letzten Reihe laufen durch die ganze Körperreihe
  if(naehen){
    o+=T(1.5,97,'Annähen',6);
    let f=`<g transform="translate(0 98)">`;
    for(const by of[3,7.6,12.2,16.8])for(const bx of[29,32.4,35.8,39.2,42.6])f+=perle(bx,by,1.7);
    for(const [px,py] of[[24,6.7],[24,9.9],[24,13.1],[19.6,8.3],[19.6,11.5],[15.2,9.9]])f+=perle(px,py,1.7,'#fde0c8',90);
    f+=L('M24 5.3V14.5',A)+L('M24 5.3C24 3 26 3 46.5 3',A)+L('M24 14.5C24 16.8 26 16.8 46.5 16.8',B)+
      `<path d="M48 3l-2 -1.1v2.2z" fill="${A}"/><path d="M48 16.8l-2 -1.1v2.2z" fill="${B}"/>`;
    o+=f+`</g>`}
  return o+'</g>';
}

function blatt(){
  const t=S.t,titel=esc($('titel').value.trim()||'Mein Tier'),{z,n}=zaehlen(t),g0=geometrie(t),g=luftGeo(t);
  const breit=(g0.x1-g0.x0-1+g0.q)*PE.d,hoch=(g0.y1-g0.y0)*PE.d;
  const F={x:84,y:34,w:116,h:186},lr=10,rr=Math.max(14,rechtsText(t)*1.95+3),bw=g.x1-g.x0,bh=g.y1-g.y0;
  const sk=Math.min((F.w-lr-rr)/bw,(F.h-8)/bh,10),ox=F.x+lr+((F.w-lr-rr)-bw*sk)/2-g.x0*sk,oy=F.y+8-g.y0*sk,fs=Math.min(3.4,sk*.62);
  const legende=`<path d="M128 225.5h6" stroke="${A}" stroke-width=".8"/><text x="135.5" y="226.5" font-size="2.9" fill="#1c2430">Draht</text>`;
  // Felder zum Bereitlegen, bei vielen Farben in zwei Zeilen
  const farben=Object.keys(z).sort((a,b)=>z[b]-z[a]),sp=Math.min(5,farben.length),zr=Math.ceil(farben.length/sp),fb=(190-(sp-1)*4)/sp,fh=(38-(zr-1)*3)/zr;
  let feld=`<text x="10" y="232" font-size="4.2" font-weight="800" fill="#1c2430">Perlen bereitlegen</text>`;
  farben.forEach((c,k)=>{const fx=10+(k%sp)*(fb+4),fy=236+Math.floor(k/sp)*(fh+3);
    feld+=`<rect x="${fx.toFixed(2)}" y="${fy.toFixed(2)}" width="${fb.toFixed(2)}" height="${fh.toFixed(2)}" rx="4" fill="#F5F8FB" stroke="#D5DEE9" stroke-width=".4"/>`+
      `<rect x="${(fx+3.6).toFixed(2)}" y="${(fy+3).toFixed(2)}" width="2.8" height="4" rx=".9" fill="${FARBE[c][0]}" stroke="#1c2430" stroke-width=".3"/><text x="${(fx+9).toFixed(2)}" y="${(fy+6.1).toFixed(2)}" font-size="3.1" fill="#1c2430"><tspan font-weight="800">${z[c]}</tspan> × ${FARBE[c][1]}</text>`});
  // Material links, bei vielen Farben in zwei Spalten
  const zwei=farben.length>8;let mat=`<text x="10" y="36" font-size="4.2" font-weight="800" fill="#1c2430">Du brauchst</text>`,y=42.5;
  farben.forEach((c,k)=>{const x=zwei&&k%2?47:10;
    mat+=`<rect x="${x+.9}" y="${y-2.8}" width="2.6" height="3.6" rx=".8" fill="${FARBE[c][0]}" stroke="#1c2430" stroke-width=".3"/><text x="${x+6}" y="${y}" font-size="3.3" fill="#1c2430"><tspan font-weight="800">${z[c]}</tspan> × ${FARBE[c][1]}</text>`;
    if(!zwei||k%2||k===farben.length-1)y+=5});
  mat+=`<text x="10" y="${y+.5}" font-size="3.1" fill="#1c2430"><tspan font-weight="800">${lang(draht(t,PE))}</tspan> Draht, ${PE.draht} dick</text>`+
    `<text x="10" y="${y+5}" font-size="3.1" fill="#1c2430">Seitenschneider</text>`;
  y+=9;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm" font-family="Nunito,Arial,sans-serif" role="img" aria-label="Perlentier ${titel}: Fädelmuster">`+
    `<rect width="210" height="297" fill="#fff"/>`+
    `<text x="10" y="17" font-size="7.5" font-weight="800" fill="#1c2430" font-family="Fredoka,Nunito,Arial,sans-serif">Perlentier: ${titel}</text>`+
    `<text x="10" y="23.5" font-size="3.4" fill="#5b6573">${t.rows.length} Reihen · ${n} ${PE.name} · ${f1(breit)} × ${f1(hoch)} cm</text>`+
    `<line x1="10" y1="27" x2="200" y2="27" stroke="#D5DEE9" stroke-width=".4"/>`+
    mat+technik(10,y,t.teile.length>0)+
    muster(t,g,sk,ox,oy,fs)+legende+feld+`</svg>`;
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hell=k=>PLAB[KEY.indexOf(k)][0]>60;

function zeichnen(){
  $('reihen-zahl').textContent=`${S.reihen} Reihen`;
  document.querySelectorAll('#farbzahl .chip').forEach(k=>k.setAttribute('aria-pressed',+k.dataset.n===S.farben));
  document.querySelectorAll('#hg .chip').forEach(k=>k.setAttribute('aria-pressed',(k.dataset.h==='1')===S.hg));
  const t=S.t,da=!!t;
  if(da&&!S.bild)$('reihen-zahl').textContent=`${t.rows.length} Reihen`;
  $('drucken').disabled=!da;$('farben-karte').hidden=!da;$('zone').classList.toggle('klein',da);$('beispiel-zeile').hidden=!!S.bild;
  $('legende').hidden=$('pruefung').hidden=!da;
  if(!da){$('plan').innerHTML='';return}
  $('plan').innerHTML=planSvg();$('plan').classList.toggle('malen',S.pinsel!==null);
  const {z,n}=zaehlen(t),g0=geometrie(t),fa=Object.keys(z).sort((a,b)=>z[b]-z[a]);
  $('info').textContent=`${t.rows.length} Reihen${t.teile.length?` + ${t.teile.length} Teile`:''} · ${n} Perlen · ${f1((g0.x1-g0.x0-1+g0.q)*PE.d)} × ${f1((g0.y1-g0.y0)*PE.d)} cm · ${lang(draht(t,PE))} Draht`;
  const weg=S.notiz?S.notiz.weg:0;
  $('pruefung').hidden=!weg;$('pruefung').textContent=`✂ ${weg} weg`;
  $('farben').innerHTML=fa.map(k=>`<button type="button" class="farbe" data-c="${KEY.indexOf(k)}" aria-pressed="${S.pinsel===KEY.indexOf(k)}"><i style="background:${FARBE[k][0]}"></i><span>${FARBE[k][1]}</span><small>${z[k]}</small></button>`).join('')+
    `<button type="button" class="farbe" data-c="-1" aria-pressed="${S.pinsel===-1}"><i style="background:transparent;border-style:dashed"></i><span>weg</span></button>`;
  $('alle').innerHTML=KEY.map((k,c)=>`<button type="button" data-c="${c}" style="background:${FARBE[k][0]}" title="${FARBE[k][1]}" aria-label="${FARBE[k][1]}" aria-pressed="${S.pinsel===c}"></button>`).join('');
}

// Malen auf dem Plan: Perle umfärben, wegnehmen oder neben dem Reihenende dazusetzen
let malt=false,plan=0;
function perleBei(e){const svg=$('plansvg');if(!svg||!S.ans)return null;const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;
  const u=p.matrixTransform(svg.getScreenCTM().inverse()),{ox,oy,sk,g}=S.ans,gx=(u.x-ox)/sk,gy=(u.y-oy)/sk;
  let b=null,bd=.3;for(const q of g.P){const d=(q.x-gx)**2+(q.y-gy)**2;if(d<bd){bd=d;b=q}}
  if(b)return {perle:b};
  const i=S.t.rows.findIndex((_,k)=>Math.abs(g.ry[k]-gy)<.5);if(i<0)return null;
  const e_=S.t.rows[i].length/2*g.q;return Math.abs(gx)>e_&&Math.abs(gx)<e_+g.q*1.5?{reihe:i,seite:gx<0?-1:1}:null}
function malen(e,neu){const h=perleBei(e),t=S.t,c=S.pinsel;if(!h)return;
  if(h.perle){const [art,i,j,k]=h.perle.ref;
    if(art==='r'){const r=t.rows[i];if(c<0){if(!neu||r.length<2)return;t.rows[i]=r.slice(0,j)+r.slice(j+1)}else{if(r[j]===KEY[c])return;t.rows[i]=r.slice(0,j)+KEY[c]+r.slice(j+1)}}
    else if(art==='t'){const p=t.teile[i],r=p.rows[j];if(c<0){if(!neu)return;if(r.length>1)p.rows[j]=r.slice(0,k)+r.slice(k+1);else if(p.rows.length>1)p.rows.splice(j,1);else t.teile.splice(i,1)}else{if(r[k]===KEY[c])return;p.rows[j]=r.slice(0,k)+KEY[c]+r.slice(k+1)}}
    else{const f=art==='f',l=f?t.teile[i].beine:t.beine,bi=f?j:i,[was,m]=h.perle.ref.slice(f?3:2),b=l[bi];
      if(c<0){if(!neu)return;l.splice(bi,1)}
      else if(was==='fc'){if(b.fc===KEY[c])return;b.fc=KEY[c]}
      else{const z=[...Array(b.n)].map((_,o)=>bc(b,o));if(z[m]===KEY[c])return;z[m]=KEY[c];b.c=z.join('')}}}
  else if(neu&&c>=0){const r=t.rows[h.reihe];t.rows[h.reihe]=h.seite<0?KEY[c]+r:r+KEY[c]}
  else return;
  if(!plan)plan=requestAnimationFrame(()=>{plan=0;zeichnen()})}
$('plan').addEventListener('pointerdown',e=>{if(S.pinsel===null||!S.t)return;malt=true;e.preventDefault();malen(e,true)});
$('plan').addEventListener('pointermove',e=>{if(malt)malen(e,false)});
addEventListener('pointerup',()=>malt=false);
const pinsel=e=>{const b=e.target.closest('[data-c]');if(!b)return;const c=+b.dataset.c;S.pinsel=S.pinsel===c?null:c;zeichnen()};
$('farben').addEventListener('click',pinsel);$('alle').addEventListener('click',pinsel);

// Bild laden: Datei, Ziehen, Einfügen, Beispiel
// Neues Bild: Grösse so wählen, dass die Figur etwa 22 Perlen breit wird (12 bis 20 Reihen)
function neuesBild(img){S.bild=img;S.pinsel=null;const V=S.vor=vorbereiten();
  if(V.x1>=0){S.reihen=Math.max(12,Math.min(20,Math.round(22*(V.y1-V.y0+1)*Q/(V.x1-V.x0+1))));$('reihen').value=S.reihen}
  berechnen()}
function laden(datei){
  if(!datei)return;
  if(!datei.type.startsWith('image/')){$('info').textContent='⚠ Kein Bild';return}
  const url=URL.createObjectURL(datei),img=new Image();
  img.onload=()=>{const nm=(datei.name||'').replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim();
    if(nm&&nm!=='image')$('titel').value=nm.slice(0,40);neuesBild(img);URL.revokeObjectURL(url)};
  img.onerror=()=>{URL.revokeObjectURL(url);$('info').textContent='⚠ Bild defekt'};
  img.src=url;
}
$('zone').addEventListener('click',()=>$('datei').click());
$('zone').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('datei').click()}});
$('datei').addEventListener('change',e=>{laden(e.target.files[0]);e.target.value=''});
addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('ueber')});
addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('ueber')});
addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('ueber');laden(e.dataTransfer.files[0])});
addEventListener('paste',e=>{const f=[...(e.clipboardData?.files||[])].find(f=>f.type.startsWith('image/'));if(f)laden(f)});
$('beispiel').addEventListener('click',()=>{   // eigenes Beispiel: Marienkäfer von oben mit Fühlern
  const c=document.createElement('canvas');c.width=240;c.height=300;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,240,300);
  x.strokeStyle='#1B1B1B';x.lineWidth=9;x.lineCap='round';x.beginPath();x.moveTo(108,50);x.lineTo(82,8);x.moveTo(132,50);x.lineTo(158,8);x.stroke();
  x.fillStyle='#1B1B1B';x.beginPath();x.arc(120,82,40,0,7);x.fill();
  x.fillStyle='#D52B2B';x.beginPath();x.ellipse(120,185,92,100,0,0,7);x.fill();
  x.strokeStyle='#1B1B1B';x.lineWidth=16;x.beginPath();x.moveTo(120,90);x.lineTo(120,282);x.stroke();
  x.fillStyle='#1B1B1B';x.beginPath();for(const [px,py] of[[75,145],[165,145],[68,215],[172,215],[100,252],[140,252]]){x.moveTo(px+17,py);x.arc(px,py,17,0,7)}x.fill();
  x.fillStyle='#F4F4F2';x.beginPath();x.arc(102,68,10,0,7);x.arc(138,68,10,0,7);x.fill();
  $('titel').value='Marienkäfer';neuesBild(c);
});
// Kolibri: Flügel quer, an den Reihen 17 und 21 angenäht, Federn am Flügel, Schwanz an der letzten Reihe
const KOLIBRI=(()=>{const fe=(k,s,n,a,o)=>({k,s,n,f:1,a,c:'l',fc:'l',o});
  const fluegel=x=>({rows:['y','yy','yyy','yyyy'],quer:x,y:18,x:x*4,an:[16,20],beine:[fe(0,-1,9,0,[1.1,-.8]),fe(0,-1,8,-58,[1.9,.25]),fe(0,1,7,-71,[1,1]),fe(0,1,5,-84,[.1,.78]),fe(1,1,4,-90,[-1,1.12]),fe(2,1,4,-90,[-2,1.45])]});
  const sch=(a,o)=>({r:33,n:7,f:1,a,c:'l',fc:'l',w:'Schwanz',o});
  return {rows:['s','s','s','s','s','s','yyy','ppp','wyyyw','pppp','wsyyysw','ppppp','yyyyyyyyy','pwwwwp','yyyyyyy','wwwwwwww','yylyy','wwwwwwwww','yyllyy','wwwwwwwww','yylllyy','wwwwwwwwww','yylllyy','wwwwwwwwwww','yyllyy','wwwwwwwwww','yylyy','wwwwwwww','yyyy','wwwwww','yyy','wwww','y'],beine:[sch(-60,[.3,-.2]),sch(-74,[-.3,.1])],teile:[fluegel(-1),fluegel(1)]}})();
$('kolibri').addEventListener('click',()=>{S.bild=null;S.vor=null;S.t=JSON.parse(JSON.stringify(KOLIBRI));S.notiz=null;S.pinsel=null;$('titel').value='Kolibri';zeichnen()});

// Einstellungen
$('farbzahl').innerHTML=FARBZAHL.map(n=>`<button type="button" class="chip" data-n="${n}">${n||'alle'}</button>`).join('');
$('hg').innerHTML=`<button type="button" class="chip" data-h="1">weglassen</button><button type="button" class="chip" data-h="0">behalten</button>`;
$('farbzahl').addEventListener('click',e=>{const k=e.target.closest('.chip');if(!k)return;S.farben=+k.dataset.n;berechnen();zeichnen()});
$('hg').addEventListener('click',e=>{const k=e.target.closest('.chip');if(!k)return;S.hg=k.dataset.h==='1';S.vor=null;berechnen();zeichnen()});
$('reihen').addEventListener('input',e=>{S.reihen=+e.target.value;$('reihen-zahl').textContent=`${S.reihen} Reihen`});
$('reihen').addEventListener('change',()=>{berechnen();zeichnen()});
function drucken(){if(S.t)$('druck').innerHTML=blatt()}
addEventListener('beforeprint',drucken);
$('drucken').addEventListener('click',()=>{drucken();window.print()});
zeichnen();
</script>
</body>
