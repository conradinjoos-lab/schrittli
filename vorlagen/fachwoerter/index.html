<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schritt für Schritt · Fachwörter</title>
<meta name="description" content="Fachwort-Karten für den TTG-Unterricht: 48 Wörter aus Nähen, Stricken, Häkeln, Weben, Filzen, Holz und mehr – mit Bild und Erklärung. Als Karten, Plakat oder Memory drucken (A4 oder A3).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{--bg:#EEF3F8;--surface:#FFFFFF;--surface2:#F5F8FB;--ink:#17212F;--muted:#5B6B80;--line:#D5DEE9;--acc:#17997A;--acc-ink:#FFFFFF;--acc-soft:#E3F4EF;--papier:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1621;--surface:#1A2433;--surface2:#141C28;--ink:#EDF2F8;--muted:#9DACBF;--line:#2B384A;--acc:#2FBF98;--acc-ink:#0F1621;--acc-soft:#16302B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1621;--surface:#1A2433;--surface2:#141C28;--ink:#EDF2F8;--muted:#9DACBF;--line:#2B384A;--acc:#2FBF98;--acc-ink:#0F1621;--acc-soft:#16302B;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.4 Nunito,system-ui,sans-serif}
h1,h2{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0}
h1{font-size:28px}
h2{font-size:17px;margin-bottom:10px}
a{color:var(--acc)}
.kopf{max-width:1200px;margin:0 auto;padding:20px 16px 8px}
.kopf p{margin:4px 0 0;color:var(--muted)}
main{max-width:1200px;margin:0 auto;padding:8px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);grid-template-areas:"filter rechts" "liste rechts";grid-template-rows:auto 1fr;gap:14px 20px;align-items:start}
#k-filter{grid-area:filter}#k-liste{grid-area:liste}.seite-rechts{grid-area:rechts;position:sticky;top:12px;display:flex;flex-direction:column;gap:14px}
.karte{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.feld{margin-bottom:14px}.feld:last-child{margin-bottom:0}
.lbl{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--punkt,var(--muted));flex:none}
.chip[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.chip:hover{border-color:var(--acc)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.suche{width:100%;font:inherit;font-size:16px;border:2px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);padding:8px 12px}
.zeile{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.zeile .suche{flex:1;min-width:180px}
.treffer{font-size:14px;color:var(--muted);margin:0}
/* Karten am Bildschirm */
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.fw{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 10px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surface2);text-align:center;border-top:6px solid var(--farbe,var(--line))}
.fw .bild{width:100px;height:100px;background:var(--papier);border-radius:14px;padding:6px}
.fw .bild svg{width:100%;height:100%}
.fw .wort{font:600 19px Fredoka,Nunito,sans-serif;line-height:1.15}
.fw .erkl{font-size:13px;color:var(--muted);margin:0}
.fw .vf{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.einfach .fw .wort{text-transform:uppercase;font-size:20px;letter-spacing:.03em}
.ohne .fw .erkl{display:none}
.pikto{stroke:#1C2430;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
.leer{color:var(--muted);padding:20px;text-align:center}
.drucken{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--acc);color:var(--acc-ink);font:600 20px Fredoka,Nunito,sans-serif;cursor:pointer}
.drucken svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round}
.hinweis{font-size:13px;color:var(--muted);margin:8px 0 0}
/* Vorschau: die Druckseiten verkleinert */
.vorschau{display:flex;flex-direction:column;gap:10px;--s:.5}
.blatt{width:calc(var(--bw)*var(--s));height:calc(var(--bh)*var(--s));overflow:hidden;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.18);background:#fff}
.blatt .seite{transform:scale(var(--s));transform-origin:0 0}
@media (max-width:860px){
  main{display:flex;flex-direction:column;align-items:stretch;gap:14px}
  .seite-rechts{display:contents}
  #k-filter{order:1}#k-druck{order:2}#k-liste{order:3}#k-vorschau{order:4}
  h1{font-size:24px}
  .raster{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
}
/* ---------- Druckseiten (Masse in mm) ---------- */
.seite{width:var(--bw,210mm);height:var(--bh,297mm);background:#fff;color:#1C2430;font:600 3.4mm/1.3 Nunito,system-ui,sans-serif;padding:8mm;position:relative;overflow:hidden}
.seite .pikto{stroke-width:4}
.gitter{display:grid;width:100%;height:100%;border-top:.3mm dashed #9AA4B1;border-left:.3mm dashed #9AA4B1}
.gitter>div{border-right:.3mm dashed #9AA4B1;border-bottom:.3mm dashed #9AA4B1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5mm;padding:3mm;text-align:center;min-height:0;overflow:hidden}
.gitter .wort{font:600 7mm/1.1 Fredoka,Nunito,sans-serif}
.gitter .bild{height:38%;aspect-ratio:1;flex:none}
.gitter .bild svg{width:100%;height:100%}
.gitter .erkl{font-size:3.2mm;color:#3B4654;margin:0;max-width:100%}
.gitter .vf{position:absolute;left:0;right:0;top:0;height:0;visibility:hidden}
.gitter .kz{font-size:2.6mm;color:#8A96A8;text-transform:uppercase;letter-spacing:.08em}
.gitter .memo .wort{font-size:8.5mm}
.gitter .memo .bild{height:58%}
.gitter .leerfeld{visibility:hidden}
.einfach .gitter .wort{text-transform:uppercase}
.ohne .gitter .erkl{display:none}
.fuss{position:absolute;left:8mm;right:8mm;bottom:3mm;font-size:2.6mm;color:#9AA4B1;display:flex;justify-content:space-between}
/* Plakat */
.plakat .titel{display:flex;align-items:center;gap:4mm;border-bottom:1mm solid var(--farbe,#1C2430);padding-bottom:3mm;margin-bottom:5mm}
.plakat .titel .em{font-size:12mm;line-height:1}
.plakat .titel h3{margin:0;font:600 12mm/1 Fredoka,Nunito,sans-serif}
.plakat .titel small{display:block;font-size:3.4mm;color:#5B6B80;font-weight:600;margin-top:1mm}
.plakat .kacheln{display:grid;grid-template-columns:repeat(var(--sp,3),1fr);gap:4mm}
.plakat .kachel{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1.5mm;padding:3mm 2mm;border:.5mm solid var(--farbe,#D5DEE9);border-radius:4mm;break-inside:avoid}
.plakat .kachel .bild{width:70%;aspect-ratio:1}
.plakat .kachel .bild svg{width:100%;height:100%}
.plakat .kachel .wort{font:600 6mm/1.1 Fredoka,Nunito,sans-serif}
.plakat .kachel .erkl{font-size:3mm;color:#3B4654;margin:0}
.einfach .plakat .wort{text-transform:uppercase}
#druck{display:none}
@page{size:A4 portrait;margin:0}
@media print{
  body{background:#fff}
  .kopf,main{display:none!important}
  #druck{display:block}
  #druck .seite{break-after:page;page-break-after:always}
  #druck .seite:last-child{break-after:auto;page-break-after:auto}
}
</style>
<style id="seite"></style>
</head>

</main>

 ['Lupe','experimente','Mit der Lupe siehst du kleine Dinge gross.','lupe']
].map(([wort,verfahren,erklaerung,bild])=>({wort,verfahren,erklaerung,bild}));

const PAPIERE={a4:{name:'A4',w:210,h:297,karten:[2,4],plakat:3},a3:{name:'A3',w:297,h:420,karten:[3,5],plakat:4}};
const S={verfahren:'',suche:'',ohne:false,modus:'karten',papier:'a4',klasse:0};
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const norm=t=>t.toLowerCase().replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/[^a-z0-9 ]/g,'');
const pikto=w=>`<svg class="pikto" viewBox="0 0 120 120" role="img" aria-label="${esc(w.wort)}"><use href="#p-${w.bild}"/></svg>`;
const mitWoertern=VERFAHREN.filter(v=>WOERTER.some(w=>w.verfahren===v.id));

function auswahl(){
  const q=norm(S.suche.trim());
  return WOERTER.filter(w=>(!S.verfahren||w.verfahren===S.verfahren)&&(!q||norm(w.wort).includes(q)||norm(w.erklaerung).includes(q)));
}
/* ---------- Bildschirm ---------- */
function liste(){
  const ws=auswahl();
  $('liste').innerHTML=ws.length?ws.map(w=>{const v=VF[w.verfahren];return `<article class="fw" style="--farbe:${v.color}"><div class="bild">${pikto(w)}</div><div class="wort">${esc(w.wort)}</div><p class="erkl">${esc(w.erklaerung)}</p>${S.verfahren?'':`<span class="vf">${esc(v.name)}</span>`}</article>`}).join('')
    :`<p class="leer">Kein Wort gefunden. Versuche ein anderes Wort oder «Alle».</p>`;
  $('treffer').textContent=`${ws.length} ${ws.length===1?'Wort':'Wörter'}`;
  return ws;
}
/* ---------- Druckseiten ---------- */
function seite(inhalt,klasse='',fuss=''){
  return `<div class="seite ${klasse}">${inhalt}<div class="fuss"><span>Schritt für Schritt · Fachwörter${fuss?' · '+fuss:''}</span><span>Papier ${PAPIERE[S.papier].name}</span></div></div>`;
}
const stueck=(a,n)=>{const r=[];for(let i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));return r};
function kartenSeiten(ws,memory){
  const [sp,ze]=PAPIERE[S.papier].karten,pro=sp*ze;
  // Memory: pro Wort zwei Karten (Bild, Wort), Paare bleiben auf derselben Seite
  const karten=memory?ws.flatMap(w=>[{w,art:'bild'},{w,art:'wort'}]):ws.map(w=>({w,art:'voll'}));
  return stueck(karten,pro).map((k,i)=>{
    while(k.length<pro)k.push(null);
    const felder=k.map(x=>{if(!x)return `<div class="leerfeld"></div>`;const v=VF[x.w.verfahren];
      if(x.art==='bild')return `<div class="memo"><div class="bild">${pikto(x.w)}</div></div>`;
      if(x.art==='wort')return `<div class="memo"><div class="wort">${esc(x.w.wort)}</div><span class="kz">${esc(v.name)}</span></div>`;
      return `<div><div class="wort">${esc(x.w.wort)}</div><div class="bild">${pikto(x.w)}</div><p class="erkl">${esc(x.w.erklaerung)}</p><span class="kz">${esc(v.name)}</span></div>`}).join('');
    return seite(`<div class="gitter" style="grid-template-columns:repeat(${sp},1fr);grid-template-rows:repeat(${ze},1fr)">${felder}</div>`,'',`${memory?'Memory':'Karten'} · Seite ${i+1}`);
  });
}
function plakatSeiten(ws){
  const sp=PAPIERE[S.papier].plakat,pro=sp*(S.papier==='a3'?5:4),seiten=[];
  mitWoertern.forEach(v=>{const eigene=ws.filter(w=>w.verfahren===v.id);if(!eigene.length)return;
    stueck(eigene,pro).forEach((teil,i,alle)=>{
      seiten.push(seite(`<div class="plakat" style="--farbe:${v.color};--sp:${sp}"><div class="titel"><span class="em">${v.emoji}</span><div><h3>${esc(v.name)}</h3><small>Fachwörter${alle.length>1?` · Blatt ${i+1} von ${alle.length}`:''}</small></div></div><div class="kacheln">${teil.map(w=>`<div class="kachel"><div class="bild">${pikto(w)}</div><div class="wort">${esc(w.wort)}</div><p class="erkl">${esc(w.erklaerung)}</p></div>`).join('')}</div></div>`,'',`Plakat ${esc(v.name)}`));});});
  return seiten;
}
function druck(ws){
  const seiten=S.modus==='plakat'?plakatSeiten(ws):kartenSeiten(ws,S.modus==='memory');
  const html=seiten.join('');
  $('druck').innerHTML=html;
  $('vorschau').innerHTML=seiten.map(s=>`<div class="blatt">${s}</div>`).join('')||'<p class="hinweis">Nichts zu drucken.</p>';
  const p=PAPIERE[S.papier],n=seiten.length;
  $('info').textContent=!ws.length?'Keine Wörter ausgewählt.':S.modus==='plakat'?`${n} ${n===1?'Plakat':'Plakate'} (je Verfahren ein Blatt ${p.name}).`:S.modus==='memory'?`${ws.length} Paare = ${ws.length*2} Karten auf ${n} ${n===1?'Seite':'Seiten'} ${p.name}. Auf dickes Papier drucken, ausschneiden, Rückseite nach oben mischen.`:`${ws.length} Karten auf ${n} ${n===1?'Seite':'Seiten'} ${p.name} (${p.karten[0]*p.karten[1]} pro Blatt). An den gestrichelten Linien ausschneiden.`;
  massstab();
}
function massstab(){
  const el=$('vorschau'),b=el.clientWidth;if(!b)return;
  el.style.setProperty('--s',(b/(PAPIERE[S.papier].w*96/25.4)).toFixed(4));
}
function papierSetzen(){
  const p=PAPIERE[S.papier];
  $('seite').textContent=`@page{size:${p.name} portrait;margin:0}`;
  ['druck','vorschau'].forEach(id=>{$(id).style.setProperty('--bw',p.w+'mm');$(id).style.setProperty('--bh',p.h+'mm')});
}
/* ---------- Bedienung ---------- */
function zeichnen(){
  document.querySelectorAll('#verfahren .chip').forEach(c=>c.setAttribute('aria-pressed',(c.dataset.v||'')===S.verfahren));
  document.querySelectorAll('#modus .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.modus===S.modus));
  document.querySelectorAll('#papier .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.papier===S.papier));
  $('erkl').setAttribute('aria-pressed',S.ohne);$('erkl').textContent=S.ohne?'Erklärung zeigen':'Erklärung verstecken';
  document.body.classList.toggle('ohne',S.ohne);
  papierSetzen();
  druck(liste());
  const p=new URLSearchParams();
  if(S.verfahren)p.set('verfahren',S.verfahren);if(S.modus!=='karten')p.set('modus',S.modus);if(S.papier!=='a4')p.set('papier',S.papier);if(S.klasse)p.set('klasse',S.klasse);
  try{history.replaceState(null,'',location.pathname+(String(p)?'?'+p:''))}catch(e){}
}
function bedienung(){
  $('verfahren').innerHTML=`<button type="button" class="chip" data-v="" aria-pressed="true">Alle</button>`+mitWoertern.map(v=>`<button type="button" class="chip" data-v="${v.id}" aria-pressed="false" style="--punkt:${v.color}"><i></i>${esc(v.name)}</button>`).join('');
  $('verfahren').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;S.verfahren=c.dataset.v||'';zeichnen()});
  $('modus').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;S.modus=c.dataset.modus;zeichnen()});
  $('papier').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;S.papier=c.dataset.papier;zeichnen()});
  $('erkl').addEventListener('click',()=>{S.ohne=!S.ohne;zeichnen()});
  $('suche').addEventListener('input',e=>{S.suche=e.target.value;druck(liste())});
  $('drucken').addEventListener('click',()=>window.print());
  if(window.ResizeObserver)new ResizeObserver(massstab).observe($('vorschau'));else addEventListener('resize',massstab);
}
const q=new URLSearchParams(location.search);
if(VF[q.get('verfahren')])S.verfahren=q.get('verfahren');
if(['karten','plakat','memory'].includes(q.get('modus')))S.modus=q.get('modus');
if(PAPIERE[q.get('papier')])S.papier=q.get('papier');
if(+q.get('klasse')>=1&&+q.get('klasse')<=6){S.klasse=+q.get('klasse');if(S.klasse<=2)document.body.classList.add('einfach')}
bedienung();zeichnen();
</script>
</body>
</html>
