<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schritt für Schritt · Mechanik-Planer</title>
<meta name="description" content="Zahnräder, Kurbeln, Nocken, Holzautos, Windräder und Kreisel planen – Masse ausrechnen und die Teile in echter Grösse drucken.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../planer.css">
<style>
:root{--bg:#EEF3F8;--surface:#FFFFFF;--surface2:#F5F8FB;--ink:#17212F;--muted:#5B6B80;--line:#D5DEE9;--acc:#17997A;--acc-ink:#FFFFFF;--acc-soft:#E3F4EF;--warn:#B3412A;--papier:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1621;--surface:#1A2433;--surface2:#141C28;--ink:#EDF2F8;--muted:#9DACBF;--line:#2B384A;--acc:#2FBF98;--acc-ink:#0F1621;--acc-soft:#16302B;--warn:#F08A6E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1621;--surface:#1A2433;--surface2:#141C28;--ink:#EDF2F8;--muted:#9DACBF;--line:#2B384A;--acc:#2FBF98;--acc-ink:#0F1621;--acc-soft:#16302B;--warn:#F08A6E;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.4 Nunito,system-ui,sans-serif}
h1,h2{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0}
h2{font-size:17px;margin-bottom:10px}
a{color:var(--acc)}
main{max-width:1200px;margin:0 auto;padding:8px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:14px;align-items:start}
.links{display:flex;flex-direction:column;gap:14px}
.karte{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.rechts{position:sticky;top:calc(var(--kopf-h) + 12px);display:flex;flex-direction:column;gap:14px}
.feld{margin-bottom:14px}.feld:last-child{margin-bottom:0}
.lbl{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.chip:hover{border-color:var(--acc)}
.modus .chip{font-size:16px;padding:8px 16px}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.zwei{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.zahl{display:flex;align-items:center;gap:6px}
.zahl input{width:92px;height:48px;font:600 24px Fredoka,Nunito,sans-serif;text-align:center;border:2px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--ink);padding:0 4px}
.zahl span{font-size:15px;color:var(--muted)}
.antwort{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.antwort li{font-size:16px;line-height:1.35}
.antwort b{font:600 24px/1.1 Fredoka,Nunito,sans-serif;color:var(--acc);white-space:nowrap}
.warn{color:var(--warn)}
/* Bühne: alles im Bild ziehen */
.buehne-karte{padding:12px}
.leiste{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:10px}
.leiste .chip{min-height:40px;padding:4px 10px}
.leiste .chip svg{display:block;height:20px;width:40px}
#formChips .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 8px}
#formChips .chip svg{height:26px;width:48px}
.leiste [data-g="ziel"] .chip{display:inline-flex;align-items:center;gap:4px}
.buehne{position:relative;border-radius:14px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
#buehne{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
#buehne [data-h]{touch-action:none}
#buehne .ks{stroke:#1F1A17;stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#buehne .ml{fill:none;stroke:var(--muted);stroke-width:1.5;vector-effect:non-scaling-stroke}
#buehne .gst{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
#buehne .pf{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#buehne text{font-family:Fredoka,Nunito,sans-serif;font-weight:600;pointer-events:none}
#buehne .mt{fill:var(--ink)}
#buehne [data-h]{cursor:grab}
#buehne .knopf{cursor:pointer}
#buehne .ring{fill:none;pointer-events:none}
#buehne .ring-spur{stroke:rgba(31,26,23,.18)}
#buehne .ring-lauf{stroke:#1F1A17}
#buehne .lauf{fill:#1F1A17;pointer-events:none}
#buehne .kontur{fill:var(--acc);fill-opacity:.22;stroke:var(--acc);stroke-width:3;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
#buehne .rk{fill:#2B2F36;fill-opacity:.3;stroke:#1F1A17;stroke-width:2.5;vector-effect:non-scaling-stroke;pointer-events:none}
#buehne .pl-teil{pointer-events:none}
#buehne .pl-teil circle{stroke-width:1.5;vector-effect:non-scaling-stroke}
@keyframes puls{0%,50%{stroke:var(--acc);stroke-width:5}100%{stroke:#1F1A17;stroke-width:2}}
#buehne .puls{animation:puls .9s ease-out}
@media (prefers-reduced-motion:reduce){#buehne .puls{animation-duration:.01s}}
.gross{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:8px;font:600 22px Fredoka,Nunito,sans-serif;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:2px 10px;pointer-events:none}
.gross b{font-size:30px;line-height:1}
.gross i{display:inline-block;width:14px;height:14px;border-radius:50%;border:1.5px solid #1F1A17;margin-right:3px}
.pruef-ok{position:absolute;right:8px;bottom:8px;min-width:56px;height:48px;border-radius:14px;border:0;background:var(--acc);color:var(--acc-ink);font:700 24px Nunito,sans-serif;cursor:pointer}
.spiel{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;cursor:pointer}
.warnung{margin:8px 0 0;font-size:14px}
#zu-gross{margin-top:8px}
#iZahl{margin-bottom:12px}
#posterAus{margin-top:8px}
#blaetter{margin-top:10px}
details.karte>summary{cursor:pointer;font:600 17px Fredoka,Nunito,sans-serif}
details.karte[open]>summary{margin-bottom:12px}
[hidden]{display:none!important}
svg .schnitt{fill:none;stroke:#000;stroke-width:.35;stroke-linejoin:round}
svg .hilf{fill:none;stroke:#777;stroke-width:.25;stroke-dasharray:1.5 1}
svg .loch{fill:none;stroke:#000;stroke-width:.3}
svg .kreuz{stroke:#000;stroke-width:.25}
svg .t{font:3.2px Nunito,sans-serif;fill:#333}
svg .tk{font:2.6px Nunito,sans-serif;fill:#555}
svg .titel{font:600 5px Fredoka,Nunito,sans-serif;fill:#000}
svg .pfeil{fill:none;stroke:#17997A;stroke-width:.5}
svg .rad{fill:#eee;stroke:#444;stroke-width:.3}
svg .deko{fill:none;stroke:#888;stroke-width:.25;stroke-dasharray:1 .8}
svg .zier{fill:none;stroke:#9A8F84;stroke-width:.2;stroke-linejoin:round;stroke-linecap:round}
#buehne .zl{fill:none;stroke:#5C4A38;stroke-width:1;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;pointer-events:none}
.rechnung{margin:0;padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font-size:15px;line-height:1.5}
.rechnung p{margin:0 0 6px}.rechnung p:last-child{margin:0}
.rechnung .f{font:600 18px/1.3 Fredoka,Nunito,sans-serif;color:var(--acc)}
.zuschnitt{display:flex;flex-direction:column;gap:14px}
.stoff svg{display:block;width:100%;height:auto;max-height:260px;margin-top:6px}
.stoff-kopf{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.stoff-kopf .n,.klein .n{color:var(--acc);font:600 16px Fredoka,Nunito,sans-serif;white-space:nowrap}
.stoff .za{fill:var(--ink)}
.klein{margin:0;padding:0;list-style:none}
.klein li{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--line);font-size:15px}
.klein li span:nth-child(2){flex:1}
.material{margin:0;padding:0;list-style:none}
.material li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
.material li:last-child{border-bottom:0}
.material .n{color:var(--acc);font:600 16px Fredoka,Nunito,sans-serif;white-space:nowrap}
@media (max-width:860px){
  main{display:flex;flex-direction:column;align-items:stretch;gap:12px}
  .links,.buehne-karte{display:contents}
  .modus{order:1}
  .buehne{order:2;position:sticky;top:var(--kopf-h)}
  .leiste{order:3;margin:0;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
  .warnung,#zu-gross{order:4;margin:0}
  .mehr{order:5}
  .rechts{order:6;position:static}
}
#druck{display:none}
@media print{
  body{background:#fff}
  main{display:none!important}
  #druck{display:block}
  #druck svg{display:block;width:var(--bw,210mm);height:var(--bh,297mm);break-after:page}
  #druck svg:last-child{break-after:auto}
}
</style>
<style id="seite"></style>
</head>
<body>
<header class="pk">
  <a class="zur-app" href="../../" data-zur-app aria-label="Zurück zur App"><span>App</span></a>
  <h1>Mechanik-Planer</h1>
  <a class="pk-vorlagen" href="../" aria-label="Vorlagen" title="Vorlagen"><span>Vorlagen</span></a>
  <button class="pk-rueck" id="p-rueck" type="button" disabled aria-label="Rückgängig" title="Rückgängig"></button>
  <button class="pk-druck" id="drucken" type="button" aria-label="Drucken, 100 %"><span>Drucken</span></button>
</header>
<script src="../zurueck.js"></script>
<script src="../planer.js"></script>
<script>window.FIGUREN={};window.FIGUREN_DAZU=function(welt,fs){fs.forEach(function(f){window.FIGUREN[f.id]=f})}</script>
<script src="../figuren/fahrzeuge.js"></script>
<main>
<div class="links">
  <div class="chips modus" role="group" aria-label="Werkstück" data-g="modus">
    <button type="button" class="chip" data-v="zahn">⚙️ Zahnräder</button>
    <button type="button" class="chip" data-v="rad">🛞 Räder</button>
    <button type="button" class="chip" data-v="auto">🚗 Auto</button>
    <button type="button" class="chip" data-v="windrad">🌬️ Windrad</button>
    <button type="button" class="chip" data-v="kreisel">🌀 Kreisel</button>
  </div>

  <section class="karte buehne-karte">
    <div class="leiste modus-teil" data-modus="zahn">
      <div class="chips" role="group" aria-label="Ziel" data-g="ziel" id="zielChips"></div>
      <div class="chips" role="group" aria-label="Modul" data-g="modul" id="modulChips"></div>
    </div>
    <div class="leiste modus-teil" data-modus="rad">
      <div class="chips" role="group" aria-label="Antrieb" data-g="nocken"><button type="button" class="chip" data-v="exzenter">↔️ Kurbel</button><button type="button" class="chip" data-v="schnecke">🐌 Schneckennocke</button><button type="button" class="chip" data-v="doppel">⛰️ Doppelnocke</button></div>
    </div>
    <div class="leiste modus-teil" data-modus="auto">
      <div class="chips" role="group" aria-label="Form" data-g="form" id="formChips"></div>
      <button type="button" class="chip" id="bildPruef" hidden>🔍 Prüfen</button>
      <div class="chips" role="group" aria-label="Lager" data-g="lager"><button type="button" class="chip" data-v="loch">🕳️ Loch</button><button type="button" class="chip" data-v="nut">🪚 Nut</button></div>
    </div>
    <div class="leiste modus-teil" data-modus="windrad">
      <div class="chips" role="group" aria-label="Art" data-g="wart"><button type="button" class="chip" data-v="papier">📄 Papier</button><button type="button" class="chip" data-v="pet">🧴 PET</button></div>
    </div>
    <div class="leiste modus-teil" data-modus="kreisel">
      <div class="chips" role="group" aria-label="Muster" data-g="kart"><button type="button" class="chip" data-v="spirale">🌀 Spirale</button><button type="button" class="chip" data-v="benham">⚫ Benham</button><button type="button" class="chip" data-v="farben">🌈 Farben</button><button type="button" class="chip" data-v="turbo">🌪️ Turbo</button></div>
      <div class="chips" role="group" aria-label="Achse" data-g="kStab"><button type="button" class="chip" data-v="stab">🥢 Rundstab</button><button type="button" class="chip" data-v="reissnagel">📌 Reissnagel</button></div>
    </div>
    <div class="buehne pl-haft">
      <svg id="buehne" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Werkstück zum Ziehen"></svg>
      <span class="gross" id="gross" role="img" hidden></span>
      <button type="button" class="spiel" id="spiel" aria-label="Drehen anhalten">⏸</button>
      <button type="button" class="pruef-ok" id="pruefFertig" aria-label="Fertig" hidden>✓</button>
    </div>
    <div id="zu-gross" hidden></div>
    <p class="warnung" id="warnung" hidden></p>
  </section>

  <details class="karte mehr">
    <summary>⋯ Genau einstellen</summary>
    <div class="modus-teil" data-modus="zahn">
      <div id="iZahl" class="rechnung"></div>
      <div class="zwei">
        <div class="feld"><label class="lbl" for="zA">Zähne A</label><div class="zahl"><input type="number" id="zA" data-k="zA" min="8" max="60" step="1" inputmode="numeric"></div></div>
        <div class="feld"><label class="lbl" for="zB">Zähne B</label><div class="zahl"><input type="number" id="zB" data-k="zB" min="8" max="60" step="1" inputmode="numeric"></div></div>
        <div class="feld"><label class="lbl" for="zC">Zähne C</label><div class="zahl"><input type="number" id="zC" data-k="zC" min="0" max="60" step="1" inputmode="numeric"></div></div>
        <div class="feld" id="feldD"><label class="lbl" for="zD">Zähne D</label><div class="zahl"><input type="number" id="zD" data-k="zD" min="8" max="60" step="1" inputmode="numeric"></div></div>
      </div>
      <div class="feld" id="feldKette"><span class="lbl">Rad C</span>
        <div class="chips" role="group" aria-label="Anordnung" data-g="kette"><button type="button" class="chip" data-v="reihe">B → C</button><button type="button" class="chip" data-v="stufe">B·C → D</button></div></div>
      <div class="zwei">
        <div class="feld"><span class="lbl">Holz</span>
          <div class="chips" role="group" aria-label="Holzdicke" data-g="holz"><button type="button" class="chip" data-v="4">4 mm</button><button type="button" class="chip" data-v="6">6 mm</button><button type="button" class="chip" data-v="8">8 mm</button><button type="button" class="chip" data-v="10">10 mm</button></div></div>
        <div class="feld"><span class="lbl">Kurbel</span>
          <div class="chips" role="group" aria-label="Kurbel" data-g="kurbel"><button type="button" class="chip" data-v="ja">Ja</button><button type="button" class="chip" data-v="nein">Nein</button></div></div>
      </div>
      <div class="feld"><span class="lbl">Achse</span>
        <div class="chips" role="group" aria-label="Achse" data-g="achse"><button type="button" class="chip" data-v="3">3 mm</button><button type="button" class="chip" data-v="4">4 mm</button><button type="button" class="chip" data-v="6">6 mm</button><button type="button" class="chip" data-v="8">8 mm</button><button type="button" class="chip" data-v="10">10 mm</button></div></div>
      <div class="feld"><span class="lbl">Lager</span>
        <div class="chips" role="group" aria-label="Lagerung" data-g="fest"><button type="button" class="chip" data-v="achse">Welle dreht</button><button type="button" class="chip" data-v="rad">Rad dreht lose</button></div></div>
    </div>

    <div class="modus-teil" data-modus="rad">
      <div class="zwei">
        <div class="feld"><label class="lbl" for="radD">Rad Ø</label><div class="zahl"><input type="number" id="radD" data-k="radD" min="1" max="30" step="0.5" inputmode="decimal"><span>cm</span></div></div>
        <div class="feld"><label class="lbl" for="radN">Anzahl</label><div class="zahl"><input type="number" id="radN" data-k="radN" min="1" max="12" step="1" inputmode="numeric"></div></div>
        <div class="feld"><label class="lbl" for="hub">Hub</label><div class="zahl"><input type="number" id="hub" data-k="hub" min="0" max="150" step="1" inputmode="numeric"><span>mm</span></div></div>
        <div class="feld"><label class="lbl" for="scheibeD">Scheibe Ø</label><div class="zahl"><input type="number" id="scheibeD" data-k="scheibeD" min="0" max="200" step="1" inputmode="numeric"><span>mm</span></div></div>
      </div>
      <div class="feld"><span class="lbl">Achse</span>
        <div class="chips" role="group" aria-label="Achse" data-g="achse"><button type="button" class="chip" data-v="3">3 mm</button><button type="button" class="chip" data-v="4">4 mm</button><button type="button" class="chip" data-v="6">6 mm</button><button type="button" class="chip" data-v="8">8 mm</button><button type="button" class="chip" data-v="10">10 mm</button></div></div>
      <div class="feld"><span class="lbl">Lager</span>
        <div class="chips" role="group" aria-label="Lagerung" data-g="fest"><button type="button" class="chip" data-v="achse">Welle dreht</button><button type="button" class="chip" data-v="rad">Rad dreht lose</button></div></div>
    </div>

    <div class="modus-teil" data-modus="auto">
      <div class="zwei">
        <div class="feld"><label class="lbl" for="autoL">Länge</label><div class="zahl"><input type="number" id="autoL" data-k="autoL" min="5" max="60" step="0.5" inputmode="decimal"><span>cm</span></div></div>
        <div class="feld"><label class="lbl" for="autoH">Höhe</label><div class="zahl"><input type="number" id="autoH" data-k="autoH" min="2" max="30" step="0.5" inputmode="decimal"><span>cm</span></div></div>
        <div class="feld"><label class="lbl" for="autoB">Breite</label><div class="zahl"><input type="number" id="autoB" data-k="autoB" min="1" max="20" step="0.5" inputmode="decimal"><span>cm</span></div></div>
        <div class="feld"><label class="lbl" for="autoRad">Rad Ø</label><div class="zahl"><input type="number" id="autoRad" data-k="autoRad" min="1" max="20" step="0.5" inputmode="decimal"><span>cm</span></div></div>
        <div class="feld"><label class="lbl" for="radBreite">Radbreite</label><div class="zahl"><input type="number" id="radBreite" data-k="radBreite" min="3" max="60" step="1" inputmode="numeric"><span>mm</span></div></div>
        <div class="feld"><label class="lbl" for="boden">Bodenfreiheit</label><div class="zahl"><input type="number" id="boden" data-k="boden" min="0" max="80" step="1" inputmode="numeric"><span>mm</span></div></div>
        <div class="feld"><label class="lbl" for="radstand">Radstand</label><div class="zahl"><input type="number" id="radstand" data-k="radstand" min="0" max="60" step="0.5" inputmode="decimal"><span>cm</span></div></div>
      </div>
      <div class="feld"><span class="lbl">Achse</span>
        <div class="chips" role="group" aria-label="Achse" data-g="achse"><button type="button" class="chip" data-v="3">3 mm</button><button type="button" class="chip" data-v="4">4 mm</button><button type="button" class="chip" data-v="6">6 mm</button><button type="button" class="chip" data-v="8">8 mm</button><button type="button" class="chip" data-v="10">10 mm</button></div></div>
      <div class="feld"><span class="lbl">Lager</span>
        <div class="chips" role="group" aria-label="Lagerung" data-g="fest"><button type="button" class="chip" data-v="achse">Welle dreht</button><button type="button" class="chip" data-v="rad">Räder drehen lose</button></div></div>
    </div>

    <div class="modus-teil" data-modus="windrad">
      <div data-wart="papier">
        <div class="zwei">
          <div class="feld"><label class="lbl" for="wSeite">Seite</label><div class="zahl"><input type="number" id="wSeite" data-k="wSeite" min="8" max="30" step="0.5" inputmode="decimal"><span>cm</span></div></div>
          <div class="feld"><span class="lbl">Flügel</span>
            <div class="chips" role="group" aria-label="Flügel" data-g="wFluegel"><button type="button" class="chip" data-v="4">4</button><button type="button" class="chip" data-v="8">8</button></div></div>
        </div>
      </div>
      <div data-wart="pet">
        <div class="zwei">
          <div class="feld"><label class="lbl" for="wUmfang">Umfang</label><div class="zahl"><input type="number" id="wUmfang" data-k="wUmfang" min="12" max="40" step="0.5" inputmode="decimal"><span>cm</span></div></div>

(function(){

const PAPIER={a4:{name:'A4',w:210,h:297},a3:{name:'A3',w:297,h:420}};

const STANDARD={modus:'zahn',papier:'a4',poster:'nein',modul:4,zA:12,zB:24,zC:0,zD:36,kette:'reihe',holz:6,kurbel:'ja',ziel:'',achse:6,
  radD:6,radN:4,hub:20,scheibeD:0,fest:'achse',nocken:'exzenter',
  autoL:18,autoH:7.5,autoB:4,autoRad:3,radBreite:18,boden:8,radstand:0,form:Object.keys(FORMEN)[0],lager:'loch',
  wart:'papier',wSeite:18,wUmfang:28,wHoehe:12,wNabe:70,wFluegel:4,

const GRENZEN={modul:[1,6],zA:[8,60],zB:[8,60],zC:[0,60],zD:[8,60],holz:[4,10],achse:[3,10],radD:[1,30],radN:[1,12],hub:[0,150],scheibeD:[0,200],
  autoL:[5,60],autoH:[2,30],autoB:[1,20],autoRad:[1,20],radBreite:[3,60],boden:[0,80],radstand:[0,60],
  wSeite:[8,30],wUmfang:[12,40],wHoehe:[5,25],wNabe:[40,120],wFluegel:[3,8],kD:[5,20],kN:[1,6],kFluegel:[6,16]};
const WORTE={modus:['zahn','rad','auto','windrad','kreisel'],papier:['a4','a3'],poster:['nein','ja'],fest:['achse','rad'],form:Object.keys(FORMEN),kette:['reihe','stufe'],kurbel:['ja','nein'],
  ziel:['','langsam','langsam3','schnell','gleich','richtung','stufe','stufe4'],nocken:Object.keys(NOCKEN),lager:['loch','nut'],wart:['papier','pet'],kart:Object.keys(KART),kStab:['stab','reissnagel']};
const ZIELE={langsam:{zA:12,zB:24,zC:0,kette:'reihe'},langsam3:{zA:10,zB:30,zC:0,kette:'reihe'},schnell:{zA:24,zB:12,zC:0,kette:'reihe'},gleich:{zA:16,zB:16,zC:0,kette:'reihe'},richtung:{zA:12,zB:12,zC:12,kette:'reihe'},
  stufe:{zA:10,zB:30,zC:10,zD:30,kette:'stufe'},stufe4:{zA:10,zB:20,zC:10,zD:20,kette:'stufe'}};
const S=Object.assign({},STANDARD);
const f=n=>+n.toFixed(2);
const begrenzt=(v,a,b)=>Math.min(b,Math.max(a,v));
const zahl=(v,d)=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:d};
const mm=v=>(Math.round(v*10)/10).toLocaleString('de-CH').replace('.',',')+' mm';   // Komma wie in allen Werkzeugen
const cmText=v=>(Math.round(v)/10).toLocaleString('de-CH').replace('.',',')+' cm';
const dz=v=>v.toLocaleString('de-CH',{maximumFractionDigits:2}).replace('.',',');
function uebernehmen(q,k,v){
  if(v==null)return;
  if(WORTE[k]){if(WORTE[k].includes(v))S[k]=v;return}
  if(GRENZEN[k]){const n=zahl(v,NaN);if(isFinite(n))S[k]=begrenzt(n,GRENZEN[k][0],GRENZEN[k][1])}
}
const g=SP.lies();if(g&&typeof g==='object')Object.keys(g).forEach(k=>uebernehmen(null,k,g[k]));
const q=new URLSearchParams(location.search);
[...q.keys()].forEach(k=>uebernehmen(q,k,q.get(k)));
if(ZIELE[q.get('ziel')])Object.assign(S,ZIELE[q.get('ziel')]);
S.ziel=Object.keys(ZIELE).find(k=>Object.keys(ZIELE[k]).every(j=>S[j]===ZIELE[k][j]))||'';
function speichern(){
  SP.schreibe(S);
  const p=new URLSearchParams();
  Object.keys(S).forEach(k=>{if(k!=='ziel'&&S[k]!==STANDARD[k])p.set(k,String(S[k]))});
  const s=p.toString();history.replaceState(null,'',location.pathname+(s?'?'+s:''));
}

// ---------- Zeichenhilfen (alles in mm) ----------
function lochKreuz(cx,cy,d,text){
  const a=d/2+2;
  return `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(d/2)}" class="loch"/><path class="kreuz" d="M${f(cx-a)} ${f(cy)}H${f(cx+a)}M${f(cx)} ${f(cy-a)}V${f(cy+a)}"/>`+
    (text?`<text x="${f(cx)}" y="${f(cy+a+3.5)}" class="tk" text-anchor="middle">${text}</text>`:'');
}
const txt=(x,y,s,k='t',anker='middle')=>`<text x="${f(x)}" y="${f(y)}" class="${k}" text-anchor="${anker}">${s}</text>`;

// Zahnrad: Teilkreis d = m·z, Kopfkreis m·(z+2), Fusskreis m·(z−2.5). Zähne als einfache Trapeze – reicht zum Aussägen.
function zahnUmriss(m,z,loch,off,cx,cy){
  const r=m*z/2,ra=r+m,rf=Math.max(r-1.25*m,loch/2+3),p=2*Math.PI/z,sp=Math.PI*m/4;
  const wa=0.5*sp/ra,wp=sp/r,wf=Math.min(1.25*sp/rf,p*0.45);
  const pts=[];
  for(let i=0;i<z;i++){const t=off+i*p;
    [[-wf,rf],[-wp,r],[-wa,ra],[wa,ra],[wp,r],[wf,rf],[p/2,rf]].forEach(([a,rr])=>pts.push(f(cx+rr*Math.cos(t+a))+' '+f(cy+rr*Math.sin(t+a))))}
  return {d:'M'+pts.join('L')+'Z',r,ra,rf};
}
function zahnrad(m,z,loch,off,name){
  const r=m*z/2,ra=r+m;
  const svg=`<path class="schnitt" d="${zahnUmriss(m,z,loch,off,ra,ra).d}"/><circle cx="${f(ra)}" cy="${f(ra)}" r="${f(r)}" class="hilf"/>${lochKreuz(ra,ra,loch)}`+
    txt(ra,ra+loch/2+6,`${name?name+' · ':''}${z} Zähne`)+txt(ra,ra+loch/2+9.5,`Modul ${m} · Ø ${mm(2*ra)} · Loch ${mm(loch)}`,'tk');
  return {name:`Zahnrad ${name||''}`.trim(),w:2*ra,h:2*ra,r,ra,z,off,svg};
}
// Winkel, bei dem Rad «links» einen Zahn genau in Richtung des rechten Nachbarn hat
const zahnBei0=(off,z)=>{const p=2*Math.PI/z,x=((-off/p)%1+1)%1;return x<0.25||x>0.75};
const gegenOff=(linksOff,linksZ,z)=>{const p=2*Math.PI/z;return zahnBei0(linksOff,linksZ)?((Math.PI-p/2)%p+p)%p:(Math.PI%p+p)%p};

function kreisRad(D,loch,name,text){
  const r=D/2;
  return {name,w:D,h:D,svg:`<circle cx="${f(r)}" cy="${f(r)}" r="${f(r)}" class="schnitt"/>${lochKreuz(r,r,loch)}`+txt(r,r+loch/2+6,name)+(text?txt(r,r+loch/2+9.5,text,'tk'):'')};
}
// Kurbelarm: Achsloch links, Griffloch im Abstand e (Kurbel = Hebel)
function kurbelarm(e,achse,griff,minW){
  const ah=griff+12,aw=e+griff+14;
  return {name:'Kurbelarm',w:Math.max(aw,minW),h:ah+6,svg:`<rect x="0.2" y="0.2" width="${f(aw-.4)}" height="${f(ah-.4)}" rx="${f(ah/2)}" class="schnitt"/>${lochKreuz(ah/2,ah/2,achse)}${lochKreuz(ah/2+e,ah/2,griff)}`+
    txt(aw/2,ah+4,`Kurbelarm · Achse ${mm(achse)} · Griff ${mm(griff)}`,'tk')};
}
// Nocke: Radius je Winkel t (Schnecke steigt eine Umdrehung lang, fällt dann; Doppelnocke hebt zweimal)
function nockeR(art,t,rb,hub){const u=((t%TAU)+TAU)%TAU;return art==='doppel'?rb+hub*(1-Math.cos(2*u))/2:rb+hub*u/TAU}
function nockePfad(art,cx,cy,rb,hub){
  const n=art==='doppel'?96:72,p=[];
  for(let i=0;i<n;i++){const t=i*TAU/n,r=nockeR(art,t,rb,hub);p.push(f(cx+r*Math.cos(t))+' '+f(cy+r*Math.sin(t)))}
  return 'M'+p.join('L')+'Z';
}
function lochmass(was){   // Bohrloch: wo etwas drehen soll, 1 mm Spiel
  const a=S.achse;
  if(was==='achse')return S.fest==='rad'?a+1:a;        // Loch im Rad
  return S.fest==='rad'?a:a+1;                          // Loch im Klotz / in der Grundplatte
}

// ---------- Zahnräder ----------
function teileZahn(){
  const m=S.modul,loch=lochmass('achse'),lochP=lochmass('klotz'),stufe=S.zC>=8&&S.kette==='stufe';
  const A=zahnrad(m,S.zA,loch,0,'A'),B=zahnrad(m,S.zB,loch,gegenOff(0,S.zA,S.zB),'B');
  const raeder=[A,B];
  if(S.zC>=8){const C=zahnrad(m,S.zC,loch,stufe?0:gegenOff(B.off,S.zB,S.zC),'C');raeder.push(C);
    if(stufe)raeder.push(zahnrad(m,S.zD,loch,gegenOff(0,S.zC,S.zD),'D'))}
  const achsen=stufe?[[A],[B,raeder[2]],[raeder[3]]]:raeder.map(r=>[r]);
  const namen=achsen.map(g=>g.map(r=>r.name.replace('Zahnrad ','')).join('+'));
  const abst=[];for(let i=1;i<achsen.length;i++){const links=achsen[i-1][achsen[i-1].length-1],rechts=achsen[i][0];abst.push(m*(links.z+rechts.z)/2)}
  const ges=abst.reduce((a,b)=>a+b,0);
  const rmax=Math.max(...raeder.map(r=>r.ra)),pw=ges+2*rmax+20,ph=2*rmax+24;let x=rmax+10;
  let plan=`<rect x="0.2" y="0.2" width="${f(pw-.4)}" height="${f(ph-.4)}" rx="4" class="schnitt"/>`;
  achsen.forEach((g,i)=>{plan+=lochKreuz(x,rmax+10,lochP,'Achse '+namen[i]);g.forEach(r=>{plan+=`<circle cx="${f(x)}" cy="${f(rmax+10)}" r="${f(r.ra)}" class="hilf"/>`});
    if(i<abst.length){plan+=`<path class="hilf" d="M${f(x+lochP/2+3)} ${f(rmax+10)}H${f(x+abst[i]-lochP/2-3)}"/>`+txt(x+abst[i]/2,rmax+7,mm(abst[i]),'tk');x+=abst[i]}});
  plan+=txt(pw/2,ph-3,`Grundplatte ${mm(pw)} × ${mm(ph)} · Löcher ${mm(lochP)}`,'tk');
  const teile=raeder.concat([{name:'Grundplatte',w:pw,h:ph,svg:plan}]);
  if(S.kurbel==='ja')teile.push(kurbelarm(Math.max(20,Math.round(A.r*0.8)),S.achse,lochmass('klotz'),52));
  const letzte=raeder[raeder.length-1],G=getriebe(),fl=G[G.length-1].f,iGes=1/Math.abs(fl),nL=letzte.name.replace('Zahnrad ','');
  const tier=iGes>1.01?(stufe?'🐌':'🐢'):iGes<.99?'🐇':'',richt=fl>0?'↻↻':'↻↺';
  const ant=raeder.map(r=>`${r.name}: <b>Ø ${mm(2*r.ra)}</b>`);
  abst.forEach((a,i)=>ant.push(`Achsabstand ${namen[i]} – ${namen[i+1]}: <b>${mm(a)}</b>`));
  const d1=v=>v.toLocaleString('de-CH',{maximumFractionDigits:1}).replace('.',','),dreh=iGes>1.01?`${d1(iGes)} ↻ A = 1 ↻ ${nL}`:iGes<.99?`1 ↻ A = ${d1(1/iGes)} ↻ ${nL}`:`1 ↻ A = 1 ↻ ${nL}`;
  ant.push(`${iGes>1.01?'Untersetzung':iGes<.99?'Übersetzung':'Gleich'}: <b>${dreh}</b> ${tier} ${richt}`);
  ant.push(`Loch Rad: <b>${mm(loch)}</b>${S.fest==='rad'?' ↻':''}`,`Loch Platte: <b>${mm(lochP)}</b>${S.fest==='achse'?' ↻':''}`);
  const warn=[];
  if(m<=2)warn.push(`🛒 Modul ${m} · fertige Zahnräder`);
  if(stufe&&S.zC>=S.zB)warn.push('⚠ Zähne C ≥ Zähne B');
  const rech=[`<p><span class="f">Ø A = ${m} × (${S.zA} + 2) = ${mm(2*A.ra)}</span></p>`,
    `<p><span class="f">a = ${m} × (${S.zA} + ${S.zB}) : 2 = ${mm(abst[0])}</span></p>`];
  const iz=[`<p><span class="f">i = ${S.zB} : ${S.zA} = ${dz(S.zB/S.zA)} ${S.zB>S.zA?'🐢':S.zB<S.zA?'🐇':''} ↻↺</span></p>`];
  if(S.zC>=8&&!stufe)iz.push(`<p><span class="f">i = ${S.zC} : ${S.zA} = ${dz(S.zC/S.zA)} ↻↻</span></p>`);
  if(stufe)iz.push(`<p><span class="f">i = ${dz(S.zB/S.zA)} × ${dz(S.zD/S.zC)} = ${dz(iGes)} 🐌</span></p>`);
  rech.push(`<p><span class="f">Loch ↻ = ${S.achse} + 1 = ${mm(S.achse+1)}</span></p>`);
  const dicke=S.holz,plattenDicke=10,achsL=plattenDicke+3+achsen.reduce((mx,g)=>Math.max(mx,g.length),0)*(dicke+1)+8+(S.kurbel==='ja'?dicke+2:0);
  const zu=[{art:'platte',name:`Sperrholz ${dicke} mm`,teile:teile.filter(t=>t.name!=='Grundplatte').map(t=>t.name==='Kurbelarm'?{w:t.w,h:t.h-6,label:'Kurbel'}:{w:t.w,h:t.h,rund:true,label:`${t.name.replace('Zahnrad ','')} · ${t.z}`})},
    {art:'platte',name:'Brett oder Sperrholz 10 mm',teile:[{w:pw,h:ph,label:'Grundplatte'}]},
    {art:'stab',name:`Rundstab ${S.achse} mm`,d:S.achse,stuecke:achsen.map(()=>achsL)}];
  if(S.kurbel==='ja')zu.push({art:'stab',name:`Rundstab ${mm(lochmass('klotz')-1)} (Griff)`,d:lochmass('klotz')-1,stuecke:[40]});
  const klein=[['⭕','Unterlagscheiben',`${S.fest==='rad'?raeder.length:achsen.length*2} ×`],['🔩','Bohrer',`${mm(loch)}${lochP!==loch?' · '+mm(lochP):''}`],['🪚','Laubsäge',''],['🧴','Holzleim, Schleifpapier','']];
  return {teile,ant,warn,rech,iz,zu,klein,titel:`Zahnräder Modul ${m}: ${raeder.map(r=>r.z).join(' / ')} Zähne`};
}

// ---------- Räder, Kurbel, Nocken ----------
function teileRad(){
  const D=S.radD*10,loch=lochmass('achse'),teile=[],ant=[],warn=[],rech=[],art=S.nocken;
  for(let i=0;i<S.radN;i++)teile.push(kreisRad(D,loch,'Rad',`Ø ${cmText(D)} · Loch ${mm(loch)}`));
  ant.push(`Rad: <b>${S.radN} × Ø ${cmText(D)}</b>`,`Loch Rad: <b>${mm(loch)}</b>${S.fest==='rad'?' ↻':''}`,`Loch Brett: <b>${mm(lochmass('klotz'))}</b>${S.fest==='achse'?' ↻':''}`);
  const klein=[['🔩','Bohrer',mm(loch)],['🥢','Rundstab',mm(S.achse)],['🪚','Laubsäge','']];
  let titel=`${S.radN} Räder Ø ${cmText(D)}`;
  if(S.hub>0&&art==='exzenter'){
    const e=S.hub/2,sd=S.scheibeD||Math.max(30,Math.ceil((S.hub+2*loch+16)/5)*5),r=sd/2;
    teile.push({name:'Kurbelscheibe',w:sd,h:sd,svg:`<circle cx="${f(r)}" cy="${f(r)}" r="${f(r)}" class="schnitt"/>${lochKreuz(r,r,S.achse,'Achse')}${lochKreuz(r+e,r,loch,'Griff')}`+txt(r,r+loch/2+10,`Kurbelscheibe · Hub ${mm(S.hub)}`)});
    teile.push(kurbelarm(e,S.achse,loch,44));
    teile.push({name:'Exzenter',w:sd,h:sd,svg:`<circle cx="${f(r)}" cy="${f(r)}" r="${f(r)}" class="schnitt"/>${lochKreuz(r+e,r,S.achse,'Achse')}<path class="kreuz" d="M${f(r-1.5)} ${f(r)}h3M${f(r)} ${f(r-1.5)}v3"/>`+txt(r,r+10,`Exzenter · Hub ${mm(S.hub)}`)});
    ant.push(`Kurbel: <b>Hub ${mm(S.hub)}</b>`,`Scheibe: <b>Ø ${mm(sd)}</b>`);
    rech.push(`<p><span class="f">Hub = 2 × ${mm(e)} = ${mm(S.hub)}</span></p>`);

function punkt(ev){const m=SV.getScreenCTM();if(!m)return {x:0,y:0};const p=new DOMPoint(ev.clientX,ev.clientY).matrixTransform(m.inverse());return {x:p.x,y:p.y}}
SV.addEventListener('pointerdown',ev=>{
  const el=ev.target.closest('[data-h]');if(!el||ev.button>0)return;
  ev.preventDefault();
  const p=punkt(ev),d=el.dataset;
  zieh={h:d.h,tap:d.tap||'',d:Object.assign({},d),c:[+d.cx||0,+d.cy||0],p0:p,p,S0:Object.assign({},S),sx:ev.clientX,sy:ev.clientY,weit:false,id:ev.pointerId,cxF:letztCxF,raf:0};
  if(d.h==='scheibe'){const r0=Math.hypot(p.x-zieh.c[0],p.y-zieh.c[1]);zieh.art=Math.abs(r0-d.e)<Math.abs(r0-d.r)?'hub':'rand'}
  if(d.h==='nocke'){const r0=Math.hypot(p.x-zieh.c[0],p.y-zieh.c[1]);zieh.art=Math.abs(r0-(+d.rb))<Math.abs(r0-(+d.rm))?'rand':'hub'}

});
SV.addEventListener('pointermove',ev=>{

function ende(ev){

function ziehen(z=zieh){
  const {p,p0,S0,c,d}=z,dx=p.x-p0.x,dy=p.y-p0.y;
  const rad=()=>Math.hypot(p.x-c[0],p.y-c[1])-Math.hypot(p0.x-c[0],p0.y-c[1]);
  const seit=()=>Math.abs(p.x-c[0])-Math.abs(p0.x-c[0]);
  const h=z.h.split(':');
  if(h[0]==='pa'||h[0]==='pr'){if(!bildAendern(h,p))return}
  else if(h[0]==='z'){const key='z'+h[1];S[key]=begrenzt(Math.round(S0[key]+2*rad()/S.modul),8,60);S.ziel=''}
  else if(h[0]==='rad')S.radD=begrenzt(r5(S0.radD+2*rad()/10),1,30);
  else if(h[0]==='scheibe'){if(z.art==='hub')S.hub=begrenzt(Math.round(S0.hub+2*rad()),2,150);else S.scheibeD=begrenzt(Math.round(2*d.r+2*rad()),10,200)}
  else if(h[0]==='nocke'){if(z.art==='hub')S.hub=begrenzt(Math.round(S0.hub+rad()),2,150);else S.scheibeD=begrenzt(Math.round(2*d.rb+2*rad()),10,200)}
  else if(h[0]==='laenge')S.autoL=begrenzt(r5(S0.autoL+dx/10),5,60);
  else if(h[0]==='hoehe')S.autoH=begrenzt(r5(S0.autoH-dy/10),2,30);
  else if(h[0]==='arad'||h[0]==='aradk')S.autoRad=begrenzt(r5(S0.autoRad+2*rad()/10),1,20);
  else if(h[0]==='koerper')S.boden=begrenzt(Math.round(S0.boden-dy),0,80);
  else if(h[0]==='achse')S.radstand=begrenzt(r5((+d.ws+2*seit())/10),1,60);
  else if(h[0]==='breite')S.autoB=begrenzt(r5(S0.autoB+2*seit()/10),1,20);
  else if(h[0]==='rbreite'&&Math.abs(dy)>Math.abs(dx))S.autoRad=begrenzt(r5(S0.autoRad-dy/10),1,20);
  else if(h[0]==='rbreite')S.radBreite=begrenzt(Math.round(S0.radBreite+seit()),3,60);
  else if(h[0]==='wind'){if(S.wart==='papier')S.wSeite=begrenzt(r5(S0.wSeite+2*rad()/10),8,30);else S.wHoehe=begrenzt(r5(S0.wHoehe+rad()/10),5,25)}
  else if(h[0]==='kreisel')S.kD=begrenzt(r5(S0.kD+2*rad()/10),5,20);
  else return;
  if(z===zieh){felder();zeigen()}
}
function tippen(a){
  if(a==='plusC'){S.zC=12;S.kette='reihe';S.ziel=''}
  else if(a==='wegC'){S.zC=0;S.ziel=''}
  else if(a==='nMinus')S.radN=Math.max(1,S.radN-1);
  else if(a==='nPlus')S.radN=Math.min(12,S.radN+1);
  else if(a==='kurbelWeg')S.hub=0;
  else if(a==='kurbelDazu'){S.hub=20;S.scheibeD=0}
  else if(a==='wMinus')S.wFluegel=S.wart==='papier'?4:Math.max(3,S.wFluegel-1);
  else if(a==='wPlus')S.wFluegel=S.wart==='papier'?8:Math.min(8,S.wFluegel+1);
  else if(a==='kMinus')S.kN=Math.max(1,S.kN-1);
  else if(a==='kPlus')S.kN=Math.min(6,S.kN+1);
  else if(a==='fMinus')S.kFluegel=Math.max(6,S.kFluegel-2);
  else if(a==='fPlus')S.kFluegel=Math.min(16,S.kFluegel+2);
}

function bildStand(){const b=BILD,p=pruef,z={...S};return ()=>{pruef=p;setzeBild(b);Object.assign(S,z);formChips();felder();zeigen()}}
function bildAendern(h,p){const F=BILD,U=1000,hU=F.hw*U;let ach=F.achsen.slice(),r=F.rad;
  if(h[0]==='pa'){const i=+h[1];let x=begrenzt(p.x/U,.03,.97);x=i?Math.max(x,ach[0]+.15):Math.min(x,ach[1]-.15);ach[i]=Math.round(x*1e3)/1e3}
  else r=Math.round(begrenzt((hU-p.y)/(2*U),.03,.25)*1e3)/1e3;
  const n=fertig((F.roh||F.env).slice(),ach,r,F.hw,[],18);if(n.i1-n.i0<NE*.3)return false;
  ['name','roh','box','url'].forEach(k=>{if(F[k]!=null)n[k]=F[k]});if(!n.roh)n.roh=F.env.slice();
