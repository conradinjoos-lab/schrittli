<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schritt für Schritt · Mechanik-Planer</title>
<meta name="description" content="Zahnräder, Räder, Kurbeln und Holzautos planen – Masse ausrechnen und die Teile in echter Grösse drucken.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F8;--surface:#FFFFFF;--surface2:#F5F8FB;--ink:#17212F;--muted:#5B6B80;--line:#D5DEE9;--acc:#17997A;--acc-ink:#FFFFFF;--acc-soft:#E3F4EF;--warn:#B3412A;--papier:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1621;--surface:#1A2433;--surface2:#141C28;--ink:#EDF2F8;--muted:#9DACBF;--line:#2B384A;--acc:#2FBF98;--acc-ink:#0F1621;--acc-soft:#16302B;--warn:#F08A6E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1621;--surface:#1A2433;--surface2:#141C28;--ink:#EDF2F8;--muted:#9DACBF;--line:#2B384A;--acc:#2FBF98;--acc-ink:#0F1621;--acc-soft:#16302B;--warn:#F08A6E;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.4 Nunito,system-ui,sans-serif}
h1,h2{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0}
h1{font-size:28px}
h2{font-size:17px;margin-bottom:10px}
a{color:var(--acc)}
.kopf{max-width:1200px;margin:0 auto;padding:16px 16px 4px}
.kopf .neben{font:600 14px Nunito,system-ui,sans-serif;margin-left:8px;vertical-align:middle}
main{max-width:1200px;margin:0 auto;padding:8px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:14px;align-items:start}
.links{display:flex;flex-direction:column;gap:14px}
.karte{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.rechts{position:sticky;top:12px;display:flex;flex-direction:column;gap:14px}
.feld{margin-bottom:14px}.feld:last-child{margin-bottom:0}
.lbl{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.chip:hover{border-color:var(--acc)}
.modus .chip{font-size:16px;padding:8px 16px}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.zwei{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.zahl{display:flex;align-items:center;gap:6px}
.zahl input{width:92px;height:48px;font:600 24px Fredoka,Nunito,sans-serif;text-align:center;border:2px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--ink);padding:0 4px}
.zahl span{font-size:15px;color:var(--muted)}
.drucken{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--acc);color:var(--acc-ink);font:600 20px Fredoka,Nunito,sans-serif;cursor:pointer}
.drucken svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round}
.antwort{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.antwort li{font-size:16px;line-height:1.35}
.antwort b{font:600 24px/1.1 Fredoka,Nunito,sans-serif;color:var(--acc);white-space:nowrap}
.antwort .leise{display:none}
.warn{color:var(--warn)}
.hinweis{font-size:13px;color:var(--muted);margin:8px 0 0}
.blaetter{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.druckzeile{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:12px 0}
.druckzeile .hinweis{margin:0}
/* Bühne: alles im Bild ziehen */
.buehne-karte{padding:12px}
.leiste{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:10px}
.leiste .chip{min-height:40px;padding:4px 10px}
.leiste .chip svg{display:block;height:20px;width:40px}
#formChips .chip svg{height:26px;width:48px}
.buehne{position:relative;border-radius:14px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
#buehne{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
#buehne .ks{stroke:#1F1A17;stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#buehne .ml{fill:none;stroke:var(--muted);stroke-width:1.5;vector-effect:non-scaling-stroke}
#buehne .gst{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
#buehne .pf{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#buehne text{font-family:Fredoka,Nunito,sans-serif;font-weight:600;pointer-events:none}
#buehne .mt{fill:var(--ink)}
#buehne [data-h]{cursor:grab}
#buehne .knopf{cursor:pointer}
.gross{position:absolute;left:10px;top:10px;font:600 22px Fredoka,Nunito,sans-serif;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:2px 12px;pointer-events:none}
.spiel{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;cursor:pointer}
.tipp{position:absolute;right:12px;bottom:8px;font-size:13px;color:var(--muted);pointer-events:none}
.warnung{margin:8px 0 0;font-size:14px}
details.karte>summary{cursor:pointer;font:600 17px Fredoka,Nunito,sans-serif}
details.karte[open]>summary{margin-bottom:12px}
.blaetter svg{display:block;width:100%;height:auto;background:var(--papier);border-radius:3px;box-shadow:0 1px 6px rgba(0,0,0,.15)}
[hidden]{display:none!important}
svg .schnitt{fill:none;stroke:#000;stroke-width:.35;stroke-linejoin:round}
svg .hilf{fill:none;stroke:#777;stroke-width:.25;stroke-dasharray:1.5 1}
svg .loch{fill:none;stroke:#000;stroke-width:.3}
svg .kreuz{stroke:#000;stroke-width:.25}
svg .t{font:3.2px Nunito,sans-serif;fill:#333}
svg .tk{font:2.6px Nunito,sans-serif;fill:#555}
svg .titel{font:600 5px Fredoka,Nunito,sans-serif;fill:#000}
svg .pfeil{fill:none;stroke:#17997A;stroke-width:.5}
svg .rad{fill:#eee;stroke:#444;stroke-width:.3}
svg .deko{fill:none;stroke:#888;stroke-width:.25;stroke-dasharray:1 .8}
.rechnung{margin:0;padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font-size:15px;line-height:1.5}
.rechnung p{margin:0 0 6px}.rechnung p:last-child{margin:0}
.rechnung .f{font:600 18px/1.3 Fredoka,Nunito,sans-serif;color:var(--acc)}
.rechnung .leise{color:var(--muted);font-size:13px}
.schritte{margin:0;padding-left:22px;font-size:15px;line-height:1.45}
.schritte li{margin-bottom:6px}
.schritte .leise{color:var(--muted);font-size:13px;display:block}
.material{margin:0;padding:0;list-style:none}
.material li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
.material li:last-child{border-bottom:0}
.material .n{color:var(--acc);font:600 16px Fredoka,Nunito,sans-serif;white-space:nowrap}
@media (max-width:860px){
  main{display:flex;flex-direction:column;align-items:stretch}
  .rechts{position:static}
  h1{font-size:24px}
}
#druck{display:none}
@page{size:A4 portrait;margin:0}
@media print{
  body{background:#fff}
  .kopf,main{display:none!important}
  #druck{display:block}
  #druck svg{display:block;width:var(--bw,210mm);height:var(--bh,297mm);break-after:page}
  #druck svg:last-child{break-after:auto}
}
</style>
<style id="seite"></style>
</head>
<body>
<header class="kopf">
  <a class="zur-app" href="../../" data-zur-app>← Zurück zur App</a>
  <h1>⚙️ Mechanik-Planer <a class="neben" href="../">Alle Vorlagen</a></h1>
</header>
<script src="../zurueck.js"></script>
<main>
<div class="links">
  <div class="chips modus" role="group" aria-label="Werkstück" data-g="modus">
    <button type="button" class="chip" data-v="zahn">⚙️ Zahnräder</button>
    <button type="button" class="chip" data-v="rad">🛞 Räder</button>
    <button type="button" class="chip" data-v="auto">🚗 Auto</button>
  </div>

  <section class="karte buehne-karte">
    <div class="leiste modus-teil" data-modus="zahn">
      <div class="chips" role="group" aria-label="Ziel" data-g="ziel"><button type="button" class="chip" data-v="langsam" title="Halb so schnell">1:2 🐢</button><button type="button" class="chip" data-v="langsam3" title="3-mal langsamer">1:3 🐢</button><button type="button" class="chip" data-v="schnell" title="Doppelt so schnell">2:1 🐇</button><button type="button" class="chip" data-v="gleich" title="Gleich schnell, andere Richtung">1:1 ↻↺</button><button type="button" class="chip" data-v="richtung" title="Gleiche Richtung mit Zwischenrad">1:1 ↻↻</button><button type="button" class="chip" data-v="stufe" title="Sehr langsam, zweistufig">1:9 🐌</button></div>
      <div class="chips" role="group" aria-label="Zahngrösse (Modul)" data-g="modul" id="modulChips"></div>
    </div>
    <div class="leiste modus-teil" data-modus="auto">
      <div class="chips" role="group" aria-label="Form" data-g="form" id="formChips"></div>
    </div>
    <div class="buehne">
      <svg id="buehne" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Werkstück zum Ziehen"></svg>
      <span class="gross" id="gross" hidden></span>
      <button type="button" class="spiel" id="spiel" aria-label="Drehen anhalten">⏸</button>
      <span class="tipp" id="tipp">👆 ziehen</span>
    </div>
    <p class="warnung" id="warnung" hidden></p>
  </section>

  <details class="karte mehr">
    <summary>⋯ Genau einstellen</summary>
    <div class="modus-teil" data-modus="zahn">
      <div class="zwei">
        <div class="feld"><label class="lbl" for="zA">Zähne A</label><div class="zahl"><input type="number" id="zA" data-k="zA" min="8" max="60" step="1" inputmode="numeric"></div></div>
        <div class="feld"><label class="lbl" for="zB">Zähne B</label><div class="zahl"><input type="number" id="zB" data-k="zB" min="8" max="60" step="1" inputmode="numeric"></div></div>
        <div class="feld"><label class="lbl" for="zC">Zähne C (0 = keins)</label><div class="zahl"><input type="number" id="zC" data-k="zC" min="0" max="60" step="1" inputmode="numeric"></div></div>
        <div class="feld" id="feldD"><label class="lbl" for="zD">Zähne D</label><div class="zahl"><input type="number" id="zD" data-k="zD" min="8" max="60" step="1" inputmode="numeric"></div></div>
      </div>
      <div class="feld" id="feldKette"><span class="lbl">Rad C</span>
        <div class="chips" role="group" aria-label="Anordnung" data-g="kette"><button type="button" class="chip" data-v="reihe">greift in B</button><button type="button" class="chip" data-v="stufe">auf Achse B, treibt D</button></div></div>
      <div class="zwei">
        <div class="feld"><span class="lbl">Holz</span>
          <div class="chips" role="group" aria-label="Holzdicke" data-g="holz"><button type="button" class="chip" data-v="4">4 mm</button><button type="button" class="chip" data-v="6">6 mm</button><button type="button" class="chip" data-v="8">8 mm</button><button type="button" class="chip" data-v="10">10 mm</button></div></div>
        <div class="feld"><span class="lbl">Kurbel an A</span>
          <div class="chips" role="group" aria-label="Kurbel" data-g="kurbel"><button type="button" class="chip" data-v="ja">Ja</button><button type="button" class="chip" data-v="nein">Nein</button></div></div>
      </div>
      <div class="feld"><span class="lbl">Achse</span>
        <div class="chips" role="group" aria-label="Achse" data-g="achse"><button type="button" class="chip" data-v="3">3 mm</button><button type="button" class="chip" data-v="4">4 mm</button><button type="button" class="chip" data-v="6">6 mm</button><button type="button" class="chip" data-v="8">8 mm</button><button type="button" class="chip" data-v="10">10 mm</button></div></div>
      <div class="feld"><span class="lbl">Was dreht?</span>
        <div class="chips" role="group" aria-label="Lagerung" data-g="fest"><button type="button" class="chip" data-v="achse">Achse dreht</button><button type="button" class="chip" data-v="rad">Rad dreht lose</button></div></div>
    </div>

    <div class="modus-teil" data-modus="rad">
      <div class="zwei">
        <div class="feld"><label class="lbl" for="radD">Rad Ø</label><div class="zahl"><input type="number" id="radD" data-k="radD" min="1" max="30" step="0.5" inputmode="decimal"><span>cm</span></div></div>
        <div class="feld"><label class="lbl" for="radN">Anzahl</label><div class="zahl"><input type="number" id="radN" data-k="radN" min="1" max="12" step="1" inputmode="numeric"></div></div>
        <div class="feld"><label class="lbl" for="hub">Hub (0 = keine Kurbel)</label><div class="zahl"><input type="number" id="hub" data-k="hub" min="0" max="150" step="1" inputmode="numeric"><span>mm</span></div></div>
        <div class="feld"><label class="lbl" for="scheibeD">Kurbelscheibe Ø (0 = auto)</label><div class="zahl"><input type="number" id="scheibeD" data-k="scheibeD" min="0" max="200" step="1" inputmode="numeric"><span>mm</span></div></div>
      </div>
      <div class="feld"><span class="lbl">Achse</span>
        <div class="chips" role="group" aria-label="Achse" data-g="achse"><button type="button" class="chip" data-v="3">3 mm</button><button type="button" class="chip" data-v="4">4 mm</button><button type="button" class="chip" data-v="6">6 mm</button><button type="button" class="chip" data-v="8">8 mm</button><button type="button" class="chip" data-v="10">10 mm</button></div></div>
      <div class="feld"><span class="lbl">Was dreht?</span>
        <div class="chips" role="group" aria-label="Lagerung" data-g="fest"><button type="button" class="chip" data-v="achse">Achse dreht</button><button type="button" class="chip" data-v="rad">Rad dreht lose</button></div></div>
    </div>

    <div class="modus-teil" data-modus="auto">
      <div class="zwei">
        <div class="feld"><label class="lbl" for="autoL">Länge</label><div class="zahl"><input type="number" id="autoL" data-k="autoL" min="5" max="60" step="0.5" inputmode="decimal"><span>cm</span></div></div>
        <div class="feld"><label class="lbl" for="autoH">Höhe</label><div class="zahl"><input type="number" id="autoH" data-k="autoH" min="2" max="30" step="0.5" inputmode="decimal"><span>cm</span></div></div>
        <div class="feld"><label class="lbl" for="autoB">Breite</label><div class="zahl"><input type="number" id="autoB" data-k="autoB" min="1" max="20" step="0.5" inputmode="decimal"><span>cm</span></div></div>
        <div class="feld"><label class="lbl" for="autoRad">Rad Ø</label><div class="zahl"><input type="number" id="autoRad" data-k="autoRad" min="1" max="20" step="0.5" inputmode="decimal"><span>cm</span></div></div>
        <div class="feld"><label class="lbl" for="radBreite">Radbreite</label><div class="zahl"><input type="number" id="radBreite" data-k="radBreite" min="3" max="60" step="1" inputmode="numeric"><span>mm</span></div></div>
        <div class="feld"><label class="lbl" for="boden">Bodenfreiheit</label><div class="zahl"><input type="number" id="boden" data-k="boden" min="0" max="80" step="1" inputmode="numeric"><span>mm</span></div></div>
        <div class="feld"><label class="lbl" for="radstand">Radstand (0 = auto)</label><div class="zahl"><input type="number" id="radstand" data-k="radstand" min="0" max="60" step="0.5" inputmode="decimal"><span>cm</span></div></div>
      </div>
      <div class="feld"><span class="lbl">Achse</span>
        <div class="chips" role="group" aria-label="Achse" data-g="achse"><button type="button" class="chip" data-v="3">3 mm</button><button type="button" class="chip" data-v="4">4 mm</button><button type="button" class="chip" data-v="6">6 mm</button><button type="button" class="chip" data-v="8">8 mm</button><button type="button" class="chip" data-v="10">10 mm</button></div></div>
      <div class="feld"><span class="lbl">Was dreht?</span>
        <div class="chips" role="group" aria-label="Lagerung" data-g="fest"><button type="button" class="chip" data-v="achse">Achse dreht</button><button type="button" class="chip" data-v="rad">Räder drehen lose</button></div></div>
    </div>
  </details>
</div>

<div class="rechts">
  <section class="karte">
    <h2>📏 Masse</h2>
    <ul class="antwort" id="antwort"></ul>
  </section>
  <section class="karte">
    <button type="button" class="drucken" id="drucken" data-handy><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v7H6z"/></svg> Drucken</button>
    <div class="druckzeile"><div class="chips" role="group" aria-label="Papier" data-g="papier"><button type="button" class="chip" data-v="a4">A4</button><button type="button" class="chip" data-v="a3">A3</button></div><span class="hinweis" id="info"></span></div>
    <div class="blaetter" id="blaetter"></div>
  </section>
  <details class="karte" id="k-rechnung" hidden>
    <summary>🧮 Rechnung</summary>
    <div class="rechnung" id="rechnung"></div>
  </details>
  <details class="karte" id="k-bau" hidden>
    <summary>🔨 Bauen</summary>
    <ul class="material" id="material"></ul>
    <ol class="schritte" id="schritte"></ol>
  </details>
</div>
</main>
<div id="druck"></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const KEY='schrittli.mechanik.v1';
const PAPIER={a4:{name:'A4',w:210,h:297},a3:{name:'A3',w:297,h:420}};
const RAND=10,LUECKE=6,KOPF=10,FUSS=8;   // mm: Rand, Lücke zwischen Teilen, Titelzeile, Kontrolllinie
const FORMEN={flitzer:'Flitzer',rennwagen:'Rennwagen',lastwagen:'Lastwagen',bus:'Bus',kaefer:'Käfer',kiste:'Kiste'};
const STANDARD={modus:'zahn',papier:'a4',modul:4,zA:12,zB:24,zC:0,zD:36,kette:'reihe',holz:6,kurbel:'ja',ziel:'',achse:6,
  radD:6,radN:4,hub:20,scheibeD:0,fest:'achse',
  autoL:18,autoH:6,autoB:4,autoRad:5,radBreite:18,boden:8,radstand:0,form:'flitzer'};
const GRENZEN={modul:[2,6],zA:[8,60],zB:[8,60],zC:[0,60],zD:[8,60],holz:[4,10],achse:[3,10],radD:[1,30],radN:[1,12],hub:[0,150],scheibeD:[0,200],
  autoL:[5,60],autoH:[2,30],autoB:[1,20],autoRad:[1,20],radBreite:[3,60],boden:[0,80],radstand:[0,60]};
const WORTE={modus:['zahn','rad','auto'],papier:['a4','a3'],fest:['achse','rad'],form:Object.keys(FORMEN),kette:['reihe','stufe'],kurbel:['ja','nein'],ziel:['','langsam','langsam3','schnell','gleich','richtung','stufe']};
const ZIELE={langsam:{zA:12,zB:24,zC:0,kette:'reihe'},langsam3:{zA:10,zB:30,zC:0,kette:'reihe'},schnell:{zA:24,zB:12,zC:0,kette:'reihe'},gleich:{zA:16,zB:16,zC:0,kette:'reihe'},richtung:{zA:12,zB:12,zC:12,kette:'reihe'},stufe:{zA:10,zB:30,zC:10,zD:30,kette:'stufe'}};
const S=Object.assign({},STANDARD);
const f=n=>+n.toFixed(2);
const begrenzt=(v,a,b)=>Math.min(b,Math.max(a,v));
const zahl=(v,d)=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:d};
const mm=v=>(Math.round(v*10)/10).toLocaleString('de-CH').replace('.',',')+' mm';   // Komma wie in allen Werkzeugen
const cmText=v=>(Math.round(v)/10).toLocaleString('de-CH').replace('.',',')+' cm';
function uebernehmen(q,k,v){
  if(v==null)return;
  if(WORTE[k]){if(WORTE[k].includes(v))S[k]=v;return}
  if(GRENZEN[k]){const n=zahl(v,NaN);if(isFinite(n))S[k]=begrenzt(n,GRENZEN[k][0],GRENZEN[k][1])}
}
try{const g=JSON.parse(localStorage.getItem(KEY)||'{}');Object.keys(g).forEach(k=>uebernehmen(null,k,g[k]))}catch(_){}
const q=new URLSearchParams(location.search);
[...q.keys()].forEach(k=>uebernehmen(q,k,q.get(k)));
function speichern(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}
  const p=new URLSearchParams();
  Object.keys(S).forEach(k=>{if(k!=='ziel'&&S[k]!==STANDARD[k])p.set(k,String(S[k]))});
  const s=p.toString();history.replaceState(null,'',location.pathname+(s?'?'+s:''));
}

// ---------- Zeichenhilfen (alles in mm) ----------
function lochKreuz(cx,cy,d,text){
  const a=d/2+2;
  return `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(d/2)}" class="loch"/><path class="kreuz" d="M${f(cx-a)} ${f(cy)}H${f(cx+a)}M${f(cx)} ${f(cy-a)}V${f(cy+a)}"/>`+
    (text?`<text x="${f(cx)}" y="${f(cy+a+3.5)}" class="tk" text-anchor="middle">${text}</text>`:'');
}
const txt=(x,y,s,k='t',anker='middle')=>`<text x="${f(x)}" y="${f(y)}" class="${k}" text-anchor="${anker}">${s}</text>`;

// Zahnrad: Teilkreis d = m·z, Kopfkreis m·(z+2), Fusskreis m·(z−2.5). Zähne als einfache Trapeze – reicht zum Aussägen.
function zahnUmriss(m,z,loch,off,cx,cy){
  const r=m*z/2,ra=r+m,rf=Math.max(r-1.25*m,loch/2+3),p=2*Math.PI/z,sp=Math.PI*m/4;
  const wa=0.5*sp/ra,wp=sp/r,wf=Math.min(1.25*sp/rf,p*0.45);
  const pts=[];
  for(let i=0;i<z;i++){const t=off+i*p;
    [[-wf,rf],[-wp,r],[-wa,ra],[wa,ra],[wp,r],[wf,rf],[p/2,rf]].forEach(([a,rr])=>pts.push(f(cx+rr*Math.cos(t+a))+' '+f(cy+rr*Math.sin(t+a))))}
  return {d:'M'+pts.join('L')+'Z',r,ra,rf};
}
function zahnrad(m,z,loch,off,name){
  const r=m*z/2,ra=r+m;
  const svg=`<path class="schnitt" d="${zahnUmriss(m,z,loch,off,ra,ra).d}"/><circle cx="${f(ra)}" cy="${f(ra)}" r="${f(r)}" class="hilf"/>${lochKreuz(ra,ra,loch)}`+
    txt(ra,ra+loch/2+6,`${name?name+' · ':''}${z} Zähne`)+txt(ra,ra+loch/2+9.5,`Modul ${m} · Ø ${mm(2*ra)} · Loch ${mm(loch)}`,'tk');
  return {name:`Zahnrad ${name||''}`.trim(),w:2*ra,h:2*ra,r,ra,z,off,svg};
}
// Winkel, bei dem Rad «links» einen Zahn genau in Richtung des rechten Nachbarn hat
const zahnBei0=(off,z)=>{const p=2*Math.PI/z,x=((-off/p)%1+1)%1;return x<0.25||x>0.75};
const gegenOff=(linksOff,linksZ,z)=>{const p=2*Math.PI/z;return zahnBei0(linksOff,linksZ)?((Math.PI-p/2)%p+p)%p:(Math.PI%p+p)%p};

function kreisRad(D,loch,name,text){
  const r=D/2;
  return {name,w:D,h:D,svg:`<circle cx="${f(r)}" cy="${f(r)}" r="${f(r)}" class="schnitt"/>${lochKreuz(r,r,loch)}`+txt(r,r+loch/2+6,name)+(text?txt(r,r+loch/2+9.5,text,'tk'):'')};
}

function teileZahn(){
  const m=S.modul,loch=lochmass('achse'),lochP=lochmass('klotz'),stufe=S.zC>=8&&S.kette==='stufe';
  const A=zahnrad(m,S.zA,loch,0,'A'),B=zahnrad(m,S.zB,loch,gegenOff(0,S.zA,S.zB),'B');
  const raeder=[A,B];
  if(S.zC>=8){const C=zahnrad(m,S.zC,loch,stufe?0:gegenOff(B.off,S.zB,S.zC),'C');raeder.push(C);
    if(stufe)raeder.push(zahnrad(m,S.zD,loch,gegenOff(0,S.zC,S.zD),'D'))}
  // Achsen: in der Reihe hat jedes Rad eine eigene Achse; zweistufig teilen B und C eine Achse
  const achsen=stufe?[[A],[B,raeder[2]],[raeder[3]]]:raeder.map(r=>[r]);
  const namen=achsen.map(g=>g.map(r=>r.name.replace('Zahnrad ','')).join('+'));
  const abst=[];for(let i=1;i<achsen.length;i++){const links=achsen[i-1][achsen[i-1].length-1],rechts=achsen[i][0];abst.push(m*(links.z+rechts.z)/2)}
  const ges=abst.reduce((a,b)=>a+b,0);
  // Grundplatte: Kreuze im richtigen Abstand, rundum Platz für das grösste Rad
  const rmax=Math.max(...raeder.map(r=>r.ra)),pw=ges+2*rmax+20,ph=2*rmax+24;let x=rmax+10;
  let plan=`<rect x="0.2" y="0.2" width="${f(pw-.4)}" height="${f(ph-.4)}" rx="4" class="schnitt"/>`;
  achsen.forEach((g,i)=>{plan+=lochKreuz(x,rmax+10,lochP,'Achse '+namen[i]);g.forEach(r=>{plan+=`<circle cx="${f(x)}" cy="${f(rmax+10)}" r="${f(r.ra)}" class="hilf"/>`});
    if(i<abst.length){plan+=`<path class="hilf" d="M${f(x+lochP/2+3)} ${f(rmax+10)}H${f(x+abst[i]-lochP/2-3)}"/>`+txt(x+abst[i]/2,rmax+7,mm(abst[i]),'tk');x+=abst[i]}});
  plan+=txt(pw/2,ph-3,`Grundplatte ${mm(pw)} × ${mm(ph)} · Löcher ${mm(lochP)} · Abstände von Mitte zu Mitte`,'tk');
  const teile=raeder.concat([{name:'Grundplatte',w:pw,h:ph,svg:plan}]);
  if(S.kurbel==='ja'){const e=Math.max(20,Math.round(A.r*0.8)),aw=e+loch+14,ah=loch+12,g=lochmass('klotz');
    teile.push({name:'Kurbelarm',w:Math.max(aw,52),h:ah+6,svg:`<rect x="0.2" y="0.2" width="${f(aw-.4)}" height="${f(ah-.4)}" rx="${f(ah/2)}" class="schnitt"/>${lochKreuz(ah/2,ah/2,S.achse)}${lochKreuz(ah/2+e,ah/2,g)}`+txt(aw/2,ah+4,`Kurbelarm · Achse ${mm(S.achse)} · Griff ${mm(g)}`,'tk')});
    teile.kurbelE=e}
  // Übersetzung
  const letzte=raeder[raeder.length-1],iGes=stufe?(S.zB/S.zA)*(S.zD/S.zC):letzte.z/S.zA,nL=letzte.name.replace('Zahnrad ','');
  const wie=iGes>1?`${dz(iGes)}-mal langsamer, dafür kräftiger`:iGes<1?`${dz(1/iGes)}-mal schneller, dafür schwächer`:'gleich schnell';
  const richtung=stufe?'D dreht gleich herum wie A':raeder.length===3?'C dreht gleich herum wie A':'B dreht gegen A';
  const ant=[];
  raeder.forEach(r=>ant.push(`Rad ${r.name.replace('Zahnrad ','')}: <b>Ø ${mm(2*r.ra)}</b><span class="leise">Teilkreis ${mm(2*r.r)} · ${r.z} Zähne</span>`));
  ant.push(`Achsabstand ${namen[0]}–${namen[1]}: <b>${mm(abst[0])}</b>`+(abst[1]?`<span class="leise">${namen[1]}–${namen[2]}: ${mm(abst[1])}</span>`:''));
  ant.push(`Übersetzung A → ${nL}: <b>1 : ${dz(iGes)}</b><span class="leise">Dreht sich A einmal, dreht sich ${nL} ${dz(1/iGes)}-mal – ${wie}. ${richtung}.</span>`);
  ant.push(`Loch im Zahnrad: <b>${mm(loch)}</b><span class="leise">${S.fest==='rad'?`1 mm grösser als die Achse (${S.achse} mm), das Rad dreht frei. Achse in der Platte festleimen (Loch ${mm(lochP)}).`:`Genau wie die Achse (${S.achse} mm), Rad festleimen. Loch in der Platte ${mm(lochP)}, damit die Achse dreht.`}</span>`);
  const warn=[];if(S.modul<=3)warn.push('Modul 2–3: sehr feine Zähne, zum Aussägen mit der Laubsäge schwierig.');
  if(stufe&&S.zC>=S.zB)warn.push('Zweistufig wird es nur langsamer, wenn C kleiner ist als B (weniger Zähne).');
  // Rechenweg
  const rech=[];
  rech.push(`<p>Teilkreis = Modul × Zähne: <span class="f">${m} × ${S.zA} = ${mm(2*A.r)}</span> (Rad A) · <span class="f">${m} × ${S.zB} = ${mm(2*B.r)}</span> (Rad B)</p>`);
  rech.push(`<p>Aussen ist jedes Rad 2 Modul grösser: <span class="f">${mm(2*A.r)} + ${2*m} = ${mm(2*A.ra)}</span> (Rad A)</p>`);
  rech.push(`<p>Achsabstand = (Teilkreis A + Teilkreis B) : 2 = <span class="f">(${mm(2*A.r)} + ${mm(2*B.r)}) : 2 = ${mm(abst[0])}</span></p>`);
  rech.push(`<p>Übersetzung = Zähne B : Zähne A = <span class="f">${S.zB} : ${S.zA} = ${dz(S.zB/S.zA)}</span> – dreht A einmal, dreht B ${dz(S.zA/S.zB)}-mal.</p>`);
  if(S.zC>=8&&!stufe)rech.push(`<p>Rad C greift in B: B ist nur ein Zwischenrad. Es ändert die Richtung, nicht die Übersetzung: <span class="f">${S.zC} : ${S.zA} = ${dz(iGes)}</span></p>`);
  if(stufe)rech.push(`<p>Zweite Stufe: Zähne D : Zähne C = <span class="f">${S.zD} : ${S.zC} = ${dz(S.zD/S.zC)}</span>. Beide Stufen malnehmen: <span class="f">${dz(S.zB/S.zA)} × ${dz(S.zD/S.zC)} = ${dz(iGes)}</span></p>`);
  rech.push(`<p class="leise">Merke: Grosses Rad treibt kleines → schneller. Kleines treibt grosses → langsamer, aber kräftiger. Zwei Räder, die ineinandergreifen, drehen immer gegeneinander.</p>`);
  // Material und Bauanleitung
  const dicke=S.holz,plattenDicke=10,achsL=plattenDicke+3+achsen.reduce((mx,g)=>Math.max(mx,g.length),0)*(dicke+1)+8+(S.kurbel==='ja'?dicke+2:0);
  const mat=[[`Sperrholz ${dicke} mm`,`${raeder.length} Zahnräder${S.kurbel==='ja'?' + Kurbelarm':''}`],[`Brett oder Sperrholz 10 mm`,`Grundplatte ${cmText(pw)} × ${cmText(ph)}`],[`Rundstab ${S.achse} mm`,`${achsen.length} × ${mm(achsL)}`],['Unterlagscheiben oder 3-mm-Ringe',`${S.fest==='rad'?raeder.length:achsen.length*2} Stück`],['Holzleim, Laubsäge, Bohrer',`${mm(loch)}${lochP!==loch?' und '+mm(lochP):''}`]];
  if(S.kurbel==='ja')mat.push([`Rundstab ${mm(lochmass('klotz')-1)} als Griff`,'1 × 40 mm']);
  const sch=[`Blatt drucken (100 %), 5-cm-Linie nachmessen, mit Leimstift auf das Holz kleben.<span class="leise">Zahnräder auf ${dicke} mm, Grundplatte${S.kurbel==='ja'?' und Kurbelarm':''} auf 10 mm.</span>`,
    `Zuerst die Löcher an den Kreuzen bohren: Zahnräder ${mm(loch)}, Grundplatte ${mm(lochP)}.<span class="leise">Erst bohren, dann sägen – das Holz hält besser, wenn es noch gross ist.</span>`,
    `Zahnräder aussägen: immer in die Zahnlücke hinein, dann wieder hinaus. Kanten mit Schleifpapier glätten.`,
    `Achsen ablängen: ${achsen.length} × ${mm(achsL)}.<span class="leise">Platte ${plattenDicke} + Unterlagscheibe 3 + Rad ${dicke}${achsen.some(g=>g.length>1)?' (+ zweites Rad)':''} + ${S.kurbel==='ja'?'Kurbelarm + ':''}Überstand.</span>`,
    S.fest==='rad'?`Achsen in die Grundplatte leimen. Unterlagscheibe aufstecken, Zahnrad lose aufstecken, oben ein Tropfen Leim auf ein Abschlussstück (Perle oder Holzscheibe), damit das Rad nicht abfällt.`:`Achsen durch die Grundplatte stecken (sie müssen drehen). Unterlagscheibe aufstecken, Zahnrad festleimen – darauf achten, dass es gerade sitzt.`,
    `Rad B so einsetzen, dass die Zähne von A in die Lücken von B greifen. Dreht es schwer, ist der Achsabstand zu klein; klappert es, ist er zu gross.`+(stufe?' C sitzt fest auf der Achse von B, D greift in C.':''),
    S.kurbel==='ja'?`Kurbelarm auf die Achse von A leimen, Griff ins äussere Loch. Drehen und zählen: eine Umdrehung an A – wie oft dreht ${nL}?`:`Rad A drehen und zählen: eine Umdrehung an A – wie oft dreht ${nL}?`];
  return {teile,ant,warn,rech,mat,sch,titel:`Zahnräder Modul ${m}: ${raeder.map(r=>r.z).join(' / ')} Zähne`};
}

function lochmass(was){   // Bohrloch: wo etwas drehen soll, 1 mm Spiel
  const a=S.achse;
  if(was==='achse')return S.fest==='rad'?a+1:a;        // Loch im Rad
  return S.fest==='rad'?a:a+1;                          // Loch im Klotz / in der Grundplatte
}

function teileRad(){
  const D=S.radD*10,loch=lochmass('achse'),teile=[],ant=[],warn=[];
  for(let i=0;i<S.radN;i++)teile.push(kreisRad(D,loch,'Rad',`Ø ${cmText(D)} · Loch ${mm(loch)}`));
  ant.push(`Räder: <b>${S.radN} × Ø ${cmText(D)}</b><span class="leise">Loch ${mm(loch)} – ${S.fest==='rad'?'1 mm grösser als die Achse, damit das Rad dreht':'genau wie die Achse, Rad festleimen'}</span>`);
  ant.push(`Loch im Klotz oder Brett: <b>${mm(lochmass('klotz'))}</b><span class="leise">${S.fest==='rad'?'Achse festleimen':'1 mm grösser, damit die Achse dreht'}</span>`);
  if(S.hub>0){
    const e=S.hub/2,sd=S.scheibeD||Math.max(30,Math.ceil((S.hub+2*loch+16)/5)*5),r=sd/2;
    if(e+loch/2+4>r)warn.push(`Kurbelscheibe zu klein für Hub ${S.hub} mm – mindestens Ø ${mm(2*(e+loch/2+4))}.`);
    teile.push({name:'Kurbelscheibe',w:sd,h:sd,svg:`<circle cx="${f(r)}" cy="${f(r)}" r="${f(r)}" class="schnitt"/>${lochKreuz(r,r,S.achse,'Achse')}${lochKreuz(r+e,r,loch,'Griff')}`+txt(r,r+loch/2+10,`Kurbelscheibe · Hub ${mm(S.hub)}`)});
    const aw=e+loch+12,ah=loch+12;
    teile.push({name:'Kurbelarm',w:Math.max(aw,44),h:ah+6,svg:`<rect x="0.2" y="0.2" width="${f(aw-.4)}" height="${f(ah-.4)}" rx="${f(ah/2)}" class="schnitt"/>${lochKreuz(ah/2,ah/2,S.achse)}${lochKreuz(ah/2+e,ah/2,loch)}`+txt(aw/2,ah+4,`Kurbelarm · Hub ${mm(S.hub)}`,'tk')});
    teile.push({name:'Exzenter',w:sd,h:sd,svg:`<circle cx="${f(r)}" cy="${f(r)}" r="${f(r)}" class="schnitt"/>${lochKreuz(r+e,r,S.achse,'Achse')}<path class="kreuz" d="M${f(r-1.5)} ${f(r)}h3M${f(r)} ${f(r-1.5)}v3"/>`+txt(r,r+loch/2+10,`Exzenter · Hub ${mm(S.hub)}`)});
    ant.push(`Kurbel: <b>Hub ${mm(S.hub)}</b><span class="leise">Griffloch ${mm(e)} neben der Mitte · Scheibe Ø ${mm(sd)}</span>`);
  }
  return {teile,ant,warn,titel:`${S.radN} Räder Ø ${cmText(D)}${S.hub>0?` · Kurbel Hub ${S.hub} mm`:''}`};
}

// Seitenansicht Auto: Umriss in Anteilen von Länge L und Höhe H, Boden unten (y = 0), Front rechts.
// Q(ctrl,end) = runde Kurve vom letzten Punkt; achsen = wo die Räder sitzen (Anteil der Länge); fenster = Deko-Linien
const kurve=(p0,c,p1,n=14)=>{const o=[];for(let i=1;i<=n;i++){const t=i/n,u=1-t;o.push([u*u*p0[0]+2*u*t*c[0]+t*t*p1[0],u*u*p0[1]+2*u*t*c[1]+t*t*p1[1]])}return o};
function umriss(def){const pts=[];def.forEach(d=>{if(d.q){const p0=pts[pts.length-1];pts.push(...kurve(p0,d.q[0],d.q[1]))}else pts.push(d)});return pts}
const UMRISSE={
  flitzer:{achsen:[.2,.8],pts:umriss([[0,0],[1,0],[1,.3],{q:[[.98,.42],[.9,.44]]},[.72,.5],{q:[[.64,.52],[.6,.74]]},{q:[[.56,.98],[.42,1]]},[.3,1],{q:[[.2,1],[.16,.7]]},{q:[[.14,.56],[.06,.54]]},[0,.52]]),
    fenster:[[.5,.58],[.62,.58],[.48,.9],[.36,.9]]},
  rennwagen:{achsen:[.2,.8],pts:umriss([[0,0],[1,0],[1,.36],{q:[[.9,.42],[.76,.46]]},[.62,.5],{q:[[.56,.52],[.54,.74]]},{q:[[.52,.98],[.44,.98]]},[.4,.98],{q:[[.34,.98],[.33,.62]]},[.14,.62],[.14,1],[.02,1],{q:[[0,1],[0,.9]]},[0,.6]]),
    fenster:[[.44,.7],[.52,.7],[.49,.9],[.44,.9]]},
  lastwagen:{achsen:[.2,.78],pts:umriss([[0,0],[1,0],[1,.5],{q:[[1,.6],[.94,.62]]},[.82,.64],[.74,.98],{q:[[.73,1],[.7,1]]},[.56,1],{q:[[.54,1],[.54,.95]]},[.54,.8],[0,.8]]),
    fenster:[[.6,.7],[.78,.7],[.73,.92],[.6,.92]]},
  bus:{achsen:[.2,.8],pts:umriss([[0,0],[1,0],[1,.3],{q:[[1,.9],[.9,1]]},[.1,1],{q:[[0,.9],[0,.3]]}]),
    fenster:[[.1,.6],[.9,.6],[.9,.88],[.1,.88]]},
  kaefer:{achsen:[.2,.8],pts:umriss([[0,0],[1,0],[1,.2],{q:[[1,.36],[.94,.42]]},{q:[[.8,.6],[.7,.86]]},{q:[[.6,1.02],[.46,1]]},{q:[[.28,.98],[.16,.74]]},{q:[[.08,.5],[0,.4]]},[0,.2]]),
    fenster:[[.56,.6],[.66,.62],[.6,.9],[.48,.92]]},
  kiste:{achsen:[.2,.8],pts:umriss([[0,0],[1,0],[1,.6],[.84,.6],[.84,.96],{q:[[.84,1],[.8,1]]},[.2,1],{q:[[.16,1],[.16,.96]]},[.16,.6],[0,.6]]),
    fenster:[[.22,.68],[.78,.68],[.78,.94],[.22,.94]]}
};
// Höhe des Umrisses an der Stelle x (Anteil der Länge): höchster Punkt der Oberkante
function hoeheBei(pts,x){let h=0;for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];if(a[1]===0&&b[1]===0)continue;
  const lo=Math.min(a[0],b[0]),hi=Math.max(a[0],b[0]);if(x<lo||x>hi)continue;const y=hi-lo<1e-6?Math.max(a[1],b[1]):a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]);h=Math.max(h,y)}return h}
function teileAuto(){
  const L=S.autoL*10,H=S.autoH*10,D=S.autoRad*10,R=D/2,bo=S.boden,lochK=lochmass('klotz'),lochR=lochmass('achse'),F=UMRISSE[S.form];
  let xR,xF;if(S.radstand){const ws=S.radstand*10;xR=(L-ws)/2;xF=xR+ws}else{xR=Math.round(F.achsen[0]*L);xF=Math.round(F.achsen[1]*L)}
  const ws=xF-xR,ay=R-bo;   // Achshöhe über der Unterkante
  const warn=[],ant=[];
  const gh=H+bo;   // Blatt-Teil: Klotz plus Bodenlinie
  const pfad='M'+F.pts.map(([x,y])=>f(x*L)+' '+f(H-y*H)).join('L')+'Z';
  let svg=`<path class="schnitt" d="${pfad}"/>`;
  if(F.fenster)svg+=`<path class="deko" d="M${F.fenster.map(([x,y])=>f(x*L)+' '+f(H-y*H)).join('L')}Z"/>`;
  // Lochprüfung: über und neben dem Loch braucht es 3 mm Holz
  const rand=lochK/2+3;
  [xR,xF].forEach((x,i)=>{svg+=`<circle cx="${f(x)}" cy="${f(H-ay)}" r="${f(R)}" class="hilf"/>`+lochKreuz(x,H-ay,lochK,i?'Vorderachse':'Hinterachse');
    const hmin=Math.min(hoeheBei(F.pts,(x-rand)/L),hoeheBei(F.pts,x/L),hoeheBei(F.pts,(x+rand)/L))*H;
    if(ay+rand>hmin)warn.push(`${i?'Vorderachse':'Hinterachse'}: Der Klotz ist dort nur ${mm(hmin)} hoch, das Loch braucht ${mm(ay+rand)}. Räder kleiner, Bodenfreiheit grösser, Klotz höher oder Radstand ändern.`)});
  svg+=`<path class="hilf" d="M${f(Math.min(0,xR-R))} ${f(gh)}H${f(Math.max(L,xF+R))}"/>`+txt(L/2,gh-1.5,'Boden','tk');
  svg+=txt(L/2,gh+4.5,`${FORMEN[S.form]} · ${cmText(L)} × ${cmText(H)} · Klotz ${cmText(S.autoB*10)} breit · Achslöcher ${mm(lochK)}`);
  const links=Math.min(0,xR-R),breite=Math.max(L,xF+R)-links;
  const teile=[{name:'Karosserie',w:breite,h:gh+6,svg:`<g transform="translate(${f(-links)} 0)">${svg}</g>`}];
  for(let i=0;i<4;i++)teile.push(kreisRad(D,lochR,'Rad',`Ø ${cmText(D)} · Loch ${mm(lochR)}`));
  if(ay<lochK/2+3)warn.push(`Achsloch liegt zu nah an der Unterkante (${mm(ay)} über dem Boden): Räder grösser, Bodenfreiheit kleiner oder Loch von unten als Nut sägen.`);
  if(xR-R<0||xF+R>L)warn.push('Die Räder stehen vorne oder hinten über den Klotz hinaus – Radstand kleiner wählen oder so lassen (sieht bei Rennwagen gut aus).');
  if(xF-xR<D+2)warn.push('Radstand zu klein: die Räder berühren sich.');
  const spiel=2,ueber=S.fest==='rad'?3:0,achsL=S.autoB*10+2*spiel+2*S.radBreite+2*ueber;

function packen(teile){

  teile.forEach(t=>{let w=t.w,h=t.h,rot=false;
    if(w>W&&h<=W&&w<=H){rot=true;[w,h]=[h,w]}

    if(x>0&&x+w>W+.01){x=0;y+=zh+LUECKE;zh=0}

  else if(h[0]==='laenge')S.autoL=begrenzt(r5(S0.autoL+dx/10),5,60);
  else if(h[0]==='hoehe')S.autoH=begrenzt(r5(S0.autoH-dy/10),2,30);
  else if(h[0]==='arad')S.autoRad=begrenzt(r5(S0.autoRad+2*rad()/10),1,20);
  else if(h[0]==='koerper')S.boden=begrenzt(Math.round(S0.boden-dy),0,80);
  else if(h[0]==='achse')S.radstand=begrenzt(r5((+d.ws+2*seit())/10),1,60);
  else if(h[0]==='breite')S.autoB=begrenzt(r5(S0.autoB+2*seit()/10),1,20);
  else if(h[0]==='rbreite')S.radBreite=begrenzt(Math.round(S0.radBreite+seit()),3,60);
  else return;
  $('tipp').hidden=true;
  if(z===zieh){felder();zeigen()}
}
function tippen(a){
  if(a==='plusC'){S.zC=12;S.kette='reihe';S.ziel=''}
  else if(a==='wegC'){S.zC=0;S.ziel=''}
  else if(a==='nMinus')S.radN=Math.max(1,S.radN-1);
  else if(a==='nPlus')S.radN=Math.min(12,S.radN+1);
  else if(a==='kurbelWeg')S.hub=0;
  else if(a==='kurbelDazu'){S.hub=20;S.scheibeD=0}
}
addEventListener('resize',()=>{if(!zieh)buehne()});

// Chips mit Bildern statt Wörtern: Zahngrösse als Zahnstange, Autoform als Umriss
$('modulChips').innerHTML=[2,3,4,5,6].map(m=>{const p=m*1.5+1.5,h=m*1.7;let d='M0 16';
  for(let x=0;x<40;x+=p)d+=`L${f(x+p*.15)} 16L${f(x+p*.32)} ${f(16-h)}L${f(x+p*.68)} ${f(16-h)}L${f(x+p*.85)} 16`;
  return `<button type="button" class="chip" data-v="${m}" title="Zahngrösse: Modul ${m} mm" aria-label="Modul ${m} mm"><svg viewBox="0 0 40 18" aria-hidden="true"><path d="${d}L40 16V18H0Z" fill="currentColor"/></svg></button>`}).join('');
$('formChips').innerHTML=Object.keys(UMRISSE).map(k=>{const F=UMRISSE[k];
  return `<button type="button" class="chip" data-v="${k}" title="${FORMEN[k]}" aria-label="${FORMEN[k]}"><svg viewBox="0 0 48 26" aria-hidden="true"><path d="M${F.pts.map(([x,y])=>f(2+x*44)+' '+f(19-y*14)).join('L')}Z" fill="currentColor"/>`+
    F.achsen.map(a=>`<circle cx="${f(2+a*44)}" cy="20" r="5" fill="currentColor" stroke="var(--surface2)" stroke-width="1.5"/>`).join('')+'</svg></button>'}).join('');

function zeigen(){
  const E=S.modus==='zahn'?teileZahn():S.modus==='rad'?teileRad():teileAuto();
  const {blaetter,zuGross,P}=packen(E.teile);
  const svgs=blaetter.map((b,i)=>blattSvg(b,i,blaetter.length,E.titel,P));
  $('antwort').innerHTML=E.ant.map(a=>`<li>${a}</li>`).join('');
  const warn=E.warn.concat(zuGross.length?[`Zu gross für ${P.name}, wird nicht gedruckt: ${[...new Set(zuGross)].join(', ')}.${S.papier==='a4'?' A3 wählen.':' Kleineren Modul oder weniger Zähne wählen.'}`]:[]);
  $('warnung').hidden=!warn.length;$('warnung').innerHTML=warn.map(w=>`<span class="warn">${w}</span>`).join('<br>');
  $('k-rechnung').hidden=!(E.rech&&E.rech.length);$('rechnung').innerHTML=(E.rech||[]).join('');
  $('k-bau').hidden=!(E.sch&&E.sch.length);
  $('material').innerHTML=(E.mat||[]).map(([a,b])=>`<li><span>${a}</span><span class="n">${b}</span></li>`).join('');
  $('schritte').innerHTML=(E.sch||[]).map(t=>`<li>${t}</li>`).join('');
  $('blaetter').innerHTML=svgs.join('');
  $('druck').innerHTML=svgs.join('');
  $('info').textContent=blaetter.length?`${E.teile.length-zuGross.length} Teile · ${blaetter.length} ${blaetter.length===1?'Blatt':'Blätter'} · 100 %`:`Passt nicht auf ${P.name}`;
  $('seite').textContent=`@page{size:${P.name} portrait;margin:0}#druck{--bw:${P.w}mm;--bh:${P.h}mm}`;
  document.title=`Schritt für Schritt · Mechanik-Planer · ${E.titel}`;
  buehne();
  speichern();
}
function felder(){
  document.querySelectorAll('.modus-teil').forEach(s=>{s.hidden=s.dataset.modus!==S.modus});
  document.querySelectorAll('[data-g]').forEach(g=>{const k=g.dataset.g;g.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(S[k])===c.dataset.v))});
  document.querySelectorAll('input[data-k]').forEach(i=>{if(document.activeElement!==i)i.value=S[i.dataset.k]});
  $('feldKette').hidden=S.zC<8;$('feldD').hidden=!(S.zC>=8&&S.kette==='stufe');
}
document.querySelectorAll('[data-g]').forEach(g=>g.addEventListener('click',ev=>{
  const c=ev.target.closest('.chip');if(!c)return;const k=g.dataset.g;
  S[k]=WORTE[k]?c.dataset.v:zahl(c.dataset.v,S[k]);
  if(k==='ziel'&&ZIELE[S.ziel])Object.assign(S,ZIELE[S.ziel]);
  felder();zeigen();
}));
document.querySelectorAll('input[data-k]').forEach(i=>{
  i.addEventListener('input',()=>{const k=i.dataset.k,n=zahl(i.value,NaN);if(!isFinite(n))return;S[k]=begrenzt(n,GRENZEN[k][0],GRENZEN[k][1]);if(k[0]==='z')S.ziel='';felder();zeigen()});
  i.addEventListener('change',()=>{i.value=S[i.dataset.k]});
});
$('drucken').addEventListener('click',()=>print());
felder();zeigen();spielKnopf();requestAnimationFrame(schritt);
})();
</script>
