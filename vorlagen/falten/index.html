<style>
:root{--bg:#EEF3F8;--surface:#FFFFFF;--surface2:#F5F8FB;--ink:#17212F;--muted:#5B6B80;--line:#D5DEE9;--acc:#17997A;--acc-ink:#FFFFFF;--acc-soft:#E3F4EF;--warn:#B3412A;--papier:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1621;--surface:#1A2433;--surface2:#141C28;--ink:#EDF2F8;--muted:#9DACBF;--line:#2B384A;--acc:#2FBF98;--acc-ink:#0F1621;--acc-soft:#16302B;--warn:#F08A6E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1621;--surface:#1A2433;--surface2:#141C28;--ink:#EDF2F8;--muted:#9DACBF;--line:#2B384A;--acc:#2FBF98;--acc-ink:#0F1621;--acc-soft:#16302B;--warn:#F08A6E;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.4 Nunito,system-ui,sans-serif}

main{max-width:1200px;margin:0 auto;padding:8px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:16px;align-items:start}
.karte{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.seite-rechts{position:sticky;top:12px;display:flex;flex-direction:column;gap:14px;min-width:0}

.modelle{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin-bottom:12px}
.kachel{font:inherit;font-size:12.5px;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 7px;border-radius:14px;border:2px solid transparent;background:var(--surface2);color:var(--ink);cursor:pointer;min-width:0}

.kachel[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}

.schau{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
#cv3{display:block;width:100%;aspect-ratio:1;border-radius:12px;background:var(--surface2);touch-action:none;cursor:grab}

.stepper input{width:72px;height:44px;font:600 22px Fredoka,Nunito,sans-serif;text-align:center;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0 4px}

.zeile>.lbl{margin:0;min-width:54px}

.drucken:disabled{opacity:.45;cursor:default}
.drucken svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round}

  body{background:#fff}

  #druck svg:last-child{break-after:auto}

<script>
// Falt-Generator von Schritt für Schritt. Masse in cm, gerechnet und gezeichnet wird 1:1 in mm.
// Körper mit ebenen Flächen (Würfel, Pyramide, Haus …) werden aus ihren Ecken abgewickelt: konvexe Hülle → Spannbaum über
// die Flächen → Flächen in die Ebene klappen → Klebelaschen an jede offene Kante, die beim Zusammenbauen aufeinandertrifft.
// Runde Sachen (Zylinder, Hut, Kissenbox) und die Ideen aus dem TTG-Material (Sternenschale, Kerze, Hexentreppe) sind
// eigene Zeichnungen. Eine Kante, die zwei Teile teilen, ist ein Falz (gestrichelt), eine einzelne Kante ein Schnitt.
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='schrittli.falten.v1';
const PAPIERE={a4:{name:'A4',w:210,h:297},a3:{name:'A3',w:297,h:420}};
const M=8, FUSS=14, ABST=4;
const FARBEN=['#FFFFFF','#FFE08A','#FFB8A8','#BFE3C0','#B9D7F5','#D9C6F2'];
const LASCHE='#D6D6D6', DACH='#E88D72', TUER='#9A6B4F', FLAMME='#FFC93C', KARTON='#D8B98A', LINIE='#2A2A2A';
const PHI=(1+Math.sqrt(5))/2;
const zahl=x=>String(Math.round(x*10)/10).replace('.',',');

// ---------- Vektoren ----------
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], mul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2], cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len=a=>Math.hypot(a[0],a[1],a[2]), norm=a=>mul(a,1/(len(a)||1));
const mitte=P=>mul(P.reduce((c,p)=>add(c,p),[0,0,0]),1/P.length);
const newell=P=>{ const n=[0,0,0]; for(let i=0;i<P.length;i++){ const a=P[i],b=P[(i+1)%P.length]; n[0]+=(a[1]-b[1])*(a[2]+b[2]); n[1]+=(a[2]-b[2])*(a[0]+b[0]); n[2]+=(a[0]-b[0])*(a[1]+b[1]); } return norm(n); };
const s2=(a,b)=>[a[0]-b[0],a[1]-b[1]], a2=(a,b)=>[a[0]+b[0],a[1]+b[1]], m2=(a,k)=>[a[0]*k,a[1]*k], l2=a=>Math.hypot(a[0],a[1]);
const mitte2=P=>{ let x=0,y=0; for(const p of P){ x+=p[0]; y+=p[1]; } return [x/P.length,y/P.length]; };
const rect=(x0,y0,x1,y1)=>[[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
const kreis2=(cx,cy,r,n=64)=>[...Array(n)].map((_,i)=>[cx+r*Math.cos(2*Math.PI*i/n),cy+r*Math.sin(2*Math.PI*i/n)]);
const bogen2=(cx,cy,r,a0,a1,n=24)=>[...Array(n+1)].map((_,i)=>{ const a=a0+(a1-a0)*i/n; return [cx+r*Math.cos(a),cy+r*Math.sin(a)]; });
const kreis3=(c,e1,e2,r,n=14)=>[...Array(n)].map((_,i)=>{ const a=2*Math.PI*i/n; return add(c,add(mul(e1,r*Math.cos(a)),mul(e2,r*Math.sin(a)))); });
// Kreisbogen von A nach B mit Stich e in Richtung o (Endpunkte exakt, damit gemeinsame Kanten erkannt werden)
const bogen=(A,B,e,o,n=24)=>{ const c=l2(s2(B,A))/2, R=(c*c+e*e)/(2*e), P=[A];
  for(let i=1;i<n;i++){ const t=i/n, x=(t-0.5)*2*c, y=Math.sqrt(R*R-x*x)-(R-e); P.push([A[0]+(B[0]-A[0])*t+o[0]*y,A[1]+(B[1]-A[1])*t+o[1]*y]); }
  P.push(B); return P; };
const mulberry32=a=>()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };

// ---------- Konvexe Hülle: Flächen als Eckenlisten, von aussen gesehen gegen den Uhrzeigersinn ----------
function huelle(V){
  const F=[], gesehen=new Set(), n=V.length;
  const sk=Math.max(...V.map(v=>Math.max(Math.abs(v[0]),Math.abs(v[1]),Math.abs(v[2]))))||1, eps=1e-7*sk;
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++) for(let k=j+1;k<n;k++){
    let nn=cross(sub(V[j],V[i]),sub(V[k],V[i])); if(len(nn)<1e-9*sk*sk) continue; nn=norm(nn);
    let pos=0,neg=0; const auf=[];
    for(let m=0;m<n;m++){ const s=dot(nn,sub(V[m],V[i])); if(s>eps) pos++; else if(s<-eps) neg++; else auf.push(m); }
    if(pos&&neg) continue; if(pos) nn=mul(nn,-1);
    const key=auf.join(','); if(gesehen.has(key)) continue; gesehen.add(key);
    const c=mitte(auf.map(m=>V[m])), e1=norm(sub(V[auf[0]],c)), e2=cross(nn,e1);
    const w=m=>Math.atan2(dot(sub(V[m],c),e2),dot(sub(V[m],c),e1));
    auf.sort((p,q)=>w(p)-w(q)); F.push(auf);
  }
  return F;
}

// ---------- Abwicklung ----------
function auslegen(V,F,baum,wurzel){
  const pos=new Array(F.length), tr=new Array(F.length);
  const abb=(t,v)=>{ const d=sub(v,t.p), a=dot(d,t.u), b=dot(d,t.w); return [t.P[0]+a*t.u2[0]+b*t.w2[0],t.P[1]+a*t.u2[1]+b*t.w2[1]]; };
  const f0=F[wurzel], n0=newell(f0.map(i=>V[i])), u0=norm(sub(V[f0[1]],V[f0[0]]));
  tr[wurzel]={p:V[f0[0]],u:u0,w:cross(u0,n0),P:[0,0],u2:[1,0],w2:[0,1]};   // SVG: y nach unten → Aussenseite nicht gespiegelt
  pos[wurzel]=new Map(f0.map(i=>[i,abb(tr[wurzel],V[i])]));
  const stapel=[wurzel];
  while(stapel.length){ const f=stapel.pop();
    for(const {g,k} of baum[f]){ const [a,b]=k.split('-').map(Number), Pa=pos[f].get(a), Pb=pos[f].get(b);
      const u=norm(sub(V[b],V[a])), du=s2(Pb,Pa), u2=m2(du,1/l2(du));
      const cg=mitte(F[g].map(i=>V[i])), r=sub(cg,V[a]), w=norm(sub(r,mul(u,dot(r,u))));
      const cf=mitte2([...pos[f].values()]); let w2=[-u2[1],u2[0]]; if((cf[0]-Pa[0])*w2[0]+(cf[1]-Pa[1])*w2[1]>0) w2=[-w2[0],-w2[1]];
      tr[g]={p:V[a],u,w,P:Pa,u2,w2};
      const m=new Map(F[g].map(i=>[i,abb(tr[g],V[i])])); m.set(a,Pa); m.set(b,Pb);   // gemeinsame Ecken exakt übernehmen
      pos[g]=m; stapel.push(g); } }
  return {pos,tr,abb};
}
const box2=P=>{ let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity; for(const p of P){ if(p[0]<x0)x0=p[0]; if(p[0]>x1)x1=p[0]; if(p[1]<y0)y0=p[1]; if(p[1]>y1)y1=p[1]; } return [x0,y0,x1,y1]; };
const boxUeber=(a,b)=>a[0]<b[2]-0.05&&b[0]<a[2]-0.05&&a[1]<b[3]-0.05&&b[1]<a[3]-0.05;
function sat(A,B,eps=0.05){
  for(const P of [A,B]) for(let i=0;i<P.length;i++){ const a=P[i], b=P[(i+1)%P.length], nx=a[1]-b[1], ny=b[0]-a[0], l=Math.hypot(nx,ny); if(l<1e-9) continue;
    let a0=Infinity,a1=-Infinity,b0=Infinity,b1=-Infinity;
    for(const p of A){ const s=(p[0]*nx+p[1]*ny)/l; if(s<a0)a0=s; if(s>a1)a1=s; }
    for(const p of B){ const s=(p[0]*nx+p[1]*ny)/l; if(s<b0)b0=s; if(s>b1)b1=s; }
    if(a1<=b0+eps||b1<=a0+eps) return false; }
  return true;
}
const trifft=(t,listen)=>{ const bt=box2(t); return listen.some(L=>L.some(P=>boxUeber(bt,box2(P))&&sat(t,P))); };
function lascheAn(P,Q,flaeche,hmax){
  const d=s2(Q,P), L=l2(d), e=m2(d,1/L); let o=[-e[1],e[0]]; const c=mitte2(flaeche);
  if((c[0]-P[0])*o[0]+(c[1]-P[1])*o[1]>0) o=[-o[0],-o[1]];
  const h=Math.min(hmax,L*0.3), i=Math.min(h,L*0.3);
  return [P,a2(a2(P,m2(o,h)),m2(e,i)),a2(s2(Q,m2(e,i)),m2(o,h)),Q];
}
function baumNett(F,nb,V,wurzel){   // Schicht um Schicht, Eltern über die längste gemeinsame Kante
  const baum=F.map(()=>[]), drin=new Set([wurzel]); let schicht=[wurzel];
  while(schicht.length){ const neu=new Map();
    for(const f of schicht) for(const {g,k} of nb[f]) if(!drin.has(g)){ const [a,b]=k.split('-').map(Number), l=len(sub(V[a],V[b])), alt=neu.get(g); if(!alt||l>alt.l+1e-6) neu.set(g,{f,k,l}); }
    for(const [g,{f,k}] of neu){ baum[f].push({g,k}); drin.add(g); }
    schicht=[...neu.keys()]; }
  return baum;
}
function baumZufall(F,nb,rnd,tief){
  const w=Math.floor(rnd()*F.length), baum=F.map(()=>[]), drin=new Set([w]);
  if(tief){ const st=[w]; while(st.length){ const f=st[st.length-1], frei=nb[f].filter(e=>!drin.has(e.g)); if(!frei.length){ st.pop(); continue; } const e=frei[Math.floor(rnd()*frei.length)]; baum[f].push(e); drin.add(e.g); st.push(e.g); } }
  else { const rand=[]; const dazu=f=>nb[f].forEach(e=>rand.push([f,e])); dazu(w);
    while(rand.length){ const i=Math.floor(rnd()*rand.length), [f,e]=rand[i]; rand[i]=rand[rand.length-1]; rand.pop(); if(drin.has(e.g)) continue; baum[f].push(e); drin.add(e.g); dazu(e.g); } }
  return {baum,w};

let PLATZ=[192,265];   // nutzbare Fläche des Blatts in mm

// ---------- Kanten einteilen: zweimal benutzt = Falz, einmal = Schnitt ----------
const pk=p=>Math.round(p[0]*100)+','+Math.round(p[1]*100);
function klassieren(st){
  const z=new Map();
  for(const P of [...st.flaechen.map(f=>f.pts),...st.laschen]) for(let i=0;i<P.length;i++){ const a=P[i], b=P[(i+1)%P.length]; if(l2(s2(a,b))<0.01) continue;
    const ka=pk(a), kb=pk(b), k=ka<kb?ka+'|'+kb:kb+'|'+ka, e=z.get(k); if(e) e.n++; else z.set(k,{a,b,n:1}); }
  const falt=[...st.falz], schnitt=[]; for(const e of z.values()) (e.n>1?falt:schnitt).push([e.a,e.b]);
  return {...st,falt,schnitt};
}

// ---------- Auf Blätter verteilen ----------
const punkte=s=>[...s.flaechen.flatMap(f=>f.pts),...s.laschen.flat(),...s.falt.flat()];
function anordnen(stuecke,UW,UH){
  const teile=[], gross=[];
  for(const s of stuecke){ const pts=punkte(s); let best=null;
    for(let g=0;g<180;g+=5){ const r=g*Math.PI/180, c=Math.cos(r), si=Math.sin(r); let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
      for(const p of pts){ const x=p[0]*c-p[1]*si, y=p[0]*si+p[1]*c; if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
      const bw=x1-x0, bh=y1-y0; if(bw>UW+0.01||bh>UH+0.01) continue;
      const sc=bw*bh*(g%90?1.06:1); if(!best||sc<best.sc-1e-6) best={s,c,si,x0,y0,bw,bh,sc}; }
    if(best) teile.push(best); else gross.push(s); }
  teile.sort((a,b)=>b.bh-a.bh);
  const blaetter=[]; let x=0,y=0,zh=0,hoehe=0;
  for(const t of teile){
    if(!blaetter.length) blaetter.push([]);
    if(x>0&&x+t.bw>UW+0.01){ x=0; y+=zh+ABST; zh=0; }
    if(y>0&&y+t.bh>UH+0.01){ blaetter.push([]); x=0; y=0; zh=0; }
    t.dx=x-t.x0; t.dy=y-t.y0; blaetter[blaetter.length-1].push(t); x+=t.bw+ABST; zh=Math.max(zh,t.bh); hoehe=Math.max(hoehe,y+zh); }
  return {blaetter,gross,hoehe};

function stueckSVG(t,ox,oy){

  const P=pts=>'M'+pts.map(f).join('L'), s=t.s; let o='';
  for(const fl of s.flaechen) o+=`<path d="${P(fl.pts)}Z" fill="${fl.col}"/>`;
  for(const l of s.laschen) o+=`<path d="${P(l)}Z" fill="${LASCHE}"/>`;
  for(const d of s.deko) o+=`<path d="${P(d.pts)}${d.zu?'Z':''}" fill="${d.voll?(d.col||LINIE):'none'}" stroke="${LINIE}" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  if(s.falt.length) o+=`<path d="${s.falt.map(P).join('')}" fill="none" stroke="#000" stroke-width="0.3" stroke-dasharray="2 1.4"/>`;

}

// ---------- 3D zeichnen ----------
const hex=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
const schatt=(c,k)=>'rgb('+hex(c).map(v=>Math.min(255,Math.round(v*k))).join(',')+')';
function zeichne3D(cv,m,yaw,pitch){
  const ctx=cv.getContext('2d'), W=cv.width, H=cv.height; ctx.clearRect(0,0,W,H); if(!m||!W) return;
  if(!m.b){ const all=m.polys.flatMap(p=>p.pts), lo=[0,1,2].map(i=>Math.min(...all.map(p=>p[i]))), hi=[0,1,2].map(i=>Math.max(...all.map(p=>p[i]))), c=mul(add(lo,hi),0.5);
    m.b={c,r:Math.max(...all.map(p=>len(sub(p,c))))||1}; }
  const {c,r}=m.b, cy=Math.cos(yaw), sy=Math.sin(yaw), cp=Math.cos(pitch), sp=Math.sin(pitch);
  const rot=v=>{ const x1=v[0]*cy-v[1]*sy, y1=v[0]*sy+v[1]*cy; return [x1,y1*cp-v[2]*sp,y1*sp+v[2]*cp]; };
  const D=r*4, s=0.46*Math.min(W,H)*(D-r)/(D*r), cam=[0,-D,0], L=norm([-0.45,-0.6,0.75]);
  const pr=v=>{ const q=rot(sub(v,c)), f=D/(D+q[1]); return [W/2+q[0]*s*f,H/2-q[2]*s*f,q[1]]; };
  const liste=m.polys.map(p=>{ const q=p.pts.map(pr), n=rot(p.n), cc=rot(sub(mitte(p.pts),c)); return {p,q,n,sicht:dot(n,sub(cam,cc))>0,z:q.reduce((a,b)=>a+b[2],0)/q.length}; });
  liste.sort((a,b)=>b.z-a.z);
  const lw=Math.max(1,W/260); ctx.lineJoin='round'; ctx.lineCap='round';
  for(const e of liste){ if(!e.sicht&&!m.offen) continue;
    const n=e.sicht?e.n:mul(e.n,-1), col=schatt(e.p.col,(0.6+0.42*Math.max(0,dot(n,L)))*(e.sicht?1:0.75));
    ctx.beginPath(); e.q.forEach((pt,i)=>i?ctx.lineTo(pt[0],pt[1]):ctx.moveTo(pt[0],pt[1])); ctx.closePath();
    ctx.fillStyle=col; ctx.fill(); ctx.strokeStyle=e.p.glatt?col:'rgba(23,33,47,.6)'; ctx.lineWidth=e.p.glatt?0.8:lw; ctx.stroke(); }
  for(const d of m.deko){ const n=rot(d.n), cc=rot(sub(mitte(d.pts),c)); if(dot(n,sub(cam,cc))<=0) continue;
    ctx.beginPath(); d.pts.map(pr).forEach((pt,i)=>i?ctx.lineTo(pt[0],pt[1]):ctx.moveTo(pt[0],pt[1])); if(d.zu) ctx.closePath();
    if(d.voll){ ctx.fillStyle=d.col||LINIE; ctx.fill(); } ctx.strokeStyle=LINIE; ctx.lineWidth=lw; ctx.stroke(); }
}
