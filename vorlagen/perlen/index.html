<head>

<title>Schritt für Schritt · Perlentiere</title>
<meta name="description" content="Flache Perlentiere aus Draht: Tier wählen, Muster drucken, Reihe für Reihe nachfädeln. Eigene Vorlagen für den TTG-Unterricht.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{--bg:#EEF3F8;--surface:#FFFFFF;--surface2:#F5F8FB;--ink:#17212F;--muted:#5B6B80;--line:#D5DEE9;--acc:#17997A;--acc-ink:#FFFFFF;--acc-soft:#E3F4EF;--papier:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1621;--surface:#1A2433;--surface2:#141C28;--ink:#EDF2F8;--muted:#9DACBF;--line:#2B384A;--acc:#2FBF98;--acc-ink:#0F1621;--acc-soft:#16302B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1621;--surface:#1A2433;--surface2:#141C28;--ink:#EDF2F8;--muted:#9DACBF;--line:#2B384A;--acc:#2FBF98;--acc-ink:#0F1621;--acc-soft:#16302B;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.4 Nunito,system-ui,sans-serif}
h1,h2{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0}
h1{font-size:28px}
h2{font-size:17px;margin-bottom:10px}
a{color:var(--acc)}
.kopf{max-width:1200px;margin:0 auto;padding:20px 16px 8px}
.kopf p{margin:4px 0 0;color:var(--muted)}
main{max-width:1200px;margin:0 auto;padding:8px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:20px;align-items:start}
.karte{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.karte h3{font:600 15px Fredoka,Nunito,sans-serif;color:var(--muted);margin:16px 0 8px}.karte h3:first-child{margin-top:0}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.kats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px 10px;border:2px solid var(--line);border-radius:16px;background:var(--surface2);color:var(--ink);font:inherit;cursor:pointer}
.kat:hover{border-color:var(--acc);background:var(--acc-soft)}
.kat b{font:600 17px Fredoka,Nunito,sans-serif;text-align:center}
.k-bilder{display:grid;grid-template-columns:repeat(2,40px);gap:4px}
.k-bilder svg,.k-bilder img{width:40px;height:52px;object-fit:contain}
.k-n{font-size:13px;color:var(--muted)}
.zurueck{margin:10px 0 12px;min-height:40px;padding:6px 14px;border:2px solid var(--line);border-radius:999px;background:var(--surface2);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.zurueck:hover{border-color:var(--acc)}
.tier{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 8px;border:2px solid var(--line);border-radius:14px;background:var(--surface2);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.tier svg{width:72px;height:96px}
.tier svg.nadel{position:absolute;top:6px;right:6px;width:20px;height:20px;fill:none;stroke:var(--acc);stroke-width:2;stroke-linecap:round}
.tier img{width:72px;height:96px;object-fit:contain}
.suche{display:grid;gap:8px;margin-bottom:14px}
.suche input:not([type=checkbox]),.suche select{width:100%;min-height:44px;padding:8px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.anpassen{width:100%;min-height:48px;margin:0 0 12px;border:2px solid var(--acc);border-radius:12px;background:var(--acc-soft);color:var(--ink);font:inherit;cursor:pointer}
.tier small{color:var(--muted);font-size:12px}
.tier[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.tier:hover{border-color:var(--acc)}
.tier:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.seite-rechts{position:sticky;top:12px;display:flex;flex-direction:column;gap:14px}
.feld{margin-bottom:14px}
.lbl{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--acc)}
.chip[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.drucken{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--acc);color:var(--acc-ink);font:600 20px Fredoka,Nunito,sans-serif;cursor:pointer}
.drucken svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round}
.info{font-size:15px;margin:10px 0 0}
.hinweis{font-size:13px;color:var(--muted);margin:8px 0 0}
.vorschau svg{display:block;width:100%;height:auto;background:var(--papier);border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
@media (max-width:860px){main{grid-template-columns:minmax(0,1fr)}.seite-rechts{position:static}h1{font-size:24px}}
@media (max-width:480px){.raster{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}.tier svg{width:56px;height:76px}.kats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.k-bilder{grid-template-columns:repeat(2,34px)}.k-bilder svg,.k-bilder img{width:34px;height:44px}}
#druck{display:none}
@page{size:A4 portrait;margin:0}
@media print{
  body{background:#fff}
  .kopf,main{display:none!important}
  #druck{display:block}
  #druck svg{display:block;width:210mm;height:297mm;break-after:page}#druck svg:last-child{break-after:auto}
}
</style>

// Angenähte Teile (Flügel, Pinsel …) sind eigene kleine Muster. Hier werden sie neben, über oder unter den Körper gelegt,

function zusammen(t,q=2/3){

  t.rows.forEach((r,i)=>{for(const c of r)reihe.push(i+1)});

    const gp=geometrie(p,q),minL=Math.min(...gp.links),seiten=p.lage==='seiten'?[-1,1]:p.lage==='links'?[-1]:p.lage==='rechts'?[1]:[0];

function zaehlen(t){

const linien=(wege,sk)=>{const sw=sk*.06,z=(farbe,b)=>wege.map(([c,p])=>`<path d="${p}" fill="none" stroke="${farbe||c}" stroke-width="${(b*sw).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round"/>`).join('');return z('#fff',2)+z('',1)};

      if(i){for(const sx of [-1,1]){const rand=sx<0?g.links:g.rechts,a=rand[i-1],b=rand[i],m=(sx<0?Math.min(a,b):Math.max(a,b))+sx*.45;
        wege.push(`M${X(a)} ${Y(g.ry[i-1]+sx*d)}C${X(m)} ${Y(g.ry[i-1]+sx*d)} ${X(m)} ${Y(y-sx*d)} ${X(b)} ${Y(y-sx*d)}`)}}

  const w=k=>((t.rows[k].length-1)/2+.5)*g.q,li=k=>k%2?B:A,ri=k=>k%2?A:B;   // li/ri: Ende, das nach Reihe k links/rechts austritt
  const ry=g.ry,yl=k=>k?ry[k]+d:0,yr=k=>k?ry[k]-d:0,wege=[],Z=ry[n];

  const {z,n}=zaehlen(t),g0=t.teile?.length?zusammen(t,pe.l/pe.d):geometrie(t,pe.l/pe.d),g=geometrie(t,pe.l/pe.d,1);   // g0: echte Grösse samt angenähten Teilen, g: mit Abstand bei den Beinen
  const breit=(g0.x1-g0.x0-1+g0.q)*pe.d,hoch=(g0.y1-g0.y0)*pe.d;
  const teile=!!t.teile?.length,genaeht=!!t.naht?.length;
  g.x0-=.35;g.x1+=.35;g.y1+=1.3;   // Platz für Drahtbögen und Enden
  const bein={};for(const b of t.beine||[])(bein[b.r]||=[]).push(b);
  const beinText=b=>` + ${htmlText(b[0].w||'Teile')} ${b.map(s=>`${s.n}+${s.f}`).join(' ')}`;
  // Muster-Feld rechts
  const F={x:84,y:34,w:116,h:186};
  const lr=10,rr=genaeht?Math.max(26,Math.max(...t.rows.map((r,i)=>`${r.length}${bein[i+1]?beinText(bein[i+1]):''}`.length))*1.95+3):26,bw=g.x1-g.x0,bh=g.y1-g.y0;
  const sk=Math.min((F.w-lr-rr)/bw,(F.h-8)/bh,10);
  const ox=F.x+lr+((F.w-lr-rr)-bw*sk)/2-g.x0*sk,oy=F.y+8-g.y0*sk;
  const fs=Math.min(3.4,sk*.62);
  let lab='';
  t.rows.forEach((r,i)=>{
    const y=(oy+g.ry[i]*sk+fs*.36).toFixed(2),b=bein[i+1];
    const lx=ox+g.x0*sk-2.5,kb=Math.min(3,sk*.55);
    lab+=`<rect x="${(lx-fs*1.6-kb).toFixed(2)}" y="${(oy+g.ry[i]*sk-kb/2).toFixed(2)}" width="${kb.toFixed(2)}" height="${kb.toFixed(2)}" rx=".4" fill="none" stroke="#9aa4b1" stroke-width=".3"/>`+
      `<text x="${lx.toFixed(2)}" y="${y}" font-size="${fs.toFixed(2)}" fill="#5b6573" text-anchor="end">${i+1}</text>`+
      `<text x="${(ox+g.x1*sk+2.5).toFixed(2)}" y="${y}" font-size="${fs.toFixed(2)}" font-weight="800" fill="#1c2430">${r.length}${b?`<tspan font-weight="600" fill="#17997A">${beinText(b)}</tspan>`:''}</text>`;
  });
  const sx=ox+(g.links[0]+g.rechts[0])/2*sk,top=oy+g.y0*sk;
  // Start: grüner Rahmen um Reihe 1 und ein Schild «Start» darauf
  // Hat Reihe 1 Ohren oder Beine, steht das Schild über der ganzen Figur, mit einem Strich zum Rahmen
  const r1=(t.rows[0].length/2*g.q+.2)*sk,ry=oy-.64*sk,pw=11,ph=4.4,pb=bein[1]||t.naht?.some(p=>!p.quer&&p.r<0)?top-.8:ry;
  const start=`<rect x="${(sx-r1).toFixed(2)}" y="${ry.toFixed(2)}" width="${(2*r1).toFixed(2)}" height="${(1.28*sk).toFixed(2)}" rx="${(.32*sk).toFixed(2)}" fill="none" stroke="#17997A" stroke-width=".7"/>`+
    (pb<ry?`<path d="M${sx.toFixed(2)} ${pb.toFixed(2)}V${ry.toFixed(2)}" stroke="#17997A" stroke-width=".7"/>`:'')+
    `<rect x="${(sx-pw/2).toFixed(2)}" y="${(pb-ph).toFixed(2)}" width="${pw}" height="${ph}" rx="${ph/2}" fill="#17997A"/>`+
    `<text x="${sx.toFixed(2)}" y="${(pb-1.15).toFixed(2)}" font-size="3.2" font-weight="800" fill="#fff" text-anchor="middle">Start</text>`;
  const kopf=`<text x="${(ox+g.x0*sk-2.5).toFixed(2)}" y="${(top-1).toFixed(2)}" font-size="2.6" fill="#5b6573" text-anchor="end">Reihe</text>`+
    `<text x="${(ox+g.x1*sk+2.5).toFixed(2)}" y="${(top-1).toFixed(2)}" font-size="2.6" fill="#5b6573">Perlen</text>`;
  const legende=`<path d="M128 225.5h6" stroke="${A}" stroke-width=".8"/><text x="135.5" y="226.5" font-size="2.9" fill="#1c2430">Draht</text>`+(z.t?durchsichtig(150,226.5):'');
  // Felder zum Bereitlegen
  const farben=Object.keys(z).sort((a,b)=>z[b]-z[a]),sp=Math.min(5,farben.length),zr=Math.ceil(farben.length/sp),fb=(190-(sp-1)*4)/sp,fh=(38-(zr-1)*3)/zr;
  let feld=`<text x="10" y="232" font-size="4.2" font-weight="800" fill="#1c2430">Perlen bereitlegen</text>`;
  farben.forEach((c,k)=>{const fx=10+(k%sp)*(fb+4),fy=236+Math.floor(k/sp)*(fh+3);
    feld+=`<rect x="${fx.toFixed(2)}" y="${fy.toFixed(2)}" width="${fb.toFixed(2)}" height="${fh.toFixed(2)}" rx="2" fill="#F5F8FB" stroke="#D5DEE9" stroke-width=".4"/>`+
      `<rect x="${(fx+2).toFixed(2)}" y="${fy+2}" width="2.8" height="4" rx=".9" fill="${FARBE[c][0]}" stroke="#1c2430" stroke-width=".3"/><text x="${(fx+6).toFixed(2)}" y="${fy+5}" font-size="2.6" fill="#1c2430"><tspan font-weight="800">${z[c]}</tspan> × ${FARBE[c][1]}</text>`});
  // Material links
  const zwei=farben.length>8||((teile||genaeht)&&farben.length>4);let mat=`<text x="10" y="36" font-size="4.2" font-weight="800" fill="#1c2430">Du brauchst</text>`,y=42.5;
  farben.forEach((c,k)=>{const x=zwei&&k%2?47:10;
    mat+=`<rect x="${x+.9}" y="${y-2.8}" width="2.6" height="3.6" rx=".8" fill="${FARBE[c][0]}" stroke="#1c2430" stroke-width=".3"/><text x="${x+6}" y="${y}" font-size="3.3" fill="#1c2430"><tspan font-weight="800">${z[c]}</tspan> × ${FARBE[c][1]}</text>`;
    if(!zwei||k%2||k===farben.length-1)y+=5});
  const lang_=draht(t,pe);
  mat+=`<text x="10" y="${y+.5}" font-size="3.1" fill="#1c2430"><tspan font-weight="800">${lang(lang_)}</tspan> Draht, ${pe.draht} dick</text>`+
    `<text x="10" y="${y+5}" font-size="3.1" fill="#1c2430">Seitenschneider</text>`;
  y+=9.5;
  const stuecke=new Map();   // Drahtstücke: gleiche Teile zusammen
  for(const [w,k,cm] of [...(t.teile||[]).map(p=>[p.w,p.n,drahtStueck(p,pe)]),...(t.naht||[]).map(p=>[p.w||'Teil',1,drahtNaht(p,pe)])]){const s=w+'|'+cm,a=stuecke.get(s);if(a)a[1]+=k;else stuecke.set(s,[w,k,cm])}
  if(stuecke.size)for(const [w,k,cm] of [['Körper',1,drahtStueck(t,pe)],...stuecke.values()]){mat+=`<text x="10" y="${y}" font-size="2.9" fill="#1c2430">${htmlText(w)} ${k>1?k+' × ':''}${lang(cm)}</text>`;y+=4.2}
  if(teile){mat+=`<text x="10" y="${y}" font-size="3.1" fill="#1c2430">Nähfaden</text>`;y+=4.5}
  y+=2;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm" font-family="Nunito,Arial,sans-serif" role="img" aria-label="Perlentier ${htmlText(t.name)}: Fädelmuster">`+
    `<rect width="210" height="297" fill="#fff"/>`+
    `<text x="10" y="17" font-size="${Math.min(7.5,330/(t.name.length+12))}" font-weight="800" fill="#1c2430" font-family="Fredoka,Nunito,Arial,sans-serif">Perlentier: ${htmlText(t.name)}</text>`+
    `<text x="10" y="23.5" font-size="3.4" fill="#5b6573">${t.rows.length} Reihen · ${n} ${pe.name} · ${f1(breit)} × ${f1(hoch)} cm · ${t.stufe}${t.offsets?' · Blatt 2':teile?' · Blatt 1':''}</text>`+
    `<line x1="10" y1="27" x2="200" y2="27" stroke="#D5DEE9" stroke-width=".4"/>`+
    mat+technik(10,y,220-y,teile?'faden':genaeht?'draht':'',!!t.offsets)+
    kopf+start+perlen(g,sk,ox,oy,.45,false)+draehte(t,g,sk,ox,oy)+lab+legende+feld+`</svg>`;
}
// Blatt 2: jedes angenähte Teil als eigenes Fädelmuster, rechts das zusammengesetzte Tier mit den Nähstellen in Rot.
function teileBlatt(t,pe){
  const q=pe.l/pe.d,hoehe=(272-32)/t.teile.length;let o='';
  t.teile.forEach((p,k)=>{
    const n=zaehlen(p).n,g=geometrie(p,q,1);
    g.x0-=.35;g.x1+=.35;g.y1+=1.3;
    const F={x:10,y:32+k*hoehe,w:92,h:hoehe-5},lr=8,rr=22,bw=g.x1-g.x0,bh=g.y1-g.y0;
    const sk=Math.min((F.w-lr-rr)/bw,(F.h-15)/bh,8),fs=Math.min(3,sk*.62);
    const ox=F.x+lr+((F.w-lr-rr)-bw*sk)/2-g.x0*sk,oy=F.y+15-g.y0*sk;
    const bein={};for(const b of p.beine||[])bein[b.r]=b;
    let lab='';
    p.rows.forEach((r,i)=>{const y=(oy+g.ry[i]*sk+fs*.36).toFixed(2),b=bein[i+1];
      lab+=`<text x="${(ox+g.x0*sk-2).toFixed(2)}" y="${y}" font-size="${fs.toFixed(2)}" fill="#5b6573" text-anchor="end">${i+1}</text>`+
        `<text x="${(ox+g.x1*sk+2).toFixed(2)}" y="${y}" font-size="${fs.toFixed(2)}" font-weight="800" fill="#1c2430">${r.length}${b?`<tspan font-weight="600" fill="#17997A"> + ${htmlText(b.w||'Teile')} ${b.n}+${b.f}</tspan>`:''}</text>`});
    const sx=ox+(g.links[0]+g.rechts[0])/2*sk;
    o+=`<text x="${F.x}" y="${F.y+4.5}" font-size="4.2" font-weight="800" fill="#1c2430">${htmlText(p.w)}</text>`+
      `<text x="${F.x}" y="${F.y+9.5}" font-size="2.9" fill="#5b6573">${p.n>1?`${p.n} × gespiegelt`:'1 ×'} · ${n} Perlen · ${lang(drahtStueck(p,pe))} Draht</text>`+
      `<text x="${sx.toFixed(2)}" y="${(F.y+14).toFixed(2)}" font-size="2.8" font-weight="800" fill="#17997A" text-anchor="middle">Start</text>`+
      perlen(g,sk,ox,oy,.45,false)+draehte(p,g,sk,ox,oy)+lab;
  });
  const ga=zusammen(t,q),G={x:108,y:32,w:92,h:118},bw=ga.x1-ga.x0+.6,bh=ga.y1-ga.y0+.4,sk=Math.min((G.w-4)/bw,(G.h-14)/bh,6);
  const ox=G.x+2+((G.w-4)-bw*sk)/2-(ga.x0-.3)*sk,oy=G.y+12-(ga.y0-.2)*sk;
  const naehte=ga.naehte.map(s=>{const dx=s.b.x-s.a.x,dy=s.b.y-s.a.y,l=Math.hypot(dx,dy)||1,ux=dx/l*.42,uy=dy/l*.42;return `<path d="M${(ox+(s.a.x-ux)*sk).toFixed(2)} ${(oy+(s.a.y-uy)*sk).toFixed(2)}L${(ox+(s.b.x+ux)*sk).toFixed(2)} ${(oy+(s.b.y+uy)*sk).toFixed(2)}" stroke="#D7352E" stroke-width="${(sk*.22).toFixed(2)}" stroke-linecap="round"/>`}).join('');
  const reihen=[...new Set(ga.naehte.map(s=>s.reihe).filter(Boolean))].sort((a,b)=>a-b);
  const ty=Math.min(G.y+G.h+8,oy+(ga.y1+.3)*sk+8),marke=reihen.length?`<path d="M${G.x} ${(ty-1).toFixed(2)}h6" stroke="#D7352E" stroke-width="1.3" stroke-linecap="round"/><text x="${G.x+8}" y="${ty.toFixed(2)}" font-size="3.1" fill="#1c2430">Reihe ${reihen.join(', ')}</text>`:'';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm" font-family="Nunito,Arial,sans-serif" role="img" aria-label="Perlentier ${htmlText(t.name)}: Teile zum Annähen">`+
    `<rect width="210" height="297" fill="#fff"/>`+
    `<text x="10" y="17" font-size="${Math.min(7.5,330/(t.name.length+20))}" font-weight="800" fill="#1c2430" font-family="Fredoka,Nunito,Arial,sans-serif">Perlentier: ${htmlText(t.name)} · Teile</text>`+
    `<text x="10" y="23.5" font-size="3.4" fill="#5b6573">Blatt 2</text>`+
    `<line x1="10" y1="27" x2="200" y2="27" stroke="#D5DEE9" stroke-width=".4"/>`+o+
    `<text x="${G.x}" y="${G.y+4.5}" font-size="4.2" font-weight="800" fill="#1c2430">Zusammennähen</text>`+perlen(ga,sk,ox,oy,.45,false)+naehte+marke+`</svg>`;
}

const ART={Kopf:'nur der Kopf',Gesicht:'nur das Gesicht',Figur:'die ganze Figur vereinfacht',Symbol:'als einfaches Symbol',Maske:'als Maske',Umriss:'als Umriss',Silhouette:'als Silhouette',Buchstabe:'als Buchstabe',Smiley:'als Smiley',Flagge:'als Flagge'};
const gruppen=['Tiere','Comic-Figuren','Essen und Sachen',...new Set(TIERE.filter(t=>t.gruppe).map(t=>t.gruppe))];
const gruppeVon=t=>t.gruppe||(t.art==='figur'?'Comic-Figuren':t.art==='ding'?'Essen und Sachen':'Tiere');
const htmlText=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let offen=null;                                   // geöffnetes Thema, sonst Kacheln aller Themen
function auswahl(){
  const such=$('suche').value.trim().toLocaleLowerCase('de-CH');
  const treffer=TIERE.filter(t=>(!S.nurPassend||passt(t))&&(!such||(t.name+' '+gruppeVon(t)).toLocaleLowerCase('de-CH').includes(such)));
  const bild=t=>t.offsets?`<img src="bilder/${t.quelle}.webp?v=${t.version||2}" alt="" loading="lazy" width="40" height="52">`:mini(t);
  const knopf=t=>`<button type="button" class="tier" data-id="${t.id}" aria-pressed="${t.id===S.tier}">${t.naht?.length?NADEL:''}${t.offsets?`<img src="bilder/${t.quelle}.webp?v=${t.version||2}" alt="" loading="lazy" width="72" height="96">`:mini(t)}<span>${htmlText(t.name)}</span><small>${zaehlen(t).n} Perlen · ${PerlenEditor.schwierigkeit(t,S.klasse)}</small><small>${PerlenEditor.reihenbreite(t)} pro Reihe${passt(t)?'':' ⚠'}</small></button>`;
  const breite=S.nurPassend?` bis ${PerlenEditor.maximum(S.klasse)} Perlen`:'';
  const leer='⚠ Kein Muster';
  // Zuerst Kacheln der Themen mit je vier Beispielen. Ein Klick öffnet das Thema; die Suche geht über alle Themen,
  // bei sehr vielen Treffern zeigen die Kacheln die Trefferzahl, damit nie eine endlose Liste entsteht.
  const kacheln=!offen&&(!such||treffer.length>120);
  $('zurueck').hidden=kacheln;
  if(kacheln){
    const themen=gruppen.map(g=>[g,treffer.filter(t=>gruppeVon(t)===g)]).filter(([,l])=>l.length);
    $('tiere').innerHTML=`<div class="kats">${themen.map(([g,l])=>`<button type="button" class="kat" data-g="${htmlText(g)}"><span class="k-bilder">${l.filter(t=>!t.naht?.length).slice(0,4).map(bild).join('')}</span><b>${htmlText(g)}</b><span class="k-n">${l.length} ${such?'Treffer':'Muster'}</span></button>`).join('')}</div>`;
    $('treffer').textContent=treffer.length?(such?`${treffer.length} Treffer in ${themen.length} Themen`:`${treffer.length} Muster${breite} in ${themen.length} Themen`):leer;
    return;
  }
  const liste=such?treffer:treffer.filter(t=>gruppeVon(t)===offen);
  $('tiere').innerHTML=(such?gruppen:[offen]).map(h=>{const l=liste.filter(t=>gruppeVon(t)===h);return l.length?`<h3>${htmlText(h)}</h3><div class="raster">${l.map(knopf).join('')}</div>`:''}).join('');
  $('treffer').textContent=liste.length?`${liste.length} ${such?'Treffer':'Muster'}${breite}${such?'':` im Thema «${offen}»`}`:leer;
}
function oeffnen(g){offen=g;$('suche').value='';auswahl()}
function liste(){
  $('klasse').innerHTML=Object.entries(PerlenEditor.GRENZEN).map(([k,max])=>`<option value="${k}">${k}. Klasse · ${max} Perlen</option>`).join('');
  $('klasse').value=String(S.klasse);
  $('klasse').addEventListener('change',()=>{S.klasse=PerlenEditor.klasse($('klasse').value);try{localStorage.setItem('schrittli.perlen.klasse',S.klasse)}catch(e){}zeichnen();auswahl()});
  $('nur-passend').checked=S.nurPassend;
  $('nur-passend').addEventListener('change',()=>{S.nurPassend=$('nur-passend').checked;try{localStorage.setItem('schrittli.perlen.nurPassend',S.nurPassend?'1':'0')}catch(e){}auswahl()});
  $('suche').addEventListener('input',auswahl);
  $('zurueck').addEventListener('click',()=>oeffnen(null));
  if(gewaehlt)offen=gruppeVon(aktuellesTier());   // Link auf ein Muster: sein Thema gleich offen
  auswahl();
  $('tiere').addEventListener('click',e=>{
    const kat=e.target.closest('.kat');
    if(kat){oeffnen(kat.dataset.g);$('zurueck').scrollIntoView({behavior:'smooth',block:'start'});return}
    const k=e.target.closest('.tier');if(!k)return;S.tier=k.dataset.id;gewaehlt=true;zeichnen();
    if(matchMedia('(max-width:860px)').matches)$('vorschau').scrollIntoView({behavior:'smooth',block:'start'})});
  $('perlen').innerHTML=Object.entries(PERLEN).map(([k,p])=>`<button type="button" class="chip" data-p="${k}" aria-pressed="false">${p.name}</button>`).join('');
  $('perlen').addEventListener('click',e=>{const k=e.target.closest('.chip');if(!k)return;S.perle=k.dataset.p;zeichnen()});
}
function zeichnen(){
  const t=aktuellesTier(),pe=PERLEN[S.perle];
  document.querySelectorAll('.tier').forEach(k=>k.setAttribute('aria-pressed',k.dataset.id===t.id));
  document.querySelectorAll('.chip').forEach(k=>k.setAttribute('aria-pressed',k.dataset.p===S.perle));
  const svg=blatt(t,pe);
  $('vorschau').innerHTML=svg;$('druck').innerHTML=svg;
  $('klasse').value=String(S.klasse);
  const teile=(t.teile||[]).reduce((s,p)=>s+p.n,0)+(t.naht||[]).length;
  $('info').textContent=`${PerlenEditor.reihenbreite(t)} Perlen breit · ${t.rows.length} Reihen · ${zaehlen(t).n} Perlen · ${lang(draht(t,pe))} Draht · ${PerlenEditor.schwierigkeit(t,S.klasse)}${teile?` · ${teile===1?'1 Teil':teile+' Teile'}`:''}${zaehlen(t).n>1500||t.rows.length>40?' · ⚠ Sehr gross':''}`;
  $('vergleich').hidden=!t.quelle;
  if(t.quelle){$('original-bild').src=(t.offsets?'originale/':'../figuren/bilder/')+t.quelle+'.webp?v='+(t.version||2);$('original-bild').alt='Original: '+t.name;$('vergleich-muster').innerHTML=mini(t)}
  const p=new URLSearchParams(gewaehlt?{tier:t.id,klasse:S.klasse}:{klasse:S.klasse});if(S.perle!=='r3')p.set('perle',S.perle);   // ohne Auswahl kein Muster in der Adresse: Neuladen zeigt wieder die Themen
  try{history.replaceState(null,'','?'+p)}catch(e){}
  document.title=`Schritt für Schritt · Perlentier ${t.name}`;
}
const q=new URLSearchParams(location.search);
let gewaehlt=TIERE.some(t=>t.id===q.get('tier'));   // Muster gewählt oder verlinkt
if(gewaehlt)S.tier=q.get('tier');
if(PERLEN[q.get('perle')])S.perle=q.get('perle');
liste();zeichnen();
$('drucken').addEventListener('click',()=>window.print());
$('anpassen').addEventListener('click',()=>PerlenEditor.oeffnen({
  muster:aktuellesTier(),original:TIERE.find(t=>t.id===S.tier),klasse:S.klasse,palette:FARBE,perle:PERLEN[S.perle],geometrie,draehte,zaehlen,
  speichern:t=>{eigene.set(S.tier,t);let ok=true;try{localStorage.setItem(speicherKey(t),JSON.stringify(t))}catch(e){ok=false}zeichnen();return ok;}
}));
</script>
