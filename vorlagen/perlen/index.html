<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schritt für Schritt · Perlentiere</title>
<meta name="description" content="Flache Perlentiere aus Draht: Tier wählen, Muster drucken, Reihe für Reihe nachfädeln. Eigene Vorlagen für den TTG-Unterricht.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap">
<link rel="stylesheet" href="../planer.css">
<style>
:root{--bg:#EEF3F8;--surface:#FFFFFF;--surface2:#F5F8FB;--ink:#17212F;--muted:#5B6B80;--line:#D5DEE9;--acc:#17997A;--acc-ink:#FFFFFF;--acc-soft:#E3F4EF;--papier:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1621;--surface:#1A2433;--surface2:#141C28;--ink:#EDF2F8;--muted:#9DACBF;--line:#2B384A;--acc:#2FBF98;--acc-ink:#0F1621;--acc-soft:#16302B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1621;--surface:#1A2433;--surface2:#141C28;--ink:#EDF2F8;--muted:#9DACBF;--line:#2B384A;--acc:#2FBF98;--acc-ink:#0F1621;--acc-soft:#16302B;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.4 Nunito,system-ui,sans-serif}
a{color:var(--acc)}
main{max-width:1200px;margin:0 auto;padding:12px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:20px;align-items:start}
.karte{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.karte h3{font:600 15px Fredoka,Nunito,sans-serif;color:var(--muted);margin:16px 0 8px}.karte h3:first-child{margin-top:0}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.kats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px 10px;border:2px solid var(--line);border-radius:16px;background:var(--surface2);color:var(--ink);font:inherit;cursor:pointer}
.kat:hover{border-color:var(--acc);background:var(--acc-soft)}
.kat b{font:600 17px Fredoka,Nunito,sans-serif;text-align:center}
.k-bilder{display:grid;grid-template-columns:repeat(2,40px);gap:4px}
.k-bilder svg,.k-bilder img{width:40px;height:52px;object-fit:contain}
.k-n{font-size:13px;color:var(--muted)}
.zurueck{margin:10px 0 12px;min-height:44px;padding:6px 14px;border:2px solid var(--line);border-radius:999px;background:var(--surface2);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;scroll-margin-top:calc(var(--kopf-h) + 12px)}
.zurueck:hover{border-color:var(--acc)}
.tier{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 8px;border:2px solid var(--line);border-radius:14px;background:var(--surface2);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.tier svg{width:72px;height:96px}
.tier svg.nadel{position:absolute;top:6px;right:6px;width:20px;height:20px;fill:none;stroke:var(--acc);stroke-width:2;stroke-linecap:round}
.tier img{width:72px;height:96px;object-fit:contain}
.suche{display:grid;gap:8px;margin-bottom:14px}
.suche input:not([type=checkbox]),.suche select{width:100%;min-height:44px;padding:8px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.anpassen{width:100%;min-height:48px;margin:0 0 12px;border:2px solid var(--acc);border-radius:12px;background:var(--acc-soft);color:var(--ink);font:inherit;cursor:pointer}
.tier small{color:var(--muted);font-size:12px}
.tier[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.tier:hover{border-color:var(--acc)}
.tier:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.seite-rechts{position:sticky;top:calc(var(--kopf-h) + 12px);display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - var(--kopf-h) - 24px);overflow:auto;overscroll-behavior:contain}
.feld{margin-bottom:14px}
.ebild{display:inline-flex;align-items:center;gap:7px;min-height:44px;justify-self:start;text-decoration:none;font-weight:700}
.ebild svg,.faedeln svg,.a-zu svg,#a-vor svg,#a-zurueck svg,.m svg,.a-nadel svg{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ebild svg{width:20px;height:20px}
.treffer{font-size:14px;margin:0 0 8px}
.papier{display:flex;align-items:center;gap:10px;margin-bottom:10px;font:700 15px Nunito,sans-serif}
.papier::before{content:"A4"}
#blaetter{margin:0 0 14px}
.pl-blatt{cursor:pointer;border-radius:6px}
.pl-blatt[aria-pressed="true"] svg{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.pl-blatt:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.faedeln{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;margin-top:12px;padding:6px 12px;border:0;border-radius:16px;background:var(--acc);color:var(--acc-ink);font:600 20px Fredoka,Nunito,sans-serif;cursor:pointer}
.faedeln svg{flex:none;width:30px;height:30px}
.faedeln b{font:800 16px Nunito,sans-serif}
.faedeln b:empty{display:none}
.zeichen-wahl button{min-width:44px}
.zeichen-wahl .kreis{width:18px;height:18px;border-radius:50%;background:conic-gradient(#D7352E 0 33%,#F4C430 0 66%,#2A6FDB 0)}
.m{display:inline-flex;align-items:center;gap:4px}
.m svg{width:18px;height:18px}
.m i{font-style:normal;color:var(--muted)}
.m.warn{color:#B4531A;font-weight:800}
.lbl{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--acc)}
.chip[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.info{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px;margin:10px 0 0}
.vorschau svg{display:block;height:46vh;width:auto;max-width:100%;margin:0 auto;background:var(--papier);border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
/* Fädeln: Muster gross, eine Reihe hervorgehoben, unten die Folge und die Pfeile. Unten links bleibt frei für die Flagge. */
#arbeit{display:flex;flex-direction:column;height:calc(100vh - var(--kopf-h));height:calc(100dvh - var(--kopf-h));background:var(--bg)}
#arbeit[hidden]{display:none}
body[data-ansicht="arbeit"]{overflow:hidden}
body[data-ansicht="arbeit"] main,body[data-ansicht="arbeit"] .melden-platz{display:none}
#a-leiste{flex:none;display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--surface);border-bottom:1px solid var(--line)}
.a-zu{flex:none;width:48px;height:48px;display:grid;place-items:center;border:2px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--ink);cursor:pointer}
.a-zu svg{width:22px;height:22px}
#a-teile{flex:1;min-width:0;display:flex;gap:6px;padding:2px;overflow-x:auto;scrollbar-width:none}
#a-teile[hidden]{display:none}
#a-leiste .zeichen-wahl{flex:none;margin-left:auto}
.a-chip{position:relative;flex:none;width:66px;height:62px;padding:4px 4px 9px;display:grid;place-items:center;border:2px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--ink);font:inherit;cursor:pointer;overflow:hidden}
.a-chip svg{display:block;width:44px;height:40px}
.a-chip[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);box-shadow:0 0 0 2px var(--acc)}
.a-bst{position:absolute;top:2px;left:2px;min-width:20px;height:20px;padding:0 3px;display:grid;place-items:center;border-radius:10px;background:var(--surface);border:1px solid var(--ink);font:800 12px Nunito,sans-serif}
.a-seite{position:absolute;top:1px;right:4px;font:800 15px Nunito,sans-serif}
.a-ok{position:absolute;right:3px;top:17px;width:20px;height:20px;display:none;place-items:center;border-radius:50%;background:var(--acc);color:var(--acc-ink);font:800 13px Nunito,sans-serif}
.a-chip.ok .a-ok{display:grid}
.a-balken{position:absolute;left:4px;right:4px;bottom:3px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.a-balken i{display:block;height:100%;width:0;background:var(--acc)}
#a-oben{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 240px}
#a-oben.ohne{grid-template-columns:minmax(0,1fr)}
#a-oben.ohne #a-gesamt{display:none}
#a-muster{min-width:0;min-height:0;overflow:auto;background:var(--papier);overscroll-behavior:contain}
#a-muster svg{display:block}
.a-r{transition:opacity .2s}
.a-r.f{opacity:.5}.a-r.o{opacity:.22}
.a-r:not(.f):not(.o) .a-nr{display:none}
.a-band{fill:rgba(23,153,122,.13);stroke:#17997A;stroke-width:3}
.a-marke circle{fill:#17997A}.a-marke text{fill:#fff;font:800 19px Nunito,sans-serif;text-anchor:middle}
.a-nr{fill:#5B6B80;font:700 13px Nunito,sans-serif;text-anchor:middle}
#a-gesamt{min-width:0;min-height:0;padding:10px;display:grid;place-items:center;background:var(--surface);border-left:1px solid var(--line);overflow:hidden}
#a-gesamt svg{display:block;width:100%;height:100%}
#a-gesamt [data-teil]{cursor:pointer}
.g-t{opacity:.35;transition:opacity .2s}.g-t.ok,.g-t.ist{opacity:1}
.g-rahmen{fill:none;stroke:#17997A}
.g-band{fill:rgba(23,153,122,.25);stroke:#17997A}
#a-legende{flex:none;display:flex;gap:6px 12px;align-items:center;padding:5px 10px;background:var(--surface);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none;font-size:14px;white-space:nowrap}
#a-legende[hidden]{display:none}
#a-legende span{display:inline-flex;align-items:center;gap:4px}
#a-legende svg{display:block;width:17px;height:26px}
#a-unten{flex:none;display:grid;grid-template-columns:62px 72px minmax(0,1fr) 96px 104px;grid-template-areas:". z f s v";gap:8px;align-items:center;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
#a-zurueck,#a-vor{display:flex;align-items:center;justify-content:center;gap:4px;border-radius:16px;font:800 26px Nunito,sans-serif;cursor:pointer}
#a-zurueck{grid-area:z;height:72px;border:2px solid var(--line);background:var(--surface2);color:var(--ink)}
#a-zurueck:disabled{opacity:.35;cursor:default}
#a-zurueck svg{width:32px;height:32px}
#a-vor{grid-area:v;height:88px;border:0;background:var(--acc);color:var(--acc-ink)}
#a-vor svg{width:42px;height:42px;stroke-width:2.6}
#a-folge{grid-area:f;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;max-height:30vh;overflow:auto}
.fg{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.fg b{font:800 20px Nunito,sans-serif}
.fg svg{display:block;height:34px;width:auto}
.fg u{font-weight:800;text-decoration:none;color:var(--muted)}
.fp{flex:none;width:9px;height:14px;fill:none;stroke:var(--muted);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.fb{display:inline-flex;align-items:center;gap:6px;flex-basis:100%;flex-wrap:wrap}
.fb>b{font:600 16px Fredoka,Nunito,sans-serif;color:var(--acc)}
#a-folge.dicht .fg{padding:2px 5px}#a-folge.dicht .fg b{font-size:16px}#a-folge.dicht .fg svg{height:26px}
.a-nadel{display:inline-flex;align-items:center;gap:8px;font:600 20px Fredoka,Nunito,sans-serif}
.a-nadel svg{width:30px;height:30px}
.a-z{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:12px;background:var(--acc-soft);font:800 17px Nunito,sans-serif}
.a-bm{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 4px;border:2px solid var(--ink);border-radius:13px;background:#fff;color:#1F2933;font:800 15px Nunito,sans-serif}
.a-ganz{font:800 40px/1 Nunito,sans-serif;color:var(--acc)}
#a-stand{grid-area:s;min-width:0;display:grid;gap:3px;text-align:center;font-size:15px}
#a-stand b{font:800 26px Nunito,sans-serif}
#a-stand i{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
#a-stand i::after{content:"";display:block;height:100%;width:var(--w,0%);background:var(--acc)}
@media (max-width:860px){
  main{display:flex;flex-direction:column;align-items:stretch;gap:12px;padding:8px 10px 40px}
  .seite-rechts{display:contents}
  .k-vorschau{order:1;display:flex;align-items:center;gap:10px;padding:8px}
  .k-vorschau .vorschau{flex:1;min-width:0}
  .vorschau svg{height:30vh}
  .faedeln{flex:none;flex-direction:column;width:112px;min-height:112px;margin:0;gap:2px;font-size:18px}
  .k-einst{order:2}
  .k-wahl{order:3}
}
@media (max-width:640px){
  #a-oben{grid-template-columns:minmax(0,1fr) 108px}
  #a-gesamt{padding:6px}
  #a-oben.ganz{grid-template-columns:minmax(0,1fr)}#a-oben.ganz #a-gesamt{display:none}
  #a-unten{grid-template-columns:54px 64px minmax(0,1fr) 104px;grid-template-areas:"f f f f" ". z s v";padding:6px 8px;padding-bottom:max(6px,env(safe-area-inset-bottom))}
  #a-zurueck{height:64px}#a-vor{height:72px}
  #a-leiste .zeichen-wahl button{min-width:38px;padding:3px 6px}
  .a-chip{width:60px}
}
@media (max-width:480px){.raster{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}.tier svg{width:56px;height:76px}.kats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.k-bilder{grid-template-columns:repeat(2,34px)}.k-bilder svg,.k-bilder img{width:34px;height:44px}}
#druck{display:none}
@page{size:A4 portrait;margin:0}
@media print{
  html,body{background:#fff;height:auto!important;overflow:visible!important}
  #arbeit,main{display:none!important}
  #druck{display:block}
  #druck svg{display:block;width:210mm;height:297mm;break-after:page}#druck svg:last-child{break-after:auto}
}
</style>
</head>
<body>
<header class="pk">
  <a class="zur-app" href="../../" data-zur-app aria-label="Zurück zur App"><span>App</span></a>
  <h1 id="titel">Perlentiere</h1>
  <a class="pk-vorlagen" href="../" aria-label="Vorlagen" title="Vorlagen"><span>Vorlagen</span></a>
  <button class="pk-rueck" id="p-rueck" type="button" disabled aria-label="Rückgängig" title="Rückgängig"></button>
  <button class="pk-druck" id="drucken" type="button" aria-label="Drucken, 100 %"><span>Drucken</span></button>
</header>
<script src="../zurueck.js"></script>
<script src="../planer.js"></script>
<main>
  <section class="karte k-wahl" aria-label="Tier wählen">
    <div class="suche"><label for="klasse">Klasse</label><select id="klasse"></select><label style="display:flex;gap:8px;align-items:center;min-height:44px"><input type="checkbox" id="nur-passend"> Nur passende</label><label for="suche">Suchen</label><input id="suche" type="search"><a class="ebild" href="../perlentier-bild/"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>Eigenes Bild</a></div>
    <p class="treffer" id="treffer" role="status"></p>
    <button type="button" class="zurueck" id="zurueck" hidden>← Alle Themen</button>
    <div id="tiere"></div>
  </section>
  <div class="seite-rechts">
    <section class="karte k-vorschau pl-haft" aria-label="Vorschau">
      <div class="vorschau" id="vorschau"></div>
      <button type="button" class="faedeln" id="faedeln" aria-label="Fädeln"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h14"/><path d="M14 7l5 5-5 5"/><path d="M6 8.5v7M10.5 8.500v7"/></svg><span>Fädeln</span><b id="f-stand"></b></button>
    </section>
    <section class="karte k-einst" aria-label="Einstellungen">
      <div class="papier" id="papier"></div>
      <div id="blaetter" hidden></div>
      <div class="feld">
        <span class="lbl" id="lbl-perle">Perlen</span>
        <div class="chips" role="group" aria-labelledby="lbl-perle" id="perlen"></div>
      </div>
      <div class="feld">
        <span class="lbl" id="lbl-zeichen">Zeichen</span>
        <div class="pl-seg zeichen-wahl" role="group" aria-labelledby="lbl-zeichen"></div>
      </div>
      <button type="button" class="anpassen" id="anpassen">Anpassen</button>
      <div class="info" id="info" aria-live="polite"></div>
      <details id="vergleich" hidden><summary>Original</summary><div style="display:flex;gap:12px;align-items:center;justify-content:center;padding:12px;background:var(--papier,#fff)"><img id="original-bild" alt="Originalmotiv" style="width:45%;max-height:200px;object-fit:contain"><div id="vergleich-muster" style="width:45%;max-height:200px"></div></div></details>
    </section>
  </div>
</main>
<section id="arbeit" hidden aria-label="Fädeln">
  <div id="a-leiste">
    <button type="button" class="a-zu" id="a-zu" aria-label="Schliessen" title="Schliessen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    <div id="a-teile" role="group" aria-label="Teile" hidden></div>
    <div class="pl-seg zeichen-wahl" role="group" aria-label="Zeichen"></div>
  </div>
  <div id="a-oben">
    <div id="a-muster" tabindex="-1"></div>
    <div id="a-gesamt"></div>
  </div>
  <div id="a-legende" hidden></div>
  <div id="a-unten">
    <button type="button" id="a-zurueck" aria-label="Vorherige Reihe"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V5M5 11l7-7 7 7"/></svg></button>
    <div id="a-folge"></div>
    <div id="a-stand"></div>
    <button type="button" id="a-vor" aria-label="Nächste Reihe"></button>
  </div>
</section>
<div id="druck"></div>
<script src="figuren.js?v=4"></script>
<script src="figuren-gross.js?v=4"></script>
<script src="bearbeiten.js?v=5"></script>
<script>
// Eigene Muster von Schritt für Schritt. Jede Reihe ist eine Zeichenkette, ein Buchstabe pro Perle (Farbe).
// Beine: nach Reihe r mit jedem Drahtende n Perlen und f Fussperlen auffädeln, zurück durch die n Perlen.
// a = Winkel in Grad (positiv: nach vorne/oben), w = Wort im Muster.
const FARBE={g:['#3FA34D','grün'],d:['#1F6B35','dunkelgrün'],h:['#B5DE7A','hellgrün'],s:['#1C2430','schwarz'],w:['#FFFFFF','weiss'],r:['#D7352E','rot'],y:['#F4C430','gelb'],o:['#F08A24','orange'],b:['#2A6FDB','blau'],l:['#9CD0F5','hellblau'],p:['#F6AFC6','rosa'],q:['#D9487A','pink'],k:['#8A5A35','braun'],c:['#E2BC72','ocker'],n:['#A7B1BE','grau'],v:['#7B4FC9','violett']};
const TIERE=[
  {id:'schlange',name:'Schlange',stufe:'leicht',rows:['r','ggg','sgggs','ggg','gg','gyg','ggg','yyy','ggg','gyg','ggg','yyy','ggg','gyg','gg','yy','gg','g','y','g']},
  {id:'eidechse',name:'Eidechse',stufe:'leicht',rows:['ggg','sgggs','ggg','gg','gghgg','gghgg','ghhhg','gghgg','gghgg','ggg','gg','gg','g','g','h'],
    beine:[{r:5,n:2,f:3,a:22,c:'g',fc:'h',w:'Beine'},{r:9,n:2,f:3,a:-22,c:'g',fc:'h',w:'Beine'}]},
  {id:'marienkaefer',name:'Marienkäfer',stufe:'leicht',rows:['sss','swsws','rrsrr','rrrsrrr','rsrsrsr','rrrsrrr','srrsrrs','rrsrr','rsr'],

// Einheit = Perlendurchmesser (Reihenabstand). q = Perlenlänge auf dem Draht. r = Drehung der Perle (Grad, Richtung des Drahts).
// luft: Abstand nach einer Reihe mit Beinen. Das Bein liegt dann zwischen den Reihen, so sieht man den Draht.
function geometrie(t,q=2/3,luft=0){
  const P=[],W=[],L=[],T=[],gr=180/Math.PI,n=t.rows.length,mitBein=new Set((t.beine||[]).map(b=>b.r-1)),ry=[];
  for(let i=0,y=0;i<=n;i++){ry.push(y);y+=1+(mitBein.has(i)?luft:0)}
  const rand=k=>k<n?t.rows[k].length/2*q:0;
  const start=t.rows.map((r,i)=>t.offsets?(t.offsets[i]-(t.gridWidth-1)/2)*q:-(r.length-1)/2*q);
  const links=start.map(x=>x-q/2),rechts=start.map((x,i)=>x+(t.rows[i].length-.5)*q);
  t.rows.forEach((r,i)=>{for(let j=0;j<r.length;j++)P.push({x:start[i]+j*q,y:ry[i],c:r[j],r:0,ref:['r',i,j]});W.push([[links[i]-.05,ry[i]],[rechts[i]+.05,ry[i]]])});
  const k0=q/2+.12;   // erste Beinperle knapp neben der Randperle
  // Gleiches Drahtende: hinaus durch das Bein, durch die quer liegende Endperle (oder die Fussschlaufe) und zurück durch die Beinperlen zur nächsten Reihe
  const strang=(E,sx,a,b,ref)=>{
    const u=[sx*Math.cos(a),-Math.sin(a)],v=[-u[1]*sx,u[0]*sx],ru=Math.atan2(u[1],u[0])*gr;   // v zeigt auf beiden Seiten nach unten: hinaus oben, zurück unten
    const o=.15,at=(p_,a_,b_)=>[p_[0]+u[0]*a_+v[0]*b_,p_[1]+u[1]*a_+v[1]*b_],bp=[];
    let p=null;
    for(let k=0;k<b.n;k++){p=at(E,k0+k*q,0);P.push({x:p[0],y:p[1],c:b.c,r:ru,ref:[...ref,'c']});bp.push(p)}
    const ende=p?at(p,q/2,0):at(E,.12,0);   // äusseres Ende des Beins

      fuss=[at(ende,0,-o),at(ende,0,-h+.1),at(ende,.1,-h),at(c,0,-h),at(c,0,h),at(ende,.1,h),at(ende,0,h-.1),at(ende,0,o)]}   // Endperle liegt quer: der Draht geht seitlich durch ihr Loch und gleich wieder zurück ins Bein

      for(let k=0;k<f;k++){const ph=Math.PI+(k+.5)*2*Math.PI/f,lx=R*s*Math.cos(ph),ly=R*pp*Math.sin(ph);
        const tx=-R*s*Math.sin(ph),ty=R*pp*Math.cos(ph);   // Tangente: so liegt die Perle auf dem Draht
        const q_=at(m,lx,ly);ring.push(q_);P.push({x:q_[0],y:q_[1],c:b.fc,r:Math.atan2(u[1]*tx+v[1]*ty,u[0]*tx+v[0]*ty)*gr,ref:[...ref,'fc']})}
      fuss=ring;
    }
    return {u,pts:[at(E,0,-o),...hin,...fuss,...zur,at(E,0,o)]}};
  (t.beine||[]).forEach((b,bi)=>{
    const i=b.r-1,e=(t.rows[i].length-1)/2*q,a=b.a*Math.PI/180;
    const ly=luft?ry[i]+(1+luft)/2:ry[i],bx=luft?Math.max(rand(i),rand(i+1))+.5:e+q/2;
    for(const sx of[-1,1]){
      const S=[sx*e,ry[i]],E=[sx*bx,ly],l=strang(E,sx,a,b,['b',bi]);
      W.push([S,E,...l.pts,E,S]);L.push({i,sx,...l});
    }
  });
  // Mit den zwei Drahtenden angenähte Teile liegen am Platz im selben Plan. rows[0] ist die Spitze, die letzte Reihe die Naht.
  // quer: Seitenteil mit senkrechten Reihen und gedrehten Perlen, die Enden gehen durch die Körperreihen an bis zur Gegenseite.
  // Sonst waagrechte Reihen über oder unter dem Körper: jedes Ende zu einer eigenen Perle der Nachbarreihe.
  if(t.naht?.length){
    const yr=r=>{if(r<0)return ry[0]+r;if(r>n)return ry[n]+r-n;const k=Math.min(n-1,Math.floor(r));return ry[k]+(r-k)*(ry[k+1]-ry[k])};
    const koerper=t.rows.flatMap((r,i)=>[...r].map((_,j)=>({x:start[i]+j*q,y:ry[i],i})));
    t.naht.forEach((p,ti)=>{
      const m=p.rows.length,d=m>1?.14:0,e=p.rows[m-1].length/2*q;
      if(p.quer){
        const sx=p.quer,y0=yr(p.y);let s=null;
        p.rows.forEach((row,k)=>{const h=(row.length-1)/2;for(let j=0;j<row.length;j++){const r=Math.round(p.y+(j-h)*q);if(r<0||r>=n)continue;
          const v=t.rows[r].length/2*q+.85-sx*(p.x+sx*(m-1-k));s=s==null?v:Math.max(s,v)}});   // so nah an den Körper, wie es seine Form erlaubt
        const x=p.x+sx*(s||0)+sx*(m-1);   // x: Spalte der Spitze
        p.rows.forEach((row,k)=>{const h=(row.length-1)/2;for(let j=0;j<row.length;j++)P.push({x:x-sx*k,y:y0+(j-h)*q,c:row[j],r:90,ref:['n',ti,k,j]})});
        const LT=(p.beine||[]).map((b,li)=>{const a=b.a*Math.PI/180,E=[x+sx*(b.o[0]-Math.cos(a)*k0),y0+b.o[1]+Math.sin(a)*k0],l=strang(E,sx,a,b,['f',ti,li]);
          return {i:b.k,sx:b.s,u:[l.u[1],-sx*l.u[0]],pts:l.pts.map(w=>[w[1]-y0,sx*(x-w[0])])}});   // für den gedrehten Drahtweg des Teils
        const enden=[[-e,m-1+d,p.an[0]],[e,m-1-d,p.an[1]]].map(([lx,ly,r])=>{
          const a=[x-sx*ly,y0+lx],k=Math.max(0,Math.min(n-1,r)),w=t.rows[k].length/2*q,y=ry[k],h=Math.sign(y-a[1])*.5;
          return {p:[a,[a[0],a[1]+h],[sx*(w+.5),y],[sx*w,y],[-sx*(w+.3),y]],pfeil:sx}});
        T.push({x,y0,L:LT,enden});return}
      const sx=p.x<0?-1:1,y0=yr(p.r),hb=k=>p.rows[k].length/2*q;
      let x=p.x,s=null;
      for(let k=0;k<m;k++){const r=Math.round(p.r+p.d*k);if(r<0||r>=n)continue;const v=t.rows[r].length/2*q+.3-(sx*x-hb(k));s=s==null?v:Math.max(s,v)}
      if(s!=null)x+=sx*s;
      p.rows.forEach((row,k)=>{const e=(row.length-1)/2;for(let j=0;j<row.length;j++)P.push({x:x+(j-e)*q,y:y0+p.d*k,c:row[j],r:0,ref:['n',ti,k,j]})});
      const iy=y0+p.d*(m-1);let an=koerper[0],bd=1e9;
      for(const b of koerper){const v=(b.x-x)**2+(b.y-iy)**2;if(v<bd){bd=v;an=b}}
      const reihe=koerper.filter(b=>b.i===an.i),nah=(px,ohne)=>reihe.filter(b=>b!==ohne).sort((a,b)=>Math.abs(a.x-px)-Math.abs(b.x-px))[0]||ohne;
      const bl=nah(x-e),br=nah(x+e,bl),ziel=(lx,ly,b,s_)=>{const a=[x+lx,y0+p.d*ly];return {p:[a,[a[0]+s_*.7,a[1]],[b.x+s_*.5,b.y],[b.x,b.y]]}};
      T.push({x,y0,L:[],enden:[ziel(-e,m-1+d,bl,-1),ziel(e,m-1-d,br,1)]});
    });

  const xs=P.map(q_=>q_.x),ys=P.map(q_=>q_.y);
  return {P,W,L,T,q,ry,links,rechts,x0:Math.min(...xs)-.5,x1:Math.max(...xs)+.5,y0:Math.min(...ys)-.5,y1:Math.max(Math.max(...ys)+.5,ry[n]-.5)};
}

// Angenähte Teile (Flügel, Pinsel …) sind eigene kleine Muster. Hier werden sie neben, über oder unter den Körper gelegt,
// für die linke Seite gespiegelt. naehte: Randperle des Körpers und nächste Perle des Teils – dort wird genäht.
function zusammen(t,q=2/3){
  const g=geometrie(t,q),P=g.P.map(p=>({...p})),naehte=[],reihe=[];
  t.rows.forEach((r,i)=>{for(const c of r)reihe.push(i+1)});
  for(const p of t.teile||[]){
    const gp=geometrie(p,q),minL=Math.min(...gp.links),seiten=p.lage==='seiten'?[-1,1]:p.lage==='links'?[-1]:p.lage==='rechts'?[1]:[0];
    for(const sx of seiten){
      let dx=0,dy,fx=x=>x;
      if(sx){const i=Math.min(p.an||1,t.rows.length)-1;fx=x=>sx*(x-minL)+(sx>0?g.rechts[i]+.3:g.links[i]-.3);dy=g.ry[i]-gp.ry[0]}
      else if(p.lage==='oben'){dx=(g.links[0]+g.rechts[0])/2;dy=g.y0-gp.y1-.3}
      else{const k=t.rows.length-1;dx=(g.links[k]+g.rechts[k])/2;dy=g.y1-gp.y0+.3}
      const neu=gp.P.map(b=>({x:fx(b.x)+dx,y:b.y+dy,c:b.c,r:sx<0?-b.r:b.r}));
      let best=null;
      g.P.forEach((a,k)=>{for(const b of neu){const d=(a.x-b.x)**2+(a.y-b.y)**2;if(!best||d<best.d)best={d,a,b,reihe:reihe[k]||0}}});
      if(best)naehte.push({a:best.a,b:best.b,w:p.w,reihe:best.reihe});
      P.push(...neu);
    }
  }
  const xs=P.map(b=>b.x),ys=P.map(b=>b.y);
  return {P,q,ry:g.ry,links:g.links,rechts:g.rechts,naehte,x0:Math.min(...xs)-.5,x1:Math.max(...xs)+.5,y0:Math.min(...ys)-.5,y1:Math.max(...ys)+.5};
}

function zaehlen(t){
  const z={};let n=0;
  const add=(c,k)=>{z[c]=(z[c]||0)+k;n+=k};
  const stueck=(s,m)=>{for(const r of s.rows)for(const c of r)add(c,m);for(const b of s.beine||[]){add(b.c,2*b.n*m);add(b.fc,2*b.f*m)}};
  stueck(t,1);for(const p of t.teile||[])stueck(p,p.n||1);   // angenähte Teile zählen mit, so oft wie sie gefädelt werden
  for(const p of t.naht||[]){for(const r of p.rows)for(const c of r)add(c,1);for(const b of p.beine||[]){add(b.c,b.n);add(b.fc,b.f)}}   // Strang eines Teils: nur eine Seite
  return {z,n};
}
// Draht pro Stück (Körper oder Teil), mit Zugabe zum Festhalten und Verdrehen
function drahtStueck(t,pe){
  let cm=0;
  for(const r of t.rows)cm+=(2*r.length+1)*pe.l;
  if(t.offsets)for(let i=1;i<t.rows.length;i++)cm+=(Math.abs(t.offsets[i]-t.offsets[i-1])+Math.abs(t.offsets[i]+t.rows[i].length-t.offsets[i-1]-t.rows[i-1].length))*pe.l;
  for(const b of t.beine||[])cm+=2*(2*b.n+b.f+1)*pe.l;
  return Math.ceil((cm*1.15+30)/10)*10;
}
function drahtNaht(p,pe){
  let cm=0;
  for(const r of p.rows)cm+=(2*r.length+1)*pe.l;
  for(const b of p.beine||[])cm+=(2*b.n+b.f+1)*pe.l;
  return Math.ceil((cm*1.15+30)/10)*10;
}
const draht=(t,pe)=>drahtStueck(t,pe)+(t.teile||[]).reduce((s,p)=>s+(p.n||1)*drahtStueck(p,pe),0)+(t.naht||[]).reduce((s,p)=>s+drahtNaht(p,pe),0);
const f1=x=>(Math.round(x*2)/2).toLocaleString('de-CH').replace('.',',');   // Komma wie in allen Werkzeugen
const lang=cm=>cm>=100?`${(cm/100).toLocaleString('de-CH').replace('.',',')} m`:`${cm} cm`;

// Zuschaltbar für Farbsehschwäche: pro Farbe ein Buchstabe oder Symbol, in Vorschau, Fädeln und Ausdruck gleich. Symbole im Feld ±5.

const FORM=[...FORM_VOLL.map(d=>[d,0]),...FORM_VOLL.slice(0,5).map(d=>[d,1]),...['M0-4.6V4.6M-4.6 0H4.6','M-3.6-3.6L3.6 3.6M3.6-3.6L-3.6 3.6','M-4.5 2.5L0-2.5L4.5 2.5','M-4.5-2.5L0 2.5L4.5-2.5','M2.5-4.5L-2.5 0L2.5 4.5','M-2.5-4.5L2.5 0L-2.5 4.5','M-3.8 4.2L3.8-4.2','M-3.8-4.2L3.8 4.2','M-2.2-4.5V4.5M2.2-4.5V4.5','M-4.5-2.2H4.5M-4.5 2.2H4.5','M-4.6 0C-3-4-1.5-4 0 0S3 4 4.6 0'].map(d=>[d,1])];
function markenVon(t){

function perlen(g,sk,ox,oy,kreis=.45,grau=true,mitZeichen=true){
