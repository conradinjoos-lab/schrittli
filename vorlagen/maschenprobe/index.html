<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schritt für Schritt · Maschen-Planer</title>
<meta name="description" content="Maschen-Planer fürs Häkeln und Stricken: Kappe, Stirnband, Armband, Pulswärmer, Schal und mehr. Messen, Maschenprobe zählen – die Seite sagt, wie viele Maschen und Reihen. Mit druckbarem Zählfenster 10 × 10 cm.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{--bg:#EEF3F8;--surface:#FFFFFF;--surface2:#F5F8FB;--ink:#17212F;--muted:#5B6B80;--line:#D5DEE9;--acc:#17997A;--acc-ink:#FFFFFF;--acc-soft:#E3F4EF;--warn:#B4541A;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1621;--surface:#1A2433;--surface2:#141C28;--ink:#EDF2F8;--muted:#9DACBF;--line:#2B384A;--acc:#2FBF98;--acc-ink:#0F1621;--acc-soft:#16302B;--warn:#F0A04B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1621;--surface:#1A2433;--surface2:#141C28;--ink:#EDF2F8;--muted:#9DACBF;--line:#2B384A;--acc:#2FBF98;--acc-ink:#0F1621;--acc-soft:#16302B;--warn:#F0A04B;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.4 Nunito,system-ui,sans-serif}
h1,h2{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0}
h1{font-size:26px}
h2{font-size:28px;line-height:1.2;text-align:center;margin:4px 0 16px}
h2:focus{outline:none}
a{color:var(--acc)}
button{touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.kopf,.weg,main{max-width:860px;margin:0 auto;padding-left:16px;padding-right:16px}
.kopf{padding-top:16px}
/* Der Weg: fünf Schritte. Erledigte zeigen, was man gewählt hat, und führen dorthin zurück. */
.weg{display:flex;flex-wrap:wrap;gap:6px;padding-top:10px;padding-bottom:6px}
.weg button{font:inherit;font-size:14px;min-height:36px;padding:4px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.weg button.fertig{color:var(--ink);border-color:var(--acc)}
.weg button[aria-current="step"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.weg button:disabled{opacity:.45;cursor:default}
main{padding-top:4px;padding-bottom:48px}
.zurueck{font:inherit;font-size:15px;background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 0;min-height:40px}
.kacheln{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kacheln.paar{grid-template-columns:repeat(2,minmax(0,1fr));max-width:520px;margin:0 auto}
.kachel{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px 12px;border:2px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink);font:600 18px/1.2 Fredoka,Nunito,sans-serif;cursor:pointer}
.kachel svg{width:84px;height:84px}
.kacheln.paar .kachel{font-size:24px;padding:22px 10px 18px}
.kacheln.paar .kachel svg{width:124px;height:124px}
.kachel:hover{border-color:var(--acc)}
.kachel[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.loch{fill:var(--surface)}
.bild{display:block;width:100%;max-width:340px;height:auto;margin:0 auto 12px}
.bild.papier{max-width:340px;border-radius:10px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.12)}
.gleich{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 8px;font:600 34px Fredoka,Nunito,sans-serif;color:var(--muted)}
.gleich svg{width:64px;height:64px}
.mass{display:flex;justify-content:center;gap:16px 32px;flex-wrap:wrap}
.feld{display:flex;flex-direction:column;align-items:center}
.lbl{font-size:15px;color:var(--muted);margin-bottom:6px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:60px;height:60px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:600 32px/1 Fredoka,Nunito,sans-serif;cursor:pointer;padding:0;flex:none}
.stepper button:hover{border-color:var(--acc)}
.stepper button:active{background:var(--acc-soft)}
.stepper input{width:100px;height:60px;font:600 32px Fredoka,Nunito,sans-serif;text-align:center;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0 4px;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper span{font-size:17px;color:var(--muted)}
.weiter{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:380px;min-height:60px;margin:24px auto 0;padding:0 18px;border:0;border-radius:18px;background:var(--acc);color:var(--acc-ink);font:600 22px Fredoka,Nunito,sans-serif;cursor:pointer}
.weiter:disabled{opacity:.35;cursor:default}
.weiter.zweit{background:transparent;color:var(--ink);border:2px solid var(--acc);min-height:52px;font-size:19px;margin-top:12px}
.warn{display:flex;justify-content:center;align-items:center;gap:14px;color:var(--warn);font:600 30px Fredoka,Nunito,sans-serif;margin:14px 0 0}
.warn[hidden]{display:none}
.warn svg{width:64px;height:64px}
.emo{font-size:30px;line-height:1}
.lp{text-align:center;margin:22px 0 0}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:15px;cursor:pointer;padding:6px}
/* Plan: links die Schritte, rechts das Werk mit Massen */
.plan-kopf{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:16px 24px;align-items:center}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.plan li{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:19px;line-height:1.3}
.plan .nr{flex:none;width:36px;height:36px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font:600 18px Fredoka,Nunito,sans-serif}
.plan b{font:600 36px/1 Fredoka,Nunito,sans-serif;color:var(--acc)}
.plan .ic{flex:none;width:60px;height:44px}
.plan .plus{font:600 22px Fredoka,Nunito,sans-serif;color:var(--acc)}
.plan .cm{margin-left:auto;color:var(--muted);font-size:17px;white-space:nowrap}
.plan .fertig-bild{display:flex;align-items:center;gap:10px;font:600 28px Fredoka,Nunito,sans-serif;color:var(--muted)}
.plan .fertig-bild svg{width:56px;height:56px}
.werkbild svg{display:block;width:100%;height:auto;max-height:320px}
.extras{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.mehr{font:inherit;font-size:16px;min-height:44px;padding:6px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.mehr[aria-expanded="true"]{border-color:var(--acc);background:var(--acc-soft)}
.ausklapp{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px auto 0;max-width:640px}
.garn-erg{text-align:center;font-size:18px;margin:12px 0 0}
.garn-erg b{color:var(--acc);font:600 24px Fredoka,Nunito,sans-serif}
.druckzeile{display:flex;gap:10px;max-width:560px;margin:24px auto 0;flex-wrap:wrap}
.druckzeile .text{flex:1 1 170px;min-height:60px;font:inherit;font-size:19px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:8px 12px}
.druckzeile .weiter{flex:1 1 220px;margin:0}
.neu{display:block;margin:18px auto 0}
/* 1./2. Klasse: grösser, Wolle-Rechnung weg */
body.klein .kachel{font-size:21px}
body.klein .plan li{font-size:21px}
body.klein .stepper button{width:68px;height:68px;font-size:36px}
body.klein .stepper input{height:68px;font-size:36px;width:110px}
@media (max-width:640px){
  .kacheln{grid-template-columns:repeat(2,minmax(0,1fr))}
  .plan-kopf{grid-template-columns:1fr}
  h2{font-size:24px}
  .stepper button{width:54px;height:54px}
  .stepper input{width:86px;height:54px}
}
#druck{display:none}
@page{size:A4 portrait;margin:0}
@media print{
  body{background:#fff}
  .kopf,.weg,main{display:none!important}
  #druck{display:block}
  #druck svg{display:block;width:var(--bw,210mm);height:var(--bh,297mm)}
}
</style>
<style id="seite"></style>

<body>
<header class="kopf">
  <a class="zur-app" href="../../" data-zur-app>← Zurück zur App</a>
  <h1>Maschen-Planer</h1>
</header>
<script src="../zurueck.js"></script>
<nav class="weg" id="weg" aria-label="Schritte"></nav>
<main id="main"></main>
<div id="druck"></div>
<script>
// Maschen-Planer von Schritt für Schritt: Häkeln oder Stricken → Werk → Messen → Probestück → Maschen und Reihen zählen → Plan.
// Immer nur ein Schritt auf dem Bildschirm. Masse in cm, Druck in mm.
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=v=>Math.round(v*10)/10;
const KEY='schrittli.maschenprobe.v1';
const FRISCH=2*60*60*1000;   // Nach 2 Stunden beginnt die Seite wieder vorne (geteilte iPads), vorher geht es dort weiter, wo man war
const PAPIERE={a4:{name:'A4',w:210,h:297},a3:{name:'A3',w:297,h:420}};
const TECHNIK={haekeln:'Häkeln',stricken:'Stricken'};
// Werke für Kinder: was gemessen wird und wie es fertig wird
const WERKE={
  kappe:{name:'Kappe',mass:'kopf',fertig:'Hinten zusammennähen, oben zusammenziehen.'},
  stirnband:{name:'Stirnband',mass:'kopf',fertig:'Die Enden zusammennähen.'},
  armband:{name:'Armband',mass:'handgelenk',fertig:'Mit Knopf oder Bändel schliessen.'},
  pulswaermer:{name:'Pulswärmer',mass:'hand',fertig:'Längs zusammennähen, ein Loch für den Daumen lassen.'},
  schal:{name:'Schal',mass:'laenge',fertig:'Fäden vernähen. Fransen, wenn du magst.'},
  topflappen:{name:'Topflappen',mass:'seite',fertig:'Eine Schlaufe an eine Ecke.'},
  handy:{name:'Handytasche',mass:'handy',fertig:'In der Mitte falten, die Seiten zusammennähen.'},
  eigenes:{name:'Eigenes',mass:'frei',fertig:''}
};
// Was man misst: Felder [Schlüssel, Beschriftung, min, max, Schritt]
const MASSE={
  kopf:{titel:'Kopf messen',felder:[['kopf','Kopf',40,64,1]],bild:()=>bildKopf()},
  handgelenk:{titel:'Handgelenk messen',felder:[['handgelenk','Handgelenk',11,22,1]],bild:()=>bildHand(true)},
  hand:{titel:'Hand messen',felder:[['hand','Hand',13,26,1]],bild:()=>bildHand(false)},
  laenge:{titel:'Länge',felder:[['laenge','Länge',50,200,5]],bild:()=>bildSchal()},
  seite:{titel:'Grösse',felder:[['seite','Seite',10,30,1]],bild:()=>bildTopf()},
  handy:{titel:'Handy messen',felder:[['handyB','Breite',5,12,1],['handyH','Höhe',10,20,1]],bild:()=>bildHandy()},
  frei:{titel:'Grösse',felder:[['freiB','Breite',3,200,1],['freiH','Höhe',3,300,1]],bild:()=>bildFrei()}
};
const ALLE_FELDER=Object.values(MASSE).flatMap(m=>m.felder);
const START={technik:null,werk:null,mass:{kopf:52,handgelenk:15,hand:18,laenge:120,seite:20,handyB:7,handyH:15,freiB:20,freiH:20},b:20,h:20,m10:0,r10:0,seite:0,gew:0,papier:'a4',name:'',schritt:0,weit:0};
const S=JSON.parse(JSON.stringify(START));
const offen={groesse:false,garn:false};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,Math.round(Number(v)||0)));
const hat=(o,k)=>k!=null&&Object.prototype.hasOwnProperty.call(o,k);   // nur echte Schlüssel, kein «constructor»
const haekeln=()=>S.technik==='haekeln';

function klasseLesen(){
  const q=Number(new URLSearchParams(location.search).get('klasse'));
  if(q>=1&&q<=6)return q;
  try{ if(localStorage.getItem('schrittli.app')==='schule'){ const k=Number(JSON.parse(localStorage.getItem('schrittli.schule.v1'))?.settings?.klasse); if(k>=1&&k<=6)return k; } }catch(e){}
  return 0;
}
const KLASSE=klasseLesen(), KLEIN=KLASSE>0&&KLASSE<=2;
if(KLEIN)document.body.classList.add('klein');
function kindName(){   // Vorname aus «Wer bist du?» der Schulversion
  try{ if(localStorage.getItem('schrittli.app')==='schule')return String(JSON.parse(localStorage.getItem('schrittli.schule.v1'))?.settings?.kind?.name||'').slice(0,30); }catch(e){}
  return '';
}

// ---------- Masse aus der Messung ----------
// Gestricktes dehnt mehr als Gehäkeltes: Kappe und Stirnband 2 cm (Häkeln 1 cm) enger als der Kopf
function masse(){
  const M=S.mass, d=haekeln()?1:2;
  switch(S.werk){
    case 'kappe':return {b:M.kopf-d,h:Math.round(M.kopf*.4)};
    case 'stirnband':return {b:8,h:M.kopf-d};
    case 'armband':return {b:3,h:M.handgelenk+2};
    case 'pulswaermer':return {b:M.hand-d+1,h:15};
    case 'schal':return {b:15,h:M.laenge};
    case 'topflappen':return {b:M.seite,h:M.seite};
    case 'handy':return {b:M.handyB+2,h:2*(M.handyH+1)};
    default:return {b:M.freiB,h:M.freiH};
  }
}
function masseSetzen(){ if(!S.werk)return; const A=masse(); S.b=clamp(A.b,2,200); S.h=clamp(A.h,2,300); }
function achsen(){ return {kappe:['Umfang','Höhe'],pulswaermer:['Umfang','Länge'],stirnband:['Breite','Länge'],armband:['Breite','Länge'],schal:['Breite','Länge']}[S.werk]||['Breite','Höhe']; }
function massText(){
  const M=S.mass;
  switch(WERKE[S.werk]?.mass){
    case 'kopf':return `Kopf ${M.kopf} cm`;
    case 'handgelenk':return `Handgelenk ${M.handgelenk} cm`;
    case 'hand':return `Hand ${M.hand} cm`;
    case 'laenge':return `${M.laenge} cm lang`;
    case 'seite':return `${M.seite} × ${M.seite} cm`;
    case 'handy':return `Handy ${M.handyB} × ${M.handyH} cm`;
    default:return `${M.freiB} × ${M.freiH} cm`;
  }
}

// ---------- Speichern ----------
function laden(){
  let t=null; try{ t=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(t&&typeof t==='object'&&Date.now()-Number(t.zeit||0)<FRISCH){
    if(hat(TECHNIK,t.technik))S.technik=t.technik;
    if(hat(WERKE,t.werk))S.werk=t.werk;
    if(t.mass&&typeof t.mass==='object')for(const [k,,min,max] of ALLE_FELDER)if(t.mass[k]!=null)S.mass[k]=clamp(t.mass[k],min,max);
    S.b=clamp(t.b??S.b,2,200);S.h=clamp(t.h??S.h,2,300);
    S.m10=clamp(t.m10,0,80);S.r10=clamp(t.r10,0,120);S.seite=clamp(t.seite,0,30);S.gew=clamp(t.gew,0,100);
    S.name=String(t.name||'').slice(0,30);
    S.weit=clamp(t.weit,0,6);S.schritt=clamp(t.schritt,0,6);
    if(hat(PAPIERE,t.papier))S.papier=t.papier;
  }
  if(!S.name)S.name=kindName();
  const q=new URLSearchParams(location.search);
  if(hat(PAPIERE,String(q.get('papier')).toLowerCase()))S.papier=String(q.get('papier')).toLowerCase();
  // Link mit Technik und Werk (z. B. aus einer Anleitung): direkt zum Messen. Gleicher Stand bleibt, sonst geht beim Neuladen alles verloren.
  const qt=q.get('technik'), qw=q.get('werk')==='muetze'?'kappe':q.get('werk');
  if(hat(TECHNIK,qt)&&S.technik!==qt){ technikWaehlen(qt); }
  if(S.technik&&hat(WERKE,qw)&&S.werk!==qw){ werkWaehlen(qw); }
  // Nur Schritte, die mit dem Stand auch gehen
  if(!S.technik)S.weit=0; else if(!S.werk)S.weit=Math.min(S.weit,1);
  if(S.m10<3)S.weit=Math.min(S.weit,4); else if(S.r10<3)S.weit=Math.min(S.weit,5);
  S.schritt=Math.min(S.schritt,S.weit);
}
function speichern(){ try{localStorage.setItem(KEY,JSON.stringify({...S,zeit:Date.now()}))}catch(e){} }

// ---------- Rechnung ----------
function rechnen(){
  const roh=S.m10/10*S.b;
  const anschlag=haekeln()?Math.max(1,Math.round(roh)):Math.max(2,2*Math.round(roh/2));   // Stricken: gerade Zahl, passt auch für 1 rechts, 1 links
  const reihen=Math.max(1,Math.round(S.r10/10*S.h));
  let gramm=0,knaeuel=0;
  if(S.gew>0&&S.seite>0){
    const g=S.gew/(S.seite*S.seite)*S.b*S.h*1.1;   // 10 % Reserve
    gramm=Math.max(5,Math.ceil(g/5)*5); knaeuel=Math.ceil(gramm/50);
  }
  return {anschlag,reihen,gramm,knaeuel};
}

// ---------- Bilder ----------
const LINIE='stroke="currentColor" stroke-width="3" stroke-linejoin="round"';
const WOLLE='#F0A04B', WOLLE2='#D9792B', HAUT='#F3D9C4', BAND='#FFD84D';
function pfeil(x1,y1,x2,y2,beide=true){
  const a=Math.atan2(y2-y1,x2-x1),k=8,s=.5;
  const spitze=(x,y,w)=>`M${f(x+k*Math.cos(w+s))} ${f(y+k*Math.sin(w+s))}L${f(x)} ${f(y)}L${f(x+k*Math.cos(w-s))} ${f(y+k*Math.sin(w-s))}`;
  return `<path d="M${f(x1)} ${f(y1)}L${f(x2)} ${f(y2)}${spitze(x2,y2,a+Math.PI)}${beide?spitze(x1,y1,a):''}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
}
function messband(x,y,w,h){   // gerades Stück Messband mit Strichen
  let s='';for(let i=0,xx=x+6;xx<x+w-2;i++,xx+=6)s+=`M${xx} ${y}v${i%5?4:7}`;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${BAND}" ${LINIE} stroke-width="2.5"/><path d="${s}" stroke="#17212F" stroke-width="1.5"/>`;
}
const svg=(vb,inhalt,label,kl='bild')=>`<svg class="${kl}" viewBox="${vb}" role="img" aria-label="${label}" font-family="Nunito,system-ui,sans-serif">${inhalt}</svg>`;
const ball=(cx,cy,r)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${WOLLE}" ${LINIE}/><path d="M${cx-r*.85} ${cy-r*.3}q${r*.9} ${r*.45} ${r*1.7} -${r*.1}M${cx-r*.95} ${cy+r*.15}q${r} ${r*.45} ${r*1.9} -${r*.15}M${cx-r*.6} ${cy+r*.7}q${r*.7} ${r*.3} ${r*1.3} -${r*.2}M${cx-r*.25} ${cy-r*.95}q-${r*.3} ${r} ${r*.5} ${r*1.9}" fill="none" stroke="${WOLLE2}" stroke-width="2.5" stroke-linecap="round"/>`;
const stab=(d,farbe)=>`<path d="${d}" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${farbe}" stroke-width="4.5" stroke-linecap="round"/>`;
const ICON={
  haekeln:`<svg viewBox="0 0 100 100" aria-hidden="true">${ball(40,62,26)}${stab('M58 84L84 22q3-9-5-10','#9DB4D3')}</svg>`,
  stricken:`<svg viewBox="0 0 100 100" aria-hidden="true">${stab('M44 62L84 14','#9DB4D3')}${stab('M56 62L16 14','#9DB4D3')}<circle cx="86" cy="11" r="6" fill="${WOLLE2}" ${LINIE}/><circle cx="14" cy="11" r="6" fill="${WOLLE2}" ${LINIE}/>${ball(50,66,26)}</svg>`,
  kappe:`<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M20 68a30 32 0 0 1 60 0z" fill="${WOLLE}" ${LINIE}/><rect x="15" y="64" width="70" height="18" rx="6" fill="${WOLLE2}" ${LINIE}/><path d="M25 67v12M35 67v12M45 67v12M55 67v12M65 67v12M75 67v12" stroke="currentColor" stroke-width="2" opacity=".45"/><circle cx="50" cy="29" r="11" fill="#FBE3C8" ${LINIE}/></svg>`,

// Maschen: Gestricktes als V, Gehäkeltes als Stäbchen. 10 cm sind im Bild 180 Einheiten.
function gitter(){ const haek=haekeln(),F=180,n=haek?9:8,nr=haek?10:11; return {haek,F,n,nr,cw:F/n,rh:F/nr}; }
function maschen(sx,sy,sp,zr,an){
  const {haek,cw,rh}=gitter();

  for(let r=0;r<zr;r++)for(let c=0;c<sp;c++){

      ?`<path d="M${f(x+cw/2)} ${f(y+rh*.4)}V${f(y+rh*.92)}" stroke="${farbe}" stroke-width="${f(cw*.24)}" stroke-linecap="round"/><ellipse cx="${f(x+cw/2)}" cy="${f(y+rh*.22)}" rx="${f(cw*.36)}" ry="${f(rh*.14)}" fill="none" stroke="${farbe}" stroke-width="${f(cw*.14)}"/>`
      :`<path d="M${f(x+cw*.16)} ${f(y+rh*.14)}L${f(x+cw/2)} ${f(y+rh*.86)}L${f(x+cw*.84)} ${f(y+rh*.14)}" fill="none" stroke="${farbe}" stroke-width="${f(cw*.26)}" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  return s;
}

// ---------- Druckzettel ----------
// Ein Zettel in ein Feld von w × h mm (A4 ganz oder ein Viertel von A3 = A5). Das Zählfenster ist immer 100 × 100 mm.
function zettel(x0,y0,w,h,R,zahlen){
  const gross=w>180, fs=gross?4.4:3.6, zeile=gross?12:9.5, rand=gross?16:10, haek=haekeln();
  const l=x0+rand, r=x0+w-rand, breit=r-l;
  let s='',y=y0+rand+(gross?8:6);
  s+=`<text x="${l}" y="${y}" font-size="${gross?9:7}" font-family="Fredoka,Nunito,sans-serif" font-weight="600" fill="#1c2430">Maschenprobe</text>`;
  if(S.technik)s+=`<text x="${r}" y="${y}" text-anchor="end" font-size="${fs}" fill="#5b6573">${TECHNIK[S.technik]}</text>`;
  y+=zeile+2;
  const linie=(label,wert,yy,x1,x2)=>{
    const lw=label.length*fs*.55+2;
    let t=`<text x="${x1}" y="${yy}" font-size="${fs}" fill="#1c2430">${label}</text><line x1="${f(x1+lw)}" y1="${f(yy+1)}" x2="${x2}" y2="${f(yy+1)}" stroke="#1c2430" stroke-width=".3"/>`;
    if(wert)t+=`<text x="${f(x1+lw+2)}" y="${yy}" font-size="${fs}" fill="#17997A" font-weight="700">${esc(wert)}</text>`;
    return t;
  };
  s+=linie('Name:',S.name,y,l,r); y+=zeile;
  s+=linie('Wolle:','',y,l,l+breit*.48); s+=linie('Nadel:','',y,l+breit*.52,r); y+=zeile-2;
  // Fenster 100 × 100 mm, zentriert, mit cm-Strichen aussen
  const fx=x0+(w-100)/2, fy=y+4;
  let striche='';
  for(let i=0;i<=10;i++){const t=i%5===0?3:2;striche+=`M${fx+i*10} ${fy-t}V${fy}M${fx+i*10} ${fy+100}V${fy+100+t}M${fx-t} ${fy+i*10}H${fx}M${fx+100} ${fy+i*10}H${fx+100+t}`;}
  // Schnittlinie gestrichelt mit Schere, aussen die cm-Striche
  s+=`<rect x="${fx}" y="${fy}" width="100" height="100" fill="none" stroke="#1c2430" stroke-width=".5" stroke-dasharray="2.5 1.5"/><path d="${striche}" stroke="#1c2430" stroke-width=".35" fill="none"/>`;
  s+=`<text x="${fx+3}" y="${fy+(gross?7:6)}" font-size="${gross?7:6}" fill="#1c2430">✂</text>`;
  s+=`<text x="${fx+50}" y="${fy+52}" text-anchor="middle" font-size="${gross?7:5.5}" fill="#c8d0db" font-family="Fredoka,Nunito,sans-serif" font-weight="600">10 × 10 cm</text>`;
  s+=`<text x="${fx+50}" y="${fy+100+(gross?9:7.5)}" text-anchor="middle" font-size="${fs}" fill="#5b6573">← Maschen →</text>`;
  s+=`<text transform="translate(${f(fx-rand*.45)} ${fy+50}) rotate(-90)" text-anchor="middle" font-size="${fs}" fill="#5b6573">← Reihen →</text>`;
  y=fy+100+(gross?22:17);
  s+=linie('Maschen auf 10 cm:',zahlen?String(S.m10):'',y,l,l+breit*.48); s+=linie('Reihen auf 10 cm:',zahlen?String(S.r10):'',y,l+breit*.52,r); y+=zeile;
  s+=linie('Werk:',zahlen&&S.werk?`${WERKE[S.werk].name}, ${S.b} × ${S.h} cm`:'',y,l,r); y+=zeile;
  s+=linie('Anschlag:',zahlen?`${R.anschlag}${haek?' + 1':''} ${haek?'Luftmaschen':'Maschen'}`:'',y,l,l+breit*.48); s+=linie('Reihen:',zahlen?String(R.reihen):'',y,l+breit*.52,r); y+=zeile;
  s+=linie('Menge:',zahlen&&R.gramm?`ca. ${R.gramm} g = ${R.knaeuel} Knäuel`:'',y,l,r);
  return s;
}
function blatt(zahlen,papier){
  const P=PAPIERE[papier], R=rechnen();
  let s='';
  if(papier==='a4')s=zettel(0,0,P.w,P.h,R,zahlen);
  else{
    const w=P.w/2,h=P.h/2;
    for(let i=0;i<4;i++)s+=zettel((i%2)*w,Math.floor(i/2)*h,w,h,R,zahlen);
    s+=`<path d="M${w} 0V${P.h}M0 ${h}H${P.w}" stroke="#9aa5b4" stroke-width=".3" stroke-dasharray="3 2" fill="none"/>`;
    s+=`<text x="${w+2}" y="${h-2}" font-size="4" fill="#9aa5b4">✂</text>`;
  }
  return `<svg viewBox="0 0 ${P.w} ${P.h}" width="${P.w}" height="${P.h}" xmlns="http://www.w3.org/2000/svg" font-family="Nunito,system-ui,sans-serif">${s}</svg>`;
}
function drucken(zahlen,papier=S.papier){
  const P=PAPIERE[papier];
  $('druck').innerHTML=blatt(zahlen,papier);
  $('seite').textContent=`@page{size:${P.name} portrait;margin:0}`;
  $('druck').style.setProperty('--bw',P.w+'mm');$('druck').style.setProperty('--bh',P.h+'mm');
  window.print();
}

const zurueck=()=>`<button type="button" class="zurueck" data-act="zurueck">‹ Zurück</button>`;
const SCHRITT=[
  ()=>`<h2 tabindex="-1">Häkeln oder stricken?</h2><div class="kacheln paar">${Object.entries(TECHNIK).map(([k,n])=>`<button type="button" class="kachel" data-technik="${k}" aria-pressed="${k===S.technik}">${ICON[k]}<span>${n}</span></button>`).join('')}</div>`,
  ()=>`${zurueck()}<h2 tabindex="-1">Was ${haekeln()?'häkelst':'strickst'} du?</h2><div class="kacheln">${Object.entries(WERKE).map(([k,w])=>`<button type="button" class="kachel" data-werk="${k}" aria-pressed="${k===S.werk}">${ICON[k]}<span>${w.name}</span></button>`).join('')}</div>`,
  ()=>{ const m=MASSE[WERKE[S.werk].mass]; return `${zurueck()}<h2 tabindex="-1">${m.titel}</h2>${m.bild()}<div class="mass">${m.felder.map(([k,l,min,max,st])=>stepper('mass.'+k,S.mass[k],min,max,st,'cm',l)).join('')}</div>${weiter('weiter')}`; },
  ()=>`${zurueck()}<h2 tabindex="-1">Probestück</h2>${probeBild()}<div class="gleich" role="img" aria-label="Gleiche Wolle und Nadel wie für das Werk">${ICON[S.technik]}<span aria-hidden="true">=</span>${ICON[S.werk]}</div>${weiter('weiter')}<button type="button" class="weiter zweit" data-act="zettel">🖨 Zählfenster</button><p class="lp"><button type="button" class="link" data-act="zettel-a3" aria-label="Zählfenster: 4 Stück auf A3">🖨 A3 · 4 ×</button></p>`,
  ()=>`${zurueck()}<h2 tabindex="-1">Maschen zählen</h2>${fensterBild('m')}<div class="mass">${stepper('m10',S.m10,0,80,1,'','Maschen')}</div><p class="warn" id="warn" role="img" aria-label="Nur im Fenster zählen"${S.m10===25?'':' hidden'}>⚠ ${warnBild()}</p>${weiter('weiter','Weiter',S.m10<3)}<p class="lp"><button type="button" class="link" data-act="zettel">🖨 Zählfenster</button></p>`,
  ()=>`${zurueck()}<h2 tabindex="-1">Reihen zählen</h2>${fensterBild('r')}<div class="mass">${stepper('r10',S.r10,0,120,1,'','Reihen')}</div>${weiter('weiter','Zum Plan',S.r10<3)}`,
  ()=>{ const [lb,lh]=achsen(); return `${zurueck()}<h2 tabindex="-1">Dein Plan</h2><div class="plan-kopf"><ol class="plan" id="plan"></ol><div class="werkbild" id="werkbild"></div></div>
    <div class="extras"><button type="button" class="mehr" data-act="groesse" aria-expanded="${offen.groesse}" aria-controls="groesse">↔ Grösse</button>${KLEIN?'':`<button type="button" class="mehr" data-act="garn" aria-expanded="${offen.garn}" aria-controls="garn">⚖️ Wolle</button>`}</div>
    <div class="ausklapp" id="groesse"${offen.groesse?'':' hidden'}><div class="mass">${stepper('b',S.b,2,200,1,'cm',lb)}${stepper('h',S.h,2,300,1,'cm',lh)}</div></div>
    ${KLEIN?'':`<div class="ausklapp" id="garn"${offen.garn?'':' hidden'}><div class="mass">${stepper('seite',S.seite,0,30,1,'cm','Probestück, Seite',planIcon('probe'))}${stepper('gew',S.gew,0,100,1,'g','Probestück, Gewicht','<span class="emo">⚖️</span>')}</div><p class="garn-erg" id="garn-erg"></p></div>`}
    <div class="druckzeile"><input class="text" id="name" maxlength="30" autocomplete="off" placeholder="Dein Name" aria-label="Dein Name (kommt auf den Zettel)" value="${esc(S.name)}"><button type="button" class="weiter" data-act="plan-druck">🖨 Drucken</button></div>
    <button type="button" class="link neu" data-act="neu">↺ Neu</button>`; }
];
function planAktualisieren(){
  const R=rechnen(), haek=haekeln(), fertig=WERKE[S.werk].fertig;
  const li=[`${planIcon('anschlag')}<span><b>${R.anschlag}</b> ${haek?'Luftmaschen':'Maschen'}${haek?' <span class="plus" aria-label="plus 1 zum Wenden">+1</span>':''}</span>`,
    `${planIcon('reihen')}<span><b>${R.reihen}</b> Reihen</span><span class="cm">📏 ${S.h} cm</span>`];
  if(fertig)li.push(`<span class="fertig-bild" role="img" aria-label="${fertig}"><span aria-hidden="true">🪡</span><span aria-hidden="true">→</span>${ICON[S.werk]}</span>`);   // fertig zeigt das Bild, der Satz nur fürs Vorlesen
  $('plan').innerHTML=li.map((t,i)=>`<li><span class="nr">${i+1}</span>${t}</li>`).join('');
  $('werkbild').innerHTML=werkBild(R);
  const g=$('garn-erg'); if(g)g.innerHTML=R.gramm?`≈ <b>${R.gramm} g</b> = <b>${R.knaeuel}</b> × 🧶 50 g`:'';
}
// Der Weg oben: Probe umfasst die Schritte 3 bis 5
function pillen(){
  const P=[[0,'Technik',S.technik&&TECHNIK[S.technik]],[1,'Werk',S.werk&&WERKE[S.werk].name],[2,'Messen',S.werk&&massText()],[3,'Probe',`${S.m10} M · ${S.r10} R`],[6,'Plan','']];
  return P.map(([i,name,wahl])=>{
    const probe=i===3, jetzt=probe?S.schritt>=3&&S.schritt<=5:S.schritt===i, fertig=!jetzt&&S.weit>(probe?5:i);
    return `<button type="button" data-gehe="${i}"${jetzt?' aria-current="step"':''}${i>S.weit?' disabled':''}${fertig?' class="fertig"':''}>${esc(fertig&&wahl?wahl:name)}</button>`;
  }).join('');
}
function zeigen(fokus=true){
  $('weg').innerHTML=pillen();
  $('main').innerHTML=SCHRITT[S.schritt]();
  if(S.schritt===6)planAktualisieren();
  if(fokus){ window.scrollTo(0,0); $('main').querySelector('h2')?.focus({preventScroll:true}); }
  speichern();
}
function gehe(i){ S.schritt=i; S.weit=Math.max(S.weit,i); zeigen(); }
function technikWaehlen(k){
  if(S.technik!==k){ S.technik=k; S.m10=0; S.r10=0; S.seite=0; S.gew=0; S.weit=1; masseSetzen(); }   // andere Technik, andere Maschenprobe
  S.schritt=1; S.weit=Math.max(S.weit,1);
}
function werkWaehlen(k){
  if(S.werk!==k){ S.werk=k; S.weit=2; }
  masseSetzen(); offen.groesse=false; S.schritt=2;
}

// ---------- Bedienung ----------
function feldLesen(feld){ return feld.startsWith('mass.')?S.mass[feld.slice(5)]:S[feld]; }
function feldSchreiben(feld,v){ if(feld.startsWith('mass.'))S.mass[feld.slice(5)]=v; else S[feld]=v; }
function geaendert(feld){
  if(feld.startsWith('mass.'))masseSetzen();
  if(feld==='m10'||feld==='r10'){ const b=document.querySelector('[data-act="weiter"]'); if(b)b.disabled=S[feld]<3; }
  if(feld==='m10'&&$('warn'))$('warn').hidden=S.m10!==25;   // 25 Maschen hat das ganze Probestück
  if(S.schritt===6)planAktualisieren();
  $('weg').innerHTML=pillen();
  speichern();
}
function setzen(st,v){
  v=clamp(v,Number(st.dataset.min),Number(st.dataset.max));
  feldSchreiben(st.dataset.feld,v); st.querySelector('input').value=v; geaendert(st.dataset.feld);
}
$('weg').addEventListener('click',e=>{
  const b=e.target.closest('[data-gehe]'); if(!b||b.disabled)return;
  const i=Number(b.dataset.gehe); S.schritt=i===3&&S.weit>=4?4:i; zeigen();   // Probe: gleich zum Zählen, wenn das Probestück schon da ist
});
$('main').addEventListener('click',e=>{
  const pm=e.target.closest('[data-minus],[data-plus]');
  if(pm){ const st=pm.closest('.stepper'); setzen(st,(Number(st.querySelector('input').value)||0)+Number(st.dataset.schritt)*(pm.hasAttribute('data-plus')?1:-1)); return; }
  const t=e.target.closest('[data-technik]'); if(t){ technikWaehlen(t.dataset.technik); zeigen(); return; }
  const w=e.target.closest('[data-werk]'); if(w){ werkWaehlen(w.dataset.werk); S.weit=Math.max(S.weit,2); zeigen(); return; }
  const a=e.target.closest('[data-act]'); if(!a)return;
  switch(a.dataset.act){
    case 'weiter': if(!a.disabled)gehe(S.schritt+1); break;
    case 'zurueck': S.schritt=Math.max(0,S.schritt-1); zeigen(); break;
    case 'zettel': drucken(false); break;
    case 'zettel-a3': drucken(false,'a3'); break;
    case 'plan-druck': drucken(true,'a4'); break;
    case 'groesse': case 'garn': {
      const k=a.dataset.act; offen[k]=!offen[k]; a.setAttribute('aria-expanded',offen[k]); $(k).hidden=!offen[k];
      if(k==='garn'&&offen.garn&&!S.seite){ S.seite=clamp(250/S.m10,5,30); $('f-seite').value=S.seite; geaendert('seite'); }   // 25 Maschen breit, als Quadrat
      break; }
    case 'neu': { const name=kindName()||S.name; Object.assign(S,JSON.parse(JSON.stringify(START)),{name,papier:S.papier}); offen.groesse=offen.garn=false; zeigen(); break; }
  }
});
$('main').addEventListener('input',e=>{
  if(e.target.id==='name'){ S.name=e.target.value.slice(0,30); speichern(); return; }
  const st=e.target.closest('.stepper'); if(!st||e.target.value==='')return;
  const v=Number(e.target.value);   // beim Tippen nur übernehmen, was schon passt; den Rest richtet «change»
  if(v>=Number(st.dataset.min)&&v<=Number(st.dataset.max)&&v!==feldLesen(st.dataset.feld)){ feldSchreiben(st.dataset.feld,Math.round(v)); geaendert(st.dataset.feld); }
});
$('main').addEventListener('change',e=>{ const st=e.target.closest('.stepper'); if(st)setzen(st,e.target.value); });

laden();zeigen(false);
</script>
</body>
</html>
