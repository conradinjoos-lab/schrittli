<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schritt für Schritt · Vorlagen</title>
<meta name="description" content="Form wählen, Grösse in cm eingeben, drucken: Schablonen in echter Grösse für den TTG-Unterricht.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap">
<link rel="stylesheet" href="planer.css">
<style>
:root{--bg:#EEF3F8;--surface:#FFFFFF;--surface2:#F5F8FB;--ink:#17212F;--muted:#5B6B80;--line:#D5DEE9;--acc:#17997A;--acc-ink:#FFFFFF;--acc-soft:#E3F4EF;--bad:#D64545;--papier:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1621;--surface:#1A2433;--surface2:#141C28;--ink:#EDF2F8;--muted:#9DACBF;--line:#2B384A;--acc:#2FBF98;--acc-ink:#0F1621;--acc-soft:#16302B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1621;--surface:#1A2433;--surface2:#141C28;--ink:#EDF2F8;--muted:#9DACBF;--line:#2B384A;--acc:#2FBF98;--acc-ink:#0F1621;--acc-soft:#16302B;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.4 Nunito,system-ui,sans-serif}
h1,h2{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0}
h2{font-size:17px;margin-bottom:10px}
main{max-width:1200px;margin:0 auto;padding:8px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:20px;align-items:start}
.karte{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.suchkopf{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.suchkopf h2{margin:0}
.suchkopf input{flex:1;max-width:280px;font:inherit;font-size:16px;color:var(--ink);background:var(--surface2);border:2px solid var(--line);border-radius:12px;padding:7px 12px;min-width:0}
.gruppe{margin:4px 0 14px}
.wortfeld{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.wortfeld input{flex:1;min-width:120px;max-width:280px;font:inherit;font-size:16px;color:var(--ink);background:var(--surface2);border:2px solid var(--line);border-radius:12px;padding:7px 12px;text-transform:uppercase}
.wunsch{margin:14px 0 0;border-top:1px solid var(--line);padding-top:10px}
.wunsch summary{cursor:pointer;font-weight:700;font-size:15px;color:var(--muted)}
.wunsch[open] summary{color:var(--ink)}
.wunsch form{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.wunsch input{flex:1 1 160px;max-width:320px;font:inherit;font-size:16px;color:var(--ink);background:var(--surface2);border:2px solid var(--line);border-radius:12px;padding:7px 12px;min-width:0}
.wunsch p{flex-basis:100%;margin:2px 0 0}
.gruppe h3{font:700 13px Nunito,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px}
.kats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px 10px;border:2px solid var(--line);border-radius:16px;background:var(--surface2);color:var(--ink);font:inherit;cursor:pointer}
.kat:hover{border-color:var(--acc);background:var(--acc-soft)}
.k-bilder{display:grid;grid-template-columns:repeat(2,44px);gap:4px}
.k-bilder svg,.k-bilder img{width:44px;height:44px}
.kats-titel{grid-column:1/-1;font:700 13px Nunito,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 0}
.kat b{font:600 17px Fredoka,Nunito,sans-serif}
.k-n{font-size:13px;color:var(--muted)}
.zurueck{margin:0 0 12px;font-size:14px;padding:6px 12px}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.form{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 6px;border:2px solid var(--line);border-radius:14px;background:var(--surface2);color:var(--ink);font:inherit;font-size:13px;cursor:pointer;min-height:92px}
.form svg,.form img{width:52px;height:52px;object-fit:contain}
.form.laedt{opacity:.55;cursor:progress}
.form svg path,.kat svg path{fill:var(--acc-soft);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.form[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.form[aria-pressed="true"] svg path{fill:var(--surface)}
.form:hover{border-color:var(--acc)}
.form:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.seite-rechts{display:flex;flex-direction:column;gap:14px;align-self:stretch}
/* Die Vorschau klebt oben, die Einstellungen laufen darunter durch: das Blatt bleibt beim Einstellen im Blick */
.karte-vorschau{position:sticky;top:calc(var(--kopf-h) + 12px);z-index:3;box-shadow:0 -12px 0 6px var(--bg),0 8px 22px rgba(0,0,0,.14)}
.v-kopf{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;background:var(--surface2);padding:2px;gap:2px}
.seg button{display:inline-flex;align-items:center;gap:5px;min-height:34px;min-width:38px;justify-content:center;padding:3px 10px;border:0;border-radius:9px;background:none;color:var(--muted);font:700 14px Nunito,sans-serif;cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.seg svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.v-rechts{margin-left:auto;display:flex;align-items:center;gap:6px}
.feld{margin-bottom:14px}
.feld>label,.feld>.lbl{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.masse{display:flex;align-items:center;gap:8px}
.masse input{width:100%}
input[type=text],input[type=number]{font:inherit;font-size:20px;color:var(--ink);background:var(--surface2);border:2px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.einheit{color:var(--muted);font-size:15px}
.schloss{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.schloss[aria-pressed="true"]{border-color:var(--acc);color:var(--acc)}
.schloss svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.regler-gr{display:flex;align-items:center;gap:8px;margin-top:10px}
.regler-gr input{flex:1;min-height:44px}
.regler-gr svg{flex:none;width:22px;height:22px;fill:none;stroke:var(--muted);stroke-width:2.2}
.chip{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--acc)}
.chip[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.zeile{display:flex;gap:8px;align-items:center}
.zeile input[type=number]{width:96px}
.knopf{font:inherit;font-size:15px;padding:9px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer}
.knopf:hover{border-color:var(--acc)}
.wahl{display:flex;flex-wrap:wrap;gap:6px}
.mm{display:flex;align-items:center;gap:6px;margin:8px 0 0;font-size:14px;color:var(--muted)}
.mm input{width:70px;font-size:16px;padding:5px 8px}
.mm input[type=range]{flex:1;width:auto;min-width:110px;max-width:220px;padding:0}
.mm-r{margin:0}
.mm b{min-width:3.4em;color:var(--ink);font-size:13px}
/* Schalter: Häkchenfeld als Pille mit Symbol */
.schalter{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:5px 12px;border:2px solid var(--line);border-radius:999px;background:var(--surface2);font-size:14px;cursor:pointer;user-select:none}
.schalter:hover{border-color:var(--acc)}
.schalter input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.schalter:has(input:checked){border-color:var(--acc);background:var(--acc-soft);color:var(--ink)}
.schalter:has(input:checked) svg{color:var(--acc)}
.schalter:has(input:focus-visible){outline:3px solid var(--acc);outline-offset:2px}
.schalter:has(input:disabled){opacity:.45;cursor:not-allowed}
.schalter svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.schalter svg .f{fill:currentColor;fill-opacity:.14}
.schalter svg .p{fill:currentColor;stroke:none}
.linien{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.linien .schalter{flex-direction:column;justify-content:center;gap:2px;border-radius:14px;padding:8px 4px 6px;font-size:13px}
.linien .schalter svg{width:34px;height:34px;stroke-width:1.6}
.mit-punkten{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
input[type=range]{width:100%;accent-color:var(--acc)}
.drucken{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--acc);color:var(--acc-ink);font:600 20px Fredoka,Nunito,sans-serif;cursor:pointer}
.drucken svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round}
.nm{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.nm small{font-size:12px;color:var(--muted)}
.netz-masse{align-items:flex-start}
.netz-masse .einheit{line-height:48px}
.deckel{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:6px 12px}
.deckel svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.drucken:disabled{opacity:.45;cursor:not-allowed}
.dazu{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-bottom:12px;border-style:dashed;color:var(--acc);font-weight:800}
.dazu:hover{background:var(--acc-soft)}
.liste{margin:0 0 14px;padding:10px;border:2px solid var(--acc);border-radius:14px;background:var(--surface2)}
.l-kopf{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.l-kopf b{font-size:15px}
.l-leeren{font:inherit;font-size:13px;color:var(--muted);background:none;border:0;padding:4px 2px;cursor:pointer;text-decoration:underline}
.l-leeren:hover{color:var(--bad)}
.liste ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.liste li{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 6px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.liste li.neu{animation:neu 1.2s ease-out}
@keyframes neu{from{background:var(--acc-soft);border-color:var(--acc)}}
.liste li svg{flex:none;width:34px;height:34px}
.liste li svg path{fill:var(--acc-soft);stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.l-text{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.l-text b{font-size:14px;overflow-wrap:anywhere}
.l-text small{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.liste li input[type=number]{flex:none;width:62px;font-size:16px;padding:4px 6px;border-radius:10px}
.l-mal{color:var(--muted);font-size:13px}
.l-weg{flex:none;width:36px;height:36px;border-radius:10px;border:2px solid transparent;background:none;color:var(--muted);font:700 22px/1 Nunito,sans-serif;cursor:pointer}
.l-weg:hover{color:var(--bad);border-color:var(--line)}
.liste li{flex-wrap:wrap}
.liste li.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.l-text{cursor:pointer}
.l-knopf{flex:none;width:32px;height:32px;border-radius:10px;border:2px solid transparent;background:none;color:var(--muted);font:700 18px/1 Nunito,sans-serif;cursor:pointer}
.l-knopf:hover{color:var(--acc);border-color:var(--line)}
.l-knopf[aria-pressed="true"]{color:var(--acc);background:var(--acc-soft)}
.l-mass{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:0 0 2px 42px;font-size:13px;color:var(--muted)}
.l-mass input[type=text]{width:56px;font-size:15px;padding:3px 6px;border-radius:8px;text-align:center}
.l-mass select{font:inherit;font-size:13px;padding:3px 4px;margin-left:auto;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
/* Formen am Blatt anfassen: Rahmen fängt den Zeiger, die ausgewählte Form hat Griff und Werkzeugleiste */
.vorschau.freimodus svg{touch-action:none}
.vorschau .frei{cursor:grab}
.vorschau .stk{cursor:pointer}
.vorschau .rahmen{fill:none;stroke:transparent;stroke-width:1.5px;vector-effect:non-scaling-stroke;pointer-events:all}
.vorschau .frei:hover .rahmen,.vorschau .stk:hover .rahmen{stroke:var(--acc);stroke-dasharray:5 4;opacity:.7}
.vorschau .frei.sel .rahmen{stroke:var(--acc);stroke-dasharray:none;stroke-width:2px;opacity:1}
.vorschau .frei.ueber .rahmen{stroke:var(--bad);stroke-dasharray:5 4;opacity:1}
.vorschau .frei.aktiv{cursor:grabbing}
.vorschau .griff{fill:#fff;stroke:var(--acc);stroke-width:2.5px;vector-effect:non-scaling-stroke;cursor:nwse-resize;pointer-events:all}
.vorschau .hilfe-l{stroke:#E8554E;stroke-width:1px;vector-effect:non-scaling-stroke;stroke-dasharray:4 3;pointer-events:none}
.werkzeug{position:absolute;z-index:4;display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.22)}
.werkzeug button{width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:9px;background:none;color:var(--ink);cursor:pointer;padding:0}
.werkzeug button:hover{background:var(--acc-soft);color:var(--acc)}
.werkzeug button[data-w=weg]:hover{background:none;color:var(--bad)}
.werkzeug svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.werkzeug{transition:opacity .12s}
.werkzeug.weg{opacity:0;pointer-events:none;visibility:hidden}
@media (max-width:480px){.liste{padding:8px}.liste li{gap:6px}.l-mal{display:none}.liste li input[type=number]{width:54px}}
.info{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:14px;margin:10px 0 0}
.info:empty{display:none}
#gross-wahl{margin:0 0 10px}
.pille{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--ink)}
.pille.warn{color:var(--bad);border-color:currentColor;background:transparent}
button.pille{font:inherit;cursor:pointer;border-width:2px;border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
button.pille:hover{background:var(--acc);color:var(--acc-ink)}
.farben{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;margin:10px 0 0;color:var(--muted)}
.farben span{display:inline-flex;align-items:center;gap:6px}
.farben i{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.25);flex:none}
.farben b{font-weight:700;color:var(--ink);margin-right:2px}
.hinweis{font-size:13px;color:var(--muted);margin:8px 0 0}
.warn{color:var(--bad)}
.vorschau{--hmax:44vh;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start}
.vorschau svg{display:block;flex:none;width:min(100%,calc(var(--hmax)*.7071));height:auto;aspect-ratio:210/297;background:var(--papier);border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.vorschau:has(svg+svg) svg{width:min(calc(50% - 6px),calc(var(--hmax)*.7071))}
.vorschau.quer svg{aspect-ratio:297/210;width:min(100%,calc(var(--hmax)*1.4142))}
.vorschau.quer:has(svg+svg) svg{width:min(calc(50% - 6px),calc(var(--hmax)*1.4142))}
/* Ausrichtung wechseln: das Blatt dreht sich sichtbar mit */
.vorschau.kipp svg{animation:kippen .42s cubic-bezier(.2,.8,.3,1)}
@keyframes kippen{from{transform:rotate(var(--kipp,90deg)) scale(.72);opacity:.5}}
@media (prefers-reduced-motion:reduce){.vorschau.kipp svg{animation:none}}
.mehr{flex-basis:100%;margin:0;font-size:15px;font-weight:800;color:var(--muted);text-align:center}
/* Breiter Bildschirm: drei Spalten, das Blatt ganz rechts in voller Höhe */
@media (min-width:1180px){
  main{max-width:1500px;grid-template-columns:minmax(0,1fr) 340px minmax(320px,410px)}
  .seite-rechts{display:contents}
  .karte-einst{grid-column:2;grid-row:1}
  .karte-vorschau{grid-column:3;grid-row:1;align-self:start;max-height:calc(100vh - var(--kopf-h) - 24px);overflow-y:auto;box-shadow:none}
  .vorschau{--hmax:calc(100vh - var(--kopf-h) - 110px)}
  .vorschau:has(svg+svg) svg{width:min(100%,calc(var(--hmax)*.7071))}
  .vorschau.quer:has(svg+svg) svg{width:min(100%,calc(var(--hmax)*1.4142))}
}
@media (max-width:860px){main{grid-template-columns:minmax(0,1fr)}.karte-vorschau{top:var(--kopf-h);padding:10px 12px;border-radius:0 0 18px 18px}.v-kopf{margin-bottom:8px}.vorschau{--hmax:26vh}.info{margin-top:6px;font-size:13px}}
@media (max-width:480px){.kats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.k-bilder{grid-template-columns:repeat(2,36px)}.k-bilder svg,.k-bilder img{width:36px;height:36px}.raster{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}.form{min-height:80px;font-size:12px}.form svg,.form img{width:40px;height:40px}}
/* Abpausen am Bildschirm: immer hell, damit die Linie durchs Papier scheint */
.pausen-auf{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;min-height:48px}
.pausen-auf svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
#pausen{position:fixed;inset:0;z-index:50;background:#fff;color:#17212F;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
.p-flaeche{position:absolute;inset:0;display:grid;place-items:center}
.p-flaeche svg{display:block}
.p-flaeche .warn{max-width:420px;padding:16px;text-align:center}
.p-leiste{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;background:rgba(238,243,248,.94);border-bottom:1px solid #D5DEE9}
.p-titel{flex:1;font-weight:800;min-width:8em}
#pausen .knopf{background:#fff;color:#17212F;border-color:#D5DEE9}
#pausen .knopf.p-sperren{background:#17997A;color:#fff;border-color:#17997A}
#pausen .knopf:disabled{opacity:.45}
.p-hilfe{position:absolute;left:12px;bottom:12px;margin:0;padding:6px 14px;border-radius:999px;font-size:16px;font-weight:800;color:#17212F;background:#FFF3C4}
.p-eichung{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;text-align:center}
.p-karte{border:2px solid #17212F;background:#F5F8FB}
.p-regler{display:flex;align-items:center;gap:10px;width:min(460px,100%)}
.p-regler .knopf{width:48px;font-size:22px;padding:4px 0}
.p-eichung .drucken{max-width:260px}
.p-schloss{position:absolute;right:12px;bottom:12px;width:56px;height:56px;border-radius:50%;border:2px solid #D5DEE9;background:#fff;color:#9DACBF;display:grid;place-items:center;padding:0;cursor:pointer;touch-action:none}
.p-schloss svg{grid-area:1/1;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.p-schloss svg.ring{width:56px;height:56px;transform:rotate(-90deg);stroke:#17997A;stroke-width:4;stroke-dasharray:163.4;stroke-dashoffset:163.4}
.p-schloss.halten svg.ring{stroke-dashoffset:0;transition:stroke-dashoffset 3s linear}
.p-tipp{position:absolute;right:76px;bottom:26px;margin:0;font-size:15px;font-weight:800;color:#5B6B80;background:#fff}
#druck{display:none}
@page{size:A4 portrait;margin:0}
@media print{
  body{background:#fff}
  .kopf,main{display:none!important}
  #druck{display:block}

<script src="https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/clipper.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
// Papier: A4 oder A3, hoch oder quer. BLATT und NUTZ (nutzbare Fläche) stellt papierSetzen() um.
const PAPIERE={a4:{name:'A4',w:210,h:297},a3:{name:'A3',w:297,h:420}};
const BLATT={name:'A4',w:210,h:297,rand:10,oben:24,unten:24,abstand:3};   // mm
const NUTZ={x:BLATT.rand,y:BLATT.oben,w:BLATT.w-2*BLATT.rand,h:BLATT.h-BLATT.oben-BLATT.unten};
const nutzFarb=ja=>{NUTZ.h=BLATT.h-BLATT.oben-BLATT.unten-(ja?7:0)};   // die Farbzeile «Farben zum Malen» braucht unten Platz
function papierSetzen(id,quer){
  const p=Planer.seite({papier:id,quer}),w=quer?p.h:p.w,h=quer?p.w:p.h;
  BLATT.name=p.name;BLATT.w=w;BLATT.h=h;NUTZ.w=w-2*BLATT.rand;NUTZ.h=h-BLATT.oben-BLATT.unten;
  $('vorschau').classList.toggle('quer',!!quer);
}
// Passt ein Stück (Masse in mm) wenigstens auf A3? Dann gibt es bei «zu gross» die direkte Wahl.
const passtA3=st=>{const a=PAPIERE.a3,w=a.w-2*BLATT.rand,h=a.h-BLATT.oben-BLATT.unten;return (st.w<=w&&st.h<=h)||(st.h<=w&&st.w<=h)};
const grossWahl=(an,a3)=>Planer.zuGross('#gross-wahl',an?{wahl:a3&&BLATT.name==='A4'?['a3']:[],tue(){Planer.merke();S.papier='a3';papierSetzen('a3',S.quer);felder();zeichnen()}}:null);
const CHIPS=[2,3,4,5,6,8,10,12,15];
const PARAM={stern:{label:'Zacken',def:5},vieleck:{label:'Ecken',def:6}};
const MAXSEITEN=30;
// Netze nach Mass: Schachteln aus Breite, Tiefe und Höhe (cm). Klebelaschen und Falzlinien kommen automatisch dazu.
// Diese Umrisse werden hier gerechnet (in mm, Union mit Clipper), nicht in formen.js. In der Adresse als m=8x5x4.
const NETZE={'netz-quader':{name:'Quader nach Mass',def:{b:8,t:5,h:4}},'netz-schachtel':{name:'Schachtel offen nach Mass',def:{b:8,t:6,h:4}}};
const netzMasse=o=>{const v=k=>Math.max(1,Math.min(40,Math.round(zahl(o&&o[k],NETZE['netz-quader'].def[k])*10)/10));return {b:v('b'),t:v('t'),h:v('h')}};
const CLIP=typeof ClipperLib!=='undefined';   // Rechenbibliothek vom CDN; ohne sie gibt es nur die Schnittlinie
function vereinigen(polys){
  if(!CLIP)return polys;
  const c=new ClipperLib.Clipper(),sol=new ClipperLib.Paths();
  const pfade=polys.map(r=>r.map(([x,y])=>({X:Math.round(x*100),Y:Math.round(y*100)})));
  pfade.forEach(r=>{if(!ClipperLib.Clipper.Orientation(r))r.reverse()});
  c.AddPaths(pfade,ClipperLib.PolyType.ptSubject,true);
  c.Execute(ClipperLib.ClipType.ctUnion,sol,ClipperLib.PolyFillType.pftNonZero,ClipperLib.PolyFillType.pftNonZero);
  return sol.map(r=>r.map(o=>[o.X/100,o.Y/100]));
}
function netzForm(id,m){
  const B=m.b*10,T=m.t*10,H=m.h*10,LW=Math.max(5,Math.min(15,Math.min(B,T,H)*.3));   // Laschenbreite in mm
  const re=(x0,y0,x1,y1)=>[[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
  // Lasche an der Kante p→q, nach aussen in Richtung (nx,ny), Ecken schräg; ein halber mm Überlappung mit der Fläche
  const la=(p,q,nx,ny)=>{const dx=q[0]-p[0],dy=q[1]-p[1],l=Math.hypot(dx,dy),ex=dx/l,ey=dy/l,d=Math.min(LW,l*.3);
    return [[p[0]-nx*.5,p[1]-ny*.5],[q[0]-nx*.5,q[1]-ny*.5],[q[0]-ex*d+nx*LW,q[1]-ey*d+ny*LW],[p[0]+ex*d+nx*LW,p[1]+ey*d+ny*LW]]};
  let teile,det;
  if(id==='netz-quader'){
    // Streifen von oben: Deckel, Rückwand, Boden, Vorderwand; Seitenwände links und rechts der Rückwand
    const y1=T,y2=T+H,y3=2*T+H,y4=2*T+2*H;
    teile=[re(0,0,B,y4),re(-T,y1,0,y2),re(B,y1,B+T,y2),
      la([0,0],[B,0],0,-1),la([0,0],[0,y1],-1,0),la([B,0],[B,y1],1,0),
      la([0,y2],[0,y3],-1,0),la([B,y2],[B,y3],1,0),la([0,y3],[0,y4],-1,0),la([B,y3],[B,y4],1,0)];
    det=[[[0,0],[B,0]],[[0,y1],[B,y1]],[[0,y2],[B,y2]],[[0,y3],[B,y3]],[[0,0],[0,y4]],[[B,0],[B,y4]]];
  }else{
    // Boden in der Mitte, vier Wände rundum, Laschen an Vorder- und Rückwand
    teile=[re(0,-H,B,T+H),re(-H,0,0,T),re(B,0,B+H,T),
      la([0,-H],[0,0],-1,0),la([B,-H],[B,0],1,0),la([0,T],[0,T+H],-1,0),la([B,T],[B,T+H],1,0)];
    det=[[[0,-H],[0,T+H]],[[B,-H],[B,T+H]],[[0,0],[B,0]],[[0,T],[B,T]]];
  }
  const d=vereinigen(teile);
  let ax=1e9,ay=1e9,bx=-1e9,by=-1e9;
  d.forEach(r=>r.forEach(([x,y])=>{ax=Math.min(ax,x);ay=Math.min(ay,y);bx=Math.max(bx,x);by=Math.max(by,y)}));
  const wmm=bx-ax,hmm=by-ay,sk=100/Math.max(wmm,hmm),tr=r=>r.map(([x,y])=>[(x-ax)*sk,(y-ay)*sk]);
  return {id,name:NETZE[id].name,gruppe:'Werkhilfen',w:wmm*sk,h:hmm*sk,d:d.map(tr),det:det.map(tr),eng:LW*sk,schwer:1,cm:Math.max(wmm,hmm)/10,mm:{w:wmm,h:hmm}};
}
const NETZFORMEN=CLIP?Object.keys(NETZE).map(id=>netzForm(id,NETZE[id].def)):[];
// Figuren: figuren/index.js kennt nur Name, Welt und Masse; die Umrisse liegen pro Welt in figuren/<welt>.js
// und werden erst geladen, wenn eine Figur gebraucht wird (alle zusammen wären mehrere MB).
const FIGUREN=(window.FIGUREN_INDEX||[]).map(f=>Object.assign({figur:true},f));
const FORMEN=(window.FORMEN||[]).concat(NETZFORMEN,FIGUREN);
const byId=Object.fromEntries(FORMEN.map(f=>[f.id,f]));
window.FIGUREN_DAZU=(welt,fs)=>fs.forEach(f=>{const z=byId[f.id];if(z&&z.figur)Object.assign(z,f,{gruppe:z.gruppe})});
const geladen={},originaleGeladen={};
function bereit(ids){
  const dateien=[...new Set(ids.map(id=>byId[id]).filter(f=>f&&f.figur&&!f.d).map(f=>f.datei))];
  return Promise.all(dateien.map(d=>geladen[d]||(geladen[d]=new Promise((ok,nein)=>{
    const t=document.createElement('script');t.src='figuren/'+encodeURIComponent(d)+'?v=2';
    t.onload=ok;t.onerror=()=>{delete geladen[d];t.remove();nein(new Error(d))};document.head.appendChild(t);
  })))).then(()=>Promise.all(ids.map(id=>byId[id]).filter(f=>f&&f.original).map(f=>
    originaleGeladen[f.id]||(originaleGeladen[f.id]=new Promise((ok,nein)=>{
      const im=new Image();im.onload=ok;im.onerror=()=>{delete originaleGeladen[f.id];nein(new Error(f.id))};
      im.src='figuren/originale/'+encodeURIComponent(f.original.datei)+'?v=2';
    }))
  )));
}

// Stern und Vieleck mit einstellbarer Zahl
function normal(rings){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  rings.forEach(r=>r.forEach(([x,y])=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}));
  const s=100/Math.max(x1-x0,y1-y0);
  return {w:(x1-x0)*s,h:(y1-y0)*s,d:rings.map(r=>r.map(([x,y])=>[(x-x0)*s,(y-y0)*s]))};
}
function paramForm(id,n){
  const pts=[];
  if(id==='stern'){
    const ri=Math.min(.55,.25+n*.03);
    for(let k=0;k<2*n;k++){const a=-Math.PI/2+Math.PI*k/n,r=k%2?ri:1;pts.push([r*Math.cos(a),r*Math.sin(a)])}
  }else{
    const a0=n%2?-Math.PI/2:-Math.PI/2+Math.PI/n;   // gerade Ecken: Kante unten flach
    for(let k=0;k<n;k++){const a=a0+2*Math.PI*k/n;pts.push([Math.cos(a),Math.sin(a)])}
  }
  return Object.assign({},byId[id],normal([pts]),{det:[]});
}

// Zustand: aus der Adresse, sonst vom letzten Mal
// punkte: Einstichpunkte an, pabst: ihr Abstand in mm, strich: gestrichelte Nählinie zu den Punkten dazu zeigen, frei: Liste von Hand anordnen
const S={id:'herz',b:5,h:5,papier:'a4',lock:true,n:1,linie:'schnitt',naht:5,zugabe:7,det:true,spiegel:false,param:5,farbig:true,punkte:false,pabst:5,strich:false,frei:false,netz:{b:8,t:5,h:4},quer:false};
const spS=Planer.speicher('schrittli-vorlagen'),spL=Planer.speicher('schrittli-vorlagen-liste');
{const alt=spS.lies();if(alt&&typeof alt==='object')Object.assign(S,alt)}
const q=new URLSearchParams(location.search);
if(q.has('form')&&byId[q.get('form')]){
  S.id=q.get('form');S.lock=!(q.has('b')&&q.has('h'));S.n=1;S.papier='a4';S.linie='schnitt';S.spiegel=false;S.punkte=false;S.strich=false;
  if(PARAM[S.id])S.param=PARAM[S.id].def;
  const f=byId[S.id];if(f.cm&&!q.has('b')&&!q.has('h')){S.b=f.cm*f.w/100;S.h=f.cm*f.h/100}   // empfohlene Grösse der Form
}
const zahl=(v,d)=>{const x=parseFloat(String(v).replace(',','.'));return isFinite(x)&&x>0?x:d};
if(q.has('b'))S.b=zahl(q.get('b'),S.b);
if(q.has('h'))S.h=zahl(q.get('h'),S.h);
if(q.has('n'))S.n=Math.round(zahl(q.get('n'),1));
if(q.has('z'))S.param=Math.round(zahl(q.get('z'),S.param));

// Geometrie in mm
function offset(rings,mm){
  if(!CLIP)return rings;
  const co=new ClipperLib.ClipperOffset(2,5),sol=new ClipperLib.Paths();
  co.AddPaths(rings.map(r=>r.map(([x,y])=>({X:Math.round(x*100),Y:Math.round(y*100)}))),ClipperLib.JoinType.jtRound,ClipperLib.EndType.etClosedPolygon);
  co.Execute(sol,mm*100);
  return sol.map(p=>p.map(o=>[o.X/100,o.Y/100]));
}
function stueck(e=S){
  const f=form(e),sx=e.b*10/f.w,sy=e.h*10/f.h;
  const tr=([x,y])=>[(e.spiegel?f.w-x:x)*sx,y*sy];
  const farbig=!!(e.farbig&&(f.original||f.farben&&f.farben.length));
  const umriss=f.d.map(r=>r.map(tr)),det=e.det&&!farbig?f.det.map(l=>l.map(tr)):[];
  const farben=farbig&&!f.original?f.farben.map(c=>({f:c.f,d:c.d.map(r=>r.map(tr))})):[];
  let schnitt=umriss,naht=[];
  if(e.linie==='naht'){naht=offset(umriss,-e.naht)}
  else if(e.linie==='zugabe'){schnitt=offset(umriss,e.zugabe);naht=umriss}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  schnitt.concat(det).forEach(r=>r.forEach(([x,y])=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}));
  const verschieben=a=>a.map(r=>r.map(([x,y])=>[x-x0,y-y0]));
  const nahtV=verschieben(naht),pk=punkteAn(e)&&nahtV.length?nahtV.map(r=>einstiche(r,e.pabst)):[];
  const pmin=Math.min(...pk.map(p=>p.min)),pmax=Math.max(0,...pk.map(p=>p.max));
  const o=f.original,original=farbig&&o?{datei:o.datei,x:(e.spiegel?f.w-o.x-o.w:o.x)*sx-x0,y:o.y*sy-y0,w:o.w*sx,h:o.h*sy,spiegel:e.spiegel}:null;
  return {w:x1-x0,h:y1-y0,schnitt:verschieben(schnitt),naht:nahtV,det:verschieben(det),farben:farben.map(c=>({f:c.f,d:verschieben(c.d)})),original,
    punkte:[].concat(...pk.map(p=>p.pts)),pabst:isFinite(pmin)?[pmin,pmax]:null,
    strich:!(pk.length&&!e.strich),
    eng:f.eng*Math.min(sx,sy),zerfaellt:e.linie==='naht'&&(naht.length!==umriss.length||f.eng*Math.min(sx,sy)<2*e.naht+3)};
}
// Einstichpunkte auf einem geschlossenen Ring, ungefähr alle sp mm. Ecken und Spitzen bekommen je einen Punkt,
// dazwischen wird der Abstand so angepasst, dass jedes Stück genau aufgeht.
function einstiche(ring,sp){
  const p=[];
  ring.forEach(a=>{const l=p[p.length-1];if(!l||Math.hypot(a[0]-l[0],a[1]-l[1])>1e-3)p.push(a)});
  while(p.length>1&&Math.hypot(p[0][0]-p[p.length-1][0],p[0][1]-p[p.length-1][1])<=1e-3)p.pop();
  const n=p.length,leer={pts:[],min:Infinity,max:0};if(n<3)return leer;
  const s=[0];for(let i=1;i<=n;i++){const a=p[i-1],b=p[i%n];s.push(s[i-1]+Math.hypot(b[0]-a[0],b[1]-a[1]))}
  const U=s[n];if(U<.5)return leer;
  const bei=t=>{                                      // Punkt bei Bogenlänge t
    t=((t%U)+U)%U;let lo=0,hi=n-1;
    while(lo<hi){const m=(lo+hi+1)>>1;if(s[m]<=t)lo=m;else hi=m-1}
    const a=p[lo],b=p[(lo+1)%n],l=s[lo+1]-s[lo],u=l>0?(t-s[lo])/l:0;
    return [a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];
  };
  // Ecken: wie stark knickt der Weg über ein kurzes Stück davor und danach?
  const d=Math.min(1.5,sp*.4,U/12),kand=[];
  for(let i=0;i<n;i++){
    const a=bei(s[i]-d),b=bei(s[i]+d),q=p[i];
    const v=[q[0]-a[0],q[1]-a[1]],w=[b[0]-q[0],b[1]-q[1]],lv=Math.hypot(...v),lw=Math.hypot(...w);
    if(!lv||!lw)continue;
    const k=Math.acos(Math.max(-1,Math.min(1,(v[0]*w[0]+v[1]*w[1])/(lv*lw))));
    if(k>.7)kand.push({t:s[i],k});                   // mehr als etwa 40° Knick
  }
  kand.sort((a,b)=>b.k-a.k);
  const ecken=[],nah=(a,b)=>{const x=Math.abs(a-b);return Math.min(x,U-x)};
  kand.forEach(c=>{if(!ecken.some(e=>nah(e,c.t)<sp*.6))ecken.push(c.t)});
  ecken.sort((a,b)=>a-b);
  const pts=[];let min=Infinity,max=0;
  const strecke=(t0,L,mind)=>{
    const k=Math.max(mind,Math.round(L/sp)),st=L/k;
    if(k>1||L>=sp*.5){min=Math.min(min,st);max=Math.max(max,st)}   // winzige Reste nicht mitzählen
    for(let i=0;i<k;i++)pts.push(bei(t0+i*st));
  };
  if(!ecken.length)strecke(0,U,U>=2*sp?3:1);
  else ecken.forEach((t,i)=>strecke(t,(i+1<ecken.length?ecken[i+1]:ecken[0]+U)-t,1));
  return {pts,min,max};
}
function platz(w,h){
  const g=BLATT.abstand,sp=Math.floor((NUTZ.w+g)/(w+g)),ze=Math.floor((NUTZ.h+g)/(h+g));
  return {sp,ze,pro:sp*ze};
}
function anordnen(st){
  const a=platz(st.w,st.h),b=platz(st.h,st.w);
  const dreh=b.pro>a.pro;                       // quer legen, wenn mehr Platz hat
  return Object.assign(dreh?b:a,{dreh,w:dreh?st.h:st.w,h:dreh?st.w:st.h});
}

const farbSvg=(st,sw)=>{

};
// Einstichpunkte als kleine gefüllte Kreise (Radius r in mm), alle in einem Pfad
const punktPfad=(pts,r)=>pts.map(([x,y])=>`M${(x-r).toFixed(2)} ${y.toFixed(2)}a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0`).join('');
const PUNKT_R=.45;   // 0,9 mm Durchmesser: gut sichtbar, Nadel trifft die Mitte
const teilSvg=st=>farbSvg(st,.2)+`<path d="${st.schnitt.map(r=>pfad(r,1)).join('')}" fill="none" stroke="#1c2430" stroke-width=".35" stroke-linejoin="round"/>`+
  (st.naht.length&&st.strich?`<path d="${st.naht.map(r=>pfad(r,1)).join('')}" fill="none" stroke="#5b6573" stroke-width=".3" stroke-dasharray="2 1.5"/>`:'')+
  (st.punkte.length?`<path d="${punktPfad(st.punkte,PUNKT_R)}" fill="#1c2430"/>`:'')+
  (st.det.length?`<path d="${st.det.map(l=>pfad(l,0)).join('')}" fill="none" stroke="#8a8178" stroke-width=".25" stroke-linecap="round"/>`:'');
// Legende oben rechts, rechtsbündig: schneiden, nähen (gestrichelt), einstechen (Punkte). Gibt auch zurück, wo sie beginnt.
function legende(strich,punkte){
  const teile=[['schneiden',x=>`<line x1="${x}" y1="15" x2="${x+10}" y2="15" stroke="#1c2430" stroke-width=".35"/>`]];
  if(strich)teile.push(['nähen',x=>`<line x1="${x}" y1="15" x2="${x+10}" y2="15" stroke="#5b6573" stroke-width=".3" stroke-dasharray="2 1.5"/>`]);
  if(punkte)teile.push(['einstechen',x=>`<path d="${punktPfad([[x+1,15],[x+5,15],[x+9,15]],PUNKT_R)}" fill="#1c2430"/>`]);
  const breiten=teile.map(([t])=>12+breit(t,3.2)),gesamt=breiten.reduce((a,b)=>a+b,0)+6*(teile.length-1);
  let x=BLATT.w-10-gesamt;const start=x;
  const svg=teile.map(([t,zeichen],i)=>{const s=zeichen(+x.toFixed(2))+`<text x="${(x+12).toFixed(2)}" y="16.1">${t}</text>`;x+=breiten[i]+6;return s}).join('');
  return {svg:`<g font-size="3.2" fill="#5b6573">${svg}</g>`,x:start};
}
// Farbnamen zum Malen: nächste Farbe aus einer kleinen Liste (Abstand in Lab, nicht in RGB)
const FARBNAMEN=[['Schwarz','#141414'],['Weiss','#fafafa'],['Grau','#8a8a8a'],['Hellgrau','#c8c8c8'],['Dunkelgrau','#4a4a4a'],['Rot','#d4262a'],['Dunkelrot','#8a1a1c'],['Orange','#f0862a'],['Gelb','#f2d22c'],['Hellgelb','#f8ee9a'],['Hellgrün','#8ed15a'],['Grün','#3aa63a'],['Dunkelgrün','#1d6a2a'],['Türkis','#2aa6a0'],['Hellblau','#8ac4ee'],['Blau','#2a62c4'],['Dunkelblau','#1a2e6a'],['Violett','#7a3aa6'],['Rosa','#f2a6c6'],['Pink','#e02a86'],['Braun','#8a5a2a'],['Dunkelbraun','#4a2e16'],['Hellbraun','#b88a5a'],['Beige','#e6d2ae'],['Hautfarbe','#f2c8a8']];
const lab=hex=>{const c=[1,3,5].map(i=>{let v=parseInt(hex.slice(i,i+2),16)/255;return v>.04045?Math.pow((v+.055)/1.055,2.4):v/12.92});
  const [x,y,z]=[(.4124*c[0]+.3576*c[1]+.1805*c[2])/.95047,(.2126*c[0]+.7152*c[1]+.0722*c[2]),(.0193*c[0]+.1192*c[1]+.9505*c[2])/1.08883].map(t=>t>.008856?Math.cbrt(t):7.787*t+16/116);
  return [116*y-16,500*(x-y),200*(y-z)]};
const farbName=hex=>{const a=lab(hex);let best=null,bd=1e9;for(const [n,h] of FARBNAMEN){const b=lab(h),d=(a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2;if(d<bd){bd=d;best=n}}return best};
// Farben einer Form, der Fläche nach (so kommen sie aus bild.py), mit Namen; gleiche Namen werden durchnummeriert
const farbListe=f=>{const seen={};return (f.farben||[]).map(c=>{const n=farbName(c.f);seen[n]=(seen[n]||0)+1;return {f:c.f,name:n,k:seen[n]}}).map(c=>Object.assign(c,{text:c.name+(seen[c.name]>1?` ${c.k}`:'')}))};
// Farbzeile fürs Blatt: Kästchen mit Namen, unten links über der 5-cm-Linie
const farbZeile=liste=>{if(!liste.length)return '';let x=10,out='';
  for(const c of liste){out+=`<rect x="${x}" y="${BLATT.h-22.4}" width="3.4" height="3.4" rx=".6" fill="${c.f}" stroke="#5b6573" stroke-width=".2"/><text x="${(x+4.4).toFixed(1)}" y="${BLATT.h-19.5}">${c.text}</text>`;x+=4.4+breit(c.text,3)+3.5;if(x>BLATT.w-25)break}
  return `<g font-size="3" fill="#5b6573"><text x="10" y="${BLATT.h-24.8}" font-weight="700">Farben</text>${out}</g>`};
const linieText=e=>(e.linie==='naht'?` · Nählinie ${e.naht} mm innen`:e.linie==='zugabe'?` · Nahtzugabe ${e.zugabe} mm`:'')+(punkteAn(e)?` · Einstichpunkte alle ${e.pabst} mm`:'');
const fuss=()=>Planer.kontrolle(10,BLATT.h-12,{farbe:'#1c2430'})+'</svg>';
const setzen=(x,y,lay)=>`translate(${x.toFixed(2)} ${y.toFixed(2)})${lay.dreh?` rotate(90) translate(0 ${-lay.w})`:''}`;
function blaetter(st,lay){
  const name=titel();
  const seiten=Math.min(MAXSEITEN,Math.ceil(S.n/lay.pro)),g=BLATT.abstand;
  const breite=lay.sp*lay.w+(lay.sp-1)*g,x0=NUTZ.x+(NUTZ.w-breite)/2;
  const lg=S.linie==='schnitt'?{svg:'',x:BLATT.w-10}:legende(st.strich,st.punkte.length>0),teil=teilSvg(st),leg=lg.svg;
  const out=[];let rest=S.n;
  for(let s=0;s<seiten;s++){
    const hier=Math.min(rest,lay.pro);rest-=hier;
    let teile='';
    for(let i=0;i<hier;i++){
      const x=x0+(i%lay.sp)*(lay.w+g),y=NUTZ.y+Math.floor(i/lay.sp)*(lay.h+g);
      teile+=`<g transform="${setzen(x,y,lay)}">${teil}</g>`;
    }
    out.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${BLATT.w} ${BLATT.h}" width="${BLATT.w}mm" height="${BLATT.h}mm" font-family="Nunito,Arial,sans-serif" role="img" aria-label="Blatt ${s+1}: ${hier} × ${name}">`+
      `<rect width="${BLATT.w}" height="${BLATT.h}" fill="#fff"/>`+
      titelSvg(name,lg.x-15)+
      subSvg(`${cm(S.b)} × ${cm(S.h)} cm${linieText(S)}${BLATT.name==='A3'?' · A3':''}${seiten>1?` · Blatt ${s+1} von ${seiten}`:''}`)+
      leg+teile+farbZeile(farbListe(form()))+fuss());
  }
  return out;
}

// Poster: eine Form, die nicht auf ein Blatt passt, auf mehrere Blätter verteilen.
// Jedes Blatt zeigt einen Ausschnitt; die Ausschnitte überlappen sich um UEB mm. Blätter mit einem Nachbarn rechts
// oder unten tragen dort einen Klebestreifen, Blätter mit einem Nachbarn links oder oben werden dort an der
// gestrichelten Linie abgeschnitten. Passkreuze auf beiden Blättern zeigen, wie sie aufeinanderliegen.
const UEB=10;
const posterRaster=(w,h)=>{const kx=Math.max(1,Math.ceil((w-UEB)/(NUTZ.w-UEB))),ky=Math.max(1,Math.ceil((h-UEB)/(NUTZ.h-UEB)));return {kx,ky,n:kx*ky}};
function poster(st){
  const a=posterRaster(st.w,st.h),b=posterRaster(st.h,st.w),dreh=b.n<a.n,r=dreh?b:a;
  if(r.n>MAXSEITEN)return null;
  const lay={dreh,w:dreh?st.h:st.w,h:dreh?st.w:st.h},sx=NUTZ.w-UEB,sy=NUTZ.h-UEB;
  const bw=r.kx*NUTZ.w-(r.kx-1)*UEB,bh=r.ky*NUTZ.h-(r.ky-1)*UEB,ox=(bw-lay.w)/2,oy=(bh-lay.h)/2;
  const teil=`<g transform="${setzen(ox,oy,lay)}">${teilSvg(st)}</g>`,name=titel();
  const kreuz=(x,y)=>`<path d="M${(x-2).toFixed(2)} ${y.toFixed(2)}h4M${x.toFixed(2)} ${(y-2).toFixed(2)}v4" stroke="#1c2430" stroke-width=".3"/><circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="1.2" fill="none" stroke="#1c2430" stroke-width=".3"/>`;
  let kreuze='';
  for(let i=1;i<r.kx;i++){const x=i*sx+UEB/2;for(let j=0;j<r.ky;j++)kreuze+=kreuz(x,j*sy+15)+kreuz(x,j*sy+NUTZ.h-15)}
  for(let j=1;j<r.ky;j++){const y=j*sy+UEB/2;for(let i=0;i<r.kx;i++)kreuze+=kreuz(i*sx+15,y)+kreuz(i*sx+NUTZ.w-15,y)}
  for(let i=1;i<r.kx;i++)for(let j=1;j<r.ky;j++)kreuze+=kreuz(i*sx+UEB/2,j*sy+UEB/2);
  const leg=S.linie==='schnitt'?{svg:'',x:BLATT.w-10}:legende(st.strich,st.punkte.length>0);
  const c=Math.min(4,24/r.kx,9/r.ky),mx=leg.x-6-r.kx*c,my=8;   // Übersicht oben rechts, links von der Legende
  const out=[];let k=0;
  for(let j=0;j<r.ky;j++)for(let i=0;i<r.kx;i++){
    k++;
    const x0=NUTZ.x,y0=NUTZ.y,x1=NUTZ.x+NUTZ.w,y1=NUTZ.y+NUTZ.h;
    let extra='';
    if(i<r.kx-1)extra+=`<rect x="${x1-UEB}" y="${y0}" width="${UEB}" height="${NUTZ.h}" fill="#f3f1ec" opacity=".7"/><text transform="translate(${x1-3.5} ${(y0+y1)/2}) rotate(-90)" font-size="2.6" fill="#8a8178" text-anchor="middle">Klebestreifen</text>`;
    if(j<r.ky-1)extra+=`<rect x="${x0}" y="${y1-UEB}" width="${NUTZ.w}" height="${UEB}" fill="#f3f1ec" opacity=".7"/><text x="${(x0+x1)/2}" y="${y1-3.5}" font-size="2.6" fill="#8a8178" text-anchor="middle">Klebestreifen</text>`;
    if(i>0)extra+=`<line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}" stroke="#1c2430" stroke-width=".3" stroke-dasharray="3 1.5"/><text transform="translate(${x0+3.5} ${(y0+y1)/2}) rotate(-90)" font-size="2.6" fill="#5b6573" text-anchor="middle">✂ Rand abschneiden</text>`;
    if(j>0)extra+=`<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}" stroke="#1c2430" stroke-width=".3" stroke-dasharray="3 1.5"/><text x="${(x0+x1)/2}" y="${y0+4}" font-size="2.6" fill="#5b6573" text-anchor="middle">✂ Rand abschneiden</text>`;
    let karte=`<g stroke="#5b6573" stroke-width=".25">`;
    for(let jj=0;jj<r.ky;jj++)for(let ii=0;ii<r.kx;ii++)karte+=`<rect x="${(mx+ii*c).toFixed(2)}" y="${(my+jj*c).toFixed(2)}" width="${c.toFixed(2)}" height="${c.toFixed(2)}" fill="${ii===i&&jj===j?'#1c2430':'#fff'}"/>`;
    karte+='</g>';
    out.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${BLATT.w} ${BLATT.h}" width="${BLATT.w}mm" height="${BLATT.h}mm" font-family="Nunito,Arial,sans-serif" role="img" aria-label="Poster-Blatt ${k} von ${r.n}: ${name}">`+
      `<rect width="${BLATT.w}" height="${BLATT.h}" fill="#fff"/>`+
      `<g transform="translate(${(NUTZ.x-i*sx).toFixed(2)} ${(NUTZ.y-j*sy).toFixed(2)})">${teil}${kreuze}</g>`+
      // Ränder weiss abdecken (statt clipPath: keine doppelten ids zwischen Vorschau und Druck)
      `<g fill="#fff"><rect x="0" y="0" width="${BLATT.w}" height="${y0}"/><rect x="0" y="${y1}" width="${BLATT.w}" height="${BLATT.h-y1}"/><rect x="0" y="0" width="${x0}" height="${BLATT.h}"/><rect x="${x1}" y="0" width="${BLATT.w-x1}" height="${BLATT.h}"/></g>`+
      extra+
      titelSvg(name,leg.x-15)+
      subSvg(`${cm(S.b)} × ${cm(S.h)} cm${linieText(S)}${BLATT.name==='A3'?' · A3':''} · Poster aus ${r.n} Blättern · Blatt ${k} von ${r.n}: Reihe ${j+1}, Spalte ${i+1}`)+
      leg.svg+karte+fuss());
  }
  return {svg:out,kx:r.kx,ky:r.ky,n:r.n};
}

// Liste: alle Stücke nach Höhe sortiert packen, jedes so weit oben (dann links) wie möglich.
// Pro Blatt eine Liste der freien Rechtecke (MaxRects), so werden auch Lücken neben grossen Formen gefüllt.
function packen(posten){
  const g=BLATT.abstand,eps=.01,W=NUTZ.w+g,H=NUTZ.h+g,stuecke=[];   // mit Abstand gerechnet: jedes Stück ist w+g breit
  posten.forEach((p,i)=>{if(p.lay.pro)for(let k=0;k<p.e.n;k++)stuecke.push({i,w:p.lay.w+g,h:p.lay.h+g})});
  stuecke.sort((a,b)=>b.h-a.h||b.w-a.w||a.i-b.i);
  const seiten=[];
  const suchen=(frei,s)=>{
    let best=null;
    for(const f of frei)if(s.w<=f.w+eps&&s.h<=f.h+eps&&(!best||f.y<best.y-eps||(Math.abs(f.y-best.y)<eps&&f.x<best.x)))best=f;
    return best;
  };
  const belegen=(frei,p)=>{
    const neu=[];
    for(const f of frei){
      if(p.x>=f.x+f.w-eps||p.x+p.w<=f.x+eps||p.y>=f.y+f.h-eps||p.y+p.h<=f.y+eps){neu.push(f);continue}
      if(p.x>f.x+eps)neu.push({x:f.x,y:f.y,w:p.x-f.x,h:f.h});
      if(p.x+p.w<f.x+f.w-eps)neu.push({x:p.x+p.w,y:f.y,w:f.x+f.w-p.x-p.w,h:f.h});
      if(p.y>f.y+eps)neu.push({x:f.x,y:f.y,w:f.w,h:p.y-f.y});
      if(p.y+p.h<f.y+f.h-eps)neu.push({x:f.x,y:p.y+p.h,w:f.w,h:f.y+f.h-p.y-p.h});
    }
    return neu.filter((a,k)=>!neu.some((b,j)=>j!==k&&a.x>=b.x-eps&&a.y>=b.y-eps&&a.x+a.w<=b.x+b.w+eps&&a.y+a.h<=b.y+b.h+eps&&(j<k||a.w!==b.w||a.h!==b.h||a.x!==b.x||a.y!==b.y)));
  };
  let kleinst=Infinity;
  for(let k=stuecke.length-1;k>=0;k--){kleinst=Math.min(kleinst,stuecke[k].w,stuecke[k].h);stuecke[k].rest=kleinst}
  for(const s of stuecke){
    let seite=null,ort=null;
    for(const b of seiten){if(b.voll)continue;ort=suchen(b.frei,s);if(ort){seite=b;break}}
    if(!seite){seite={frei:[{x:0,y:0,w:W,h:H}],teile:[]};seiten.push(seite);ort={x:0,y:0}}
    seite.teile.push({i:s.i,x:ort.x,y:ort.y});
    seite.frei=belegen(seite.frei,{x:ort.x,y:ort.y,w:s.w,h:s.h});
    seite.voll=!seite.frei.some(f=>f.w>=s.rest-eps&&f.h>=s.rest-eps);   // nichts Kleineres passt mehr hinein
  }
  seiten.forEach(b=>{b.breite=Math.max(...b.teile.map(t=>t.x+posten[t.i].lay.w))});
  return seiten;
}
const masstext=e=>`${cm(e.b)} × ${cm(e.h)} cm`+(e.linie==='naht'?` (Naht ${e.naht} mm`:e.linie==='zugabe'?` (Zugabe ${e.zugabe} mm`:'')+(e.linie==='schnitt'?'':punkteAn(e)?`, Punkte alle ${e.pabst} mm)`:')');
const breit=(t,pt)=>t.length*pt*.52;   // ungefähre Textbreite in mm
const titelSvg=(name,maxW)=>`<text x="10" y="16.5" font-size="6" font-weight="800" fill="#1c2430"${breit(name,6)>maxW?` textLength="${maxW.toFixed(1)}" lengthAdjust="spacingAndGlyphs"`:''}>${name}</text>`;
const subSvg=sub=>`<text x="10" y="21" font-size="3.4" fill="#5b6573"${breit(sub,3.4)>NUTZ.w?` textLength="${NUTZ.w}" lengthAdjust="spacingAndGlyphs"`:''}>${sub}</text>`;
function blaetterListe(posten,seiten,frei){
  const n=Math.min(MAXSEITEN,seiten.length);
  return seiten.slice(0,n).map((seite,s)=>{
    const da=[...new Set(seite.teile.map(t=>t.i))].sort((a,b)=>a-b);
    const mitNaht=da.filter(i=>posten[i].e.linie!=='schnitt');
    const leg=mitNaht.length?legende(mitNaht.some(i=>posten[i].st.strich),mitNaht.some(i=>posten[i].st.punkte.length>0)):null;
    let name=[...new Set(da.map(i=>titel(posten[i].e)))].join(', ');
    if(breit(name,6)>(leg?leg.x-15:NUTZ.w))name=`${da.length} Formen`;
    const teile=da.map(i=>[posten[i].e.n,seite.teile.filter(t=>t.i===i).length,i]);
    let unter=da.map(i=>`${titel(posten[i].e)} ${masstext(posten[i].e)}`),zu='';
    const blatt=(BLATT.name==='A3'?' · A3':'')+(seiten.length>1?` · Blatt ${s+1} von ${seiten.length}`:'');
    while(unter.length>1&&breit(unter.join(' · ')+blatt,3.4)>NUTZ.w*1.5){unter.pop();zu=' …'}
    const sub=unter.join(' · ')+zu+blatt,eng=breit(sub,3.4)>NUTZ.w;
    const x0=NUTZ.x+(NUTZ.w-seite.breite)/2;
    const stuecke=seite.teile.map(t=>{const p=posten[t.i],x=x0+t.x,y=NUTZ.y+t.y;
      if(!frei)return `<g transform="${setzen(x,y,p.lay)}">${p.teil}</g>`;
      const l=p.lay;   // zum Verschieben: der Rahmen fängt den Zeiger, der Griff unten rechts streckt
      return `<g class="frei" data-i="${t.i}" transform="translate(${x.toFixed(2)} ${y.toFixed(2)})"><g transform="${l.dreh?`rotate(90) translate(0 ${-l.w})`:''}">${p.teil}</g><rect class="rahmen" x="0" y="0" width="${l.w.toFixed(2)}" height="${l.h.toFixed(2)}"/>${NETZE[p.e.id]?'':`<path class="griff" d="M${(l.w-4).toFixed(2)} ${l.h.toFixed(2)}L${l.w.toFixed(2)} ${(l.h-4).toFixed(2)}V${l.h.toFixed(2)}Z"/>`}</g>`;
    }).join('');
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${BLATT.w} ${BLATT.h}" width="${BLATT.w}mm" height="${BLATT.h}mm" font-family="Nunito,Arial,sans-serif" data-blatt="${s}" role="img" aria-label="Blatt ${s+1}: ${teile.map(([,k,i])=>`${k} × ${titel(posten[i].e)}`).join(', ')}">`+
      `<rect width="${BLATT.w}" height="${BLATT.h}" fill="#fff"/>`+
      titelSvg(name,leg?leg.x-15:NUTZ.w)+
      `<text x="10" y="21" font-size="3.4" fill="#5b6573"${eng?` textLength="${NUTZ.w}" lengthAdjust="spacingAndGlyphs"`:''}>${sub}</text>`+
      (leg?leg.svg:'')+stuecke+farbZeile([...new Map(da.flatMap(i=>farbListe(form(posten[i].e))).map(c=>[c.f,c])).values()])+fuss();
  });
}
function layoutAuto(){
  // Wie liegen die Formen? Ein paar einfache Regeln durchprobieren, die mit den wenigsten Blättern gewinnt.
  // Bei Gleichstand bleiben die Formen lieber aufrecht.
  const basis=L.map(e=>{const x=voll(e),st=stueck(x);return {e:x,st,teil:teilSvg(st)}});
  const lage=(st,dreh)=>{const a=platz(st.w,st.h),b=platz(st.h,st.w);if(!a.pro&&b.pro)dreh=true;if(!b.pro)dreh=false;
    return Object.assign(dreh?b:a,{dreh,w:dreh?st.h:st.w,h:dreh?st.w:st.h})};
  const regeln=[
    ()=>false,                                                                                  // aufrecht
    (st,n)=>{const a=platz(st.w,st.h),b=platz(st.h,st.w);return a.pro>0&&b.pro>0&&Math.ceil(n/b.pro)<Math.ceil(n/a.pro)},
    st=>platz(st.h,st.w).pro>platz(st.w,st.h).pro,                                             // so dicht wie einzeln
    st=>st.h>st.w,                                                                              // flach hinlegen
  ];
  let posten,seiten;
  regeln.forEach(r=>{
    const p=basis.map(b=>Object.assign({},b,{lay:lage(b.st,r(b.st,b.e.n))})),s=packen(p);
    if(!seiten||s.length<seiten.length){posten=p;seiten=s}
  });
  return {posten,seiten};
}
function zeichnenListe(){
  nutzFarb(L.some(e=>farbListe(form(e)).length));
  if(S.frei){zeichnenFrei();return}
  const {posten,seiten}=layoutAuto(),svg=blaetterListe(posten,seiten);
  const passt=posten.filter(p=>p.lay.pro),stk=passt.reduce((a,p)=>a+p.e.n,0),z=seiten.length;
  let info=passt.length?`${stk} Stück · ${passt.length} ${passt.length===1?'Form':'Formen'} · ${z} ${z===1?'Blatt':'Blätter'}`:'';
  const zuGross=posten.filter(p=>!p.lay.pro);
  if(zuGross.length)info+=(info?'<br>':'')+`<span class="warn">${zuGross.map(p=>titel(p.e)).join(', ')} · max. ${cm(NUTZ.w/10)} × ${cm(NUTZ.h/10)} cm</span>`;
  grossWahl(zuGross.length>0,zuGross.every(p=>passtA3(p.st)));
  if(z>MAXSEITEN)info+=`<br><span class="warn">⚠ Max. ${MAXSEITEN} Blätter</span>`;
  const schmal=passt.filter(p=>p.st.eng<4).map(p=>titel(p.e)),zerf=passt.filter(p=>p.st.zerfaellt).map(p=>titel(p.e));
  if(schmal.length)info+=`<br><span class="warn">⚠ Zu schmal: ${schmal.join(', ')}</span>`;
  if(zerf.length)info+=`<br><span class="warn">⚠ Naht: ${zerf.join(', ')}</span>`;
  const mehrteilig=passt.filter(p=>(form(p.e).teile||1)>1).map(p=>`${titel(p.e)} (${form(p.e).teile} Teile)`);
  if(mehrteilig.length)info+=`<br>✂ ${mehrteilig.join(', ')}`;
  $('vorschau').innerHTML=svg.slice(0,2).join('')+(svg.length>2?`<p class="mehr">+${svg.length-2}</p>`:'');
  $('druck').innerHTML=svg.join('');

// Frei anordnen: jedes Stück liegt dort, wo es hingeschoben wurde (x, y in mm auf dem Blatt, blatt = Nummer ab 0)
const lageFrei=(st,e)=>{const d=!!e.dreh;return {dreh:d,w:d?st.h:st.w,h:d?st.w:st.h,pro:1}};
const ueberlappt=(a,b)=>a.x<b.x+b.w-.01&&b.x<a.x+a.w-.01&&a.y<b.y+b.h-.01&&b.y<a.y+a.h-.01;
const kaesten=ohne=>L.map((e,i)=>{if(i===ohne||e.x==null)return null;const l=lageFrei(stueck(voll(e)),e);return {i,x:e.x,y:e.y,w:l.w,h:l.h,blatt:e.blatt||0}}).filter(Boolean);
// Platz für ein Stück: wenn möglich rechts neben «neben», sonst die erste Lücke (oben, dann links), notfalls ein neues Blatt
function freiPlatz(e,ohne,neben){
  const lay=lageFrei(stueck(voll(e)),e),g=BLATT.abstand,kk=kaesten(ohne);
  const passt=(x,y,blatt)=>x>=0&&y>=0&&x+lay.w<=NUTZ.w+.01&&y+lay.h<=NUTZ.h+.01&&!kk.some(k=>k.blatt===blatt&&ueberlappt(k,{x,y,w:lay.w,h:lay.h}));
  const setz=(x,y,blatt)=>{e.x=+x.toFixed(1);e.y=+y.toFixed(1);e.blatt=blatt};
  const n=kk.find(k=>k.i===neben);   // zuerst rechts daneben, sonst darunter
  if(n&&passt(n.x+n.w+g,n.y,n.blatt))return setz(n.x+n.w+g,n.y,n.blatt);
  if(n&&passt(n.x,n.y+n.h+g,n.blatt))return setz(n.x,n.y+n.h+g,n.blatt);
  const nBl=Math.min(MAXSEITEN,Math.max(0,...kk.map(k=>k.blatt+1))+1);
  for(let blatt=0;blatt<nBl;blatt++){
    const kand=[{x:0,y:0}];
    kk.filter(k=>k.blatt===blatt).forEach(k=>{kand.push({x:k.x+k.w+g,y:k.y});kand.push({x:k.x,y:k.y+k.h+g})});
    kand.sort((a,b)=>a.y-b.y||a.x-b.x);
    for(const c of kand)if(passt(c.x,c.y,blatt))return setz(c.x,c.y,blatt);
  }
  setz(0,0,nBl-1);   // passt in keine Lücke: oben links aufs letzte Blatt
}
function zeichnenFrei(){
  L.forEach((e,i)=>{if(e.x==null)freiPlatz(e,i)});
  const da=[...new Set(L.map(e=>e.blatt||0))].sort((a,b)=>a-b);   // leere Blätter fallen weg
  L.forEach(e=>{e.blatt=da.indexOf(e.blatt||0)});
  const posten=L.map(e=>{const x=voll(e),st=stueck(x),lay=lageFrei(st,x);
    x.x=e.x=+begrenzt(e.x,0,Math.max(0,NUTZ.w-lay.w)).toFixed(1);x.y=e.y=+begrenzt(e.y,0,Math.max(0,NUTZ.h-lay.h)).toFixed(1);
    return {e:x,st,teil:teilSvg(st),lay}});
  const nBl=Math.min(MAXSEITEN,da.length||1),seiten=Array.from({length:nBl},()=>({teile:[],breite:NUTZ.w}));
  L.forEach((e,i)=>{e.blatt=Math.min(e.blatt,nBl-1);seiten[e.blatt].teile.push({i,x:e.x,y:e.y})});
  const svg=blaetterListe(posten,seiten,true),druck=blaetterListe(posten,seiten);
  let info=`${L.length} Stück · ${nBl} ${nBl===1?'Blatt':'Blätter'}`;

  const zuGross=posten.filter(p=>p.lay.w>NUTZ.w+.01||p.lay.h>NUTZ.h+.01);
  if(zuGross.length)info+=`<br><span class="warn">${namen(zuGross)} · max. ${cm(NUTZ.w/10)} × ${cm(NUTZ.h/10)} cm</span>`;
  grossWahl(zuGross.length>0,zuGross.every(p=>passtA3(p.st)));
  const kk=posten.map((p,i)=>({i,x:p.e.x,y:p.e.y,w:p.lay.w,h:p.lay.h,blatt:p.e.blatt})),ueber=new Set();
  kk.forEach((a,i)=>kk.slice(i+1).forEach(b=>{if(a.blatt===b.blatt&&ueberlappt(a,b)){ueber.add(a.i);ueber.add(b.i)}}));
  if(ueber.size)info+=`<br>⚠ Überlappt: ${namen([...ueber].map(i=>posten[i]))}`;
  const schmal=posten.filter(p=>p.st.eng<4),zerf=posten.filter(p=>p.st.zerfaellt);

  $('druck').innerHTML=druck.join('');

}

  $('schloss').setAttribute('aria-pressed',S.lock);$('schloss').innerHTML=S.lock?SCHLOSS_ZU:SCHLOSS_AUF;
  $('schloss').title=S.lock?'Seitenverhältnis':'Strecken';
  const l=Math.max(S.b,S.h);
  $('chips').innerHTML=(S.papier==='a3'?CHIPS.concat([20,25,30,40,60]):CHIPS.concat([20,30,40])).map(c=>`<button type="button" class="chip" data-cm="${c}" aria-pressed="${S.lock&&Math.abs(l-c)<.01}">${c} cm</button>`).join('');
  $('gross').max=S.papier==='a3'?60:40;$('gross').value=Math.round(l*2)/2;
  $('feld-param').hidden=!PARAM[S.id];
  if(PARAM[S.id]){$('lbl-param').textContent=`${PARAM[S.id].label}: ${S.param}`;$('param').value=S.param}
  const nz=!!NETZE[S.id];$('feld-netz').hidden=!nz;$('chips').hidden=$('regler-gr').hidden=nz;$('b').disabled=$('h').disabled=$('schloss').disabled=nz;
  if(nz){$('nb').value=cm(S.netz.b);$('nt').value=cm(S.netz.t);$('nh').value=cm(S.netz.h)}
  $('n').value=S.n;$('naht').value=S.naht;$('zugabe').value=S.zugabe;
  document.querySelectorAll('[name=linie]').forEach(r=>r.checked=r.value===S.linie);
  $('mm-naht').hidden=S.linie!=='naht';$('mm-zugabe').hidden=S.linie!=='zugabe';
  const pk=punkteAn(S);$('punkte').checked=pk;$('mm-punkte').hidden=$('feld-strich').hidden=!pk;
  $('pabst').value=S.pabst;$('lbl-pabst').textContent=`alle ${S.pabst} mm`;$('strich').checked=S.strich;
  $('feld-farbig').hidden=!(f.farben&&f.farben.length);$('farbig').checked=S.farbig;
  const fl=farbListe(f);$('farben').hidden=!fl.length;
  $('farben').innerHTML=fl.length?fl.map(c=>`<span><i style="background:${c.f}"></i>${c.text}</span>`).join(''):'';
  $('feld-det').hidden=!f.det.length||(f.farben&&f.farben.length&&S.farbig);$('det').checked=S.det;$('spiegel').checked=S.spiegel;
}
function mass(welche){
  const f=form(),v=zahl($(welche).value,null);if(!v||NETZE[S.id])return;
  Planer.merke(null,'mass');S[welche]=Math.min(v,100);
  if(S.lock){if(welche==='b')S.h=S.b*f.h/f.w;else S.b=S.h*f.w/f.h}
  zeichnen();Planer.leuchte('#vorschau');
}
['b','h'].forEach(k=>{
  $(k).addEventListener('input',()=>mass(k));
  $(k).addEventListener('change',felder);
  $(k).addEventListener('focus',e=>e.target.select());
});
$('schloss').addEventListener('click',()=>{
  Planer.merke();S.lock=!S.lock;
  if(S.lock){const f=form();S.h=S.b*f.h/f.w}
  felder();zeichnen();
});
const kopf=Planer.druckkopf('#papier',{lage:true,papier:S.papier,quer:!!S.quer,wahl(w){
  if(w.papier===S.papier&&w.quer===!!S.quer)return;
  Planer.merke();S.papier=w.papier;S.quer=w.quer;papierSetzen(S.papier,S.quer);felder();zeichnen();Planer.leuchte('#vorschau');
}});
$('gross').addEventListener('input',()=>{
  const l=+$('gross').value,k=l/Math.max(S.b,S.h);if(!k||NETZE[S.id])return;Planer.merke(null,'gross');
  S.b*=k;S.h*=k;$('b').value=cm(S.b);$('h').value=cm(S.h);
  document.querySelectorAll('#chips .chip').forEach(c=>c.setAttribute('aria-pressed',S.lock&&Math.abs(l-c.dataset.cm)<.01));
  zeichnen();
});
$('chips').addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;
  Planer.merke();const f=form(),l=+c.dataset.cm;S.lock=true;
  if(f.w>=f.h){S.b=l;S.h=l*f.h/f.w}else{S.h=l;S.b=l*f.w/f.h}
  felder();zeichnen();
});
['nb','nt','nh'].forEach(k=>{
  $(k).addEventListener('input',()=>{
    const v=zahl($(k).value,null);if(!v||!NETZE[S.id])return;Planer.merke(null,'netz');
    S.netz=netzMasse(Object.assign({},S.netz,{[k.slice(1)]:v}));
    const f=form();S.b=f.mm.w/10;S.h=f.mm.h/10;S.lock=true;
    $('b').value=cm(S.b);$('h').value=cm(S.h);zeichnen();Planer.leuchte('#vorschau');
  });
  $(k).addEventListener('change',felder);
  $(k).addEventListener('focus',e=>e.target.select());
});
$('param').addEventListener('input',()=>{
  Planer.merke(null,'param');S.param=+$('param').value;const f=form();
  if(S.lock)S.h=S.b*f.h/f.w;
  felder();zeichnen();
});
$('n').addEventListener('input',()=>{Planer.merke(null,'n');S.n=Math.max(1,Math.min(500,Math.round(zahl($('n').value,S.n))));zeichnen();Planer.leuchte('#vorschau')});
$('n').addEventListener('change',felder);
$('fuellen').addEventListener('click',()=>{
  const lay=anordnen(stueck());if(!lay.pro)return;
  Planer.merke();S.n=Math.max(1,Math.ceil(S.n/lay.pro))*lay.pro;felder();zeichnen();
});
document.querySelectorAll('[name=linie]').forEach(r=>r.addEventListener('change',()=>{Planer.merke();S.linie=r.value;felder();zeichnen()}));
if(!CLIP){document.querySelectorAll('[name=linie]').forEach(r=>{if(r.value!=='schnitt'){r.disabled=true;r.closest('label').title='Offline'}});$('punkte').disabled=true}
['naht','zugabe'].forEach(k=>{
  $(k).addEventListener('input',()=>{Planer.merke(null,k);S[k]=Math.max(1,Math.min(20,Math.round(zahl($(k).value,S[k]))));zeichnen()});
  $(k).addEventListener('change',felder);
});
$('punkte').addEventListener('change',()=>{
  Planer.merke();S.punkte=$('punkte').checked;
  if(S.punkte&&S.linie==='schnitt')S.linie='naht';   // Punkte liegen auf der Nählinie: die braucht es dazu
  felder();zeichnen();
});
$('pabst').addEventListener('input',()=>{Planer.merke(null,'pabst');S.pabst=Math.max(2,Math.min(20,Math.round(+$('pabst').value||5)));$('lbl-pabst').textContent=`alle ${S.pabst} mm`;zeichnen()});
$('strich').addEventListener('change',()=>{Planer.merke();S.strich=$('strich').checked;zeichnen()});
$('det').addEventListener('change',()=>{Planer.merke();S.det=$('det').checked;zeichnen()});
$('farbig').addEventListener('change',()=>{Planer.merke();S.farbig=$('farbig').checked;felder();zeichnen()});
$('spiegel').addEventListener('change',()=>{Planer.merke();S.spiegel=$('spiegel').checked;zeichnen()});
$('drucken').addEventListener('click',()=>window.print());
Planer.verlauf({hole:()=>({s:S,l:L}),setze(z){Object.assign(S,z.s);L=z.l;papierSetzen(S.papier,S.quer);felder();modusZeigen();zeichnen();listeZeigen()}});

// Abpausen: Form in echter Grösse auf dem Bildschirm. Wie viele Bildschirmpunkte ein cm sind, weiss der Browser nicht –
// darum einmal pro Gerät mit einer Karte (85,6 × 54 mm) eichen. Die Helligkeit kann eine Webseite nicht stellen: nur Hinweis.
const PXCM_KEY='schrittli-pausen-pxcm',KARTE={w:85.6,h:53.98,r:3.18};
function schaetzen(){
  const ipad=/iPad/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(!ipad)return 96/2.54;
  return Math.min(screen.width,screen.height)<768?163/2.54:132/2.54;   // iPad mini 326 ppi, sonst 264 ppi
}
let pxcm=0;try{pxcm=+localStorage.getItem(PXCM_KEY)||0}catch(e){}
let gesperrt=false,wach=null;
function pausenZeichnen(){
  if(!pxcm)return;
  const st=stueck(),px=pxcm/10,rand=1.5;
  const fw=innerWidth/px-2*rand,fh=innerHeight/px-2*rand;    // Platz in mm
  const dreh=!(st.w<=fw&&st.h<=fh)&&st.h<=fw&&st.w<=fh;      // quer, wenn es nur so passt
  const w=dreh?st.h:st.w,h=dreh?st.w:st.h,ok=w<=fw&&h<=fh;
  $('p-titel').textContent=`${form().name} · ${cm(S.b)} × ${cm(S.h)} cm`;
  $('p-sperren').disabled=!ok;
  if(!ok){$('p-flaeche').innerHTML=`<p class="warn">⚠ Zu gross · max. ${cm(Math.max(fw,fh)/10)} × ${cm(Math.min(fw,fh)/10)} cm</p>`;return}
  const d=.8;   // Strichdicke in mm
  $('p-flaeche').innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" width="${(w+2*d)*px}" height="${(h+2*d)*px}" viewBox="${-d} ${-d} ${w+2*d} ${h+2*d}" role="img" aria-label="${form().name} in echter Grösse"><g${dreh?` transform="rotate(90) translate(0 ${-st.h})"`:''}>`+
    farbSvg(st,.3)+(st.det.length?`<path d="${st.det.map(l=>pfad(l,0)).join('')}" fill="none" stroke="#8a8178" stroke-width=".5" stroke-linecap="round"/>`:'')+
    (st.naht.length&&st.strich?`<path d="${st.naht.map(r=>pfad(r,1)).join('')}" fill="none" stroke="#5b6573" stroke-width=".5" stroke-dasharray="2.5 1.8"/>`:'')+
    (st.punkte.length?`<path d="${punktPfad(st.punkte,.6)}" fill="#000"/>`:'')+
    `<path d="${st.schnitt.map(r=>pfad(r,1)).join('')}" fill="none" stroke="#000" stroke-width="${d}" stroke-linejoin="round"/></g></svg>`;
}
async function wachHalten(an){
  try{
    if(an&&'wakeLock' in navigator&&!wach){wach=await navigator.wakeLock.request('screen');wach.addEventListener('release',()=>{wach=null})}
    else if(!an&&wach){const w=wach;wach=null;await w.release()}
  }catch(e){}
}
function eichKarte(){
  const px=pxcm/10,k=$('p-karte');
  k.style.width=KARTE.w*px+'px';k.style.height=KARTE.h*px+'px';k.style.borderRadius=KARTE.r*px+'px';
}
function eichung(an){
  $('p-eichung').hidden=!an;
  if(!an)return;
  if(!pxcm)pxcm=schaetzen();
  $('p-regler').value=pxcm;eichKarte();
}
function eichen(v){pxcm=Math.max(25,Math.min(90,v));$('p-regler').value=pxcm;eichKarte()}
$('p-regler').addEventListener('input',()=>eichen(+$('p-regler').value));
$('p-minus').addEventListener('click',()=>eichen(pxcm-.1));
$('p-plus').addEventListener('click',()=>eichen(pxcm+.1));
$('p-ok').addEventListener('click',()=>{try{localStorage.setItem(PXCM_KEY,pxcm)}catch(e){}eichung(false);pausenZeichnen()});
$('p-eichen').addEventListener('click',()=>eichung(true));
function sperren(an){
  gesperrt=an;
  $('p-leiste').hidden=$('p-hilfe').hidden=an;$('p-schloss').hidden=!an;$('p-tipp').hidden=true;
  (an?$('p-schloss'):$('p-sperren')).focus({preventScroll:true});
}
$('p-sperren').addEventListener('click',()=>sperren(true));
function pausenAuf(){
  $('pausen').hidden=false;document.documentElement.style.overflow='hidden';
  const el=document.documentElement,fs=el.requestFullscreen||el.webkitRequestFullscreen;
  try{const r=fs&&fs.call(el);if(r&&r.catch)r.catch(()=>{})}catch(e){}
  wachHalten(true);sperren(false);
  let gespeichert=0;try{gespeichert=+localStorage.getItem(PXCM_KEY)||0}catch(e){}
  eichung(!gespeichert);pausenZeichnen();
}
function pausenZu(){
  $('pausen').hidden=true;document.documentElement.style.overflow='';
  const ex=document.exitFullscreen||document.webkitExitFullscreen;
  try{if(document.fullscreenElement||document.webkitFullscreenElement){const r=ex.call(document);if(r&&r.catch)r.catch(()=>{})}}catch(e){}
  wachHalten(false);$('pausen-auf').focus();
}
$('pausen-auf').addEventListener('click',pausenAuf);
$('p-zu').addEventListener('click',pausenZu);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('pausen').hidden&&!gesperrt)pausenZu()});
addEventListener('resize',()=>{if(!$('pausen').hidden)pausenZeichnen()});
document.addEventListener('visibilitychange',()=>{if(!$('pausen').hidden&&document.visibilityState==='visible')wachHalten(true)});
// Gesperrt: jede Berührung schlucken, ausser am Schloss (3 Sekunden halten)
let tippZeit=0,haltZeit=0;
const schlucken=e=>{
  if(!gesperrt||e.target.closest('#p-schloss'))return;
  e.preventDefault();e.stopPropagation();
  if(e.type==='touchstart'||e.type==='mousedown'){$('p-tipp').hidden=false;clearTimeout(tippZeit);tippZeit=setTimeout(()=>{$('p-tipp').hidden=true},2500)}
};
['touchstart','touchmove','touchend','gesturestart','gesturechange','contextmenu','dblclick','wheel','mousedown','click','keydown'].forEach(t=>$('pausen').addEventListener(t,schlucken,{passive:false,capture:true}));
document.addEventListener('touchmove',e=>{if(!$('pausen').hidden)e.preventDefault()},{passive:false});
const loslassen=()=>{clearTimeout(haltZeit);$('p-schloss').classList.remove('halten')};
$('p-schloss').addEventListener('pointerdown',e=>{
  e.preventDefault();$('p-schloss').classList.add('halten');
  haltZeit=setTimeout(()=>{loslassen();sperren(false)},3000);
});
['pointerup','pointercancel','pointerleave'].forEach(t=>$('p-schloss').addEventListener(t,loslassen));

// Figuren der gewählten Form und der Liste zuerst nachladen; was nicht kommt, fällt weg
bereit([S.id,...L.map(e=>e.id)]).catch(()=>{}).then(()=>{
  if(!form().d)S.id='herz';
  L=L.filter(e=>form(e).d);
  if(S.lock){const f=form();if(q.has('h')&&!q.has('b'))S.b=S.h*f.w/f.h;else S.h=S.b*f.h/f.w}
  auswahl();felder();modusZeigen();listeZeigen();zeichnen();
  if(q.get('pausen')==='1')pausenAuf();   // aus der App: «Abpausen» öffnet direkt den Leuchttisch
});
})();
